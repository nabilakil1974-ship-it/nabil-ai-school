<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABIL AI | دروس السبورة</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#071523;color:#edf7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#16485e,#071523 65%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:20px 14px 50px}header{padding:23px;border:1px solid #28647a;border-radius:20px;background:linear-gradient(130deg,#103b55,#0c625f)}h1{margin:0 0 8px;font-size:clamp(25px,4vw,38px)}p{line-height:1.8;color:#c6dce9}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #37657b;background:#0b263a;color:#fff;min-width:0}input{flex:1;min-width:190px}select{min-width:140px}#status{padding:10px 2px;color:#9fe5d8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lesson{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid #294b60;border-radius:15px;background:#0d2438}.lesson h2{font-size:17px;margin:0;line-height:1.5}.meta{font-size:12px;color:#a7c2d2;direction:ltr;text-align:right}.lesson a{display:block;text-align:center;text-decoration:none;background:#0d9488;color:#fff;font-weight:800;padding:12px;border-radius:10px;margin-top:4px}.lesson a:focus,.lesson a:hover{background:#087fbd;outline:2px solid #7ee7da}.empty{grid-column:1/-1;padding:22px;border:1px dashed #53778c;border-radius:14px;color:#c7dce8}.home{display:inline-block;color:#d5fffa;margin-top:18px}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.tools>*{width:100%}header{padding:18px}}
</style></head><body><main class="wrap"><header><h1>📚 دروس السبورة التفاعلية</h1><p>اختر الصف وابحث عن الدرس، ثم اضغط على اسمه لفتح صفحة الدرس والشرح على السبورة. تُعرض الدروس المسجّلة في فهرس Golden؛ إذا تعذّر تحميل درس فلن يتم استبداله بدرس آخر.</p></header>
<div class="tools"><select id="grade" aria-label="الصف"><option value="">كل الصفوف</option><option value="1">الصف 1</option><option value="2">الصف 2</option><option value="3">الصف 3</option><option value="4">الصف 4</option><option value="5">الصف 5</option><option value="6">الصف 6</option><option value="7">الصف 7</option><option value="8">الصف 8</option><option value="9">الصف 9</option><option value="10">الصف 10</option><option value="11">الصف 11</option><option value="12">الصف 12</option></select><input id="search" type="search" placeholder="ابحث باسم الدرس أو رقمه…" aria-label="بحث عن درس"><select id="language" aria-label="اللغة"><option value="">كل اللغات</option><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div>
<div id="status" role="status">جارٍ تحميل فهرس الدروس…</div><section id="lessons" class="grid" aria-live="polite"></section><a class="home" href="/">← العودة إلى الواجهة التعليمية</a></main>
<script>
"use strict";const all=[];const gradeEl=document.getElementById("grade"),searchEl=document.getElementById("search"),langEl=document.getElementById("language"),listEl=document.getElementById("lessons"),statusEl=document.getElementById("status");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function draw(){const g=gradeEl.value,q=searchEl.value.trim().toLocaleLowerCase(),lang=langEl.value;const rows=all.filter(x=>(!g||String(x.grade||"")===g)&&(!lang||String(x.language||"").toLowerCase()===lang)&&(!q||(String(x.title||"")+" "+String(x.lesson_id||"")).toLocaleLowerCase().includes(q)));listEl.innerHTML=rows.length?rows.map(x=>'<article class="lesson"><h2>'+esc(x.title||x.lesson_id)+'</h2><div class="meta">'+esc(x.lesson_id)+' · '+esc(x.language||"")+'</div><a href="/api/interactive-lessons/golden-classroom?lesson_id='+encodeURIComponent(x.lesson_id)+'">ابدأ الدرس ←</a></article>').join(""):'<div class="empty">لا توجد دروس مطابقة في الفهرس الحالي.</div>';statusEl.textContent='عدد الدروس المعروضة: '+rows.length+' من '+all.length;}
async function load(){try{const grades=gradeEl.value?[Number(gradeEl.value)]:Array.from({length:12},(_,i)=>i+1);const results=await Promise.all(grades.map(async g=>{const r=await fetch('/api/curriculum/lessons?grade='+g+'&subject=math',{cache:'no-store'});if(!r.ok)throw new Error('تعذّر تحميل فهرس الصف '+g);return r.json()}));const seen=new Set();for(const data of results)for(const row of(data.lessons||[])){const id=String(row.lesson_id||'');if(!id||seen.has(id))continue;seen.add(id);all.push({...row,grade:row.grade||id.match(/^G(\d{2})-/)?.[1]?.replace(/^0/,'')||''});}all.sort((a,b)=>Number(a.grade)-Number(b.grade)||String(a.title).localeCompare(String(b.title)));draw();}catch(e){statusEl.textContent=e.message+'؛ جرّب تحديث الصفحة.';listEl.innerHTML='<div class="empty">لم نتمكن من قراءة فهرس Golden. لم ننشئ أسماء دروس افتراضية.</div>';}}gradeEl.addEventListener('change',()=>{all.length=0;load()});searchEl.addEventListener('input',draw);langEl.addEventListener('change',draw);load();
</script></body></html>
