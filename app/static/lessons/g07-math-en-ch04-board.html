e\" stroke=\"#e53935\" stroke-width=\"3.5\"/><path d=\"M 591.5 273.1 A 26 26 0 0 0 588.5 291.8\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"3.5\"/><path d=\"M 585.5 269.5 A 33 33 0 0 0 581.6 293.2\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"3.5\"/><path d=\"M 579.5 266.0 A 40 40 0 0 0 574.8 294.7\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"3.5\"/><\/g>", "vb": [660, 440], "show": ["EQ0", "EQ1", "EQ2", "EQ3"]}, {"k": "t", "en": "We mark equal sides with the same number of small strokes, and equal angles with the same number of arcs. One stroke on AB and DE, two strokes on AC and DF, three on BC and EF.", "ar": "نعلّم الأضلاع المتساوية بعدد الشرطات نفسه، والزوايا المتساوية بعدد الأقواس نفسه. شرطة واحدة على AB وDE وشرطتان على AC وDF وثلاث على BC وEF.", "fr": "Même nombre de traits pour des côtés égaux, même nombre d'arcs pour des angles égaux.", "label": ""}, {"k": "f", "f": "△ABC ≅ △DEF"}]}, {"title": {"en": "Corresponding (homologous) elements", "ar": "العناصر المتناظرة", "fr": "Éléments homologues"}, "items": [{"k": "t", "en": "When two triangles are equal, the vertices that match are called homologous. A matches D, B matches E and C matches F. We always write the letters in the matching order: ABC and DEF.", "ar": "عندما يتساوى مثلثان تُسمّى الرؤوس المتناظرة رؤوسًا متماثلة. A تقابل D وB تقابل E وC تقابل F. نكتب الحروف دائمًا بالترتيب المتناظر: ABC وDEF.", "fr": "A correspond à D, B à E, C à F : on écrit les lettres dans l'ordre.", "label": ""}, {"k": "d", "svg": "<g id=\"HM0\"><polygon points=\"111.5,180.5 40.0,330.0 274.0,330.0\" fill=\"rgba(30,136,229,.10)\" stroke=\"#0b3d5c\" stroke-width=\"4\" stroke-linejoin=\"round\"/><circle data-pt=\"A\" cx=\"111.5\" cy=\"180.5\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"103.9\" y=\"164.6\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">A<\/text><circle data-pt=\"B\" cx=\"40.0\" cy=\"330.0\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"16.6\" y AB = 4 cm   ∠A = 45°   AC = 3 cm"}]}, {"title": {"en": "Construct a triangle with Side-Side-Side (Side-Side-Side)", "ar": "ارسم مثلثًا بحالة ضلع – ضلع – ضلع", "fr": "Construire avec côté-côté-côté (Side-Side-Side)"}, "items": [{"k": "t", "en": "A triangle with sides 3, 4 and 5 centimetres. Draw AB = 4 cm. With the compass make an arc of radius 3 cm from A and an arc of radius 5 cm from B. They meet at C. This triangle has a right angle at A.", "ar": "مثلث أضلاعه 3 و4 و5 سنتيمترات. نرسم AB = 4 سم ثم بالفرجار قوسًا نصف قطره 3 سم من A وقوسًا نصف قطره 5 سم من B فيلتقيان في C. في هذا المثلث زاوية قائمة عند A.", "fr": "Avec le compas : arc de 3 cm depuis A et arc de 5 cm depuis B.", "label": ""}, {"k": "d", "svg": "<g id=\"K30\"><line x1=\"110.0\" y1=\"340.0\" x2=\"310.0\" y2=\"340.0\" stroke=\"#0b3d5c\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle data-pt=\"A\" cx=\"110.0\" cy=\"340.0\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"90.0\" y=\"350.0\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">A<\/text><circle data-pt=\"B\" cx=\"310.0\" cy=\"340.0\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"330.0\" y=\"350.0\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">B<\/text><text x=\"210.0\" y=\"385.0\" font-size=\"26\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1e88e5\" font-family=\"sans-serif\">4 cm<\/text><\/g><g id=\"K31\"><path d=\"M 84.0 192.3 A 150 150 0 0 1 161.3 199.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><text x=\"60.0\" y=\"230.0\" font-size=\"24\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1e88e5\" font-family=\"sans-serif\">3 cm<\/text><\/g><g id=\"K32\"><path d=\"M 63.8 296.6 A 250 250 0 0 1 105.2 196.6\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><text x=\"230.0\" y=\"170.0\" font-size=\"24\" font-weight=\"700\" text-a en": "Proof 2: MF = NE", "ar": "برهان 2: MF = NE", "fr": "Démonstration 2 : MF = NE"}, "items": [{"k": "t", "en": "Problem. On the sides of angle O we have OM = ON and ME = NF. The points O, M, E are on one ray and O, N, F are on the other. Prove that MF = NE. First we draw the angle and the points.", "ar": "مسألة. على ضلعي الزاوية O لدينا OM = ON وME = NF. النقاط O وM وE على نصف مستقيم واحد وO وN وF على الآخر. أثبت أن MF = NE. نرسم أولًا الزاوية والنقاط.", "fr": "Sur les côtés de l'angle O : OM = ON et ME = NF. Montrer que MF = NE.", "label": ""}, {"k": "d", "svg": "<g id=\"MF0\"><line x1=\"110.0\" y1=\"330.0\" x2=\"439.5\" y2=\"347.3\" stroke=\"#6fa8dc\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"110.0\" y1=\"330.0\" x2=\"380.3\" y2=\"140.7\" stroke=\"#6fa8dc\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle data-pt=\"O\" cx=\"110.0\" cy=\"330.0\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"88.0\" y=\"352.0\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">O<\/text><circle data-pt=\"M\" cx=\"279.8\" cy=\"338.9\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"283.8\" y=\"370.9\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">M<\/text><circle data-pt=\"E\" cx=\"369.6\" cy=\"343.6\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"373.6\" y=\"375.6\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">E<\/text><circle data-pt=\"N\" cx=\"249.3\" cy=\"232.5\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"227.3\" y=\"224.5\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">N<\/text><circle data-pt=\"F\" cx=\"323.0\" cy=\"180.9\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"329.0\" y=\"166.9\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">F<\/text><\/g>", "vb": [660, 440], "show": ["MF0"]}, {"k": "t", "en": "Step 1. The marks show the data: OM = ON with one stroke and ME = NF with two strokes.", "ar": "الخطوة 1. العلامات تبيّن المعطيات: OM = ON بشرطة واحدة وME = NF بشرطتين.", "fr": "Étape 1 : les données sont codées sur la figure.", "label": ""}, {"k": "t", "en": "Step 2. O, M, E are aligned, so OE = OM + ME. In the same way OF = ON + NF.", "ar": "الخطوة 2. O وM وE على استقامة واحدة فإن OE = OM + ME. وكذلك OF = ON + NF.", "fr": "Étape 2 : OE = OM + ME et OF = ON + NF.", "label": ""}, {"k": "f", "f": "OE = OM + ME      OF = ON + NF"}, {"k": "t", "en": "Step 3. Equal parts added to equal parts give equal wholes: since OM = ON and ME = NF, we conclude that OE = OF.", "ar": "الخطوة 3. أجزاء متساوية مجموعة إلى أجزاء متساوية تعطي كلًّا متساويًا: بما أن OM = ON وME = NF فإن OE = OF.", "fr": "Étape 3 : OE = OF.", "label": ""}, {"k": "f", "f": "OE = OF"}, {"k": "t", "en": "Step 4. Look at triangles OMF and ONE. They share the angle at O: angle MOF is the same angle as angle NOE.", "ar": "الخطوة 4. انظر إلى المثلثين OMF وONE. بينهما زاوية مشتركة عند O: الزاوية MOF هي نفسها الزاوية NOE.", "fr": "Étape 4 : les triangles OMF et ONE ont l'angle en O en commun.", "label": ""}, {"k": "d", "svg": "<g id=\"MF0\"><line x1=\"110.0\" y1=\"330.0\" x2=\"439.5\" y2=\"347.3\" stroke=\"#6fa8dc\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"110.0\" y1=\"330.0\" x2=\"380.3\" y2=\"140.7\" stroke=\"#6fa8dc\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle data-pt=\"O\" cx=\"110.0\" cy=\"330.0\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"88.0\" y=\"352.0\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">O<\/text><circle data-pt=\"M\" cx=\"279.8\" cy=\"338.9\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"283.8\" y=\"370.9\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"san " stroke=\"#8e24aa\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><line x1=\"312.2\" y1=\"254.5\" x2=\"294.8\" y2=\"249.8\" stroke=\"#8e24aa\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><line x1=\"297.5\" y1=\"289.2\" x2=\"309.7\" y2=\"276.0\" stroke=\"#d4a500\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><line x1=\"303.3\" y1=\"294.7\" x2=\"315.6\" y2=\"281.4\" stroke=\"#d4a500\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><line x1=\"309.2\" y1=\"300.1\" x2=\"321.4\" y2=\"286.9\" stroke=\"#d4a500\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><\/g>", "vb": [660, 440], "show": ["MF0", "MF1", "MF2", "MF3", "MF4", "MF5"]}, {"k": "f", "f": "△OMF ≅ △ONE   ⇒   MF = NE"}]}, {"title": {"en": "Error detective", "ar": "المحقق", "fr": "Détective"}, "items": [{"k": "t", "en": "A learner says: AB = DE, BC = EF and angle A = angle D, so the triangles are equal by Side-Angle-Side (SAS). Is this right? No! The equal angle A is not between AB and BC. It is not an included angle, so Side-Angle-Side (SAS) cannot be used. Always check where the angle is.", "ar": "قال متعلّم: AB = DE وBC = EF والزاوية A = D فالمثلثان متساويان بحالة ضلع – زاوية – ضلع. هل هذا صحيح؟ لا! الزاوية A ليست محصورة بين AB وBC فلا يمكن استعمال ضلع – زاوية – ضلع. تحقق دائمًا من موقع الزاوية.", "fr": "Erreur : l'angle égal n'est pas compris entre les deux côtés.", "label": ""}, {"k": "f", "f": "SAS needs the angle BETWEEN the two sides"}]}, {"title": {"en": "Summary", "ar": "الخلاصة", "fr": "Résumé"}, "items": [{"k": "t", "en": "Two triangles are equal when they can be superposed. Three cases prove it: Angle-Side-Angle (ASA), Side-Angle-Side (SAS) and Side-Side-Side (SSS). Equal triangles have equal homologous sides and angles. Equal angles alone are not enough. Use the cases to prove that segments or angles are equal.", "ar": "يتساوى مثلثان إذا أمكن تطابقهما. ثلاث حالات تثبت ذلك: زاوية – ضلع – زاوية وSAS وSSS. والمثلثان المتساويان لهما أضلاع وزوايا متناظرة متساوية. الزوايا وحدها لا تكفي. نستعمل الحالات لنثبت تساوي قطع أو زوايا.", "fr": "Trois cas : angle-côté-angle (ASA), côté-angle-côté (SAS), côté-côté-côté (SSS). Les éléments homologues sont égaux.", "label": ""}, {"k": "f", "f": "Angle-Side-Angle      Side-Angle-Side      Side-Side-Side"}]}, {"title": {"en": "Exercise 1", "ar": "التمرين 1", "fr": "Exercice 1"}, "items": [{"k": "t", "en": "Triangles ABC and DEF: AB = DE = 5 cm, BC = EF = 7 cm and angle B = angle E = 50°. Which case proves they are equal?", "ar": "المثلثان ABC وDEF: AB = DE = 5 سم وBC = EF = 7 سم والزاوية B = الزاوية E = 50°. أي حالة تثبت تساويهما؟", "fr": "AB = DE = 5, BC = EF = 7, angle B = angle E = 50°. Quel cas ?", "label": "Problem"}, {"k": "t", "en": "The angle B is between the sides AB and BC, and E is between DE and EF. Two sides and the included angle: case Side-Angle-Side (SAS). Then AC = DF and angle A = angle D, angle C = angle F.", "ar": "الزاوية B محصورة بين AB وBC وE بين DE وEF. ضلعان والزاوية المحصورة: حالة ضلع – زاوية – ضلع. ومنه AC = DF والزاوية A = الزاوية D والزاوية C = الزاوية F.", "fr": "côté-angle-côté (SAS).", "label": ""}, {"k": "f", "f": "△ABC ≅ △DEF  (Side-Angle-Side)"}]}, {"title": {"en": "Exercise 2", "ar": "التمرين 2", "fr": "Exercice 2"}, "items": [{"k": "t", "en": "angle A = angle D = 40°, angle B = angle E = 65°, AB = DE = 6 cm. Which case? Find angle C and angle F.", "ar": "الزاوية A = الزاوية D = 40° والزاوية B = الزاوية E = 65° وAB = DE = 6 سم. أي حالة؟ جد الزاوية C والزاوية F.", "fr": "angle A = angle D = 40°, angle B = angle E = 65°, AB = DE = 6. Quel cas ? angle C, angle F ?", "label": "Problem"}, {"k": "t", "en": "The side AB lies between the angles A and B, and DE between D and E: case Angle-Side-Angle (ASA). The third angle: C = 180 − (40 + 65) = 75°, and F = C = 75° because homologous angles are equal.", "ar": "الضلع AB بين الزاويتين A وB وDE بين D وE: حالة زاوية – ضلع – زاوية. الزاوية الثالثة C = 180 − (40 + 65) = 75° وF = C = 75° لأن الزوايا المتناظرة متساوية.", "fr": "angle-côté-angle (ASA) ; C = F = 75°.", "label": ""}, {"k": "f", "f": "C = 180° − 105° = 75°      F = 75°"}]}, {"title": {"en": "Exercise 3", "ar": "التمرين 3", "fr": "Exercice 3"}, "items": [{"k": "t", "en": "triangle ABC has AB = 3, BC = 4, CA = 5 cm. triangle DEF has DE = 5, EF = 3, FD = 4 cm. Are they equal? Write the correct order of letters.", "ar": "في المثلث ABC: AB = 3 وBC = 4 وCA = 5 سم. وفي المثلث DEF: DE = 5 وEF = 3 وFD = 4 سم. هل هما متساويان؟ اكتب ترتيب الحروف الصحيح.", "fr": "triangle ABC : 3, 4, 5. triangle DEF : DE = 5, EF = 3, FD = 4. Égaux ? Ordre des lettres ?", "label": "Problem"}, {"k": "t", "en": "The sides are 3, 4, 5 in both: case Side-Side-Side (SSS). Match equal sides: AB = EF = 3 so A, B match E, F; BC = FD = 4 so B matches F and C matches D; CA = DE = 5 so C matches D and A matches E. The triangles are equal and triangle ABC is congruent to triangle EFD.", "ar": "الأضلاع 3 و4 و5 في كليهما: حالة ضلع – ضلع – ضلع. نقابل الأضلاع المتساوية: AB = EF = 3 وBC = FD = 4 وCA = DE = 5. إذن A تقابل E وB تقابل F وC تقابل D فيكون المثلث ABC يطابق المثلث EFD.", "fr": "côté-côté-côté (SSS) ; triangle ABC est égal à triangle EFD.", "label": ""}, {"k": "f", "f": "A↔E   B↔F   C↔D      △ABC ≅ △EFD"}]}, {"title": {"en": "Exercise 4", "ar": "التمرين 4", "fr": "Exercice 4"}, "items": [{"k": "t", "en": "In isosceles triangle ABC (AB = AC) the vertex angle A = 50°. Find the base angles.", "ar": "في مثلث متساوي الساقين ABC (AB = AC) الزاوية A = 50°. جد زاويتي القاعدة.", "fr": "triangle ABC isocèle (AB = AC), angle A = 50°. Angles de base ?", "label": "Problem"}, {"k": "t", "en": "The base angles are equal and the three angles add up to 180°. B + C = 180 − 50 = 130, so each is 130 ÷ 2 = 65°. Check: 50 + 65 + 65 = 180 ✓.", "ar": "زاويتا القاعدة متساويتان ومجموع الزوايا 180°. B + C = 180 − 50 = 130 فكل منهما 130 ÷ 2 = 65°. تحقق: 50 + 65 + 65 = 180 ✓.", "fr": "65° chacun.", "label": ""}, {"k": "f", "f": "B = C = (180° − 50°) ÷ 2 = 65°"}]}, {"title": {"en": "Exercise 5", "ar": "التمرين 5", "fr": "Exercice 5"}, "items": [{"k": "t", "en": "triangle ABC is congruent to triangle DEF, angle A = 80° and angle B = 45°. Find angle F.", "ar": "المثلث ABC يطابق المثلث DEF والزاوية A = 80° والزاوية B = 45°. جد الزاوية F.", "fr": "triangle ABC est égal à triangle DEF, angle A = 80°, angle B = 45°. angle F ?", "label": "Problem"}, {"k": "t", "en": "In triangle ABC, C = 180 − (80 + 45) = 55°. Homologous angles are equal and C matches F, so F = 55°.", "ar": "في المثلث ABC: C = 180 − (80 + 45) = 55°. الزوايا المتناظرة متساوية وC تقابل F إذن F = 55°.", "fr": "55°.", "label": ""}, {"k": "f", "f": "∠F = ∠C = 55°"}]}, {"title": {"en": "Exercise 6", "ar": "التمرين 6", "fr": "Exercice 6"}, "items": [{"k": "t", "en": "triangle ABC is congruent to triangle DEF, AB = 4, BC = 6, AC = 7. Find the perimeter of DEF and the length DF.", "ar": "المثلث ABC يطابق المثلث DEF وAB = 4 وBC = 6 وAC = 7. جد محيط DEF وطول DF.", "fr": "triangle ABC est égal à triangle DEF, AB = 4, BC = 6, AC = 7. Périmètre de DEF, DF ?", "label": "Problem"}, {"k": "t", "en": "Equal triangles have equal sides: DE = 4, EF = 6, DF = AC = 7. Perimeter 4 + 6 + 7 = 17.", "ar": "المثلثان المتساويان أضلاعهما متساوية: DE = 4 وEF = 6 وDF = AC = 7. المحيط 4 + 6 + 7 = 17.", "fr": "DF = 7 ; 17.", "label": ""}, {"k": "f", "f": "DF = 7      perimeter = 17"}]}, {"title": {"en": "Exercise 7", "ar": "التمرين 7", "fr": "Exercice 7"}, "items": [{"k": "t", "en": "Construct triangle ABC with AB = 4 cm, angle A = 30°, angle B = 45°. Find angle C and estimate AC and BC.", "ar": "ارسم المثلث ABC فيه AB = 4 سم والزاوية A = 30° والزاوية B = 45°. جد الزاوية C وقدّر AC وBC.", "fr": "Construis triangle ABC : AB = 4 cm, angle A = 30°, angle B = 45°. angle C, AC, BC ?", "label": "Problem"}, {"k": "t", "en": "C = 180 − 75 = 105°. After drawing, measure: AC is about 2.9 cm and BC about 2.1 cm. Any other triangle with the same data is equal to it (Angle-Side-Angle (ASA)).", "ar": "C = 180 − 75 = 105°. بعد الرسم نقيس: AC ≈ 2.9 سم وBC ≈ 2.1 سم. وأي مثلث آخر له المعطيات نفسها يساويه (زاوية – ضلع – زاوية).", "fr": "C = 105°, AC ≈ 2,9 cm, BC ≈ 2,1 cm.", "label": ""}, {"k": "d", "svg": "<g id=\"K20\"><line x1=\"110.0\" y1=\"340.0\" x2=\"310.0\" y2=\"340.0\" stroke=\"#0b3d5c\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle data-pt=\"A\" cx=\"110.0\" cy=\"340.0\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"90.0\" y=\"350.0\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">A<\/text><circle data-pt=\"B\" cx=\"310.0\" cy=\"340.0\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"330.0\" y=\"350.0\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">B<\/text><text x=\"210.0\" y=\"385.0\" font-size=\"26\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1e88e5\" font-family=\"sans-serif\">4 cm<\/text><\/g><g id=\"K21\"><line x1=\"110.0\" y1=\"340.0\" x2=\"395.8\" y2=\"175.0\" stroke=\"#0b3d5c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><path d=\"M 156.0 340.0 A 46 46 0 0 0 149.8 317.0\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"3.5\"/><text x=\"170.0\" y=\"322.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#e53935\" font-family=\"sans-serif\">30°<\/text><\/g><g id=\"K22\"><line x1=\"310.0\" y1=\"340.0\" x2=\"126.2\" y2=\"156.2\" stroke=\"#0b3d5c\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"6 5\"/><path d=\"M 281.7 311.7 A 40 40 0 0 0 270.0 340.0\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"3.5\"/><text x=\"270.0\" y=\"322.0\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#e53935\" font-family=\"sans-serif\">45°<\/text><\/g><g id=\"K23\"><circle data-pt=\"C\" cx=\"236.8\" cy=\"266.8\" r=\"5\" fill=\"#0b3d5c\"/><text x=\"236.8\" y=\"250.8\" font-size=\"26\" font-weight=\"700\" font-style=\"italic\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">C<\/text><line x1=\" var MW={en:{"−":" minus ","+":" plus ","×":" times ","·":" times ","÷":" divided by ","=":" equals ","→":" gives ","✓":" correct ","≈":" approximately "},
        ar:{"−":" ناقص ","+":" زائد ","×":" ضرب ","·":" ضرب ","÷":" تقسيم ","=":" يساوي ","→":" يعطي ","✓":" صحيح ","≈":" يساوي تقريبًا "},
        fr:{"−":" moins ","+":" plus ","×":" fois ","·":" fois ","÷":" divisé par ","=":" égale ","→":" donne ","✓":" juste ","≈":" environ "}};
function mathSpeech(f){var m=MW[LANG];return f.replace(/[−+×·÷=→✓≈]/g,function(c){return m[c]||c}).replace(/\s+/g," ")}
function chunksOf(text){
  var parts=text.match(/[^.!?؟؛:]+[.!?؟؛:]*\s*/g)||[text],out=[],cur="";
  parts.forEach(function(p){if(cur&&(cur+p).length>170){out.push(cur);cur=p}else cur+=p});
  if(cur)out.push(cur);
  return out.join("")===text?out:[text];
}
function narStop(){narTok++;clearInterval(narTimer);speaking=false;try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
function narrate(text,el,onDone,onProg,estO){
  narStop();var tok=narTok;
  var words=el?$$(".w",el):[],starts=[],pos=0;
  words.forEach(function(w){var i=text.indexOf(w.textContent,pos);if(i<0)i=pos;starts.push(i);pos=i+w.textContent.length});
  function reveal(n,f){for(var i=0;i<words.length;i++)words[i].classList.toggle("on",i<n);if(onProg)onProg(f!=null?f:(words.length?n/words.length:0));
    if(n>0&&n<=words.length){var wp=wordPoint(n>1?words[n-2].textContent:"",words[n-1].textContent);if(wp){target=wp;wtActive=true}}}
  var done=false;
  function finish(){if(tok!==narTok||done)return;done=true;clearInterval(narTimer);reveal(words.length,1);speaking=false;if(onDone){try{onDone()}catch(e){}}}
  reveal(0,0);speaking=true;
  var est=estO||Math.max(1400,text.length*(LANG==="ar"?80:68)),t0=Date.now(),gotB=false,started=false;
  narTimer=setInterval(function(){if(tok!==narTok||gotB)return;var f0=Math.min(1,(Date.now()-t0)/est);reveal(Math.ceil(f0*words.length),f0)},100);
  if(!text||!(voiceOn&&SUPPORT)){setTimeout(finish,est+400);return}
  var ch=chunksOf(text),ci=0,base=0,lastAct=Date.now();
  var wd=setInterval(function(){if(tok!==narTok||done){clearInterval(wd);return}
    try{var ss=window.speechSynthesis;if(ss&&ss.paused)ss.resume()}catch(e){}
    if(started&&Date.now()-lastAct>6000){clearInterval(wd);try{window.speechSynthesis.cancel()}catch(e){}finish()}},1000);
  function speakNext(){
    if(tok!==narTok)return;
    if(ci>=ch.length){finish();return}
    var u=new SpeechSynthesisUtterance(ch[ci]),off=base,len=ch[ci].length;
    u.lang=VOICES[LANG];u.rate=.95;
    u.onstart=function(){started=true;lastAct=Date.now()};
    u.onboundary=function(e){
      if(tok!==narTok)return;gotB=true;started=true;lastAct=Date.now();var c=off+(e.charIndex||0),n=0;
      for(var i=0;i<starts.length;i++){if(starts[i]<=c+1)n=i+1}
      reveal(n,words.length?n/words.length:0);
    };
    u.onend=function(){if(tok!==narTok)return;lastAct=Date.now();ci++;base+=len;speakNext()};
    u.onerror=function(e){if(tok!==narTok)return;setTimeout(finish,300)};
    try{window.speechSynthesis.speak(u)}catch(e){setTimeout(finish,est)}
  }
  try{window.speechSynthesis.cancel()}catch(e){}
  setTimeout(speakNext,60);
  setTimeout(function(){ /* voice never started: keep the timed writing and move on */
    if(tok===narTok&&!started&&!done){try{window.speechSynthesis.cancel()}catch(e){}tok=++narTok;var t1=Date.now();narTimer=setInterval(function(){var f=Math.min(1,(Date.now()-t1)/est);reveal(Math.ceil(f*words.length),f);if(f>=1){clearInterval(narTimer);reveal(words.length,1);speaking=false;if(!done){done=true;if(onDone)onDone()}}},100)}
  },3500);
}
function schedule(ms){
  clearTimeout(playTimer);
  playTimer=setTimeout(function(){
    if(!playing)return;
    var p=page();
    if(pi>=DATA.pages.length-1&&ii>=bundlesOf(p).length-1){stopPlay();return}
    next();
  },ms);
}
function startPlay(){
  playing=true;try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}closePops();$("#side").classList.remove("show");$("#bigplay").textContent="❚❚";$("#mPlay").textContent="❚❚  "+UI[LANG].pause;
  go(Math.max(ii,0),true);
}
function stopPlay(){$("#bigplay").textContent="▶";playing=false;clearTimeout(playTimer);narStop();$("#mPlay").textContent="▶  "+UI[LANG].play}

var cur={x:585,y:330},target=[585,330];
function frame(ts){
  cur.x+=(target[0]-cur.x)*.08;cur.y+=(target[1]-cur.y)*.08;
  var ox=262,oy=470;
  var wob=Math.sin(ts/330)*3,tx=cur.x+wob,ty=cur.y+wob*.6;
  var mx=(ox+tx)/2,my=Math.min(oy,ty)-70;
  var dx=tx-ox,dy=ty-oy,dl=Math.hypot(dx,dy)||1,ex=tx-dx/dl*16,ey=ty-dy/dl*16;beam.setAttribute("d","M"+ox+" "+oy+" L"+ex+" "+ey);
  ring.setAttribute("cx",tx);ring.setAttribute("cy",ty);ring.setAttribute("r",24+Math.sin(ts/260)*5);
  dot.setAttribute("cx",tx);dot.setAttribute("cy",ty);
  var ang=Math.atan2(ty-my,tx-mx)*180/Math.PI;
  head.setAttribute("opacity",0);head.setAttribute("transform","translate("+(tx-4)+","+(ty-4)+") rotate("+ang+") translate(-18,0)");
  var u=$("#ustaz");if(u)u.classList.toggle("talk",speaking);
  if(speaking!==lastSp){lastSp=speaking;if(uv){try{if(speaking){var pr=uv.play();if(pr&&pr.catch)pr.catch(function(){})}else uv.pause()}catch(e){}}}
  requestAnimationFrame(frame);
}

function pos(e){var r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function drawOp(o,c){
  c.save();c.lineCap="round";c.lineJoin="round";c.lineWidth=o.w;c.strokeStyle=o.c;
  if(o.k==="erase"){c.globalCompositeOperation="destination-out";c.lineWidth=o.w*4}
  if(o.k==="pen"||o.k==="erase"){
    c.beginPath();c.moveTo(o.p[0].x,o.p[0].y);
    if(o.p.length===1)c.lineTo(o.p[0].x+.1,o.p[0].y);
    for(var i=1;i<o.p.length;i++)c.lineTo(o.p[i].x,o.p[i].y);
    c.stroke();
  }else{
    var a=o.a,b=o.b;c.beginPath();
    if(o.k==="line"||o.k==="arrow"){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);
      if(o.k==="arrow"){var an=Math.atan2(b.y-a.y,b.x-a.x),h=14+o.w*2;
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an-.45),b.y-h*Math.sin(an-.45));
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an+.45),b.y-h*Math.sin(an+.45))}}
    else if(o.k==="rect"){c.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}
    else if(o.k==="circle"){c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,7)}
    else if(o.k==="tri"){c.moveTo((a.x+b.x)/2,a.y);c.lineTo(b.x,b.y);c.lineTo(a.x,b.y);c.closePath()}
    c.stroke();
  }
  c.restore();
}
window.__repaint=function(){repaint()};
function repaint(extra){cx.clearRect(0,0,cv.width,cv.height);ops.forEach(function(o){drawOp(o,cx)});if(extra)drawOp(extra,cx)}
cv.addEventListener("pointerdown",function(e){
  if(tool==="select")return;
  cv.setPointerCapture(e.pointerId);closePops();
  var p=pos(e);redo=[];
  if(tool==="shape")drawing={k:shapeKind||"line",c:color,w:size,a:p,b:p};
  else drawing={k:tool==="eraser"?"erase":"pen",c:color,w:size,p:[p]};
  repaint(drawing);
});
cv.addEventListener("pointermove",function(e){
  if(!drawing)return;var p=pos(e);
  if(drawing.p)drawing.p.push(p);else drawing.b=p;
  repaint(drawing);
});
function endDraw(){if(!drawing)return;ops.push(drawing);drawing=null;repaint()}
