<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Power functions — NABIL AI Smart Board</title>
<style>

:root{
  --bg1:#05102a;--bg2:#0a2050;--line:#1e90ff;--cyan:#6fd3ff;--yellow:#ffe14d;--orange:#ff9f1c;--green:#39d98a;--ink:#eaf3ff;
  --hand:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020812;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:0 0;border-radius:18px;overflow:hidden;
  background:radial-gradient(1200px 700px at 55% 40%,#0c2a63 0%,var(--bg2) 38%,var(--bg1) 100%);
  box-shadow:0 0 0 10px #0b0f18,0 0 0 13px #1b2433,0 30px 80px rgba(0,0,0,.7)}
#stage.bg-black{background:#000}
#stage.bg-grid{background:linear-gradient(rgba(60,130,255,.14) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(60,130,255,.14) 1px,transparent 1px) 0 0/44px 44px,radial-gradient(1200px 700px at 55% 40%,#0c2a63,var(--bg1))}
#stage.bg-green{background:radial-gradient(1200px 700px at 55% 40%,#1d5a45,#0d2c22)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 20% 0%,rgba(80,160,255,.18),transparent 70%);z-index:0}
.abs{position:absolute}
/* top bar */
#logo{left:214px;top:30px;display:flex;align-items:center;gap:12px}
#logo .t1{font-weight:800;font-size:33px;letter-spacing:1px;line-height:1;text-shadow:0 0 10px rgba(110,190,255,.8)}
#logo .t2{font-size:14.5px;color:#bcd7ff;margin-top:6px}
#title{left:497px;top:36px;width:686px;height:68px;border:3px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#0b2a66,#08205a);box-shadow:0 0 18px rgba(30,144,255,.85),inset 0 0 18px rgba(30,144,255,.45);
  font-size:41px;font-weight:600;letter-spacing:1px;white-space:pre;text-shadow:0 0 12px rgba(150,210,255,.8)}
#topic{left:1337px;top:33px;width:175px;height:66px;border:2px solid var(--line);border-radius:12px;padding:9px 14px;font-size:17px;line-height:22px;
  box-shadow:0 0 12px rgba(30,144,255,.7),inset 0 0 10px rgba(30,144,255,.35);background:rgba(8,32,90,.7)}
#pager{left:1543px;top:44px;font-size:25px;font-weight:600;text-shadow:0 0 8px rgba(130,200,255,.7)}
/* text column */
#steps{left:757px;top:128px;width:500px;display:flex;flex-direction:column;gap:12px;font-family:var(--hand);font-size:29px;line-height:36px;z-index:3}
.st{display:flex;gap:16px;align-items:flex-start;cursor:pointer;opacity:0;transition:opacity .25s}
.st.on{opacity:1}
.st .n{flex:0 0 42px;height:42px;border:3px solid var(--yellow);border-radius:50%;color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1;margin-top:0;font-family:system-ui,Arial,sans-serif;font-weight:700;box-shadow:0 0 10px rgba(255,225,77,.45)}
.st .tx{flex:1;text-shadow:0 0 6px rgba(160,210,255,.35)}
.st .tx .hw{display:inline-block;clip-path:inset(0 100% 0 0)}
.st.on .hw{animation:write 1.5s steps(28,end) forwards}
.st.done .hw{animation:none;clip-path:inset(0 0 0 0)}
.st.cur .n{background:rgba(255,225,77,.18)}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.st.s5 .tx{font-size:30px}
#final{left:737px;top:722px;width:510px;height:66px;border:3px solid var(--yellow);border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:30px;color:var(--yellow);font-weight:700;box-shadow:0 0 18px rgba(255,225,77,.55),inset 0 0 14px rgba(255,225,77,.18);opacity:0;transition:opacity .4s;z-index:3;white-space:pre}
#final.on{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,225,77,.9),inset 0 0 18px rgba(255,225,77,.3)}}
/* right panel */
#panelline{left:1259px;top:128px;width:3px;height:680px;background:linear-gradient(#1e90ff,rgba(30,144,255,.3));box-shadow:0 0 10px #1e90ff}
#side{left:1283px;top:126px;width:350px;font-family:var(--hand);font-size:28px;line-height:36px;z-index:3}
.hd{color:var(--yellow);font-size:31px;display:inline-block;border-bottom:3px solid var(--yellow);padding-bottom:0;line-height:34px;text-shadow:0 0 8px rgba(255,225,77,.5)}
.blk{opacity:0;transition:opacity .35s;margin-bottom:18px}
.blk.on{opacity:1}
.blk .ln{margin:6px 0 0 30px}
#steps2{border:3px solid var(--green);border-radius:16px 16px 12px 12px;padding:6px 14px 12px;box-shadow:0 0 12px rgba(57,217,138,.4);margin-top:20px}
#steps2 .hd{border:0;color:var(--yellow)}
.ms{display:flex;gap:10px;align-items:flex-start;opacity:0;transition:opacity .35s;margin-top:8px;font-size:27px;line-height:32px}
.ms.on{opacity:1}
.ms i{font-style:normal;flex:0 0 28px;height:28px;margin-top:3px;border:2px solid var(--cyan);border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-family:system-ui,Arial,sans-serif}
/* svg layers */
#diagram,#teacher,#ink{position:absolute;left:0;top:0;width:1672px;height:941px}
#diagram{z-index:2;pointer-events:none}
#teacher{z-index:4;pointer-events:none}
#ink{z-index:6;touch-action:none}
.fx{opacity:0;transition:opacity .5s}
.fx.on{opacity:1}
.lbl{font-family:var(--hand);font-style:italic;font-size:38px;fill:#fff}
/* toolbar */
#bar{left:364px;top:812px;width:1284px;height:84px;display:flex;align-items:center;border-top:2px solid rgba(30,144,255,.8);background:linear-gradient(rgba(5,20,50,.2),rgba(5,20,50,.85));z-index:8}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:80px;height:68px;border-radius:10px;color:#cfe4ff;font-size:15px;cursor:pointer;user-select:none;border:0;background:none;font-family:inherit;transition:background .15s}
.tb svg{width:32px;height:32px;stroke:#cfe4ff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:rgba(60,130,255,.2)}
.tb.act{background:#1f8cff;color:#fff;box-shadow:0 0 14px rgba(31,140,255,.85)}
.tb.act svg{stroke:#fff}
.sp{flex:1}
#nav{display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;border-radius:14px;background:rgba(18,50,120,.65);margin-left:12px;border:1px solid rgba(30,144,255,.5)}
#nav button{width:44px;height:44px;border:0;background:none;cursor:pointer;color:#2e9bff;font-size:30px;font-weight:700;border-radius:8px}
#nav button:hover{background:rgba(60,130,255,.25)}
#nav span{min-width:90px;text-align:center;font-size:20px;font-weight:600}
#dots{position:absolute;left:1456px;top:802px;display:flex;gap:6px;z-index:9}
#dots b{width:9px;height:9px;border-radius:50%;background:#2a4a85}
#dots b.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
/* popups */
.pop{position:absolute;left:372px;bottom:150px;min-width:250px;padding:14px;border-radius:14px;background:rgba(6,22,56,.97);border:2px solid var(--line);box-shadow:0 0 20px rgba(30,144,255,.6);display:none;z-index:12;font-size:19px}
.pop.show{display:block}
.pop button.item{display:block;width:100%;text-align:left;padding:10px 12px;margin:3px 0;border-radius:8px;border:0;background:rgba(40,100,220,.25);color:#fff;font-size:19px;cursor:pointer}
.pop button.item:hover{background:rgba(40,100,220,.55)}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:3px solid transparent;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 10px #fff}
#shapes{left:915px}
#bgmsg{position:absolute;right:20px;top:120px;font-size:15px;color:#9bbcf2;opacity:0;transition:opacity .3s;z-index:20}
#rot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;background:#0b2a66;color:#fff;font-size:14px;text-align:center;z-index:50;display:none}
#draw{left:372px;top:330px;width:430px;height:300px;border-radius:14px;background:#f4f9ff;border:3px solid var(--line);box-shadow:0 0 18px rgba(30,144,255,.7);z-index:2;overflow:hidden;display:none}
#draw svg{width:100%;height:100%}
#draw.on{display:block}
#fm{left:380px;top:646px;width:420px;height:152px;overflow:hidden;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;font-size:27px;color:var(--yellow);font-family:var(--hand);text-shadow:0 0 8px rgba(255,225,77,.4)}
#fm.tall{top:128px;height:664px;justify-content:flex-start;font-size:30px}
#fm .f{border:3px solid var(--yellow);border-radius:12px;padding:8px 12px;direction:ltr;text-align:center;box-shadow:0 0 12px rgba(255,225,77,.35);overflow-wrap:anywhere;opacity:0;transition:opacity .4s;line-height:32px}
#fm .f.on{opacity:1}
#steps{left:830px;top:128px;width:415px;height:664px;overflow-y:auto;scrollbar-width:none;font-size:25px;line-height:33px;gap:14px}
#steps::-webkit-scrollbar{display:none}
#steps .st{opacity:.55}
#steps .st.cur{opacity:1}
#steps .st .n{flex:0 0 38px;height:38px;font-size:22px}
#steps .st .tx{font-family:var(--hand)}
#steps .st .lab{display:block;color:var(--cyan);font-size:19px;line-height:22px}
#steps.rtl{direction:rtl;text-align:right}
#side{width:350px}
#map{border:3px solid var(--green);border-radius:16px;padding:8px 12px;box-shadow:0 0 12px rgba(57,217,138,.4);height:610px;overflow-y:auto;scrollbar-width:none;margin-top:14px}
#map::-webkit-scrollbar{display:none}
#map .mi{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:21px;line-height:26px;cursor:pointer;opacity:.75;font-family:system-ui,Arial,sans-serif}
#map .mi i{font-style:normal;flex:0 0 28px;height:28px;border:2px solid var(--cyan);border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--cyan);margin-top:0}
#map .mi.cur{opacity:1;color:var(--yellow);font-weight:700}
#map .mi.cur i{border-color:var(--yellow);color:var(--yellow);background:rgba(255,225,77,.15)}
#map.rtl{direction:rtl}
#sideh{font-family:var(--hand);font-size:31px;color:var(--yellow);border-bottom:3px solid var(--yellow);display:inline-block;line-height:34px}
#title{font-size:36px;padding:0 20px;text-align:center;white-space:normal;line-height:40px}
.pop button.item.sel{background:#1f8cff}

@keyframes writeR{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
#steps.rtl .st .hw{clip-path:inset(0 0 0 100%)}
#steps.rtl .st.done .hw{clip-path:inset(0)}
#steps.rtl .st .tx{font-family:"Noto Naskh Arabic","Droid Arabic Naskh","Segoe UI",Tahoma,system-ui,sans-serif;font-size:27px;line-height:38px}
#fm .f{font-family:var(--hand)}
#bigplay{display:block;left:14px;top:524px;width:346px;height:72px;border:3px solid var(--yellow);border-radius:16px;background:rgba(255,225,77,.14);color:var(--yellow);font-size:38px;cursor:pointer;z-index:10}
#start{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,8,20,.82);z-index:30}
#startbox{width:760px;max-width:90%;text-align:center;padding:40px;border:3px solid var(--line);border-radius:24px;background:rgba(6,22,56,.97);box-shadow:0 0 40px rgba(30,144,255,.6)}
#startt{font-size:40px;font-weight:700;margin-bottom:26px;line-height:50px}
#startb{font-size:44px;padding:22px 54px;border-radius:20px;border:0;background:#1f8cff;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 0 30px rgba(31,140,255,.8)}
#startn{margin-top:26px;font-size:26px;line-height:36px;color:#bcd7ff}

#side.show{display:block}
/* ---------- portrait (phones) ---------- */
#stage.portrait #logo,#stage.portrait #panelline,#stage.portrait #dots{display:none}
#stage.portrait #title{left:20px;top:16px;width:860px;height:92px;font-size:38px;line-height:44px}
#stage.portrait #topic{left:440px;top:132px;width:440px;height:92px;font-size:28px;line-height:34px;padding:10px 16px;display:flex;align-items:center}
#stage.portrait #pager{left:440px;top:240px;font-size:34px}
#stage.portrait #bigplay{left:440px;top:300px;width:440px;height:84px}
#stage.portrait #ustaz{left:20px;top:122px;width:400px;height:262px}
#stage.portrait #bigplay{left:440px;top:300px}
#stage.portrait #draw{left:20px;top:400px;width:860px;height:573px}
#stage.portrait #fm{left:20px;top:988px;width:860px;height:232px;font-size:34px}
#stage.portrait #fm.tall{top:400px;height:820px;font-size:38px}
#stage.portrait #fm .f{line-height:42px;padding:10px 16px}
#stage.portrait #steps{left:20px;top:1232px;width:860px;height:392px;font-size:34px;line-height:46px}
#stage.portrait #steps .st .n{flex:0 0 52px;height:52px;font-size:30px}
#stage.portrait #steps.rtl .st .tx{font-size:36px;line-height:50px}
#stage.portrait #steps .st{opacity:.5}
#stage.portrait #steps .st.cur{opacity:1}
#stage.portrait #bar{left:0;top:1636px;width:900px;height:164px;flex-wrap:wrap;align-content:flex-start;border-top:2px solid rgba(30,144,255,.8);padding:6px 6px}
#stage.portrait #bar .sp{display:none}
#stage.portrait #nav{order:-1;flex:0 0 100%;height:84px;justify-content:space-between;margin:0 0 6px;border-radius:18px}
#stage.portrait #nav button{width:120px;height:68px;font-size:50px}
#stage.portrait #nav span{font-size:34px}
#stage.portrait .tb{width:98px;height:70px;font-size:15px}
#stage.portrait .tb svg{width:30px;height:30px}
#stage.portrait #side{display:none;left:20px;top:122px;width:860px;height:1500px;padding:14px;background:rgba(6,22,56,.98);border:3px solid var(--line);border-radius:18px;z-index:15}
#stage.portrait #side.show{display:block}
#stage.portrait #map{height:1400px}
#stage.portrait #map .mi{font-size:32px;line-height:40px}
#stage.portrait #map .mi i{flex:0 0 42px;height:42px;font-size:22px}
#stage.portrait .pop{left:20px!important;bottom:190px;min-width:420px;font-size:28px}
#stage.portrait .pop button.item{font-size:30px;padding:16px}
#stage.portrait #startbox{width:820px}

#ustaz{left:14px;top:134px;width:346px;height:372px;border-radius:22px;overflow:hidden;border:3px solid var(--line);box-shadow:0 0 22px rgba(30,144,255,.75);z-index:4;background:#1a1d24;transition:box-shadow .3s}
#ustaz img{width:100%;height:100%;object-fit:cover;object-position:38% 20%;display:block}
#ustaz.talk{box-shadow:0 0 30px rgba(57,217,138,.95);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012)}}
#nametag{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(3,12,32,.92));font-size:25px;font-weight:700;color:#fff}
#nametag .eq{display:flex;gap:4px;align-items:flex-end;height:26px}
#nametag .eq i{width:6px;height:6px;background:#39d98a;border-radius:3px;display:block}
#ustaz.talk .eq i{animation:eq .5s ease-in-out infinite alternate}
#ustaz.talk .eq i:nth-child(2){animation-delay:.1s}#ustaz.talk .eq i:nth-child(3){animation-delay:.2s}#ustaz.talk .eq i:nth-child(4){animation-delay:.15s}#ustaz.talk .eq i:nth-child(5){animation-delay:.05s}
@keyframes eq{to{height:26px}}
#stage.portrait #nametag{font-size:26px}

#steps .st .tx .hw{clip-path:none!important;animation:none!important}
#steps .w{opacity:0;transition:opacity .12s}
#steps .w.on,#steps .st.done .w{opacity:1}
#ustaz video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;opacity:0;transition:opacity .25s}
#ustaz.vid video{opacity:1}

#rot{background:#ffe14d;color:#10203f;font-weight:700;font-size:18px;padding:12px;z-index:60}
#stage.nodraw #steps{left:380px;top:128px;width:865px;height:480px;font-size:30px;line-height:42px}
#stage.nodraw #steps.rtl .st .tx{font-size:32px;line-height:46px}
#stage.nodraw #steps .st .n{flex:0 0 44px;height:44px;font-size:25px}
#stage.nodraw #fm.tall{left:380px;top:620px;width:865px;height:176px;justify-content:flex-end;font-size:30px}

#ustaz{top:128px;height:480px}
#ustaz img{object-position:40% 18%}
#bigplay{top:622px;height:66px}

/* standing teacher (full-body photo) */
#ustaz{left:14px;top:128px;width:340px;height:800px;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible;transition:none}
#ustaz img{position:absolute;left:30px;bottom:0;width:252px;height:800px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 6px 14px rgba(0,0,0,.65))}

@keyframes sway{50%{transform:rotate(.7deg) translateY(-3px)}}
#nametag{left:6px;right:auto;bottom:6px;width:240px;padding:8px 12px;border-radius:12px;background:rgba(3,12,32,.78);border:2px solid var(--line);font-size:22px}
#bigplay{left:272px;top:140px;width:84px;height:84px;border-radius:50%;font-size:34px;padding:0}

/* robot avatar */
#ustaz{left:14px;top:250px;width:346px;height:344px}

#nametag{left:0;bottom:-58px;width:346px;font-size:24px;justify-content:space-between}
#bigplay{left:14px;top:672px;width:346px;height:72px;border-radius:16px;font-size:38px}

.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.frac .nu{border-bottom:.08em solid currentColor;padding:0 .2em .05em}
.frac .de{padding:.05em .2em 0}
.frac .nu,.frac .de{font-size:.92em}
.rad{display:inline-flex;align-items:flex-end}
.rad .rc{border-top:.08em solid currentColor;padding:0 .12em;margin-left:.05em}
sup,sub{font-size:.62em;line-height:0}
.mw{display:inline-block;direction:ltr;unicode-bidi:isolate}

</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="logo" class="abs">
    <svg width="76" height="56" viewBox="0 0 76 56" aria-hidden="true">
      <defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9ac9ff"/></linearGradient></defs>
      <polygon points="38,4 74,20 38,36 2,20" fill="url(#gc)" stroke="#6fb4ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 28 V42 C16 47 27 52 38 52 C49 52 60 47 60 42 V28 L38 37 Z" fill="#cfe4ff" stroke="#6fb4ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M68 22 V40" stroke="#ffd34d" stroke-width="3" stroke-linecap="round"/><circle cx="68" cy="43" r="3.5" fill="#ffd34d"/>
    </svg>
    <div><div class="t1">NABIL AI</div><div class="t2">Smart Learning Platform</div></div>
  </div>
  <div id="title" class="abs"></div>
  <div id="topic" class="abs"></div>
  <div id="pager" class="abs"></div>

  <button id="bigplay" class="abs">▶</button>
  <div id="draw" class="abs"></div>
  <div id="fm" class="abs"></div>
  <div id="steps" class="abs"></div>

var DATA={"title": {"en": "Power functions", "ar": "الدوال القوى", "fr": "Fonctions puissances"}, "lang": "ar", "pages": [{"title": {"en": "One symbol, many behaviours", "ar": "رمز واحد وسلوكات كثيرة", "fr": "Un symbole, plusieurs comportements"}, "items": [{"k": "t", "en": "Hello! x², x³, x^(1/2), x^(−1), x^(3/2): are all of these power functions? Yes, they have the form xᵃ. But the value of a changes the domain and the behaviour radically. x² is defined for every real x, while √x is real only for x ≥ 0. So before differentiating or drawing, read the exponent and decide its type.", "ar": "مرحبًا! x² وx³ وx^(1/2) وx^(−1) وx^(3/2): هل كلها دوال قوى؟ نعم فهي من الشكل xᵃ. لكن قيمة a تغيّر المجال والسلوك جذريًا. x² معرّفة لكل x حقيقي أما √x فحقيقية فقط عند x ≥ 0. لذلك قبل الاشتقاق أو الرسم نقرأ الأس ونحدد نوعه.", "fr": "L'exposant gouverne.", "label": ""}]}, {"title": {"en": "Integer exponents and parity", "ar": "الأسس الصحيحة والزوجية", "fr": "Exposants entiers et parité"}, "items": [{"k": "t", "en": "For integer n: (−x)ⁿ = (−1)ⁿxⁿ. Even n gives an even function (symmetric about the y-axis); odd n gives an odd function (symmetric about the origin). So x⁷ is odd. Example f(x) = x⁴: domain ℝ, even, f′(x) = 4x³, negative for x < 0 and positive for x > 0, so decreasing on (−∞, 0], increasing on [0, +∞), limits +∞ at ±∞, minimum f(0) = 0.", "ar": "لعدد صحيح n: (−x)ⁿ = (−1)ⁿxⁿ. n زوجي يعطي دالة زوجية (متناظرة حول محور التراتيب) وn فردي يعطي دالة فردية (متناظرة حول المبدأ). إذن x⁷ فردية. مثال f(x) = x⁴: المجال ℝ زوجية وf′(x) = 4x³ سالبة عندما x < 0 وموجبة عندما x > 0 فهي متناقصة على (−∞, 0] ومتزايدة على [0, +∞) والنهايتان +∞ عند ±∞ والصغرى f(0) = 0.", "fr": "Paire ou impaire.", "label": ""}, {"k": "f", "f": "f(x) = x⁴      f′(x) = 4x³      min f(0) = 0"}, {"k": "d", "svg": "<g id=\"P1a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"40.0\" y=\"384.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family ont-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">A(1,1)<\/text><\/g><g id=\"P2pB\"><circle cx=\"233.3\" cy=\"242.5\" r=\"9\" fill=\"#1e88e5\" stroke=\"#0b3d5c\" stroke-width=\"2\"/><text x=\"245.3\" y=\"232.5\" font-size=\"19\" font-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">B(-1,-1)<\/text><\/g>", "vb": [660, 440], "show": ["P2a", "P2c", "P2x0", "P2pO", "P2pA", "P2pB"]}, {"k": "t", "en": "Odd powers are symmetric about the origin: rotate the right half by 180° to get the left half. They are increasing on all of ℝ and pass through (−1, −1), (0, 0), (1, 1). At 0 the tangent is the x-axis, so the curve flattens as it crosses.", "ar": "القوى الفردية متناظرة حول المبدأ: ندير النصف الأيمن 180° فنحصل على النصف الأيسر. وهي متزايدة على ℝ وتمر بالنقاط (−1, −1) و(0, 0) و(1, 1). عند 0 يكون المماس هو محور الفواصل فيتسطح المنحنى وهو يعبر.", "fr": "Les puissances impaires sont symétriques par rapport à l'origine, croissantes sur ℝ, et passent par (−1 ; −1), (0 ; 0), (1 ; 1). En 0 la tangente est l'axe des abscisses.", "label": ""}]}, {"title": {"en": "Negative integer powers", "ar": "القوى الصحيحة السالبة", "fr": "Puissances entières négatives"}, "items": [{"k": "t", "en": "x^(−n) = 1/xⁿ with x ≠ 0, so the domain of x^(−4) is ℝ \\ {0}. Example g(x) = x^(−2) = 1/x²: even, g′(x) = −2/x³, positive for x < 0 and negative for x > 0. Limits: +∞ at 0 from both sides (a positive denominator tending to zero) and 0⁺ at ±∞. So x = 0 is a vertical asymptote and y = 0 a horizontal asymptote.", "ar": "x^(−n) = 1/xⁿ مع x ≠ 0 فمجال x^(−4) هو ℝ \\ {0}. مثال g(x) = x^(−2) = 1/x²: زوجية وg′(x) = −2/x³ موجبة عندما x < 0 وسالبة عندما x > 0. النهايات: +∞ عند 0 من الجهتين (مقام موجب يؤول إلى الصفر) و0⁺ عند ±∞. فالمستقيم x = 0 مقارب رأسي وy = 0 مقارب أفقي.", "fr": "Asymptotes x = 0, y = 0.", "label": ""}, {"k": "f", "f": "g′(x) = −2 / x³"}, {"k": "d", "svg": "<g id=\"P3a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=  deux branches dans des quadrants opposés. Décroissante sur chaque intervalle, mais pas sur leur réunion.", "label": ""}]}, {"title": {"en": "Rational exponents", "ar": "الأسس الكسرية", "fr": "Exposants rationnels"}, "items": [{"k": "t", "en": "For x^(p/q) in reduced form with q > 0: if q is even we need x ≥ 0 (and x > 0 when the exponent is negative); if q is odd, negative x may be allowed. Domains: x^(3/2) is [0, +∞); x^(−3/2) is (0, +∞). Also (−8)^(2/3) is possible since the denominator 3 is odd: the cube root is −2 and its square is 4.", "ar": "في x^(p/q) بصيغة مختزلة وq > 0: إذا كان q زوجيًا نشترط x ≥ 0 (وx > 0 عندما يكون الأس سالبًا)، وإذا كان q فرديًا فقد يُسمح بـ x السالب. المجالات: x^(3/2) هو [0, +∞)؛ وx^(−3/2) هو (0, +∞). كذلك (−8)^(2/3) ممكن لأن المقام 3 فردي: الجذر التكعيبي −2 ومربعه 4.", "fr": "Parité du dénominateur.", "label": ""}, {"k": "t", "en": "Example h(x) = x^(3/2): domain x ≥ 0; for x > 0, h′(x) = (3/2)x^(1/2) > 0 so h is increasing; h″(x) = 3/(4√x) > 0 so it is concave up; h(0) = 0. Domain controls where derivative formulas may be used.", "ar": "مثال h(x) = x^(3/2): المجال x ≥ 0؛ عندما x > 0 فإن h′(x) = (3/2)x^(1/2) > 0 فهي متزايدة؛ وh″(x) = 3/(4√x) > 0 فهي مقعّرة نحو الأعلى؛ وh(0) = 0. المجال يتحكم في أين تُستعمل صيغ المشتقة.", "fr": "h′ > 0, h″ > 0.", "label": ""}, {"k": "f", "f": "h′(x) = (3/2)√x      h″(x) = 3 / (4√x)"}, {"k": "d", "svg": "<g id=\"P5a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"104.4\" y1=\"400.0\" x2=\"104.4\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"104.4\" y=\"348.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"168.9\" y1=\"400.0\" x2=\"168.9\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"168.9\" y=\"348.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">2<\/text><line x1=\"233.3\" y1=\"400.0\" x2=\"233.3\" y2=\"40.0\" stroke= ily=\"sans-serif\">A(1,1)<\/text><\/g><g id=\"P6pB\"><circle cx=\"620.0\" cy=\"76.0\" r=\"9\" fill=\"#1e88e5\" stroke=\"#0b3d5c\" stroke-width=\"2\"/><text x=\"632.0\" y=\"66.0\" font-size=\"19\" font-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">B(4,8)<\/text><\/g>", "vb": [660, 440], "show": ["P6a", "P6c", "P6pA", "P6pB"]}, {"k": "t", "en": "x^(3/2) = x√x grows faster than x but slower than x². At 0 the tangent is horizontal because the derivative (3/2)√x is 0 there. Check: at x = 4, 4 × 2 = 8.", "ar": "x^(3/2) = x√x تنمو أسرع من x وأبطأ من x². عند 0 المماس أفقي لأن المشتقة (3/2)√x تساوي 0 هناك. تحقق: عند x = 4 نجد 4 × 2 = 8.", "fr": "x^(3/2) = x√x croît plus vite que x, moins que x². Tangente horizontale en 0. Vérification : x = 4 → 4 × 2 = 8.", "label": ""}]}, {"title": {"en": "Real exponent on x > 0", "ar": "أس حقيقي على x > 0", "fr": "Exposant réel"}, "items": [{"k": "t", "en": "For x > 0, xᵃ = e^(a ln x). Differentiate: e^(a ln x) · a/x = a xᵃ/x = a x^(a−1). So d/dx(xᵃ) = a x^(a−1); for example the derivative of x^π is πx^(π−1). This representation is for x > 0 only.", "ar": "من أجل x > 0: xᵃ = e^(a ln x). نشتق: e^(a ln x) · a/x = a xᵃ/x = a x^(a−1). إذن d/dx(xᵃ) = a x^(a−1)؛ مثلًا مشتقة x^π هي πx^(π−1). هذا التمثيل لـ x > 0 فقط.", "fr": "xᵃ = e^(a ln x).", "label": ""}, {"k": "f", "f": "(xᵃ)′ = a · x^(a−1),   x > 0"}]}, {"title": {"en": "Monotonicity, concavity, limits", "ar": "الرتابة والتقعر والنهايات", "fr": "Monotonie, concavité, limites"}, "items": [{"k": "t", "en": "For x > 0, x^(a−1) > 0 so the sign of f′ is the sign of a: a > 0 increasing, a < 0 decreasing, a = 0 constant. Also f″ = a(a−1)x^(a−2): concave down when 0 < a < 1, concave up when a > 1 or a < 0. Limits: for a > 0, x → 0⁺ gives 0 and x → +∞ gives +∞; for a < 0 they reverse, because xᵃ = 1/x^(−a). All these curves pass through (1, 1).", "ar": "من أجل x > 0 فإن x^(a−1) > 0 فإشارة f′ هي إشارة a: a > 0 متزايدة وa < 0 متناقصة وa = 0 ثابتة. وكذلك f″ = a(a−1)x^(a−2): مقعّرة نحو الأسفل عندما 0 < a < 1 ونحو الأعلى عندما a > 1 أو a < 0. النهايات: لـ a > 0 يعطي x → 0⁺ القيمة 0 وx → +∞ القيمة +∞؛ ولـ a < 0 ينعكس ذلك لأن xᵃ = 1/x^(−a). وكل هذه المنحنيات تمر بالنقطة (1, 1).", "fr": "Signe de a et de a(a−1).", "label": ""}, {"k": "f", "f": "f″(x) = a(a − 1) x^(a−2)"}, {"k": "d", "svg": "<g id=\"P7a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"156.0\" y1=\"400.0\" x2=\"156.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"156.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"272.0\" y1=\"400.0\" x2=\"272.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"272.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">2<\/text><line x1=\"388.0\" y1=\"400.0\" x2=\"388.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"388.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">3<\/text><line x1=\"504.0\" y1=\"400.0\" x2=\"504.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"504.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">4<\/text><line x1=\"620.0\" y1=\"400.0\" x2=\"620.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"620.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">5<\/text><line x1=\"40.0\" y1=\"400.0\" x2=\"620.0\" y2=\"400.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"40.0\" y1=\"280.0\" x2=\"620.0\" y2=\"280.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"30.0\" y=\"285.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"40.0\" y1=\"160.0\" x2=\"620.0\" y2=\"160.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"30.0\" y=\"165.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-  so the larger positive exponent dominates for large x. Near 0⁺ the order reverses: x⁵ is smaller than x² there. A larger exponent does not always give a larger value: for 0 < x < 1 a larger positive exponent gives a smaller value.", "ar": "إذا كان a > b فإن xᵃ/xᵇ = x^(a−b) → +∞ عندما x → +∞ فيغلب الأس الموجب الأكبر عند x الكبيرة. وقرب 0⁺ ينعكس الترتيب: x⁵ أصغر من x² هناك. الأس الأكبر لا يعطي دائمًا قيمة أكبر: عندما 0 < x < 1 يعطي الأس الموجب الأكبر قيمة أصغر.", "fr": "x⁵ domine à l'infini.", "label": ""}]}, {"title": {"en": "Complete study of x^(−3/2)", "ar": "دراسة كاملة لـ x^(−3/2)", "fr": "Étude complète"}, "items": [{"k": "t", "en": "Domain: x > 0 (negative exponent and even root), so D = (0, +∞). f′(x) = −(3/2)x^(−5/2) < 0, so f is strictly decreasing. Limits: +∞ at 0⁺ and 0 at +∞. Asymptotes: x = 0 vertical and y = 0 horizontal. Check: f(1) = 1 and f(4) = 1/8, consistent with a decreasing function.", "ar": "المجال: x > 0 (أس سالب وجذر زوجي) فيكون D = (0, +∞). f′(x) = −(3/2)x^(−5/2) < 0 فالدالة متناقصة تمامًا. النهايات: +∞ عند 0⁺ و0 عند +∞. المقاربات: x = 0 رأسي وy = 0 أفقي. تحقق: f(1) = 1 وf(4) = 1/8 وهذا يوافق دالة متناقصة.", "fr": "D = ]0, +∞[.", "label": ""}, {"k": "f", "f": "f′(x) = −(3/2) x^(−5/2) < 0"}, {"k": "d", "svg": "<g id=\"P8a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"156.0\" y1=\"400.0\" x2=\"156.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"156.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"272.0\" y1=\"400.0\" x2=\"272.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"272.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">2<\/text><line x1=\"388.0\" y1=\"400.0\" x2=\"388.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"388.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sa  "The study gives: domain (0, +∞); f′(x) = −(3/2)x^(−5/2) < 0, so f is decreasing; limit +∞ at 0⁺ and 0 at +∞; so both axes are asymptotes. The graph confirms every line: a falling curve hugging the y-axis then the x-axis.", "ar": "الدراسة تعطي: المجال (0, +∞)؛ f′(x) = −(3/2)x^(−5/2) < 0 إذن f متناقصة؛ النهاية +∞ عند 0⁺ و0 عند +∞؛ فكلا المحورين مقاربان. والرسم يؤكد كل سطر: منحنى هابط يلتصق بمحور التراتيب ثم بمحور الفواصل.", "fr": "Étude : domaine ]0 ; +∞[ ; f′(x) = −(3/2)x^(−5/2) < 0, f décroît ; limite +∞ en 0⁺ et 0 en +∞ ; les deux axes sont asymptotes. Le graphique confirme tout.", "label": ""}, {"k": "f", "f": "x: 0⁺ → +∞   f′ < 0   f: +∞ ↘ 0"}]}, {"title": {"en": "Error detectives", "ar": "المحققون", "fr": "Détectives"}, "items": [{"k": "t", "en": "1) “x^(1/2) has domain ℝ”: wrong, the even root needs x ≥ 0. 2) Differentiating x^(−2) at x = 0: undefined there. 3) Using x^a = e^(a ln x) for negative x. 4) Thinking (−8)^(2/3) is impossible: the denominator 3 is odd. 5) Saying a larger exponent always gives a larger value.", "ar": "1) «x^(1/2) مجالها ℝ»: خطأ، الجذر الزوجي يشترط x ≥ 0. 2) اشتقاق x^(−2) عند x = 0: غير معرّفة هناك. 3) استعمال x^a = e^(a ln x) من أجل x سالب. 4) ظن أن (−8)^(2/3) مستحيل: المقام 3 فردي. 5) القول إن الأس الأكبر يعطي دائمًا قيمة أكبر.", "fr": "Cinq erreurs types.", "label": ""}]}, {"title": {"en": "Memory line", "ar": "جملة الذاكرة", "fr": "Fil conducteur"}, "items": [{"k": "t", "en": "Do not memorise the shape of xᵃ. Read a first, then ask: where does the function exist? does it rise or fall? how does it bend? what does it do near zero and infinity? The graph becomes a result of understanding.", "ar": "لا تحفظ شكل xᵃ. اقرأ a أولًا ثم اسأل: أين الدالة موجودة؟ هل تصعد أم تنزل؟ كيف تنحني؟ ماذا تفعل قرب الصفر واللانهاية؟ عندها يصبح الرسم نتيجة للفهم.", "fr": "Exposant, domaine, dérivée, signe, limites, forme.", "label": ""}, {"k": "f", "f": "EXPONENT → DOMAIN → DERIVATIVE → SIGN → LIMITS → SHAPE"}]}, {"title": {"en": "Exercise 1", "ar": "التمرين 1", "fr": "Exercice 1"}, "items": [{"k": "t", "en": "State the domain, parity and monotonicity of x⁶, x⁷ and x⁻⁵.", "ar": "عيّن المجال والزوجية والرتابة لكل من x⁶ وx⁷ وx⁻⁵.", "fr": "Domaine, parité et monotonie de x⁶, x⁷, x⁻⁵.", "label": "Problem"}, {"k": "t", "en": "x⁶: domain ℝ; (−x)⁶ = x⁶ so even; derivative 6x⁵ is negative for x < 0 and positive for x > 0: decreasing then increasing, minimum 0 at x = 0.", "ar": "x⁶: المجال ℝ؛ (−x)⁶ = x⁶ إذن زوجية؛ المشتقة 6x⁵ سالبة عند x < 0 وموجبة عند x > 0: متناقصة ثم متزايدة وللدالة قيمة صغرى 0 عند x = 0.", "fr": "x⁶ : ℝ, paire, décroît puis croît, minimum 0.", "label": ""}, {"k": "t", "en": "x⁷: domain ℝ; odd; derivative 7x⁶ ≥ 0 so increasing on all of ℝ.", "ar": "x⁷: المجال ℝ؛ فردية؛ المشتقة 7x⁶ ≥ 0 إذن متزايدة على ℝ.", "fr": "x⁷ : ℝ, impaire, croissante.", "label": ""}, {"k": "t", "en": "x⁻⁵: domain ℝ \\ {0}; odd; derivative −5x⁻⁶ < 0 so decreasing on (−∞, 0) and on (0, +∞).", "ar": "x⁻⁵: المجال ℝ \\ {0}؛ فردية؛ المشتقة −5x⁻⁶ < 0 إذن متناقصة على (−∞, 0) وعلى (0, +∞).", "fr": "x⁻⁵ : ℝ*, impaire, décroissante sur chaque intervalle.", "label": ""}, {"k": "f", "f": "x⁶: even, min at 0      x⁷: odd, increasing      x⁻⁵: odd, decreasing on each branch"}]}, {"title": {"en": "Exercise 2", "ar": "التمرين 2", "fr": "Exercice 2"}, "items": [{"k": "t", "en": "Compare 1.2³ᐟ² and 1.2² without a calculator.", "ar": "قارن بين 1.2^(3/2) و1.2² دون آلة حاسبة.", "fr": "Compare 1,2^(3/2) et 1,2² sans calculatrice.", "label": "Problem"}, {"k": "t", "en": "Both are powers of the same base 1.2 > 1. For a base greater than 1, the larger exponent gives the larger value.", "ar": "كلاهما قوة للأساس نفسه 1.2 > 1. وعندما يكون الأساس أكبر من 1 يعطي الأس الأكبر قيمة أكبر.", "fr": "Même base 1,2 > 1 : l'exposant le plus grand donne la plus grande valeur.", "label": ""}, {"k": "t", "en": "Since 3/2 = 1.5 < 2, we get 1.2^1.5 < 1.2². Numerically: 1.2^1.5 ≈ 1.315 and 1.2² = 1.44.", "ar": "بما أن 3/2 = 1.5 < 2 فإن 1.2^1.5 < 1.2². عدديًا: 1.2^1.5 ≈ 1.315 و1.2² = 1.44.", "fr": "1,5 < 2 donc 1,2^1,5 < 1,2² (≈ 1,315 < 1,44).", "label": ""}, {"k": "f", "f": "1.2^(3/2) < 1.2²"}]}, {"title": {"en": "Exercise 3", "ar": "التمرين 3", "fr": "Exercice 3"}, "items": [{"k": "t", "en": "Differentiate f(x) = x^(5/2) and g(x) = 4x^(−1/2), x > 0.", "ar": "اشتق f(x) = x^(5/2) وg(x) = 4x^(−1/2) حيث x > 0.", "fr": "Dérive f(x) = x^(5/2) et g(x) = 4x^(−1/2).", "label": "Problem"}, {"k": "t", "en": "Use (x^a)′ = a·x^(a−1). For f: a = 5/2, so f′(x) = (5/2)x^(3/2).", "ar": "نستعمل (x^a)′ = a·x^(a−1). لـ f: a = 5/2 فيكون f′(x) = (5/2)x^(3/2).", "fr": "(x^a)′ = a x^(a−1) : f′ = (5/2) x^(3/2).", "label": ""}, {"k": "t", "en": "For g: a = −1/2, so g′(x) = 4 × (−1/2)x^(−3/2) = −2x^(−3/2) = −2/(x√x).", "ar": "لـ g: a = −1/2 فيكون g′(x) = 4 × (−1/2)x^(−3/2) = −2x^(−3/2) = −2/(x√x).", "fr": "g′ = 4(−1/2)x^(−3/2) = −2/(x√x).", "label": ""}, {"k": "f", "f": "f′(x) = (5/2)x^(3/2)      g′(x) = −2x^(−3/2)"}, {"k": "f", "f": "Check at x = 4: f′(4) = (5/2)·8 = 20 ; g′(4) = −2/8 = −1/4"}]}, {"title": {"en": "Exercise 4", "ar": "التمرين 4", "fr": "Exercice 4"}, "items": [{"k": "t", "en": "Solve x^(3/2) = 8 and x^(−2) = 1/9 for x > 0.", "ar": "حلّ x^(3/2) = 8 وx^(−2) = 1/9 حيث x > 0.", "fr": "Résous x^(3/2) = 8 et x^(−2) = 1/9.", "label": "Problem"}, {"k": "t", "en": "Raise both sides to the power 2/3: x = 8^(2/3) = (∛8)² = 2² = 4. Check: 4^(3/2) = (√4)³ = 8 ✓.", "ar": "نرفع الطرفين إلى القوة 2/3: x = 8^(2/3) = (∛8)² = 2² = 4. تحقق: 4^(3/2) = (√4)³ = 8 ✓.", "fr": "x = 8^(2/3) = 4 ; 4^(3/2) = 8 ✓.", "label": ""}, {"k": "t", "en": "x^(−2) = 1/9 means 1/x² = 1/9, so x² = 9 and, with x > 0, x = 3.", "ar": "x^(−2) = 1/9 تعني 1/x² = 1/9 إذن x² = 9 ومع x > 0 نجد x = 3.", "fr": "1/x² = 1/9 → x = 3.", "label": ""}, {"k": "f", "f": "x = 4      x = 3"}]}, {"title": {"en": "Exercise 5", "ar": "التمرين 5", "fr": "Exercice 5"}, "items": [{"k": "t", "en": "Study f(x) = x^(2/3) on ℝ: domain, parity, limits, variations, and sketch it.", "ar": "ادرس f(x) = x^(2/3) على ℝ: المجال والزوجية والنهايات والتغيرات ثم ارسمها.", "fr": "Étudie f(x) = x^(2/3) sur ℝ et trace-la.", "label": "Problem"}, {"k": "t", "en": "x^(2/3) = (∛x)², defined for all real x. It is even because (−x)^(2/3) = (∛(−x))² = (∛x)². Limit at ±∞ is +∞.", "ar": "x^(2/3) = (∛x)² معرّفة لكل x حقيقي. وهي زوجية لأن (−x)^(2/3) = (∛(−x))² = (∛x)². النهاية عند ±∞ هي +∞.", "fr": "(∛x)² : définie sur ℝ, paire, limite +∞ en ±∞.", "label": ""}, {"k": "t", "en": "For x > 0: f′(x) = (2/3)x^(−1/3) > 0, increasing. At 0 the derivative blows up: a cusp pointing down at the origin. Minimum f(0) = 0.", "ar": "من أجل x > 0: f′(x) = (2/3)x^(−1/3) > 0 فالدالة متزايدة. عند 0 تؤول المشتقة إلى اللانهاية: نقطة رجوع (ذروة) نحو الأسفل عند المبدأ. قيمة صغرى f(0) = 0.", "fr": "f′ = (2/3)x^(−1/3) > 0 sur ]0 ; +∞[ ; point de rebroussement en 0, minimum 0.", "label": ""}, {"k": "d", "svg": "<g id=\"X5a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"40.0\" y=\"360.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-8<\/text><line x1=\"112.5\" y1=\"400.0\" x2=\"112.5\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"112.5\" y=\"360.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-6<\/text><line x1=\"185.0\" y1=\"400.0\" x2=\"185.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"185.0\" y=\"360.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-4<\/text><line x1=\"257.5\" y1=\"400.0\" x2=\"257.5\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"257.5\" y=\"360.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-2<\/text><line x1=\"330.0\" y1=\"400.0\" x2=\"330.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"402.5\" y1=\"400.0\" x2=\"402.5\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"402.5\" y=\"360.0\" font-size=\"15\" text-anch sans-serif\">B(9,3)<\/text><\/g>", "vb": [660, 440], "show": ["X6a", "X6c", "X6x0", "X6x1", "X6pA", "X6pB"]}, {"k": "t", "en": "The curve is concave, so it lies below each tangent: for example √12 ≈ 3.46 while the tangent at 4 gives 12/4 + 1 = 4.", "ar": "المنحنى مقعّر لذلك يقع تحت كل مماس: مثلًا √12 ≈ 3.46 بينما المماس عند 4 يعطي 12/4 + 1 = 4.", "fr": "Concave : la courbe est sous ses tangentes.", "label": ""}, {"k": "f", "f": "T₄: y = x/4 + 1      T₉: y = x/6 + 3/2"}]}, {"title": {"en": "Exercise 7", "ar": "التمرين 7", "fr": "Exercice 7"}, "items": [{"k": "t", "en": "Real-life: the time of one swing of a pendulum is T = 2π√(L/9.8). How does T change when L is multiplied by 4? What power function is T of L?", "ar": "حياتي: زمن نوسة واحدة لنواس هو T = 2π√(L/9.8). كيف يتغير T عندما يُضرب L في 4؟ وأي دالة قوة هي T بدلالة L؟", "fr": "Un pendule : T = 2π√(L/9,8). Que devient T si L est multiplié par 4 ?", "label": "Problem"}, {"k": "t", "en": "T = (2π/√9.8) · L^(1/2): a power function of L with exponent 1/2.", "ar": "T = (2π/√9.8) · L^(1/2): دالة قوة في L أسها 1/2.", "fr": "T est proportionnelle à L^(1/2).", "label": ""}, {"k": "t", "en": "Replace L by 4L: T′ = c·(4L)^(1/2) = c·2·L^(1/2) = 2T. Multiplying the length by 4 only doubles the time of a swing.", "ar": "نبدّل L بـ 4L: T′ = c·(4L)^(1/2) = c·2·L^(1/2) = 2T. ضرب الطول في 4 يضاعف زمن النوسة فقط.", "fr": "T′ = c(4L)^(1/2) = 2T : le temps double.", "label": ""}, {"k": "f", "f": "T(4L) = 2·T(L)"}]}, {"title": {"en": "Exercise 8", "ar": "التمرين 8", "fr": "Exercice 8"}, "items": [{"k": "t", "en": "Error detective: a student says that x^(1/2) is defined for negative x because (−4)^(1/2) = −2. Find the mistake.", "ar": "المحقق: يقول طالب إن x^(1/2) معرّفة عند x سالب لأن (−4)^(1/2) = −2. جد الخطأ.", "fr": "Détective : « (−4)^(1/2) = −2 ». Où est l'erreur ?", "label": "Problem"}, {"k": "t", "en": "x^(1/2) means √x, the non-negative number whose square is x. No real number squared gives −4, so (−4)^(1/2) does not exist in ℝ.", "ar": "x^(1/2) تعني √x أي العدد غير السالب الذي مربعه x. ولا يوجد عدد حقيقي مربعه −4 إذن (−4)^(1/2) غير موجود في ℝ.", "fr": "x^(1/2) = √x n'existe pas pour x < 0.", "label": ""}, {"k": "t", "en": "The student confused it with the cube root: ∛(−8) = −2 does exist. The real power function xᵃ with non-integer a is defined only for x > 0 (or x ≥ 0).", "ar": "خلط الطالب بينها وبين الجذر التكعيبي: ∛(−8) = −2 موجود فعلًا. دالة القوة xᵃ لأس غير صحيح تُعرَّف فقط عند x > 0 (أو x ≥ 0).", "fr": "Il confond avec ∛(−8) = −2. Pour a non entier, xᵃ n'est définie que pour x > 0.", "label": ""}, {"k": "f", "f": "Domain of x^(1/2): [0, +∞)"}]}]};

    else if(o.k==="rect"){c.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}
    else if(o.k==="circle"){c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,7)}
    else if(o.k==="tri"){c.moveTo((a.x+b.x)/2,a.y);c.lineTo(b.x,b.y);c.lineTo(a.x,b.y);c.closePath()}
    c.stroke();
  }
  c.restore();
}
window.__repaint=function(){repaint()};
function repaint(extra){cx.clearRect(0,0,cv.width,cv.height);ops.forEach(function(o){drawOp(o,cx)});if(extra)drawOp(extra,cx)}
cv.addEventListener("pointerdown",function(e){
  if(tool==="select")return;
  cv.setPointerCapture(e.pointerId);closePops();
  var p=pos(e);redo=[];
  if(tool==="shape")drawing={k:shapeKind||"line",c:color,w:size,a:p,b:p};
  else drawing={k:tool==="eraser"?"erase":"pen",c:color,w:size,p:[p]};
  repaint(drawing);
});
cv.addEventListener("pointermove",function(e){
  if(!drawing)return;var p=pos(e);
  if(drawing.p)drawing.p.push(p);else drawing.b=p;
  repaint(drawing);
});
function endDraw(){if(!drawing)return;ops.push(drawing);drawing=null;repaint()}
cv.addEventListener("pointerup",endDraw);cv.addEventListener("pointercancel",endDraw);
function setTool(t){
  tool=t;
  $$("[data-tool]").forEach(function(b){b.classList.toggle("act",b.dataset.tool===t)});
  $("#tShape").classList.toggle("act",t==="shape");
  cv.style.pointerEvents=(t==="select")?"none":"auto";
  cv.style.cursor=t==="eraser"?"cell":"crosshair";
}

$("#tUndo").onclick=function(){if(ops.length){redo.push(ops.pop());repaint()}};
$("#tRedo").onclick=function(){if(redo.length){ops.push(redo.pop());repaint()}};
$("#clearInk").onclick=function(){ops=[];redo=[];repaint()};
