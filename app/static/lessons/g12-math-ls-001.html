<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Systems of linear equations — NABIL AI Smart Board</title>
<style>

:root{
  --bg1:#05102a;--bg2:#0a2050;--line:#1e90ff;--cyan:#6fd3ff;--yellow:#ffe14d;--orange:#ff9f1c;--green:#39d98a;--ink:#eaf3ff;
  --hand:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020812;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:0 0;border-radius:18px;overflow:hidden;
  background:radial-gradient(1200px 700px at 55% 40%,#0c2a63 0%,var(--bg2) 38%,var(--bg1) 100%);
  box-shadow:0 0 0 10px #0b0f18,0 0 0 13px #1b2433,0 30px 80px rgba(0,0,0,.7)}
#stage.bg-black{background:#000}
#stage.bg-grid{background:linear-gradient(rgba(60,130,255,.14) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(60,130,255,.14) 1px,transparent 1px) 0 0/44px 44px,radial-gradient(1200px 700px at 55% 40%,#0c2a63,var(--bg1))}
#stage.bg-green{background:radial-gradient(1200px 700px at 55% 40%,#1d5a45,#0d2c22)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 20% 0%,rgba(80,160,255,.18),transparent 70%);z-index:0}
.abs{position:absolute}
/* top bar */
#logo{left:214px;top:30px;display:flex;align-items:center;gap:12px}
#logo .t1{font-weight:800;font-size:33px;letter-spacing:1px;line-height:1;text-shadow:0 0 10px rgba(110,190,255,.8)}
#logo .t2{font-size:14.5px;color:#bcd7ff;margin-top:6px}
#title{left:497px;top:36px;width:686px;height:68px;border:3px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#0b2a66,#08205a);box-shadow:0 0 18px rgba(30,144,255,.85),inset 0 0 18px rgba(30,144,255,.45);
  font-size:41px;font-weight:600;letter-spacing:1px;white-space:pre;text-shadow:0 0 12px rgba(150,210,255,.8)}
#topic{left:1337px;top:33px;width:175px;height:66px;border:2px solid var(--line);border-radius:12px;padding:9px 14px;font-size:17px;line-height:22px;
  box-shadow:0 0 12px rgba(30,144,255,.7),inset 0 0 10px rgba(30,144,255,.35);background:rgba(8,32,90,.7)}
#pager{left:1543px;top:44px;font-size:25px;font-weight:600;text-shadow:0 0 8px rgba(130,200,255,.7)}
/* text column */
#steps{left:757px;top:128px;width:500px;display:flex;flex-direction:column;gap:12px;font-family:var(--hand);font-size:29px;line-height:36px;z-index:3}
.st{display:flex;gap:16px;align-items:flex-start;cursor:pointer;opacity:0;transition:opacity .25s}
.st.on{opacity:1}
.st .n{flex:0 0 42px;height:42px;border:3px solid var(--yellow);border-radius:50%;color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1;margin-top:0;font-family:system-ui,Arial,sans-serif;font-weight:700;box-shadow:0 0 10px rgba(255,225,77,.45)}
.st .tx{flex:1;text-shadow:0 0 6px rgba(160,210,255,.35)}
.st .tx .hw{display:inline-block;clip-path:inset(0 100% 0 0)}
.st.on .hw{animation:write 1.5s steps(28,end) forwards}
.st.done .hw{animation:none;clip-path:inset(0 0 0 0)}
.st.cur .n{background:rgba(255,225,77,.18)}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.st.s5 .tx{font-size:30px}
#final{left:737px;top:722px;width:510px;height:66px;border:3px solid var(--yellow);border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:30px;color:var(--yellow);font-weight:700;box-shadow:0 0 18px rgba(255,225,77,.55),inset 0 0 14px rgba(255,225,77,.18);opacity:0;transition:opacity .4s;z-index:3;white-space:pre}
#final.on{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,225,77,.9),inset 0 0 18px rgba(255,225,77,.3)}}
/* right panel */
#panelline{left:1259px;top:128px;width:3px;height:680px;background:linear-gradient(#1e90ff,rgba(30,144,255,.3));box-shadow:0 0 10px #1e90ff}
#side{left:1283px;top:126px;width:350px;font-family:var(--hand);font-size:28px;line-height:36px;z-index:3}
.hd{color:var(--yellow);font-size:31px;display:inline-block;border-bottom:3px solid var(--yellow);padding-bottom:0;line-height:34px;text-shadow:0 0 8px rgba(255,225,77,.5)}
.blk{opacity:0;transition:opacity .35s;margin-bottom:18px}
.blk.on{opacity:1}
.blk .ln{margin:6px 0 0 30px}
#steps2{border:3px solid var(--green);border-radius:16px 16px 12px 12px;padding:6px 14px 12px;box-shadow:0 0 12px rgba(57,217,138,.4);margin-top:20px}
#steps2 .hd{border:0;color:var(--yellow)}
.ms{display:flex;gap:10px;align-items:flex-start;opacity:0;transition:opacity .35s;margin-top:8px;font-size:27px;line-height:32px}
.ms.on{opacity:1}
.ms i{font-style:normal;flex:0 0 28px;height:28px;margin-top:3px;border:2px solid var(--cyan);border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-family:system-ui,Arial,sans-serif}
/* svg layers */
#diagram,#teacher,#ink{position:absolute;left:0;top:0;width:1672px;height:941px}
#diagram{z-index:2;pointer-events:none}
#teacher{z-index:4;pointer-events:none}
#ink{z-index:6;touch-action:none}
.fx{opacity:0;transition:opacity .5s}
.fx.on{opacity:1}
.lbl{font-family:var(--hand);font-style:italic;font-size:38px;fill:#fff}
/* toolbar */
#bar{left:364px;top:812px;width:1284px;height:84px;display:flex;align-items:center;border-top:2px solid rgba(30,144,255,.8);background:linear-gradient(rgba(5,20,50,.2),rgba(5,20,50,.85));z-index:8}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:80px;height:68px;border-radius:10px;color:#cfe4ff;font-size:15px;cursor:pointer;user-select:none;border:0;background:none;font-family:inherit;transition:background .15s}
.tb svg{width:32px;height:32px;stroke:#cfe4ff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:rgba(60,130,255,.2)}
.tb.act{background:#1f8cff;color:#fff;box-shadow:0 0 14px rgba(31,140,255,.85)}
.tb.act svg{stroke:#fff}
.sp{flex:1}
#nav{display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;border-radius:14px;background:rgba(18,50,120,.65);margin-left:12px;border:1px solid rgba(30,144,255,.5)}
#nav button{width:44px;height:44px;border:0;background:none;cursor:pointer;color:#2e9bff;font-size:30px;font-weight:700;border-radius:8px}
#nav button:hover{background:rgba(60,130,255,.25)}
#nav span{min-width:90px;text-align:center;font-size:20px;font-weight:600}
#dots{position:absolute;left:1456px;top:802px;display:flex;gap:6px;z-index:9}
#dots b{width:9px;height:9px;border-radius:50%;background:#2a4a85}
#dots b.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
/* popups */
.pop{position:absolute;left:372px;bottom:150px;min-width:250px;padding:14px;border-radius:14px;background:rgba(6,22,56,.97);border:2px solid var(--line);box-shadow:0 0 20px rgba(30,144,255,.6);display:none;z-index:12;font-size:19px}
.pop.show{display:block}
.pop button.item{display:block;width:100%;text-align:left;padding:10px 12px;margin:3px 0;border-radius:8px;border:0;background:rgba(40,100,220,.25);color:#fff;font-size:19px;cursor:pointer}
.pop button.item:hover{background:rgba(40,100,220,.55)}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:3px solid transparent;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 10px #fff}
#shapes{left:915px}
#bgmsg{position:absolute;right:20px;top:120px;font-size:15px;color:#9bbcf2;opacity:0;transition:opacity .3s;z-index:20}
#rot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;background:#0b2a66;color:#fff;font-size:14px;text-align:center;z-index:50;display:none}
#draw{left:372px;top:330px;width:430px;height:300px;border-radius:14px;background:#f4f9ff;border:3px solid var(--line);box-shadow:0 0 18px rgba(30,144,255,.7);z-index:2;overflow:hidden;display:none}
#draw svg{width:100%;height:100%}
#draw.on{display:block}
#fm{left:380px;top:646px;width:420px;height:152px;overflow:hidden;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;font-size:27px;color:var(--yellow);font-family:var(--hand);text-shadow:0 0 8px rgba(255,225,77,.4)}
#fm.tall{top:128px;height:664px;justify-content:flex-start;font-size:30px}
#fm .f{border:3px solid var(--yellow);border-radius:12px;padding:8px 12px;direction:ltr;text-align:center;box-shadow:0 0 12px rgba(255,225,77,.35);overflow-wrap:anywhere;opacity:0;transition:opacity .4s;line-height:32px}
#fm .f.on{opacity:1}
#steps{left:830px;top:128px;width:415px;height:664px;overflow-y:auto;scrollbar-width:none;font-size:25px;line-height:33px;gap:14px}
#steps::-webkit-scrollbar{display:none}
#steps .st{opacity:.55}
#steps .st.cur{opacity:1}
#steps .st .n{flex:0 0 38px;height:38px;font-size:22px}
#steps .st .tx{font-family:var(--hand)}
#steps .st .lab{display:block;color:var(--cyan);font-size:19px;line-height:22px}
#steps.rtl{direction:rtl;text-align:right}
#side{width:350px}
#map{border:3px solid var(--green);border-radius:16px;padding:8px 12px;box-shadow:0 0 12px rgba(57,217,138,.4);height:610px;overflow-y:auto;scrollbar-width:none;margin-top:14px}
#map::-webkit-scrollbar{display:none}
#map .mi{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:21px;line-height:26px;cursor:pointer;opacity:.75;font-family:system-ui,Arial,sans-serif}
#map .mi i{font-style:normal;flex:0 0 28px;height:28px;border:2px solid var(--cyan);border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--cyan);margin-top:0}
#map .mi.cur{opacity:1;color:var(--yellow);font-weight:700}
#map .mi.cur i{border-color:var(--yellow);color:var(--yellow);background:rgba(255,225,77,.15)}
#map.rtl{direction:rtl}
#sideh{font-family:var(--hand);font-size:31px;color:var(--yellow);border-bottom:3px solid var(--yellow);display:inline-block;line-height:34px}
#title{font-size:36px;padding:0 20px;text-align:center;white-space:normal;line-height:40px}
.pop button.item.sel{background:#1f8cff}

@keyframes writeR{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
#steps.rtl .st .hw{clip-path:inset(0 0 0 100%)}
#steps.rtl .st.done .hw{clip-path:inset(0)}
#steps.rtl .st .tx{font-family:"Noto Naskh Arabic","Droid Arabic Naskh","Segoe UI",Tahoma,system-ui,sans-serif;font-size:27px;line-height:38px}
#fm .f{font-family:var(--hand)}
#bigplay{display:block;left:14px;top:524px;width:346px;height:72px;border:3px solid var(--yellow);border-radius:16px;background:rgba(255,225,77,.14);color:var(--yellow);font-size:38px;cursor:pointer;z-index:10}
#start{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,8,20,.82);z-index:30}
#startbox{width:760px;max-width:90%;text-align:center;padding:40px;border:3px solid var(--line);border-radius:24px;background:rgba(6,22,56,.97);box-shadow:0 0 40px rgba(30,144,255,.6)}
#startt{font-size:40px;font-weight:700;margin-bottom:26px;line-height:50px}
#startb{font-size:44px;padding:22px 54px;border-radius:20px;border:0;background:#1f8cff;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 0 30px rgba(31,140,255,.8)}
#startn{margin-top:26px;font-size:26px;line-height:36px;color:#bcd7ff}

#side.show{display:block}
/* ---------- portrait (phones) ---------- */
#stage.portrait #logo,#stage.portrait #panelline,#stage.portrait #dots{display:none}
#stage.portrait #title{left:20px;top:16px;width:860px;height:92px;font-size:38px;line-height:44px}
#stage.portrait #topic{left:440px;top:132px;width:440px;height:92px;font-size:28px;line-height:34px;padding:10px 16px;display:flex;align-items:center}
#stage.portrait #pager{left:440px;top:240px;font-size:34px}
#stage.portrait #bigplay{left:440px;top:300px;width:440px;height:84px}
#stage.portrait #ustaz{left:20px;top:122px;width:400px;height:262px}
#stage.portrait #bigplay{left:440px;top:300px}
#stage.portrait #draw{left:20px;top:400px;width:860px;height:573px}
#stage.portrait #fm{left:20px;top:988px;width:860px;height:232px;font-size:34px}
#stage.portrait #fm.tall{top:400px;height:820px;font-size:38px}
#stage.portrait #fm .f{line-height:42px;padding:10px 16px}
#stage.portrait #steps{left:20px;top:1232px;width:860px;height:392px;font-size:34px;line-height:46px}
#stage.portrait #steps .st .n{flex:0 0 52px;height:52px;font-size:30px}
#stage.portrait #steps.rtl .st .tx{font-size:36px;line-height:50px}
#stage.portrait #steps .st{opacity:.5}
#stage.portrait #steps .st.cur{opacity:1}
#stage.portrait #bar{left:0;top:1636px;width:900px;height:164px;flex-wrap:wrap;align-content:flex-start;border-top:2px solid rgba(30,144,255,.8);padding:6px 6px}
#stage.portrait #bar .sp{display:none}
#stage.portrait #nav{order:-1;flex:0 0 100%;height:84px;justify-content:space-between;margin:0 0 6px;border-radius:18px}
#stage.portrait #nav button{width:120px;height:68px;font-size:50px}
#stage.portrait #nav span{font-size:34px}
#stage.portrait .tb{width:98px;height:70px;font-size:15px}
#stage.portrait .tb svg{width:30px;height:30px}
#stage.portrait #side{display:none;left:20px;top:122px;width:860px;height:1500px;padding:14px;background:rgba(6,22,56,.98);border:3px solid var(--line);border-radius:18px;z-index:15}
#stage.portrait #side.show{display:block}
#stage.portrait #map{height:1400px}
#stage.portrait #map .mi{font-size:32px;line-height:40px}
#stage.portrait #map .mi i{flex:0 0 42px;height:42px;font-size:22px}
#stage.portrait .pop{left:20px!important;bottom:190px;min-width:420px;font-size:28px}
#stage.portrait .pop button.item{font-size:30px;padding:16px}
#stage.portrait #startbox{width:820px}

#ustaz{left:14px;top:134px;width:346px;height:372px;border-radius:22px;overflow:hidden;border:3px solid var(--line);box-shadow:0 0 22px rgba(30,144,255,.75);z-index:4;background:#1a1d24;transition:box-shadow .3s}
#ustaz img{width:100%;height:100%;object-fit:cover;object-position:38% 20%;display:block}
#ustaz.talk{box-shadow:0 0 30px rgba(57,217,138,.95);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012)}}
#nametag{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(3,12,32,.92));font-size:25px;font-weight:700;color:#fff}
#nametag .eq{display:flex;gap:4px;align-items:flex-end;height:26px}
#nametag .eq i{width:6px;height:6px;background:#39d98a;border-radius:3px;display:block}
#ustaz.talk .eq i{animation:eq .5s ease-in-out infinite alternate}
#ustaz.talk .eq i:nth-child(2){animation-delay:.1s}#ustaz.talk .eq i:nth-child(3){animation-delay:.2s}#ustaz.talk .eq i:nth-child(4){animation-delay:.15s}#ustaz.talk .eq i:nth-child(5){animation-delay:.05s}
@keyframes eq{to{height:26px}}
#stage.portrait #nametag{font-size:26px}

#steps .st .tx .hw{clip-path:none!important;animation:none!important}
#steps .w{opacity:0;transition:opacity .12s}
#steps .w.on,#steps .st.done .w{opacity:1}
#ustaz video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;opacity:0;transition:opacity .25s}
#ustaz.vid video{opacity:1}

#rot{background:#ffe14d;color:#10203f;font-weight:700;font-size:18px;padding:12px;z-index:60}
#stage.nodraw #steps{left:380px;top:128px;width:865px;height:480px;font-size:30px;line-height:42px}
#stage.nodraw #steps.rtl .st .tx{font-size:32px;line-height:46px}
#stage.nodraw #steps .st .n{flex:0 0 44px;height:44px;font-size:25px}
#stage.nodraw #fm.tall{left:380px;top:620px;width:865px;height:176px;justify-content:flex-end;font-size:30px}

#ustaz{top:128px;height:480px}
#ustaz img{object-position:40% 18%}
#bigplay{top:622px;height:66px}

/* standing teacher (full-body photo) */
#ustaz{left:14px;top:128px;width:340px;height:800px;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible;transition:none}
#ustaz img{position:absolute;left:30px;bottom:0;width:252px;height:800px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 6px 14px rgba(0,0,0,.65))}
#ustaz.talk{box-shadow:none;animation:none}
#ustaz.talk img{animation:sway 2.2s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 0 16px rgba(57,217,138,.7))}
@keyframes sway{50%{transform:rotate(.7deg) translateY(-3px)}}
#nametag{left:6px;right:auto;bottom:6px;width:240px;padding:8px 12px;border-radius:12px;background:rgba(3,12,32,.78);border:2px solid var(--line);font-size:22px}
#bigplay{left:272px;top:140px;width:84px;height:84px;border-radius:50%;font-size:34px;padding:0}

/* robot avatar */
#ustaz{left:14px;top:250px;width:346px;height:344px}

#nametag{left:0;bottom:-58px;width:346px;font-size:24px;justify-content:space-between}
#bigplay{left:14px;top:672px;width:346px;height:72px;border-radius:16px;font-size:38px}

.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.frac .nu{border-bottom:.08em solid currentColor;padding:0 .2em .05em}
.frac .de{padding:.05em .2em 0}
.frac .nu,.frac .de{font-size:.92em}
.rad{display:inline-flex;align-items:flex-end}
.rad .rc{border-top:.08em solid currentColor;padding:0 .12em;margin-left:.05em}
sup,sub{font-size:.62em;line-height:0}
.mw{display:inline-block;direction:ltr;unicode-bidi:isolate}

</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="logo" class="abs">
    <svg width="76" height="56" viewBox="0 0 76 56" aria-hidden="true">
      <defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9ac9ff"/></linearGradient></defs>
      <polygon points="38,4 74,20 38,36 2,20" fill="url(#gc)" stroke="#6fb4ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 28 V42 C16 47 27 52 38 52 C49 52 60 47 60 42 V28 L38 37 Z" fill="#cfe4ff" stroke="#6fb4ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M68 22 V40" stroke="#ffd34d" stroke-width="3" stroke-linecap="round"/><circle cx="68" cy="43" r="3.5" fill="#ffd34d"/>
    </svg>
    <div><div class="t1">NABIL AI</div><div class="t2">Smart Learning Platform</div></div>
  </div>
  <div id="title" class="abs"></div>
  <div id="topic" class="abs"></div>
  <div id="pager" class="abs"></div>

  <button id="bigplay" class="abs">▶</button>
  <div id="draw" class="abs"></div>
  <div id="fm" class="abs"></div>
  <div id="steps" class="abs"></div>

var DATA={"title": {"en": "Systems of linear equations", "ar": "جمل المعادلات الخطية", "fr": "Systèmes d'équations linéaires"}, "lang": "ar", "pages": [{"title": {"en": "Why a method?", "ar": "لماذا نحتاج طريقة؟", "fr": "Pourquoi une méthode ?"}, "items": [{"k": "t", "en": "Hello! Quick check first: x + y = 5 and x − y = 1. Adding them removes y and gives 2x = 6. That is the seed of elimination. Now look at 9x − 3y + 3z = 0, 5x + y − 6z = −1, x + y + z = 10. Are these three separate problems? No. We look for one triple that satisfies all three simultaneously. Success in two equations and failure in the third does not make a solution.", "ar": "مرحبًا! تحقق سريع أولًا: x + y = 5 وx − y = 1. جمعهما يحذف y ويعطي 2x = 6. هذه بذرة الحذف. الآن انظر إلى 9x − 3y + 3z = 0 و5x + y − 6z = −1 وx + y + z = 10. هل هي ثلاث مسائل منفصلة؟ لا. نبحث عن ثلاثية واحدة تحقق الثلاث معًا. النجاح في معادلتين والفشل في الثالثة لا يصنع حلًّا.", "fr": "Un seul triplet pour les trois.", "label": ""}]}, {"title": {"en": "Three planes", "ar": "ثلاثة مستويات", "fr": "Trois plans"}, "items": [{"k": "t", "en": "Think of each linear equation in three unknowns as a plane. The common solution lives in the common intersection: one point, none, or infinitely many points. The picture builds intuition; elimination gives the verdict algebraically. Must any three planes meet in one point? No.", "ar": "تخيّل كل معادلة خطية بثلاثة مجاهيل مستويًا. الحل المشترك يقع في التقاطع المشترك: نقطة واحدة أو لا شيء أو عدد لا نهائي من النقاط. الرسم يبني الحدس والحذف يعطي الحكم جبريًا. هل يجب أن يلتقي أي ثلاثة مستويات في نقطة؟ لا.", "fr": "Un point, aucun, ou une infinité.", "label": ""}]}, {"title": {"en": "Elimination and legal moves", "ar": "الحذف والحركات المسموحة", "fr": "Élimination et opérations"}, "items": [{"k": "t", "en": "We aim for a staircase: ax + by + cz = d, then ey + fz = g, then hz = k. We find z first, then back-substitute for y and x. The legal moves are Lᵢ ↔ Lⱼ, Lᵢ ← aLᵢ with a ≠ 0, and Lᵢ ← Lᵢ + aLⱼ with i ≠ j. Each is reversible, so the solution set is preserved. Multiplying a row by zero is blocked: the information is lost and cannot be reversed.", "ar": "نريد الوصول إلى شكل سلّمي: ax + by + cz = d ثم ey + fz = g ثم hz = k. نجد z أولًا ثم نعوّض رجعيًا لنجد y وx. الحركات المسموحة: Lᵢ ↔ Lⱼ وLᵢ ← aLᵢ مع a ≠ 0 وLᵢ ← Lᵢ + aLⱼ مع i ≠ j. كل منها قابلة للعكس فتُحفظ مجموعة الحلول. ضرب سطر في الصفر ممنوع: تضيع المعلومة ولا يمكن عكسه.", "fr": "Opérations réversibles.", "label": ""}, {"k": "f", "f": "Lᵢ ↔ Lⱼ      Lᵢ ← aLᵢ (a ≠ 0)      Lᵢ ← Lᵢ + aLⱼ"}]}, {"title": {"en": "Plan before calculation", "ar": "الخطة قبل الحساب", "fr": "Le plan d'abord"}, "items": [{"k": "t", "en": "Plan: choose a pivot, make zeros below it, move diagonally, repeat, read the case, back-substitute, verify in the ORIGINAL system. A row with x-coefficient 1 is a comfortable pivot: fewer fractions and fewer errors. The choice of pivot does not change the solution; it is a calculation strategy.", "ar": "الخطة: نختار ارتكازًا ونصنع أصفارًا تحته ونتحرك قطريًا ونكرر ونقرأ الحالة ونعوّض رجعيًا ونتحقق في الجملة الأصلية. السطر الذي معامل x فيه 1 ارتكاز مريح: كسور أقل وأخطاء أقل. اختيار الارتكاز لا يغيّر الحل بل هو استراتيجية حساب.", "fr": "Pivot, zéros, remontée, vérifier.", "label": ""}]}, {"title": {"en": "Full worked example", "ar": "مثال محلول كامل", "fr": "Exemple complet"}, "items": [{"k": "t", "en": "Solve x + y + z = 6, 2x − y + z = 3, 3x + y − z = 2. L₁ is the pivot. L₂ ← L₂ − 2L₁ gives −3y − z = −9, and L₃ ← L₃ − 3L₁ gives −2y − 4z = −16. Simplify the third: y + 2z = 8; the second: 3y + z = 9. Multiply y + 2z = 8 by 3: 3y + 6z = 24, subtract 3y + z = 9: 5z = 15, z = 3. Then y = 2 and x = 1.", "ar": "حلّ x + y + z = 6 و2x − y + z = 3 و3x + y − z = 2. L₁ هو الارتكاز. L₂ ← L₂ − 2L₁ تعطي −3y − z = −9 وL₃ ← L₃ − 3L₁ تعطي −2y − 4z = −16. نبسّط الثالثة: y + 2z = 8 والثانية: 3y + z = 9. نضرب y + 2z = 8 في 3: 3y + 6z = 24 ونطرح 3y + z = 9: 5z = 15 وz = 3. ثم y = 2 وx = 1.", "fr": "(1, 2, 3).", "label": ""}, {"k": "f", "f": "−3y − z = −9      −2y − 4z = −16"}, {"k": "f", "f": "5z = 15  →  z = 3  →  y = 2  →  x = 1"}, {"k": "f", "f": "1 + 2 + 3 = 6      2 − 2 + 3 = 3      3 + 2 − 3 = 2"}]}, {"title": {"en": "The pivot and the three cases", "ar": "الارتكاز والحالات الثلاث", "fr": "Pivot et trois cas"}, "items": [{"k": "t", "en": "A zero pivot does not mean no solution: look for another row with a non-zero coefficient and exchange. Reading the cases: unique, when the staircase fixes every unknown; none, when 0 = k with k ≠ 0 appears (a contradiction, so stop); infinite, when a redundant row 0 = 0 appears with free unknowns. 0 = 0 is not a contradiction and does not give unknown = 0.", "ar": "الارتكاز الصفري لا يعني انعدام الحل: نبحث عن سطر آخر بمعامل غير معدوم ونبدّل. قراءة الحالات: وحيد عندما يحدد الشكل السلّمي كل المجاهيل؛ لا حل عندما تظهر 0 = k مع k ≠ 0 (تناقض فنتوقف)؛ لا نهائي عندما يظهر سطر زائد 0 = 0 مع مجاهيل حرة. و0 = 0 ليست تناقضًا ولا تعطي مجهولًا = 0.", "fr": "Zéro pivot ≠ pas de solution.", "label": ""}]}, {"title": {"en": "Infinite family", "ar": "عائلة لا نهائية", "fr": "Famille infinie"}, "items": [{"k": "t", "en": "x + y + z = 4, y + z = 2, 2y + 2z = 4. Notice the dependency before inventing a new equation: the third is 2 × the second. Choose z = t: y = 2 − t, x = 2. The family is (2, 2 − t, t), t ∈ ℝ. One free parameter generates infinitely many solutions; substitute symbolically in all three equations to check.", "ar": "x + y + z = 4 وy + z = 2 و2y + 2z = 4. نلاحظ الاعتماد قبل اختراع معادلة جديدة: الثالثة تساوي 2 × الثانية. نختار z = t فيكون y = 2 − t وx = 2. العائلة (2, 2 − t, t) حيث t ∈ ℝ. وسيط حر واحد يولّد عددًا لا نهائيًا من الحلول؛ نعوّض رمزيًا في المعادلات الثلاث للتحقق.", "fr": "(2, 2 − t, t).", "label": ""}, {"k": "f", "f": "(x, y, z) = (2, 2 − t, t),  t ∈ ℝ"}, {"k": "d", "svg": "<g id=\"Y1a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"40.0\" y=\"368.6\" font-size=\"15\" text-anchor=\"mi r detectives", "ar": "المحققون", "fr": "Détectives"}, "items": [{"k": "t", "en": "1) Changing the left side but forgetting the right side: invalid operation; the whole row changes together. 2) Reading 0 = 0 as x = 0: false. 3) Continuing to solve 0 = 7: stop and classify as no solution. 4) Never checking in the original system. 5) Dividing by a parameter without checking it is non-zero: split cases first.", "ar": "1) تغيير الطرف الأيسر ونسيان الأيمن: عملية غير صالحة؛ السطر كله يتحول معًا. 2) قراءة 0 = 0 على أنها x = 0: خطأ. 3) متابعة حلّ 0 = 7: نتوقف ونصنّف لا حل. 4) عدم التحقق في الجملة الأصلية. 5) القسمة على وسيط دون التأكد أنه غير معدوم: نفصل الحالات أولًا.", "fr": "Cinq erreurs types.", "label": ""}]}, {"title": {"en": "Student try", "ar": "جرّب بنفسك", "fr": "À toi"}, "items": [{"k": "t", "en": "Solve x + y + z = 6, 2x + 3y + z = 11, x + 2y + 3z = 14. L₂ ← L₂ − 2L₁ gives y − z = −1; L₃ ← L₃ − L₁ gives y + 2z = 8. Then y = z − 1, so 3z = 9, z = 3, y = 2, x = 1. Check: 1 + 2 + 3 = 6, 2 + 6 + 3 = 11, 1 + 4 + 9 = 14. Writing the plan first made the solution shorter and auditable.", "ar": "حلّ x + y + z = 6 و2x + 3y + z = 11 وx + 2y + 3z = 14. L₂ ← L₂ − 2L₁ تعطي y − z = −1؛ وL₃ ← L₃ − L₁ تعطي y + 2z = 8. ثم y = z − 1 فيكون 3z = 9 وz = 3 وy = 2 وx = 1. التحقق: 1 + 2 + 3 = 6 و2 + 6 + 3 = 11 و1 + 4 + 9 = 14. كتابة الخطة أولًا جعلت الحل أقصر وقابلًا للمراجعة.", "fr": "(1, 2, 3).", "label": ""}, {"k": "f", "f": "1 + 2 + 3 = 6      2 + 6 + 3 = 11      1 + 4 + 9 = 14"}]}, {"title": {"en": "Challenge and summary", "ar": "تحدٍّ وخلاصة", "fr": "Défi et résumé"}, "items": [{"k": "t", "en": "Challenge: build a system with exactly one solution, then change only one constant so it becomes impossible, and explain what changes in the echelon form. Summary: understand all the conditions, choose a pivot, zeros below, move diagonally, read the case (unique, none, infinite), back-substitute, verify in the original.", "ar": "تحدٍّ: ابنِ جملة لها حل واحد بالضبط ثم غيّر ثابتًا واحدًا فقط لتصبح مستحيلة واشرح ماذا تغيّر في الشكل السلّمي. الخلاصة: نفهم كل الشروط ونختار ارتكازًا ونصنع أصفارًا تحته ونتحرك قطريًا ونقرأ الحالة (وحيد أو لا شيء أو لا نهائي) ونعوّض رجعيًا ونتحقق في الأصل.", "fr": "Pivot, zéro, diagonale, cas, remontée, vérification.", "label": ""}, {"k": "f", "f": "PIVOT → ZERO BELOW → MOVE DIAGONALLY → READ THE CASE → SUBSTITUTE → VERIFY"}, {"k": "d", "svg": "<g id=\"Y4a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"88.3\" y1=\"400.0\" x2=\"88.3\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"88.3\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"136.7\" y1=\"400.0\" x2=\"136.7\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"136.7\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">2<\/text><line x1=\"185.0\" y1=\"400.0\" x2=\"185.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"185.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">3<\/text><line x1=\"233.3\" y1=\"400.0\" x2=\"233.3\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"233.3\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">4<\/text><line x1=\"281.7\" y1=\"400.0\" x2=\"281.7\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"281.7\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">5<\/text><line x1=\"330.0\" y1=\"400.0\" x2=\"330.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"330.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">6<\/text><line x1=\"378.3\" y1=\"400.0\" x2=\"378.3\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"378.3\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family .4,353.4 L567.8,353.8 L569.2,354.2 L570.7,354.7 L572.1,355.1 L573.6,355.6 L575.0,356.1 L576.5,356.5 L578.0,356.9 L579.4,357.4 L580.9,357.9 L582.3,358.3 L583.8,358.8 L585.2,359.2 L586.6,359.6 L588.1,360.1 L589.5,360.6 L591.0,361.0 L592.5,361.4 L593.9,361.9 L595.4,362.4 L596.8,362.8 L598.2,363.2 L599.7,363.7 L601.1,364.1 L602.6,364.6 L604.1,365.1 L605.5,365.5 L607.0,365.9 L608.4,366.4 L609.8,366.8 L611.3,367.3 L612.8,367.8 L614.2,368.2 L615.6,368.6 L617.1,369.1 L618.6,369.6 L620.0,370.0\" fill=\"none\" stroke=\"#1e88e5\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-dasharray=\"12 8\"/><\/g><g id=\"Y4pP\"><circle cx=\"330.0\" cy=\"280.0\" r=\"9\" fill=\"#1e88e5\" stroke=\"#0b3d5c\" stroke-width=\"2\"/><text x=\"342.0\" y=\"270.0\" font-size=\"19\" font-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">P(6,4)<\/text><\/g>", "vb": [660, 440], "show": ["Y4a", "Y4c", "Y4x0", "Y4pP"]}, {"k": "t", "en": "A farm has 10 animals with 28 legs in total. The two lines cross at P(6, 4): 6 chickens and 4 rabbits. Check: 6 + 4 = 10 and 2·6 + 4·4 = 12 + 16 = 28.", "ar": "في مزرعة 10 حيوانات ومجموع أرجلها 28. يتقاطع المستقيمان في P(6, 4): 6 دجاجات و4 أرانب. تحقق: 6 + 4 = 10 و2·6 + 4·4 = 12 + 16 = 28.", "fr": "10 animaux et 28 pattes : P(6 ; 4), soit 6 poules et 4 lapins. 6 + 4 = 10 ; 12 + 16 = 28.", "label": ""}]}, {"title": {"en": "Exercise 1", "ar": "التمرين 1", "fr": "Exercice 1"}, "items": [{"k": "t", "en": "Solve x + y + z = 6, 2x − y + z = 3, 3x + y − z = 2.", "ar": "حلّ x + y + z = 6 وَ2x − y + z = 3 وَ3x + y − z = 2.", "fr": "Résous x + y + z = 6, 2x − y + z = 3, 3x + y − z = 2.", "label": "Problem"}, {"k": "t", "en": "Add equations 1 and 3 to remove z: 4x + 2y = 8, so 2x + y = 4. Subtract equation 2 from equation 1: −x + 2y = 3.", "ar": "نجمع المعادلتين 1 و3 لحذف z: 4x + 2y = 8 إذن 2x + y = 4. ونطرح المعادلة 2 من 1: −x + 2y = 3.", "fr": "Éliminer z : 2x + y = 4 et −x + 2y = 3.", "label": ""}, {"k": "t", "en": "From 2x + y = 4 take y = 4 − 2x. Substitute: −x + 8 − 4x = 3, so −5x = −5 and x = 1. Then y = 2 and z = 6 − 1 − 2 = 3.", "ar": "من 2x + y = 4 نأخذ y = 4 − 2x. نعوّض: −x + 8 − 4x = 3 إذن −5x = −5 وx = 1. ثم y = 2 وz = 6 − 1 − 2 = 3.", "fr": "x = 1, y = 2, z = 3.", "label": ""}, {"k": "f", "f": "(x, y, z) = (1, 2, 3)"}, {"k": "f", "f": "Check: 1+2+3 = 6 ✓   2−2+3 = 3 ✓   3+2−3 = 2 ✓"}]}, {"title": {"en": "Exercise 2", "ar": "التمرين 2", "fr": "Exercice 2"}, "items": [{"k": "t", "en": "A reduction ends with 0 = 9. Classify the system and explain geometrically.", "ar": "تنتهي عملية اختزال إلى 0 = 9. صنّف الجملة وفسّر هندسيًا.", "fr": "Une réduction donne 0 = 9 : classe et explique.", "label": "Problem"}, {"k": "t", "en": "0 = 9 is false for every x, y, z, so no triple satisfies all the equations: the system is impossible (no solution).", "ar": "0 = 9 خاطئة مهما كانت x وy وz إذن لا ثلاثية تحقق كل المعادلات: الجملة مستحيلة (لا حل).", "fr": "Système impossible.", "label": ""}, {"k": "t", "en": "Geometrically, the planes have no common point, like the two parallel lines on the board: they never meet.", "ar": "هندسيًا لا توجد نقطة مشتركة بين المستويات، مثل المستقيمين المتوازيين على اللوح: لا يلتقيان أبدًا.", "fr": "Aucun point commun.", "label": ""}, {"k": "f", "f": "S = ∅"}]}, {"title": {"en": "Exercise 3", "ar": "التمرين 3", "fr": "Exercice 3"}, "items": [{"k": "t", "en": "x + y + z = 4, y + z = 2, 2y + 2z = 4: write the family of solutions.", "ar": "x + y + z = 4 وy + z = 2 و2y + 2z = 4: اكتب عائلة الحلول.", "fr": "x + y + z = 4, y + z = 2, 2y + 2z = 4 : famille de solutions.", "label": "Problem"}, {"k": "t", "en": "The third equation is twice the second, so it adds nothing. Two independent equations remain for three unknowns: one free parameter.", "ar": "المعادلة الثالثة ضعف الثانية فلا تضيف شيئًا. تبقى معادلتان مستقلتان لثلاثة مجاهيل: وسيط حر واحد.", "fr": "Deux équations indépendantes, un paramètre.", "label": ""}, {"k": "t", "en": "From y + z = 2 and x + y + z = 4 we get x = 2. Let z = t, then y = 2 − t.", "ar": "من y + z = 2 وx + y + z = 4 نجد x = 2. ليكن z = t فيكون y = 2 − t.", "fr": "x = 2, z = t, y = 2 − t.", "label": ""}, {"k": "f", "f": "(x, y, z) = (2, 2 − t, t), t ∈ ℝ"}, {"k": "t", "en": "Example t = 0: (2, 2, 0). Check: 2+2+0 = 4 ✓, 2+0 = 2 ✓.", "ar": "مثال t = 0: (2, 2, 0). تحقق: 2+2+0 = 4 ✓ وَ2+0 = 2 ✓.", "fr": "t = 0 : (2 ; 2 ; 0) ✓.", "label": ""}]}, {"title": {"en": "Exercise 4", "ar": "التمرين 4", "fr": "Exercice 4"}, "items": [{"k": "t", "en": "Solve x + y + z = 6, 2x + 3y + z = 11, x + 2y + 3z = 14.", "ar": "حلّ x + y + z = 6 وَ2x + 3y + z = 11 وَx + 2y + 3z = 14.", "fr": "Résous x + y + z = 6, 2x + 3y + z = 11, x + 2y + 3z = 14.", "label": "Problem"}, {"k": "t", "en": "Subtract eq. 1 from eq. 2: x + 2y = 5. Subtract eq. 1 from eq. 3: y + 2z = 8.", "ar": "نطرح المعادلة 1 من 2: x + 2y = 5. ونطرح 1 من 3: y + 2z = 8.", "fr": "x + 2y = 5 et y + 2z = 8.", "label": ""}, {"k": "t", "en": "From x + 2y = 5: x = 5 − 2y. From y + 2z = 8: z = (8 − y)/2. Put into eq. 1: 5 − 2y + y + (8 − y)/2 = 6; multiply by 2: 10 − 4y + 2y + 8 − y = 12, so 18 − 3y = 12, y = 2.", "ar": "من x + 2y = 5: x = 5 − 2y. ومن y + 2z = 8: z = (8 − y)/2. نعوّض في المعادلة 1: 5 − 2y + y + (8 − y)/2 = 6؛ نضرب في 2: 10 − 4y + 2y + 8 − y = 12 أي 18 − 3y = 12 وy = 2.", "fr": "y = 2.", "label": ""}, {"k": "t", "en": "Then x = 5 − 4 = 1 and z = (8 − 2)/2 = 3.", "ar": "إذن x = 5 − 4 = 1 وz = (8 − 2)/2 = 3.", "fr": "x = 1, z = 3.", "label": ""}, {"k": "f", "f": "(1, 2, 3)"}, {"k": "f", "f": "Check: 1+2+3 = 6 ✓   2+6+3 = 11 ✓   1+4+9 = 14 ✓"}]}, {"title": {"en": "Exercise 5", "ar": "التمرين 5", "fr": "Exercice 5"}, "items": [{"k": "t", "en": "Why must we check the answer in the ORIGINAL system?", "ar": "لماذا يجب التحقق من الجواب في الجملة الأصلية؟", "fr": "Pourquoi vérifier dans le système ORIGINAL ?", "label": "Problem"}, {"k": "t", "en": "A copying or arithmetic slip during elimination can still give numbers that fit the later, simplified equations. Only the original equations are the real problem.", "ar": "قد يحدث خطأ نسخ أو حساب أثناء الحذف فنحصل على أعداد تناسب المعادلات المبسّطة اللاحقة فقط. المعادلات الأصلية وحدها هي المسألة الحقيقية.", "fr": "Une erreur de calcul peut rester invisible dans les équations simplifiées.", "label": ""}, {"k": "t", "en": "Example: if we had wrongly found y = 3 above, the check 2 − 3 + 3 = 2 ≠ 3 in the original equation 2 would expose it immediately.", "ar": "مثال: لو وجدنا خطأً y = 3 في التمرين 1 لكشف التحقق 2 − 3 + 3 = 2 ≠ 3 في المعادلة الأصلية 2 الخطأ فورًا.", "fr": "Un test dans l'équation d'origine révèle l'erreur.", "label": ""}, {"k": "f", "f": "Always substitute into every original equation"}]}, {"title": {"en": "Exercise 6", "ar": "التمرين 6", "fr": "Exercice 6"}, "items": [{"k": "t", "en": "Word problem: 10 animals, 28 legs (chickens 2 legs, rabbits 4 legs). How many of each?", "ar": "مسألة: 10 حيوانات و28 رجلًا (للدجاجة رجلان وللأرنب 4). كم من كل نوع؟", "fr": "10 animaux, 28 pattes : combien de chaque ?", "label": "Problem"}, {"k": "t", "en": "Let x = chickens and y = rabbits. Equations: x + y = 10 and 2x + 4y = 28.", "ar": "ليكن x عدد الدجاجات وy عدد الأرانب. المعادلتان: x + y = 10 وَ2x + 4y = 28.", "fr": "x + y = 10 ; 2x + 4y = 28.", "label": ""}, {"k": "t", "en": "Multiply the first by 2: 2x + 2y = 20. Subtract from the second: 2y = 8, so y = 4 and x = 6.", "ar": "نضرب الأولى في 2: 2x + 2y = 20. نطرحها من الثانية: 2y = 8 إذن y = 4 وx = 6.", "fr": "2y = 8 → y = 4, x = 6.", "label": ""}, {"k": "f", "f": "6 chickens and 4 rabbits"}, {"k": "f", "f": "Check: 6 + 4 = 10 ✓   12 + 16 = 28 ✓"}]}, {"title": {"en": "Exercise 7", "ar": "التمرين 7", "fr": "Exercice 7"}, "items": [{"k": "t", "en": "Solve 2x + 3y = 12 and x − y = 1, and describe the picture.", "ar": "حلّ 2x + 3y = 12 وَx − y = 1 وصف الصورة.", "fr": "Résous 2x + 3y = 12 et x − y = 1 et décris le graphique.", "label": "Problem"}, {"k": "t", "en": "From x − y = 1, x = y + 1. Substitute: 2(y + 1) + 3y = 12, so 5y + 2 = 12 and y = 2, x = 3.", "ar": "من x − y = 1 نأخذ x = y + 1. نعوّض: 2(y + 1) + 3y = 12 إذن 5y + 2 = 12 وy = 2 وx = 3.", "fr": "y = 2, x = 3.", "label": ""}, {"k": "t", "en": "Two lines with different slopes (−2/3 and 1) cross at one point (3, 2): a single solution.", "ar": "مستقيمان مختلفا الميل (−2/3 و1) يتقاطعان في نقطة واحدة (3, 2): حل وحيد.", "fr": "Pentes différentes : un seul point (3 ; 2).", "label": ""}, {"k": "f", "f": "(3, 2)"}]}, {"title": {"en": "Exercise 8", "ar": "التمرين 8", "fr": "Exercice 8"}, "items": [{"k": "t", "en": "For which value of k does x + y = 5, 2x + 2y = k have infinitely many solutions? None?", "ar": "من أجل أي قيمة لـ k تكون للجملة x + y = 5 وَ2x + 2y = k حلول لا نهائية؟ ومتى لا حل؟", "fr": "Pour quel k : une infinité de solutions ? aucune ?", "label": "Problem"}, {"k": "t", "en": "Doubling the first equation gives 2x + 2y = 10. If k = 10 the second equation is the same line: infinitely many solutions.", "ar": "ضعف المعادلة الأولى يعطي 2x + 2y = 10. إذا كان k = 10 فالمعادلة الثانية هي المستقيم نفسه: حلول لا نهائية.", "fr": "k = 10 : même droite.", "label": ""}, {"k": "t", "en": "If k ≠ 10 the lines are parallel and distinct (0 = k − 10 ≠ 0): no solution. There is never exactly one solution here, because the slopes are equal.", "ar": "إذا كان k ≠ 10 فالمستقيمان متوازيان ومختلفان (0 = k − 10 ≠ 0): لا حل. ولا يوجد حل وحيد هنا لأن الميلين متساويان.", "fr": "k ≠ 10 : parallèles, aucune solution.", "label": ""}, {"k": "f", "f": "k = 10: infinitely many      k ≠ 10: none"}]}]};

var beam=tel("path",{d:"",fill:"none",stroke:"#e8c27a","stroke-width":6,"stroke-linecap":"round",opacity:.92});
var ring=tel("circle",{cx:0,cy:0,r:26,fill:"none",stroke:"#ffe14d","stroke-width":4,filter:"url(#pg)"});
var dot=tel("circle",{cx:0,cy:0,r:9,fill:"#ffe14d",filter:"url(#pg)"});
var head=tel("path",{d:"M0 0 L-30 -14 L-24 0 L-30 14 Z",fill:"#ffe14d",stroke:"#7a5b00","stroke-width":2,filter:"url(#pg)"});
var speaking=false,lastSp=null,uv=$("#uv");
if(uv){uv.addEventListener("playing",function(){$("#ustaz").classList.add("vid")});uv.addEventListener("error",function(){})}
var cur={x:585,y:330},target=[585,330];
function frame(ts){
  cur.x+=(target[0]-cur.x)*.08;cur.y+=(target[1]-cur.y)*.08;
  var ox=322,oy=432;
  var wob=Math.sin(ts/330)*3,tx=cur.x+wob,ty=cur.y+wob*.6;
  var mx=(ox+tx)/2,my=Math.min(oy,ty)-70;
  var dx=tx-ox,dy=ty-oy,dl=Math.hypot(dx,dy)||1,ex=tx-dx/dl*16,ey=ty-dy/dl*16;beam.setAttribute("d","M"+ox+" "+oy+" L"+ex+" "+ey);
  ring.setAttribute("cx",tx);ring.setAttribute("cy",ty);ring.setAttribute("r",24+Math.sin(ts/260)*5);
  dot.setAttribute("cx",tx);dot.setAttribute("cy",ty);
  var ang=Math.atan2(ty-my,tx-mx)*180/Math.PI;
  head.setAttribute("opacity",0);head.setAttribute("transform","translate("+(tx-4)+","+(ty-4)+") rotate("+ang+") translate(-18,0)");
  var u=$("#ustaz");if(u)u.classList.toggle("talk",speaking);
  if(speaking!==lastSp){lastSp=speaking;if(uv){try{if(speaking){var pr=uv.play();if(pr&&pr.catch)pr.catch(function(){})}else uv.pause()}catch(e){}}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- ink ---- */

var cv=$("#ink"),cx=cv.getContext("2d");
var tool="pen",color="#ffffff",size=5,shapeKind=null,ops=[],redo=[],drawing=null;
var COLORS=["#ffffff","#ffe14d","#ff5252","#39d98a","#6fd3ff","#ff9f1c","#d58cff"];
var swBox=$("#sws");
COLORS.forEach(function(c,i){var s=document.createElement("span");s.className="sw"+(i===0?" sel":"");s.style.background=c;s.onclick=function(){color=c;$$(".sw").forEach(function(x){x.classList.remove("sel")});s.classList.add("sel");if(tool==="eraser")setTool("pen")};swBox.appendChild(s)});
$("#size").oninput=function(){size=+this.value};
function pos(e){var r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function drawOp(o,c){
  c.save();c.lineCap="round";c.lineJoin="round";c.lineWidth=o.w;c.strokeStyle=o.c;
  if(o.k==="erase"){c.globalCompositeOperation="destination-out";c.lineWidth=o.w*4}
  if(o.k==="pen"||o.k==="erase"){
    c.beginPath();c.moveTo(o.p[0].x,o.p[0].y);
    if(o.p.length===1)c.lineTo(o.p[0].x+.1,o.p[0].y);
    for(var i=1;i<o.p.length;i++)c.lineTo(o.p[i].x,o.p[i].y);
    c.stroke();
  }else{
    var a=o.a,b=o.b;c.beginPath();
    if(o.k==="line"||o.k==="arrow"){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);
      if(o.k==="arrow"){var an=Math.atan2(b.y-a.y,b.x-a.x),h=14+o.w*2;
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an-.45),b.y-h*Math.sin(an-.45));
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an+.45),b.y-h*Math.sin(an+.45))}}
    else if(o.k==="rect"){c.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}
    else if(o.k==="circle"){c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,7)}
    else if(o.k==="tri"){c.moveTo((a.x+b.x)/2,a.y);c.lineTo(b.x,b.y);c.lineTo(a.x,b.y);c.closePath()}
    c.stroke();
  }
  c.restore();
}
window.__repaint=function(){repaint()};
function repaint(extra){cx.clearRect(0,0,cv.width,cv.height);ops.forEach(function(o){drawOp(o,cx)});if(extra)drawOp(extra,cx)}
cv.addEventListener("pointerdown",function(e){
  if(tool==="select")return;
  cv.setPointerCapture(e.pointerId);closePops();
  var p=pos(e);redo=[];
  if(tool==="shape")drawing={k:shapeKind||"line",c:color,w:size,a:p,b:p};
  else drawing={k:tool==="eraser"?"erase":"pen",c:color,w:size,p:[p]};
  repaint(drawing);
});
cv.addEventListener("pointermove",function(e){
  if(!drawing)return;var p=pos(e);
  if(drawing.p)drawing.p.push(p);else drawing.b=p;
  repaint(drawing);
});
function endDraw(){if(!drawing)return;ops.push(drawing);drawing=null;repaint()}
cv.addEventListener("pointerup",endDraw);cv.addEventListener("pointercancel",endDraw);
function setTool(t){
  tool=t;
  $$("[data-tool]").forEach(function(b){b.classList.toggle("act",b.dataset.tool===t)});
  $("#tShape").classList.toggle("act",t==="shape");
  cv.style.pointerEvents=(t==="select")?"none":"auto";
  cv.style.cursor=t==="eraser"?"cell":"crosshair";
}
$$("[data-tool]").forEach(function(b){b.onclick=function(){closePops();setTool(b.dataset.tool)}});
$("#tShape").onclick=function(){togglePop("popShapes")};
$$("[data-shape]").forEach(function(b){b.onclick=function(){shapeKind=b.dataset.shape;setTool("shape");closePops()}});
$("#tUndo").onclick=function(){if(ops.length){redo.push(ops.pop());repaint()}};
$("#tRedo").onclick=function(){if(redo.length){ops.push(redo.pop());repaint()}};
$("#clearInk").onclick=function(){ops=[];redo=[];repaint()};
setTool("select");
