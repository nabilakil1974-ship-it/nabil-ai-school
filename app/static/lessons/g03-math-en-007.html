var DATA={"title": {"en": "Adding and Subtraction", "ar": "الجمع والطرح", "fr": "Addition et soustraction"}, "lang": "ar", "pages": [{"title": {"en": "Joining means adding", "ar": "الضم يعني الجمع", "fr": "Réunir = additionner"}, "items": [{"k": "t", "en": "Hello, champion! When two parts are put together to make a whole, we add. Tom has 35 cards and gets 24 more. The parts are 35 and 24. The whole is unknown. 35 + 24: 35 + 20 = 55, then 55 + 4 = 59. Tom has 59 cards.", "ar": "مرحبًا يا بطل! عندما نضم جزأين لنصنع كلًّا نجمع. عند توم 35 بطاقة وأخذ 24 أخرى. الجزآن 35 و24 والكل مجهول. 35 + 24: 35 + 20 = 55 ثم 55 + 4 = 59. عند توم 59 بطاقة.", "fr": "Deux parties réunies : on additionne. 35 + 24 = 59.", "label": ""}, {"k": "d", "svg": "<g id=\"M1w\"><rect x=\"30\" y=\"80\" width=\"600\" height=\"70\" rx=\"6\" fill=\"#fff3e0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"330\" y=\"125\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">?<\/text><\/g><g id=\"M1p\"><rect x=\"30\" y=\"190\" width=\"355.9\" height=\"70\" rx=\"6\" fill=\"#bbdefb\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><rect x=\"385.9\" y=\"190\" width=\"244.1\" height=\"70\" rx=\"6\" fill=\"#c8e6c9\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"208.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">35<\/text><text x=\"508.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">24<\/text><\/g>", "vb": [660, 440], "show": ["M1w", "M1p"]}, {"k": "f", "f": "35 + 24 = 59"}, {"k": "t", "en": "The bar model shows the picture: the two small boxes together are as long as the big box. Unknown whole → add the parts.", "ar": "يبيّن نموذج الأشرطة الصورة: الصندوقان الصغيران معًا بطول الصندوق الكبير. الكل مجهول ← نجمع الجزأين.", "fr": "Tout inconnu → on additionne les parties.", "label": ""}]}, {"title": {"en": "Finding a missing part means subtracting", "ar": "إيجاد جزء ناقص يعني الطرح", "fr": "Chercher une partie = soustraire"}, "items": [{"k": "t", "en": "Now the whole is known: 59 cards in all. Tom has 35 in his box. The rest are in his bag. How many in the bag? A part is missing. We take the known part away from the whole: 59 − 35 = 24. Count up to check: 35 + 24 = 59 ✓.", "ar": "الآن الكل معروف: 59 بطاقة. في علبة توم 35 والباقي في حقيبته. كم في الحقيبة؟ جزء ناقص. نطرح الجزء المعروف من الكل: 59 − 35 = 24. نتحقق بالعدّ إلى الأعلى: 35 + 24 = 59 ✓.", "fr": "Total 59, une partie 35 : 59 − 35 = 24.", "label": ""}, {"k": "d", "svg": "<g id=\"M2w\"><rect x=\"30\" y=\"80\" width=\"600\" height=\"70\" rx=\"6\" fill=\"#fff3e0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"330\" y=\"125\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">59<\/text><\/g><g id=\"M2p\"><rect x=\"30\" y=\"190\" width=\"355.9\" height=\"70\" rx=\"6\" fill=\"#bbdefb\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><rect x=\"385.9\" y=\"190\" width=\"244.1\" height=\"70\" rx=\"6\" fill=\"#c8e6c9\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"208.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">35<\/text><text x=\"508.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">?<\/text><\/g>", "vb": [660, 440], "show": ["M2w", "M2p"]}, {"k": "f", "f": "59 − 35 = 24      check: 35 + 24 = 59 ✓"}, {"k": "t", "en": "Subtracting can also be a jump back on the number line: from 75 take away 40 to land on 35.", "ar": "ويمكن للطرح أن يكون قفزة إلى الخلف على خط الأعداد: من 75 نطرح 40 فنصل إلى 35.", "fr": "Soustraire = reculer sur la droite numérique.", "label": ""}, {"k": "d", "svg": "<g id=\"H1a\"><line x1=\"40\" y1=\"250\" x2=\"630\" y2=\"250\" stroke=\"#0b3d5c\" stroke-width=\"5\"/><\/g><g id=\"H1n0\"><line x1=\"70.0\" y1=\"238\" x2=\"70.0\" y2=\"262\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><circle cx=\"70.0\" cy=\"250\" r=\"9\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"70.0\" y=\"302\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">75<\/text><\/g><g id=\"H1h0\"><path d=\"M 70.0 236 Q 350.0 140 630.0 236\" fill=\"none\" stroke=\"#1e88e5\" stroke-width=\"5\"/><text x=\"350.0\" y=\"150\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1e88e5\" font-family=\"sans-serif\">−40<\/text><\/g><g id=\"H1n1\"><line x1=\"630.0\" y1=\"238\" x2=\"630.0\" y2=\"262\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><circle cx=\"630.0\" cy=\"250\" r=\"9\" fill=\"#2e7d32\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"630.0\" y=\"302\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">35<\/text><\/g>", "vb": [660, 440], "show": ["H1a", "H1n0", "H1h0", "H1n1"]}, {"k": "f", "f": "75 − 40 = 35"}]}, {"title": {"en": "Fact family: four related sentences", "ar": "أسرة الحقائق: أربع جمل مترابطة", "fr": "Famille de calculs : quatre égalités liées"}, "items": [{"k": "t", "en": "Three numbers, 35, 24 and 59, give a family of four sentences. Two additions: 35 + 24 = 59 and 24 + 35 = 59. Two subtractions: 59 − 35 = 24 and 59 − 24 = 35. The biggest number, the whole, is at the start of every subtraction and at the end of every addition.", "ar": "ثلاثة أعداد 35 و24 و59 تعطي أسرة من أربع جمل. جمعان: 35 + 24 = 59 و24 + 35 = 59. وطرحان: 59 − 35 = 24 و59 − 24 = 35. العدد الأكبر، أي الكل، في أول كل طرح وفي آخر كل جمع.", "fr": "35 + 24 = 59 ; 24 + 35 = 59 ; 59 − 35 = 24 ; 59 − 24 = 35.", "label": ""}, {"k": "f", "f": "35 + 24 = 59      24 + 35 = 59"}, {"k": "f", "f": "59 − 35 = 24      59 − 24 = 35"}, {"k": "d", "svg": "<g id=\"M3w\"><rect x=\"30\" y=\"80\" width=\"600\" height=\"70\" rx=\"6\" fill=\"#fff3e0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"330\" y=\"125\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">59<\/text><\/g><g id=\"M3p\"><rect x=\"30\" y=\"190\" width=\"355.9\" height=\"70\" rx=\"6\" fill=\"#bbdefb\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><rect x=\"385.9\" y=\"190\" width=\"244.1\" height=\"70\" rx=\"6\" fill=\"#c8e6c9\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"208.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">35<\/text><text x=\"508.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">24<\/text><\/g>", "vb": [660, 440], "show": ["M3w", "M3p"]}]}, {"title": {"en": "Check with the inverse", "ar": "تحقق بالعملية العكسية", "fr": "Vérifier avec l'opération inverse"}, "items": [{"k": "t", "en": "Addition and subtraction undo each other. If 36 + 27 = 63 then 63 − 27 must give back 36. Test: 63 − 27 = 36 ✓. A subtraction is checked with an addition: 82 − 45 = 37, and 37 + 45 = 82 ✓.", "ar": "الجمع والطرح يلغي أحدهما الآخر. إذا كان 36 + 27 = 63 فإن 63 − 27 يجب أن يعطي 36. نختبر: 63 − 27 = 36 ✓. ونتحقق من الطرح بالجمع: 82 − 45 = 37 و37 + 45 = 82 ✓.", "fr": "36 + 27 = 63 → 63 − 27 = 36 ; 82 − 45 = 37 → 37 + 45 = 82.", "label": ""}, {"k": "f", "f": "36 + 27 = 63  →  63 − 27 = 36"}, {"k": "f", "f": "82 − 45 = 37  →  37 + 45 = 82"}, {"k": "d", "svg": "<g id=\"H2a\"><line x1=\"40\" y1=\"250\" x2=\"630\" y2=\"250\" stroke=\"#0b3d5c\" stroke-width=\"5\"/><\/g><g id=\"H2n0\"><line x1=\"70.0\" y1=\"238\" x2=\"70.0\" y2=\"262\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><circle cx=\"70.0\" cy=\"250\" r=\"9\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"70.0\" y=\"302\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">36<\/text><\/g><g id=\"H2h0\"><path d=\"M 70.0 236 Q 350.0 140 630.0 236\" fill=\"none\" stroke=\"#1e88e5\" stroke-width=\"5\"/><text x=\"350.0\" y=\"150\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1e88e5\" font-family=\"sans-serif\">+27<\/text><\/g><g id=\"H2n1\"><line x1=\"630.0\" y1=\"238\" x2=\"630.0\" y2=\"262\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><circle cx=\"630.0\" cy=\"250\" r=\"9\" fill=\"#2e7d32\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"630.0\" y=\"302\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">63<\/text><\/g>", "vb": [660, 440], "show": ["H2a", "H2n0", "H2h0", "H2n1"]}, {"k": "t", "en": "If the check does not return to the starting number, there is a mistake. Look for it before you say 'finished'.", "ar": "إذا لم يعد التحقق إلى العدد الأول ففي الحل خطأ. ابحث عنه قبل أن تقول «انتهيت».", "fr": "Si le contrôle ne redonne pas le départ : erreur.", "label": ""}]}, {"title": {"en": "How many more? Comparing", "ar": "كم أكثر؟ المقارنة", "fr": "De combien de plus ? Comparer"}, "items": [{"k": "t", "en": "To compare, put two bars side by side. Mia has 52 stickers and Noor has 37. How many more has Mia? The difference is 52 − 37 = 15 (37 + 3 = 40, 40 + 12 = 52, and 3 + 12 = 15). Mia has 15 more than Noor, Noor has 15 fewer.", "ar": "للمقارنة نضع شريطين جنبًا إلى جنب. عند ميا 52 ملصقًا وعند نور 37. كم ملصقًا أكثر عند ميا؟ الفرق 52 − 37 = 15 (37 + 3 = 40 و40 + 12 = 52 و3 + 12 = 15). عند ميا 15 أكثر من نور وعند نور 15 أقل.", "fr": "52 − 37 = 15 : Mia en a 15 de plus.", "label": ""}, {"k": "d", "svg": "<g id=\"M4w\"><rect x=\"30\" y=\"80\" width=\"600\" height=\"70\" rx=\"6\" fill=\"#fff3e0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"330\" y=\"125\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">52<\/text><\/g><g id=\"M4p\"><rect x=\"30\" y=\"190\" width=\"426.9\" height=\"70\" rx=\"6\" fill=\"#bbdefb\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><rect x=\"456.9\" y=\"190\" width=\"173.1\" height=\"70\" rx=\"6\" fill=\"#c8e6c9\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"243.5\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">37<\/text><text x=\"543.5\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">15<\/text><\/g>", "vb": [660, 440], "show": ["M4w", "M4p"]}, {"k": "f", "f": "52 − 37 = 15      37 + 15 = 52 ✓"}, {"k": "t", "en": "Error detective! 'Ali has 8 more than Sara. Ali has 35. How many has Sara?' The word 'more' tempts us to add 35 + 8 = 43, but Ali is the bigger number. Sara has less: 35 − 8 = 27. Do not choose the operation from one word alone; think of the picture.", "ar": "المحقق! «عند علي 8 أكثر من سارة. عند علي 35. كم عند سارة؟» كلمة «أكثر» تغري بجمع 35 + 8 = 43 لكن علي هو الأكبر. عند سارة أقل: 35 − 8 = 27. لا نختار العملية من كلمة واحدة بل نفكر في الصورة.", "fr": "« 8 de plus » mais Ali est le plus grand : Sara a 35 − 8 = 27.", "label": ""}, {"k": "f", "f": "Sara: 35 − 8 = 27      check: 27 + 8 = 35 ✓"}]}, {"title": {"en": "Missing number in an addition", "ar": "العدد الناقص في جمع", "fr": "Terme manquant"}, "items": [{"k": "t", "en": "What number goes in 40 + ? = 75? It is a missing part, so subtract: 75 − 40 = 35. Check: 40 + 35 = 75 ✓. And for ? + 18 = 50: 50 − 18 = 32, check 32 + 18 = 50 ✓.", "ar": "ما العدد في 40 + ؟ = 75؟ جزء ناقص إذن نطرح: 75 − 40 = 35. تحقق: 40 + 35 = 75 ✓. وفي ؟ + 18 = 50: 50 − 18 = 32 وتحقق 32 + 18 = 50 ✓.", "fr": "40 + ? = 75 → 75 − 40 = 35 ; ? + 18 = 50 → 32.", "label": ""}, {"k": "d", "svg": "<g id=\"M5w\"><rect x=\"30\" y=\"80\" width=\"600\" height=\"70\" rx=\"6\" fill=\"#fff3e0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"330\" y=\"125\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">75<\/text><\/g><g id=\"M5p\"><rect x=\"30\" y=\"190\" width=\"320.0\" height=\"70\" rx=\"6\" fill=\"#bbdefb\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><rect x=\"350.0\" y=\"190\" width=\"280.0\" height=\"70\" rx=\"6\" fill=\"#c8e6c9\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"190.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">40<\/text><text x=\"490.0\" y=\"235\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">?<\/text><\/g>", "vb": [660, 440], "show": ["M5w", "M5p"]}, {"k": "f", "f": "40 + 35 = 75      32 + 18 = 50"}]}, {"title": {"en": "Summary", "ar": "الخلاصة", "fr": "Résumé"}, "items": [{"k": "t", "en": "Join parts to find the whole: add. Know the whole and one part: subtract to find the other. Compare: subtract the smaller from the bigger. Three numbers make a family of four sentences. Always check with the inverse operation, and think of the picture, not only of one keyword.", "ar": "نضم الأجزاء لنجد الكل: نجمع. نعرف الكل وجزءًا: نطرح لنجد الآخر. للمقارنة نطرح الأصغر من الأكبر. ثلاثة أعداد تصنع أسرة من أربع جمل. تحقق دائمًا بالعملية العكسية وفكر في الصورة لا في كلمة واحدة.", "fr": "Réunir : +. Partie manquante : −. Comparer : grand − petit. Vérifier par l'inverse.", "label": ""}, {"k": "f", "f": "whole = part + part        part = whole − part"}]}, {"title": {"en": "Exercise 1", "ar": "التمرين 1", "fr": "Exercice 1"}, "items": [{"k": "t", "en": "Calculate 46 + 33 and check with the inverse.", "ar": "احسب 46 + 33 وتحقق بالعملية العكسية.", "fr": "Calcule 46 + 33 et vérifie.", "label": "Problem"}, {"k": "t", "en": "46 + 30 = 76, then 76 + 3 = 79. Check: 79 − 33 = 46 ✓.", "ar": "46 + 30 = 76 ثم 76 + 3 = 79. تحقق: 79 − 33 = 46 ✓.", "fr": "79.", "label": ""}, {"k": "d", "svg": "<g id=\"X1w\"><rect x=\"30\" y=\"80\" width=\"600\" height=\"70\" rx=\"6\" fill=\"#fff3e0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><text x=\"330\" y=\"125\" font-size=\"38\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">?<\/text><\/g><g id=\"X1p\"><rect x=\"30\" y=\"190\" width=\"349.4\" height=\"70\" rx=\"6\" fill=\"#bbdefb\" stroke=\"#0b3
