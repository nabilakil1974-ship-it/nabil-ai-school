<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exponential functions — NABIL AI Smart Board</title>
<style>

:root{
  --bg1:#05102a;--bg2:#0a2050;--line:#1e90ff;--cyan:#6fd3ff;--yellow:#ffe14d;--orange:#ff9f1c;--green:#39d98a;--ink:#eaf3ff;
  --hand:"Segoe Print","Bradley Hand","Chalkboard SE","Marker Felt","Ink Free","Comic Sans MS","Comic Neue",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020812;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:0 0;border-radius:18px;overflow:hidden;
  background:radial-gradient(1200px 700px at 55% 40%,#0c2a63 0%,var(--bg2) 38%,var(--bg1) 100%);
  box-shadow:0 0 0 10px #0b0f18,0 0 0 13px #1b2433,0 30px 80px rgba(0,0,0,.7)}
#stage.bg-black{background:#000}
#stage.bg-grid{background:linear-gradient(rgba(60,130,255,.14) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(60,130,255,.14) 1px,transparent 1px) 0 0/44px 44px,radial-gradient(1200px 700px at 55% 40%,#0c2a63,var(--bg1))}
#stage.bg-green{background:radial-gradient(1200px 700px at 55% 40%,#1d5a45,#0d2c22)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 20% 0%,rgba(80,160,255,.18),transparent 70%);z-index:0}
.abs{position:absolute}
/* top bar */
#logo{left:214px;top:30px;display:flex;align-items:center;gap:12px}
#logo .t1{font-weight:800;font-size:33px;letter-spacing:1px;line-height:1;text-shadow:0 0 10px rgba(110,190,255,.8)}
#logo .t2{font-size:14.5px;color:#bcd7ff;margin-top:6px}
#title{left:497px;top:36px;width:686px;height:68px;border:3px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#0b2a66,#08205a);box-shadow:0 0 18px rgba(30,144,255,.85),inset 0 0 18px rgba(30,144,255,.45);
  font-size:41px;font-weight:600;letter-spacing:1px;white-space:pre;text-shadow:0 0 12px rgba(150,210,255,.8)}
#topic{left:1337px;top:33px;width:175px;height:66px;border:2px solid var(--line);border-radius:12px;padding:9px 14px;font-size:17px;line-height:22px;
  box-shadow:0 0 12px rgba(30,144,255,.7),inset 0 0 10px rgba(30,144,255,.35);background:rgba(8,32,90,.7)}
#pager{left:1543px;top:44px;font-size:25px;font-weight:600;text-shadow:0 0 8px rgba(130,200,255,.7)}
/* text column */
#steps{left:757px;top:128px;width:500px;display:flex;flex-direction:column;gap:12px;font-family:var(--hand);font-size:29px;line-height:36px;z-index:3}
.st{display:flex;gap:16px;align-items:flex-start;cursor:pointer;opacity:0;transition:opacity .25s}
.st.on{opacity:1}
.st .n{flex:0 0 42px;height:42px;border:3px solid var(--yellow);border-radius:50%;color:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1;margin-top:0;font-family:system-ui,Arial,sans-serif;font-weight:700;box-shadow:0 0 10px rgba(255,225,77,.45)}
.st .tx{flex:1;text-shadow:0 0 6px rgba(160,210,255,.35)}
.st .tx .hw{display:inline-block;clip-path:inset(0 100% 0 0)}
.st.on .hw{animation:write 1.5s steps(28,end) forwards}
.st.done .hw{animation:none;clip-path:inset(0 0 0 0)}
.st.cur .n{background:rgba(255,225,77,.18)}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.st.s5 .tx{font-size:30px}
#final{left:737px;top:722px;width:510px;height:66px;border:3px solid var(--yellow);border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:30px;color:var(--yellow);font-weight:700;box-shadow:0 0 18px rgba(255,225,77,.55),inset 0 0 14px rgba(255,225,77,.18);opacity:0;transition:opacity .4s;z-index:3;white-space:pre}
#final.on{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,225,77,.9),inset 0 0 18px rgba(255,225,77,.3)}}
/* right panel */
#panelline{left:1259px;top:128px;width:3px;height:680px;background:linear-gradient(#1e90ff,rgba(30,144,255,.3));box-shadow:0 0 10px #1e90ff}
#side{left:1283px;top:126px;width:350px;font-family:var(--hand);font-size:28px;line-height:36px;z-index:3}
.hd{color:var(--yellow);font-size:31px;display:inline-block;border-bottom:3px solid var(--yellow);padding-bottom:0;line-height:34px;text-shadow:0 0 8px rgba(255,225,77,.5)}
.blk{opacity:0;transition:opacity .35s;margin-bottom:18px}
.blk.on{opacity:1}
.blk .ln{margin:6px 0 0 30px}
#steps2{border:3px solid var(--green);border-radius:16px 16px 12px 12px;padding:6px 14px 12px;box-shadow:0 0 12px rgba(57,217,138,.4);margin-top:20px}
#steps2 .hd{border:0;color:var(--yellow)}
.ms{display:flex;gap:10px;align-items:flex-start;opacity:0;transition:opacity .35s;margin-top:8px;font-size:27px;line-height:32px}
.ms.on{opacity:1}
.ms i{font-style:normal;flex:0 0 28px;height:28px;margin-top:3px;border:2px solid var(--cyan);border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--cyan);font-family:system-ui,Arial,sans-serif}
/* svg layers */
#diagram,#teacher,#ink{position:absolute;left:0;top:0;width:1672px;height:941px}
#diagram{z-index:2;pointer-events:none}
#teacher{z-index:4;pointer-events:none}
#ink{z-index:6;touch-action:none}
.fx{opacity:0;transition:opacity .5s}
.fx.on{opacity:1}
.lbl{font-family:var(--hand);font-style:italic;font-size:38px;fill:#fff}
/* toolbar */
#bar{left:364px;top:812px;width:1284px;height:84px;display:flex;align-items:center;border-top:2px solid rgba(30,144,255,.8);background:linear-gradient(rgba(5,20,50,.2),rgba(5,20,50,.85));z-index:8}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:80px;height:68px;border-radius:10px;color:#cfe4ff;font-size:15px;cursor:pointer;user-select:none;border:0;background:none;font-family:inherit;transition:background .15s}
.tb svg{width:32px;height:32px;stroke:#cfe4ff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:rgba(60,130,255,.2)}
.tb.act{background:#1f8cff;color:#fff;box-shadow:0 0 14px rgba(31,140,255,.85)}
.tb.act svg{stroke:#fff}
.sp{flex:1}
#nav{display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;border-radius:14px;background:rgba(18,50,120,.65);margin-left:12px;border:1px solid rgba(30,144,255,.5)}
#nav button{width:44px;height:44px;border:0;background:none;cursor:pointer;color:#2e9bff;font-size:30px;font-weight:700;border-radius:8px}
#nav button:hover{background:rgba(60,130,255,.25)}
#nav span{min-width:90px;text-align:center;font-size:20px;font-weight:600}
#dots{position:absolute;left:1456px;top:802px;display:flex;gap:6px;z-index:9}
#dots b{width:9px;height:9px;border-radius:50%;background:#2a4a85}
#dots b.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
/* popups */
.pop{position:absolute;left:372px;bottom:150px;min-width:250px;padding:14px;border-radius:14px;background:rgba(6,22,56,.97);border:2px solid var(--line);box-shadow:0 0 20px rgba(30,144,255,.6);display:none;z-index:12;font-size:19px}
.pop.show{display:block}
.pop button.item{display:block;width:100%;text-align:left;padding:10px 12px;margin:3px 0;border-radius:8px;border:0;background:rgba(40,100,220,.25);color:#fff;font-size:19px;cursor:pointer}
.pop button.item:hover{background:rgba(40,100,220,.55)}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:4px;border:3px solid transparent;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 10px #fff}
#shapes{left:915px}
#bgmsg{position:absolute;right:20px;top:120px;font-size:15px;color:#9bbcf2;opacity:0;transition:opacity .3s;z-index:20}
#rot{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;background:#0b2a66;color:#fff;font-size:14px;text-align:center;z-index:50;display:none}
#draw{left:372px;top:330px;width:430px;height:300px;border-radius:14px;background:#f4f9ff;border:3px solid var(--line);box-shadow:0 0 18px rgba(30,144,255,.7);z-index:2;overflow:hidden;display:none}
#draw svg{width:100%;height:100%}
#draw.on{display:block}
#fm{left:380px;top:646px;width:420px;height:152px;overflow:hidden;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;font-size:27px;color:var(--yellow);font-family:var(--hand);text-shadow:0 0 8px rgba(255,225,77,.4)}
#fm.tall{top:128px;height:664px;justify-content:flex-start;font-size:30px}
#fm .f{border:3px solid var(--yellow);border-radius:12px;padding:8px 12px;direction:ltr;text-align:center;box-shadow:0 0 12px rgba(255,225,77,.35);overflow-wrap:anywhere;opacity:0;transition:opacity .4s;line-height:32px}
#fm .f.on{opacity:1}
#steps{left:830px;top:128px;width:415px;height:664px;overflow-y:auto;scrollbar-width:none;font-size:25px;line-height:33px;gap:14px}
#steps::-webkit-scrollbar{display:none}
#steps .st{opacity:.55}
#steps .st.cur{opacity:1}
#steps .st .n{flex:0 0 38px;height:38px;font-size:22px}
#steps .st .tx{font-family:var(--hand)}
#steps .st .lab{display:block;color:var(--cyan);font-size:19px;line-height:22px}
#steps.rtl{direction:rtl;text-align:right}
#side{width:350px}
#map{border:3px solid var(--green);border-radius:16px;padding:8px 12px;box-shadow:0 0 12px rgba(57,217,138,.4);height:610px;overflow-y:auto;scrollbar-width:none;margin-top:14px}
#map::-webkit-scrollbar{display:none}
#map .mi{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:21px;line-height:26px;cursor:pointer;opacity:.75;font-family:system-ui,Arial,sans-serif}
#map .mi i{font-style:normal;flex:0 0 28px;height:28px;border:2px solid var(--cyan);border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--cyan);margin-top:0}
#map .mi.cur{opacity:1;color:var(--yellow);font-weight:700}
#map .mi.cur i{border-color:var(--yellow);color:var(--yellow);background:rgba(255,225,77,.15)}
#map.rtl{direction:rtl}
#sideh{font-family:var(--hand);font-size:31px;color:var(--yellow);border-bottom:3px solid var(--yellow);display:inline-block;line-height:34px}
#title{font-size:36px;padding:0 20px;text-align:center;white-space:normal;line-height:40px}
.pop button.item.sel{background:#1f8cff}

</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="logo" class="abs">
    <svg width="76" height="56" viewBox="0 0 76 56" aria-hidden="true">
      <defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9ac9ff"/></linearGradient></defs>
      <polygon points="38,4 74,20 38,36 2,20" fill="url(#gc)" stroke="#6fb4ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 28 V42 C16 47 27 52 38 52 C49 52 60 47 60 42 V28 L38 37 Z" fill="#cfe4ff" stroke="#6fb4ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M68 22 V40" stroke="#ffd34d" stroke-width="3" stroke-linecap="round"/><circle cx="68" cy="43" r="3.5" fill="#ffd34d"/>
    </svg>
    <div><div class="t1">NABIL AI</div><div class="t2">Smart Learning Platform</div></div>
  </div>
  <div id="title" class="abs"></div>
  <div id="topic" class="abs"></div>
  <div id="pager" class="abs"></div>

  <div id="draw" class="abs"></div>
  <div id="fm" class="abs"></div>
  <div id="steps" class="abs"></div>
  <div id="panelline" class="abs"></div>
  <div id="side" class="abs"><span id="sideh"></span><div id="map"></div></div>

  <svg id="teacher" viewBox="0 0 1672 941" aria-label="Teacher"></svg>
  <canvas id="ink" width="1672" height="941"></canvas>

  <div id="bar" class="abs">
    <button class="tb" id="bMenu"><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="20" rx="2"/><path d="M4 12h24M12 12v14"/></svg>Menu</button>
    <button class="tb" id="bTools"><svg viewBox="0 0 32 32"><rect x="4" y="5" width="9" height="9" rx="1"/><rect x="17" y="5" width="9" height="9" rx="1"/><rect x="4" y="18" width="9" height="9" rx="1"/><rect x="17" y="18" width="9" height="9" rx="1"/></svg>Tools</button>
    <div class="sp"></div>
    <button class="tb" data-tool="select" id="tSelect"><svg viewBox="0 0 32 32"><path d="M8 24l1-5L21 7l4 4-12 12z"/><path d="M19 9l4 4"/></svg>Select</button>
    <button class="tb" data-tool="pen" id="tPen"><svg viewBox="0 0 32 32"><path d="M6 26l2-7L22 5l5 5L13 24z"/><path d="M19 8l5 5"/></svg>Pen</button>
    <button class="tb" data-tool="eraser" id="tEraser"><svg viewBox="0 0 32 32"><path d="M13 25H27M5 18l9-10 10 9-6 8H10z"/><path d="M12 14l10 9"/></svg>Eraser</button>
    <button class="tb" id="tShape"><svg viewBox="0 0 32 32"><path d="M6 14l7-9 7 9z"/><circle cx="22" cy="22" r="6"/><rect x="5" y="19" width="9" height="9"/></svg>Shape</button>
    <button class="tb" id="tUndo"><svg viewBox="0 0 32 32"><path d="M10 9L5 14l5 5"/><path d="M5 14h13a7 7 0 010 14h-5"/></svg>Undo</button>
    <button class="tb" id="tRedo"><svg viewBox="0 0 32 32"><path d="M22 9l5 5-5 5"/><path d="M27 14H14a7 7 0 000 14h5"/></svg>Redo</button>
    <div class="sp"></div>
    <button class="tb" id="bBg"><svg viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="20" rx="2"/><circle cx="12" cy="13" r="2.5"/><path d="M5 23l8-7 5 4 4-4 5 5"/></svg>Background</button>
    <div id="nav"><button id="prev" aria-label="Previous">‹</button><span id="navtxt">1 / 1</span><button id="next" aria-label="Next">›</button></div>
  </div>

  <div class="pop" id="popMenu">
    <button class="item" id="mPlay">▶  Play the lesson</button>
    <button class="item" id="mRestart">↺  Restart this page</button>
    <button class="item" id="mAll">☰  Show whole page</button>
    <button class="item" id="mVoice">🔊  Voice: on</button>
    <div style="margin:6px 0 2px;color:#9bbcf2;font-size:15px">Language</div>
    <button class="item" data-lang="en">English</button>
    <button class="item" data-lang="ar">العربية</button>
    <button class="item" data-lang="fr">Français</button>
    <button class="item" id="mFull">⛶  Full screen</button>
  </div>
  <div class="pop" id="popTools" style="left:440px">
    <div>Pen colour</div><div id="sws"></div>
    <div style="margin-top:6px">Pen size <input type="range" id="size" min="2" max="14" value="5" style="vertical-align:middle;width:130px"></div>
    <button class="item" id="clearInk" style="margin-top:10px">🗑  Clear my writing</button>
  </div>
  <div class="pop" id="popShapes" style="left:900px;min-width:200px">
    <button class="item" data-shape="line">╱  Line</button>
    <button class="item" data-shape="arrow">➜  Arrow</button>
    <button class="item" data-shape="rect">▭  Rectangle</button>
    <button class="item" data-shape="circle">◯  Circle</button>
    <button class="item" data-shape="tri">△  Triangle</button>
  </div>
  <div id="bgmsg"></div>
</div>
</div>
<div id="rot">Rotate your phone to landscape for a bigger board.</div>

<script>
(function(){
"use strict";
var DATA={"title": {"en": "Exponential functions", "ar": "الدوال الأسية", "fr": "Fonctions exponentielles"}, "lang": "en", "pages": [{"title": {"en": "When the unknown moves into the exponent", "ar": "عندما ينتقل المجهول إلى الأس", "fr": "L'inconnue dans l'exposant"}, "items": [{"k": "t", "en": "Hello! Quick check: 2³ · 2⁴ = 2⁷ (same base, add exponents). Now 2ˣ = 8: where is the unknown? In the exponent. Ordinary linear algebra does not isolate x directly; the exponent structure or logarithms will. An exponential function turns additive changes in x into multiplicative changes in the output. Try 3ˣ = 27: x = 3 by recognising the same base.", "ar": "مرحبًا! تحقق سريع: 2³ · 2⁴ = 2⁷ (أساس واحد نجمع الأسس). الآن 2ˣ = 8: أين المجهول؟ في الأس. الجبر الخطي العادي لا يعزل x مباشرة؛ بنية الأس أو اللوغاريتمات ستفعل. الدالة الأسية تحوّل التغيرات الجمعية في x إلى تغيرات ضربية في المخرج. جرّب 3ˣ = 27: x = 3 بملاحظة الأساس نفسه.", "fr": "Exposant inconnu.", "label": ""}]}, {"title": {"en": "Definition", "ar": "التعريف", "fr": "Définition"}, "items": [{"k": "t", "en": "f(x) = aˣ with a > 0 and a ≠ 1. Domain ℝ, range (0, ∞), f(0) = 1. Why a ≠ 1? Because 1ˣ is constant and has no growth or decay. Every exponential graph passes through (0, 1) and approaches but never reaches y = 0, so aˣ = 0 has no solution.", "ar": "f(x) = aˣ حيث a > 0 وa ≠ 1. المجال ℝ والمدى (0, ∞) وf(0) = 1. لماذا a ≠ 1؟ لأن 1ˣ ثابتة بلا نمو ولا تناقص. كل منحنى أسي يمر بالنقطة (0, 1) ويقترب من y = 0 دون أن يبلغه فلا حل لـ aˣ = 0.", "fr": "Domaine ℝ, image ]0, ∞[.", "label": ""}, {"k": "f", "f": "f(x) = aˣ,  a > 0, a ≠ 1      f(0) = 1"}, {"k": "d", "svg": "<g id=\"E1a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"40.0\" y=\"384.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-4<\/text><line x1=\"112.5\" y1=\"400.0\" x2=\"112.5\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"112.5\" y=\"384.0\" font-si  before heavier tools.", "ar": "2^(x+1) = 8. نفحص الأسس قبل استعمال اللوغاريتمات: 8 = 2³ فيكون 2^(x+1) = 2³ وبما أن 2ᵗ متباينة نجد x + 1 = 3 وx = 2. التحقق: 2^(2+1) = 8. نستعمل البنية قبل الأدوات الأثقل.", "fr": "x = 2.", "label": ""}, {"k": "f", "f": "2^(x+1) = 2³  →  x + 1 = 3  →  x = 2"}]}, {"title": {"en": "Different bases: use ln", "ar": "أسس مختلفة: نستعمل ln", "fr": "Bases différentes : ln"}, "items": [{"k": "t", "en": "3e^(2x) = 12. Isolate the exponential first: e^(2x) = 4. The right side 4 > 0, so ln is valid. Apply ln: 2x = ln 4, so x = (ln 4)/2 = ln 2. Independent check: 3e^(2 ln 2) = 3e^(ln 4) = 12. Keep the exact logarithmic form before any decimal. Beware: ln(3 + e^(2x)) is not ln 3 + 2x.", "ar": "3e^(2x) = 12. نعزل الأسية أولًا: e^(2x) = 4. الطرف الأيمن 4 > 0 فاللوغاريتم صالح. نطبق ln: 2x = ln 4 إذن x = (ln 4)/2 = ln 2. تحقق مستقل: 3e^(2 ln 2) = 3e^(ln 4) = 12. نحتفظ بالصيغة اللوغاريتمية الدقيقة قبل أي قيمة عشرية. انتبه: ln(3 + e^(2x)) ليست ln 3 + 2x.", "fr": "x = ln 2.", "label": ""}, {"k": "f", "f": "e^(2x) = 4  →  2x = ln 4  →  x = ln 2"}]}, {"title": {"en": "Graph transformations", "ar": "تحويلات المنحنى", "fr": "Transformations"}, "items": [{"k": "t", "en": "g(x) = e^(x−2) + 3: shift right 2 and up 3; the horizontal asymptote moves from y = 0 to y = 3. For 2eˣ − 5 the asymptote is y = −5. Common mistake: calling x = −5 the asymptote.", "ar": "g(x) = e^(x−2) + 3: انسحاب 2 إلى اليمين و3 إلى الأعلى؛ والمقارب الأفقي ينتقل من y = 0 إلى y = 3. وفي 2eˣ − 5 المقارب y = −5. خطأ شائع: تسمية x = −5 مقاربًا.", "fr": "Asymptote y = 3.", "label": ""}, {"k": "d", "svg": "<g id=\"E4a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"40.0\" y=\"392.3\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-3<\/text><line x1=\"104.4\" y1=\"400.0\" x2=\"104.4\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"104.4\" y=\"392.3\" font-size=\"15\" text-anchor=\"middle\" ce toujours l'asymptote avec la courbe.", "label": ""}]}, {"title": {"en": "Growth model", "ar": "نموذج النمو", "fr": "Modèle de croissance"}, "items": [{"k": "t", "en": "P(t) = P₀ e^(kt): P₀ = P(0) is the initial amount, and the sign of k decides growth (k > 0) or decay (k < 0). When does P(t) = 500e^(0.03t) reach 800? Divide by 500: e^(0.03t) = 1.6, so 0.03t = ln 1.6 and t = ln(1.6)/0.03. The logarithm releases the unknown time from the exponent.", "ar": "P(t) = P₀ e^(kt): P₀ = P(0) هي الكمية الابتدائية وإشارة k تحدد النمو (k > 0) أو التناقص (k < 0). متى تبلغ P(t) = 500e^(0.03t) القيمة 800؟ نقسم على 500: e^(0.03t) = 1.6 إذن 0.03t = ln 1.6 وt = ln(1.6)/0.03. اللوغاريتم يحرّر الزمن المجهول من الأس.", "fr": "t = ln(1,6)/0,03.", "label": ""}, {"k": "f", "f": "e^(0.03t) = 1.6  →  t = ln(1.6) / 0.03"}, {"k": "d", "svg": "<g id=\"E5a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"98.0\" y1=\"400.0\" x2=\"98.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"98.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">3<\/text><line x1=\"156.0\" y1=\"400.0\" x2=\"156.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"156.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">6<\/text><line x1=\"214.0\" y1=\"400.0\" x2=\"214.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"214.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">9<\/text><line x1=\"272.0\" y1=\"400.0\" x2=\"272.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"272.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">12<\/text><line x1=\"330.0\" y1=\"400.0\" x2=\"330.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"330.0\" y=\"428.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-f نية في eˣ", "fr": "Quadratique en eˣ"}, "items": [{"k": "t", "en": "e^(2x) − 5eˣ + 6 = 0. Since e^(2x) = (eˣ)², put u = eˣ with u > 0: u² − 5u + 6 = 0, so (u − 2)(u − 3) = 0, u = 2 or 3, both positive. Then x = ln 2 or x = ln 3. Check in the original: eˣ = 2 or 3 zeroes the quadratic.", "ar": "e^(2x) − 5eˣ + 6 = 0. بما أن e^(2x) = (eˣ)² نضع u = eˣ مع u > 0: u² − 5u + 6 = 0 إذن (u − 2)(u − 3) = 0 وu = 2 أو 3 وكلاهما موجب. ثم x = ln 2 أو x = ln 3. نتحقق في الأصل: eˣ = 2 أو 3 تصفّر المعادلة.", "fr": "x = ln 2 ou ln 3.", "label": ""}, {"k": "f", "f": "u² − 5u + 6 = 0  →  u = 2, 3  →  x = ln 2, ln 3"}, {"k": "d", "svg": "<g id=\"E6a\"><line x1=\"122.9\" y1=\"400.0\" x2=\"122.9\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"122.9\" y=\"348.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-1<\/text><line x1=\"288.6\" y1=\"400.0\" x2=\"288.6\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"454.3\" y1=\"400.0\" x2=\"454.3\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"454.3\" y=\"348.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"620.0\" y1=\"400.0\" x2=\"620.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"620.0\" y=\"348.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">2<\/text><line x1=\"40.0\" y1=\"400.0\" x2=\"620.0\" y2=\"400.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"280.6\" y=\"405.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-2<\/text><line x1=\"40.0\" y1=\"364.0\" x2=\"620.0\" y2=\"364.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"280.6\" y=\"369.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-1<\/text><line x1=\"40.0\" y1=\"328.0\" x2=\"620.0\" y2=\"328.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"40.0\" y1=\"292.0\" x2=\"620.0\" y2=\"292.0\" stroke=\"#e0e6ea\" st s", "ar": "المحققون", "fr": "Détectives"}, "items": [{"k": "t", "en": "1) e^(a+b) = eᵃ + eᵇ is false: it is eᵃ·eᵇ. 2) e^(2x) = 2eˣ is false. 3) Do not confuse ln(eˣ) = x (all real x) with e^(ln x) = x (only x > 0). 4) eˣ = −2: stop, no real solution. 5) Do not use a decimal before the exact answer. 6) With k < 0 the model is decay, not growth. 7) After a vertical shift +3 the asymptote is y = 3, not y = 0.", "ar": "1) e^(a+b) = eᵃ + eᵇ خطأ: الصحيح eᵃ·eᵇ. 2) e^(2x) = 2eˣ خطأ. 3) لا نخلط ln(eˣ) = x (لكل x) مع e^(ln x) = x (فقط x > 0). 4) eˣ = −2: نتوقف، لا حل حقيقي. 5) لا نستعمل العشري قبل الجواب الدقيق. 6) مع k < 0 النموذج تناقص لا نمو. 7) بعد انسحاب رأسي +3 يصبح المقارب y = 3 لا y = 0.", "fr": "Sept erreurs types.", "label": ""}]}, {"title": {"en": "Student try", "ar": "جرّب بنفسك", "fr": "À toi"}, "items": [{"k": "t", "en": "5eˣ − 10 = 0: 5eˣ = 10, eˣ = 2, so x = ln 2. Check: 5e^(ln 2) − 10 = 10 − 10 = 0. Summary: see the exponent, choose the structure, isolate, invert with the logarithm, check in the original.", "ar": "5eˣ − 10 = 0: 5eˣ = 10 وeˣ = 2 إذن x = ln 2. التحقق: 5e^(ln 2) − 10 = 10 − 10 = 0. الخلاصة: نرى الأس ونختار البنية ونعزل ونعكس باللوغاريتم ونتحقق في الأصل.", "fr": "x = ln 2.", "label": ""}, {"k": "f", "f": "5e^(ln 2) − 10 = 0"}]}, {"title": {"en": "Exercise 1", "ar": "التمرين 1", "fr": "Exercice 1"}, "items": [{"k": "t", "en": "Solve 2ˣ = 16 and 3^(x−1) = 9.", "ar": "حلّ 2ˣ = 16 و3^(x−1) = 9.", "fr": "Résous 2ˣ = 16 et 3^(x−1) = 9.", "label": "Problem"}, {"k": "t", "en": "Write each right side as a power of the same base. 16 = 2⁴, so 2ˣ = 2⁴ and x = 4.", "ar": "نكتب الطرف الأيمن قوة للأساس نفسه. 16 = 2⁴ فيكون 2ˣ = 2⁴ وx = 4.", "fr": "On écrit 16 = 2⁴, donc x = 4.", "label": ""}, {"k": "t", "en": "Second: 9 = 3², so 3^(x−1) = 3². Then x − 1 = 2 and x = 3.", "ar": "الثانية: 9 = 3² إذن 3^(x−1) = 3². فيكون x − 1 = 2 وx = 3.", "fr": "9 = 3² donc x − 1 = 2 et x = 3.", "label": ""}, {"k": "f", "f": "x = 4      x = 3"}, {"k": "f", "f": "Check: 2⁴ = 16 ✓      3^(3−1) = 3² = 9 ✓"}]}, {"title": {"en": "Exercise 2", "ar": "التمرين 2", "fr": "Exercice 2"}, "items": [{"k": "t", "en": "Solve e^(3x) = 7 and 4e^(−x) = 9.", "ar": "حلّ e^(3x) = 7 و4e^(−x) = 9.", "fr": "Résous e^(3x) = 7 et 4e^(−x) = 9.", "label": "Problem"}, {"k": "t", "en": "Take ln of both sides of e^(3x) = 7: 3x = ln 7, so x = (ln 7)/3 ≈ 0.649.", "ar": "نطبق ln على الطرفين: 3x = ln 7 إذن x = (ln 7)/3 ≈ 0.649.", "fr": "On applique ln : 3x = ln 7, x = (ln 7)/3 ≈ 0,649.", "label": ""}, {"k": "t", "en": "For the second, isolate the exponential first: e^(−x) = 9/4. Then −x = ln(9/4), so x = −ln(9/4) = ln(4/9) ≈ −0.811.", "ar": "للثانية نعزل الأسية أولًا: e^(−x) = 9/4. إذن −x = ln(9/4) وx = −ln(9/4) = ln(4/9) ≈ −0.811.", "fr": "On isole : e^(−x) = 9/4, donc x = −ln(9/4) = ln(4/9) ≈ −0,811.", "label": ""}, {"k": "f", "f": "x = (ln 7)/3 ≈ 0.649      x = ln(4/9) ≈ −0.811"}, {"k": "f", "f": "Check: e^(3·0.649) ≈ e^1.946 ≈ 7 ✓      4e^(0.811) ≈ 4 × 2.25 = 9 ✓"}]}, {"title": {"en": "Exercise 3", "ar": "التمرين 3", "fr": "Exercice 3"}, "items": [{"k": "t", "en": "Solve e^(2x) − 7eˣ + 12 = 0.", "ar": "حلّ e^(2x) − 7eˣ + 12 = 0.", "fr": "Résous e^(2x) − 7eˣ + 12 = 0.", "label": "Problem"}, {"k": "t", "en": "Put u = eˣ with u > 0. Then e^(2x) = u² and the equation becomes u² − 7u + 12 = 0.", "ar": "نضع u = eˣ مع u > 0. فيصبح e^(2x) = u² والمعادلة u² − 7u + 12 = 0.", "fr": "On pose u = eˣ > 0 : u² − 7u + 12 = 0.", "label": ""}, {"k": "t", "en": "Factor: (u − 3)(u − 4) = 0, so u = 3 or u = 4. Both are positive, so both are accepted.", "ar": "نحلّل: (u − 3)(u − 4) = 0 إذن u = 3 أو u = 4. كلاهما موجب فيُقبلان.", "fr": "(u − 3)(u − 4) = 0 : u = 3 ou 4, tous deux > 0.", "label": ""}, {"k": "t", "en": "Return to x: eˣ = 3 gives x = ln 3, and eˣ = 4 gives x = ln 4.", "ar": "نعود إلى x: eˣ = 3 تعطي x = ln 3 وeˣ = 4 تعطي x = ln 4.", "fr": "x = ln 3 ou x = ln 4.", "label": ""}, {"k": "f", "f": "x = ln 3 ≈ 1.099      x = ln 4 ≈ 1.386"}, {"k": "f", "f": "Check x = ln 3: 9 − 21 + 12 = 0 ✓"}]}, {"title": {"en": "Exercise 4", "ar": "التمرين 4", "fr": "Exercice 4"}, "items": [{"k": "t", "en": "For f(x) = 2e^(x−1) − 4 give the domain, the range and the horizontal asymptote, then the zero of f.", "ar": "أعطِ مجال f(x) = 2e^(x−1) − 4 ومداها ومقاربها الأفقي ثم صفرها.", "fr": "Pour f(x) = 2e^(x−1) − 4 : domaine, image, asymptote, puis zéro.", "label": "Problem"}, {"k": "t", "en": "The exponential is defined for every real x, so the domain is ℝ.", "ar": "الأسية معرّفة لكل x حقيقي فالمجال ℝ.", "fr": "Domaine : ℝ.", "label": ""}, {"k": "t", "en": "e^(x−1) > 0, so 2e^(x−1) > 0 and f(x) > −4. The range is (−4, +∞) and the asymptote is y = −4 (as x → −∞).", "ar": "e^(x−1) > 0 إذن 2e^(x−1) > 0 وf(x) > −4. المدى (−4, +∞) والمقارب y = −4 عند −∞.", "fr": "f(x) > −4 : image ]−4 ; +∞[, asymptote y = −4.", "label": ""}, {"k": "t", "en": "Zero: 2e^(x−1) = 4, e^(x−1) = 2, x − 1 = ln 2, so x = 1 + ln 2 ≈ 1.693.", "ar": "الصفر: 2e^(x−1) = 4 وe^(x−1) = 2 وx − 1 = ln 2 إذن x = 1 + ln 2 ≈ 1.693.", "fr": "2e^(x−1) = 4 → x = 1 + ln 2 ≈ 1,693.", "label": ""}, {"k": "d", "svg": "<g id=\"X4a\"><line x1=\"40.0\" y1=\"400.0\" x2=\"40.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"40.0\" y=\"285.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-3<\/text><line x1=\"122.9\" y1=\"400.0\" x2=\"122.9\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"122.9\" y=\"285.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-2<\/text><line x1=\"205.7\" y1=\"400.0\" x2=\"205.7\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"205.7\" y=\"285.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-1<\/text><line x1=\"288.6\" y1=\"400.0\" x2=\"288.6\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"371.4\" y1=\"400.0\" x2=\"371.4\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"371.4\" y=\"285.0\" font-size=\"15\" text-anc {"k": "t", "en": "Solve 7e^(2x) = 20 exactly and give a decimal value.", "ar": "حلّ 7e^(2x) = 20 بدقة وأعطِ قيمة عشرية.", "fr": "Résous 7e^(2x) = 20 exactement puis en décimal.", "label": "Problem"}, {"k": "t", "en": "Divide by 7: e^(2x) = 20/7. Apply ln: 2x = ln(20/7). Divide by 2.", "ar": "نقسم على 7: e^(2x) = 20/7. نطبق ln: 2x = ln(20/7). ثم نقسم على 2.", "fr": "e^(2x) = 20/7 → 2x = ln(20/7).", "label": ""}, {"k": "f", "f": "x = (1/2) ln(20/7) ≈ (1/2)(1.0498) ≈ 0.525"}, {"k": "f", "f": "Check: 7e^(1.0498) = 7 × 2.857 ≈ 20 ✓"}]}, {"title": {"en": "Exercise 6", "ar": "التمرين 6", "fr": "Exercice 6"}, "items": [{"k": "t", "en": "Solve the inequality eˣ > 5 and the inequality 3e^(−x) ≤ 1.", "ar": "حلّ المتراجحة eˣ > 5 والمتراجحة 3e^(−x) ≤ 1.", "fr": "Résous eˣ > 5 et 3e^(−x) ≤ 1.", "label": "Problem"}, {"k": "t", "en": "The function ln is increasing, so applying it keeps the direction: eˣ > 5 gives x > ln 5 ≈ 1.609.", "ar": "الدالة ln متزايدة فتحافظ على اتجاه المتراجحة: eˣ > 5 تعطي x > ln 5 ≈ 1.609.", "fr": "ln est croissante : x > ln 5 ≈ 1,609.", "label": ""}, {"k": "t", "en": "Second: e^(−x) ≤ 1/3, so −x ≤ ln(1/3) = −ln 3, and multiplying by −1 reverses the sign: x ≥ ln 3 ≈ 1.099.", "ar": "الثانية: e^(−x) ≤ 1/3 إذن −x ≤ ln(1/3) = −ln 3. وبضرب الطرفين في −1 ينعكس الاتجاه: x ≥ ln 3 ≈ 1.099.", "fr": "e^(−x) ≤ 1/3 → −x ≤ −ln 3 → x ≥ ln 3.", "label": ""}, {"k": "f", "f": "S₁ = (ln 5, +∞)      S₂ = [ln 3, +∞)"}]}, {"title": {"en": "Exercise 7", "ar": "التمرين 7", "fr": "Exercice 7"}, "items": [{"k": "t", "en": "A culture has 500 bacteria and grows as P(t) = 500e^(0.03t) (t in hours). When does it double? What is P(24)?", "ar": "مزرعة فيها 500 بكتيريا تنمو وفق P(t) = 500e^(0.03t) (t بالساعات). متى يتضاعف عددها؟ وما قيمة P(24)؟", "fr": "Une culture de 500 bactéries suit P(t) = 500e^(0,03t). Quand double-t-elle ? Que vaut P(24) ?", "label": "Problem"}, {"k": "t", "en": "Doubling means P(t) = 1000, so e^(0.03t) = 2 and 0.03t = ln 2.", "ar": "التضاعف يعني P(t) = 1000 إذن e^(0.03t) = 2 وهذا يعطي 0.03t = ln 2.", "fr": "Doubler : e^(0,03t) = 2.", "label": ""}, {"k": "f", "f": "t = ln 2 / 0.03 ≈ 0.693 / 0.03 ≈ 23.1 hours"}, {"k": "t", "en": "For t = 24: P(24) = 500e^(0.72) ≈ 500 × 2.054 ≈ 1027 bacteria — just over double, matching the doubling time of 23.1 h.", "ar": "عند t = 24: P(24) = 500e^(0.72) ≈ 500 × 2.054 ≈ 1027 بكتيريا، أي أكثر قليلًا من الضعف وهذا يوافق زمن التضاعف 23.1 ساعة.", "fr": "P(24) = 500e^(0,72) ≈ 1027, cohérent avec 23,1 h.", "label": ""}, {"k": "f", "f": "P(24) ≈ 1027"}]}, {"title": {"en": "Exercise 8", "ar": "التمرين 8", "fr": "Exercice 8"}, "items": [{"k": "t", "en": "Error detective: a student solves e^(2x) − 5eˣ + 6 = 0 by writing 2x − 5x + 6 = 0. Find the mistake and solve correctly.", "ar": "المحقق: حلّ طالب e^(2x) − 5eˣ + 6 = 0 فكتب 2x − 5x + 6 = 0. جد الخطأ وحلّ بشكل صحيح.", "fr": "Détective : un élève écrit 2x − 5x + 6 = 0. Trouve l'erreur et résous.", "label": "Problem"}, {"k": "t", "en": "The student removed the letter e as if it were a common factor. But e^(2x) − 5eˣ + 6 is not a product: you cannot cancel e from a sum of different exponentials.", "ar": "حذف الطالب الحرف e وكأنه عامل مشترك. لكن المقدار ليس جداءً، ولا يمكن حذف e من مجموع أسّيات مختلفة.", "fr": "L'élève a supprimé e comme s'il était facteur commun : impossible dans une somme.", "label": ""}, {"k": "t", "en": "The correct method is u = eˣ: u² − 5u + 6 = 0 gives u = 2 or 3, hence x = ln 2 or x = ln 3. The graph of h(x) on the board crosses the x-axis at exactly these two points.", "ar": "الطريقة الصحيحة u = eˣ: u² − 5u + 6 = 0 تعطي u = 2 أو 3 فيكون x = ln 2 أو x = ln 3. ومنحنى h(x) على اللوح يقطع محور الفواصل عند هاتين النقطتين فقط.", "fr": "Bonne méthode : u = eˣ → x = ln 2 ou ln 3, comme le montre la courbe.", "label": ""}, {"k": "f", "f": "x = ln 2 ≈ 0.693      x = ln 3 ≈ 1.099"}]}]};

function schedule(ms){
  clearTimeout(playTimer);
  playTimer=setTimeout(function(){
    if(!playing)return;
    var p=page();
    if(pi>=DATA.pages.length-1&&ii>=p.items.length-1){stopPlay();return}
    next();
    var it=page().items[ii];
    if(!it||it.k!=="t"||!hasVoice())schedule(it&&it.k==="t"?Math.max(3500,L(it).length*70):(it&&it.k==="d"?3500:2200));
  },ms);
}
function startPlay(){playing=true;closePops();$("#mPlay").textContent="❚❚  "+UI[LANG].pause;if(ii<0||ii>=page().items.length-1)gotoPage(pi);schedule(hasVoice()?100:3500)}

var SHD={x:310,y:410},L1=215,L2=215;
var cur={x:560,y:330},target=[585,330],t0=0;
function solve(tx,ty){
  var dx=tx-SHD.x,dy=ty-SHD.y,d=Math.hypot(dx,dy),max=L1+L2-6;
  if(d>max){dx*=max/d;dy*=max/d;d=max}
  if(d<110){dx*=110/d;dy*=110/d;d=110}
  var a=Math.atan2(dy,dx),c=(L1*L1+d*d-L2*L2)/(2*L1*d);
  var ang=Math.acos(Math.max(-1,Math.min(1,c)));
  var ea=a+ang; /* elbow below the line (positive y) */
  var ex=SHD.x+L1*Math.cos(ea),ey=SHD.y+L1*Math.sin(ea);
  return {ex:ex,ey:ey,wx:SHD.x+dx,wy:SHD.y+dy};
}
function frame(ts){
  cur.x+=(target[0]-cur.x)*.07;cur.y+=(target[1]-cur.y)*.07;
  var wob=Math.sin(ts/380)*2.2;
  var s=solve(cur.x-67+wob,cur.y+57+wob*.4);
  var d="M"+SHD.x+" "+SHD.y+" Q"+(SHD.x+10)+" "+(SHD.y+60)+" "+s.ex+" "+s.ey+" L"+s.wx+" "+s.wy;
  arm.setAttribute("d",d);armHl.setAttribute("d",d);
  var fa=Math.atan2(s.wy-s.ey,s.wx-s.ex);
  hand.setAttribute("cx",s.wx);hand.setAttribute("cy",s.wy);
  var px=cur.x+wob,py=cur.y+wob*.4;
  pen.setAttribute("x1",s.wx);pen.setAttribute("y1",s.wy);pen.setAttribute("x2",px);pen.setAttribute("y2",py);
  penTip.setAttribute("cx",px);penTip.setAttribute("cy",py);
  requestAnimationFrame(frame);
}

var cv=$("#ink"),cx=cv.getContext("2d");

$("#size").oninput=function(){size=+this.value};
function pos(e){var r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function drawOp(o,c){
  c.save();c.lineCap="round";c.lineJoin="round";c.lineWidth=o.w;c.strokeStyle=o.c;
  if(o.k==="erase"){c.globalCompositeOperation="destination-out";c.lineWidth=o.w*4}
  if(o.k==="pen"||o.k==="erase"){
    c.beginPath();c.moveTo(o.p[0].x,o.p[0].y);
    if(o.p.length===1)c.lineTo(o.p[0].x+.1,o.p[0].y);
    for(var i=1;i<o.p.length;i++)c.lineTo(o.p[i].x,o.p[i].y);
    c.stroke();
  }else{
    var a=o.a,b=o.b;c.beginPath();
    if(o.k==="line"||o.k==="arrow"){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);
      if(o.k==="arrow"){var an=Math.atan2(b.y-a.y,b.x-a.x),h=14+o.w*2;
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an-.45),b.y-h*Math.sin(an-.45));
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an+.45),b.y-h*Math.sin(an+.45))}}
    else if(o.k==="rect"){c.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}
    else if(o.k==="circle"){c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,7)}
    else if(o.k==="tri"){c.moveTo((a.x+b.x)/2,a.y);c.lineTo(b.x,b.y);c.lineTo(a.x,b.y);c.closePath()}
    c.stroke();
  }
  c.restore();
}
function repaint(extra){cx.clearRect(0,0,1672,941);ops.forEach(function(o){drawOp(o,cx)});if(extra)drawOp(extra,cx)}
cv.addEventListener("pointerdown",function(e){
  if(tool==="select")return;
  cv.setPointerCapture(e.pointerId);closePops();
  var p=pos(e);redo=[];
  if(tool==="shape")drawing={k:shapeKind||"line",c:color,w:size,a:p,b:p};
  else drawing={k:tool==="eraser"?"erase":"pen",c:color,w:size,p:[p]};
  repaint(drawing);
});
cv.addEventListener("pointermove",function(e){
  if(!drawing)return;var p=pos(e);
  if(drawing.p)drawing.p.push(p);else drawing.b=p;
  repaint(drawing);
});
function endDraw(){if(!drawing)return;ops.push(drawing);drawing=null;repaint()}
cv.addEventListener("pointerup",endDraw);cv.addEventListener("pointercancel",endDraw);
function setTool(t){
  tool=t;

  cv.style.pointerEvents=(t==="select")?"none":"auto";

}
