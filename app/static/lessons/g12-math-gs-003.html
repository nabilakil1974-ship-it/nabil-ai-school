var DATA={"title": {"en": "Inverse trigonometric functions", "ar": "الدوال المثلثية العكسية", "fr": "Fonctions trigonométriques réciproques"}, "lang": "ar", "pages": [{"title": {"en": "Can sine have an inverse?", "ar": "هل للجيب دالة عكسية؟", "fr": "Le sinus a-t-il une réciproque ?"}, "items": [{"k": "t", "en": "Hello! Look: sin(π/6) = 1/2 and sin(5π/6) = 1/2. Given the value 1/2, can we recover one unique angle on all of ℝ? No. The problem is not algebra, it is uniqueness. An inverse must send each output back to exactly one input, so we first restrict the function to an interval where it is one-to-one. The horizontal-line test detects the problem.", "ar": "مرحبًا! انظر: sin(π/6) = 1/2 وsin(5π/6) = 1/2. إذا أعطيتك القيمة 1/2 فهل نستعيد زاوية واحدة على ℝ كلها؟ لا. المشكلة ليست جبرية بل هي الوحدانية. الدالة العكسية يجب أن تعيد كل مخرج إلى مدخل واحد فقط، لذلك نقيّد الدالة أولًا على مجال تكون فيه متباينة. ويكشف المشكلة اختبار الخط الأفقي.", "fr": "Il faut restreindre.", "label": ""}, {"k": "d", "svg": "<g id=\"T1a\"><line x1=\"53.1\" y1=\"400.0\" x2=\"53.1\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"53.1\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-3<\/text><line x1=\"145.4\" y1=\"400.0\" x2=\"145.4\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"145.4\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-2<\/text><line x1=\"237.7\" y1=\"400.0\" x2=\"237.7\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"237.7\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-1<\/text><line x1=\"330.0\" y1=\"400.0\" x2=\"330.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"422.3\" y1=\"400.0\" x2=\"422.3\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"422.3\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text .9,173.7 L582.3,175.3 L583.7,176.9 L585.2,178.6 L586.6,180.2 L588.1,181.9 L589.5,183.6 L591.0,185.2 L592.5,186.9 L593.9,188.6 L595.3,190.3 L596.8,192.0 L598.2,193.7 L599.7,195.5 L601.1,197.2 L602.6,198.9 L604.1,200.7 L605.5,202.4 L607.0,204.1 L608.4,205.9 L609.8,207.7 L611.3,209.4 L612.8,211.2 L614.2,212.9 L615.6,214.7 L617.1,216.5 L618.6,218.2 L620.0,220.0\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"5\" stroke-linejoin=\"round\" /><text x=\"614\" y=\"44\" font-size=\"20\" font-weight=\"700\" text-anchor=\"end\" fill=\"#e53935\" font-family=\"sans-serif\">y = sin x<\/text><\/g><g id=\"T1s\"><line x1=\"40.0\" y1=\"107.5\" x2=\"620.0\" y2=\"107.5\" stroke=\"#8e24aa\" stroke-width=\"3\" stroke-dasharray=\"10 7\"/><line x1=\"40.0\" y1=\"332.5\" x2=\"620.0\" y2=\"332.5\" stroke=\"#8e24aa\" stroke-width=\"3\" stroke-dasharray=\"10 7\"/><\/g><g id=\"T1pA\"><circle cx=\"474.9\" cy=\"107.5\" r=\"9\" fill=\"#1e88e5\" stroke=\"#0b3d5c\" stroke-width=\"2\"/><text x=\"486.9\" y=\"97.5\" font-size=\"19\" font-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">A(1.57,1)<\/text><\/g><g id=\"T1pB\"><circle cx=\"185.1\" cy=\"332.5\" r=\"9\" fill=\"#1e88e5\" stroke=\"#0b3d5c\" stroke-width=\"2\"/><text x=\"197.1\" y=\"322.5\" font-size=\"19\" font-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">B(-1.57,-1)<\/text><\/g>", "vb": [660, 440], "show": ["T1a", "T1c", "T1s", "T1pA", "T1pB"]}, {"k": "t", "en": "Look at sin x. The horizontal line y = 0.5 cuts the curve many times, so one output comes from many inputs: sine is not one-to-one on ℝ. To invert it we keep only the piece from −π/2 to π/2 (between the two marked points), where it rises from −1 to 1 and is one-to-one.", "ar": "انظر إلى sin x. المستقيم الأفقي y = 0.5 يقطع المنحنى مرات كثيرة أي أن الناتج الواحد يأتي من مداخل كثيرة: الجيب ليس متباينًا على ℝ. لنعكسه نحتفظ بالقطعة من −π/2 إلى π/2 (بين النقطتين المعلّمتين) حيث ترتفع من −1 إلى 1 وتكون متباينة.", "fr": "Observe sin x : la droite y = 0,5 coupe la courbe plusieurs fois, sin n'est pas injective sur ℝ. On garde la portion de −π/2 à π/2, où elle monte de −1 à 1.", "label": ""}]}, {"title": {"en": "Choosing the principal branches", "ar": "اختيار الفروع الأساسية", "fr": "Branches principales"}, "items": [{"k": "t", "en": "sin x is restricted to [−π/2, π/2]: strictly increasing from −1 to 1. cos x is restricted to [0, π]: strictly decreasing from 1 to −1. tan x is restricted to ]−π/2, π/2[: strictly increasing from −∞ to +∞. Inverse trig functions are not obtained by blindly writing “−1”; they exist because we first choose one-to-one branches. Note: sin⁻¹x is not 1/sin x.", "ar": "نقيّد sin x على [−π/2, π/2]: متزايدة تمامًا من −1 إلى 1. ونقيّد cos x على [0, π]: متناقصة تمامًا من 1 إلى −1. ونقيّد tan x على ]−π/2, π/2[: متزايدة تمامًا من −∞ إلى +∞. الدوال العكسية لا تأتي من كتابة «−1» بعمى، بل توجد لأننا اخترنا أولًا فروعًا متباينة. تنبيه: sin⁻¹x ليست 1/sin x.", "fr": "Trois restrictions.", "label": ""}, {"k": "f", "f": "sin: [−π/2, π/2]      cos: [0, π]      tan: ]−π/2, π/2["}]}, {"title": {"en": "arcsin", "ar": "arcsin", "fr": "arcsin"}, "items": [{"k": "t", "en": "Reflect the points of the sine branch across y = x: (π/2, 1) becomes (1, π/2). So y = arcsin x means sin y = x with y ∈ [−π/2, π/2]; domain [−1, 1], range [−π/2, π/2]. sin(arcsin x) = x for x ∈ [−1, 1], but arcsin(sin x) = x only when x ∈ [−π/2, π/2]: otherwise arcsin returns the equivalent principal angle.", "ar": "نعكس نقاط فرع الجيب حول y = x: النقطة (π/2, 1) تصبح (1, π/2). إذن y = arcsin x تعني sin y = x مع y ∈ [−π/2, π/2]؛ المجال [−1, 1] والمدى [−π/2, π/2]. وsin(arcsin x) = x لكل x ∈ [−1, 1] أما arcsin(sin x) = x فقط عندما x ∈ [−π/2, π/2]، وإلا تعيد arcsin الزاوية الأساسية المكافئة.", "fr": "Domaine [−1, 1].", "label": ""}, {"k": "t", "en": "Derivative: let y = arcsin x, so x = sin y and 1 = cos y · y′. Since y ∈ [−π/2, π/2], cos y ≥ 0 and cos y = √(1 − x²). Therefore:", "ar": "المشتقة: لتكن y = arcsin x إذن x = sin y فيكون 1 = cos y · y′. وبما أن y ∈ [−π/2, π/2] فإن cos y ≥ 0 وcos y = √(1 − x²). إذن:", "fr": "Dérivée.", "label": ""}, {"k": "f", "f": "(arcsin x)′ = 1 / √(1 − x²),   −1 < x < 1"}, {"k": "d", "svg": "<g id=\"T2a\"><line x1=\"122.9\" y1=\"400.0\" x2=\"122.9\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"122.9\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-1<\/text><line x1=\"330.0\" y1=\"400.0\" x2=\"330.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"537.1\" y1=\"400.0\" x2=\"537.1\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"537.1\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"40.0\" y1=\"400.0\" x2=\"620.0\" y2=\"400.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"322.0\" y=\"405.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-2<\/text><line x1=\"40.0\" y1=\"310.0\" x2=\"620.0\" y2=\"310.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"322.0\" y=\"315.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-1<\/text><line x1=\"40.0\" y1=\"220.0\" x2=\"620.0\" y2=\"220.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><line x1=\"40.0\" y1=\"130.0\" x2=\"620.0\" y2=\"130.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"322.0\" y=\"135.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1<\/text><line x1=\"40.0\" y1=\"40.0\" x2=\"620.0\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"322.0\" y=\"45.0\" font-size=\"15\" text-anchor=\"end\" fill=\"#0b3d5c\" font-family=\"sans-serif\">2<\/text><line x1=\"40.0\" y1=\"220.0\" x2=\"620.0\" y2=\"220.0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><line x1=\"330.0\" y1=\"400.0\" x2=\"330.0\" y2=\"40.0\" stroke=\"#0b3d5c\" stroke-width=\"4\"/><\/g><g id=\"T2c\"><path d=\"M124.1,351.5 L125.6,346.8 L127.0,343.3 L128.4,340.4 L129.9,337.8 L131.3,335.5 L132.8,333.4 L134.2,331.4 L13 615.6,90.0 L617.1,89.9 L618.6,89.9 L620.0,89.8\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"5\" stroke-linejoin=\"round\" /><text x=\"614\" y=\"44\" font-size=\"20\" font-weight=\"700\" text-anchor=\"end\" fill=\"#e53935\" font-family=\"sans-serif\">arctan x<\/text><\/g><g id=\"T4s\"><line x1=\"40.0\" y1=\"78.6\" x2=\"620.0\" y2=\"78.6\" stroke=\"#8e24aa\" stroke-width=\"3\" stroke-dasharray=\"10 7\"/><line x1=\"40.0\" y1=\"361.4\" x2=\"620.0\" y2=\"361.4\" stroke=\"#8e24aa\" stroke-width=\"3\" stroke-dasharray=\"10 7\"/><\/g><g id=\"T4pO\"><circle cx=\"330.0\" cy=\"220.0\" r=\"9\" fill=\"#1e88e5\" stroke=\"#0b3d5c\" stroke-width=\"2\"/><text x=\"342.0\" y=\"210.0\" font-size=\"19\" font-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">O(0,0)<\/text><\/g><g id=\"T4pA\"><circle cx=\"366.2\" cy=\"148.9\" r=\"9\" fill=\"#1e88e5\" stroke=\"#0b3d5c\" stroke-width=\"2\"/><text x=\"378.2\" y=\"138.9\" font-size=\"19\" font-weight=\"700\" fill=\"#0b3d5c\" font-family=\"sans-serif\">A(1,0.79)<\/text><\/g>", "vb": [660, 440], "show": ["T4a", "T4c", "T4s", "T4pO", "T4pA"]}, {"k": "t", "en": "arctan x is defined for every real x, increases slowly and flattens toward two horizontal asymptotes: y = π/2 on the right and y = −π/2 on the left. It never reaches them. Point A: tan(π/4) = 1, so arctan 1 = π/4.", "ar": "arctan x معرّف لكل x حقيقي، يتزايد ببطء ويتسطح نحو مقاربين أفقيين: y = π/2 يمينًا وy = −π/2 يسارًا ولا يبلغهما. النقطة A: tan(π/4) = 1 إذن arctan 1 = π/4.", "fr": "arctan est définie sur ℝ, croissante, avec deux asymptotes y = ±π/2. A : arctan 1 = π/4.", "label": ""}]}, {"title": {"en": "Principal-value map", "ar": "خريطة القيم الأساسية", "fr": "Valeurs principales"}, "items": [{"k": "t", "en": "Do not memorise isolated answers. Always ask: what angle inside the principal range gives this value? arcsin: 0 → 0, 1/2 → π/6, √2/2 → π/4, √3/2 → π/3, 1 → π/2. arccos: 1 → 0, √3/2 → π/6, √2/2 → π/4, 1/2 → π/3, 0 → π/2, −1 → π. arctan: 0 → 0, 1/√3 → π/6, 1 → π/4, √3 → π/3.", "ar": "لا نحفظ إجابات معزولة. نسأل دائمًا: أي زاوية داخل المجال الأساسي تعطي هذه القيمة؟ arcsin: 0 → 0 و1/2 → π/6 و√2/2 → π/4 و√3/2 → π/3 و1 → π/2. arccos: 1 → 0 و√3/2 → π/6 و√2/2 → π/4 و1/2 → π/3 و0 → π/2 و−1 → π. arctan: 0 → 0 و1/√3 → π/6 و1 → π/4 و√3 → π/3.", "fr": "Angle dans l'intervalle principal.", "label": ""}]}, {"title": {"en": "Exact value and composition", "ar": "قيمة دقيقة وتركيب", "fr": "Valeur exacte et composition"}, "items": [{"k": "t", "en": "A = arcsin(−√3/2): search only inside [−π/2, π/2]. sin(π/3) = √3/2, so for the negative value choose y = −π/3. Check: sin(−π/3) = −√3/2. B = arccos(cos(5π/3)): do not cancel. First Range(arccos) = [0, π]. cos(5π/3) = 1/2, and the angle in [0, π] with cosine 1/2 is π/3. So B = π/3, not 5π/3.", "ar": "A = arcsin(−√3/2): نبحث فقط داخل [−π/2, π/2]. sin(π/3) = √3/2 فللقيمة السالبة نختار y = −π/3. التحقق: sin(−π/3) = −√3/2. B = arccos(cos(5π/3)): لا نختصر. أولًا Range(arccos) = [0, π]. cos(5π/3) = 1/2 والزاوية في [0, π] التي جيب تمامها 1/2 هي π/3. إذن B = π/3 لا 5π/3.", "fr": "Principal avant simplification.", "label": ""}, {"k": "f", "f": "arcsin(−√3/2) = −π/3"}, {"k": "f", "f": "arccos(cos(5π/3)) = arccos(1/2) = π/3"}, {"k": "d", "svg": "<g id=\"T5a\"><line x1=\"53.1\" y1=\"400.0\" x2=\"53.1\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"53.1\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-6<\/text><line x1=\"99.2\" y1=\"400.0\" x2=\"99.2\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"99.2\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-5<\/text><line x1=\"145.4\" y1=\"400.0\" x2=\"145.4\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"145.4\" y=\"240.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">-4<\/text><line x1=\"191.5\" y1=\"400.0\" x2=\"191.5\" y2=\"40.0\" stroke=\"#e0e6ea\" stroke-width=\"2\"/><text x=\"191.5\ 99.6,84.3 L401.0,81.5 L402.5,78.6 L404.0,75.8 L405.4,73.0 L406.9,70.1 L408.3,67.3 L409.8,64.5 L411.2,61.7 L412.7,58.8 L414.1,56.0 L415.5,53.2 L417.0,50.4 L418.4,47.5 L419.9,44.7 L421.4,41.9\" fill=\"none\" stroke=\"#1e88e5\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-dasharray=\"12 8\"/><\/g>", "vb": [660, 440], "show": ["T5a", "T5c", "T5x0"]}, {"k": "t", "en": "This is the trap picture. arcsin(sin x) is NOT x for every x: it equals x only on [−π/2, π/2]. Outside, the graph zig-zags between −π/2 and π/2. For example sin(3π/4) = √2/2, and arcsin(√2/2) = π/4, not 3π/4.", "ar": "هذه صورة الفخ. arcsin(sin x) ليس x لكل x: يساوي x فقط على [−π/2, π/2]. خارجه يتعرّج المنحنى بين −π/2 وπ/2. مثلًا sin(3π/4) = √2/2 وarcsin(√2/2) = π/4 لا 3π/4.", "fr": "Piège : arcsin(sin x) = x seulement sur [−π/2 ; π/2] ; ailleurs, zigzag. arcsin(sin(3π/4)) = π/4.", "label": ""}]}, {"title": {"en": "Sign reasoning and equations", "ar": "استدلال الإشارة والمعادلات", "fr": "Signe et équations"}, "items": [{"k": "t", "en": "sin(arccos(3/5)): let θ = arccos(3/5), so cos θ = 3/5 and θ ∈ [0, π]. Cosine positive puts θ in the first quadrant, so sin θ > 0. sin²θ = 1 − 9/25 = 16/25, so sin θ = 4/5, not ±4/5. Equation: arctan(2x − 1) = π/4; π/4 is in the range, apply tan: 2x − 1 = 1, so x = 1. Check: arctan(1) = π/4.", "ar": "sin(arccos(3/5)): لتكن θ = arccos(3/5) إذن cos θ = 3/5 وθ ∈ [0, π]. جيب التمام الموجب يضع θ في الربع الأول فـ sin θ > 0. sin²θ = 1 − 9/25 = 16/25 إذن sin θ = 4/5 لا ±4/5. معادلة: arctan(2x − 1) = π/4؛ π/4 داخل المدى فنطبق tan: 2x − 1 = 1 إذن x = 1. التحقق: arctan(1) = π/4.", "fr": "sin θ = 4/5 ; x = 1.", "label": ""}, {"k": "f", "f": "sin²θ = 16/25  ⇒  sin θ = 4/5"}]}, {"title": {"en": "Domain before derivative", "ar": "المجال قبل المشتقة", "fr": "Domaine avant dérivée"}, "items": [{"k": "t", "en": "f(x) = arcsin(2x − 1). The input must satisfy −1 ≤ 2x − 1 ≤ 1, so 0 ≤ x ≤ 1 and Df = [0, 1]. For 0 < x < 1: f′(x) = 2 / √(1 − (2x − 1)²). The radicand: 1 − (4x² − 4x + 1) = 4x(1 − x). Hence f′(x) = 1 / √(x(1 − x)). Domain first, derivative second.", "ar": "f(x) = arcsin(2x − 1). يجب أن يحقق المدخل −1 ≤ 2x − 1 ≤ 1 إذن 0 ≤ x ≤ 1 وDf = [0, 1]. عندما 0 < x < 1: f′(x) = 2 / √(1 − (2x − 1)²). ما تحت الجذر: 1 − (4x² − 4x + 1) = 4x(1 − x). إذن f′(x) = 1 / √(x(1 − x)). المجال أولًا والمشتقة ثانيًا.", "fr": "Df = [0, 1].", "label": ""}, {"k": "f", "f": "f′(x) = 1 / √(x(1 − x)),   0 < x < 1"}]}, {"title": {"en": "A key identity", "ar": "متطابقة أساسية", "fr": "Une identité"}, "items": [{"k": "t", "en": "Let α = arcsin x. Then sin α = x and cos(π/2 − α) = sin α. Since π/2 − α ∈ [0, π], arccos x = π/2 − α. Therefore arcsin x + arccos x = π/2. Test x = 0: 0 + π/2 = π/2.", "ar": "لتكن α = arcsin x. إذن sin α = x وcos(π/2 − α) = sin α. وبما أن π/2 − α ∈ [0, π] فإن arccos x = π/2 − α. إذن arcsin x + arccos x = π/2. نختبر x = 0: 0 + π/2 = π/2.", "fr": "arcsin + arccos = π/2.", "label": ""}, {"k": "f", "f": "arcsin x + arccos x = π/2"}]}, {"title": {"en": "Error detectives", "ar": "المحققون", "fr": "Détectives"}, "items": [{"k": "t", "en": "A) arcsin x is not 1/sin x (that is csc x). B) arccos(cos(7π/6)) is not 7π/6: cos(7π/6) = −√3/2 and the principal answer is 5π/6. C) For sin(arccos x), writing ±√(1 − x²) is unfinished: arccos x ∈ [0, π], so sine is nonnegative and sin(arccos x) = √(1 − x²).", "ar": "أ) arcsin x ليست 1/sin x (تلك csc x). ب) arccos(cos(7π/6)) ليست 7π/6: cos(7π/6) = −√3/2 والجواب الأساسي 5π/6. ج) في sin(arccos x) كتابة ±√(1 − x²) غير مكتملة: arccos x ∈ [0, π] فالجيب غير سالب وsin(arccos x) = √(1 − x²).", "fr": "Trois erreurs types.", "label": ""}]}, {"title": {"en": "Challenge", "ar": "تحدٍّ", "fr": "Défi"}, "items": [{"k": "t", "en": "Prove that for −1 < x < 1, arctan(x/√(1 − x²)) = arcsin x. Let θ = arcsin x: sin θ = x, θ ∈ [−π/2, π/2], and cos θ = √(1 − x²) > 0. Then tan θ = x/√(1 − x²), and θ already lies in the principal range of arctan, so arctan(x/√(1 − x²)) = θ = arcsin x.", "ar": "أثبت أن arctan(x/√(1 − x²)) = arcsin x عندما −1 <
