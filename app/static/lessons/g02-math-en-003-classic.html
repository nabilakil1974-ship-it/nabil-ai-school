roke-width=\"3\"/><circle id=\"Bo3\" cx=\"377.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text id=\"Blab\" x=\"330\" y=\"340\" font-size=\"54\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">0 tens + 4 ones = 4<\/text>", "vb": [660, 440], "show": ["Bo0", "Bo1", "Bo2", "Bo3", "Blab"]}}, {"t": "text", "text": "Hello, champion! Today we do addition, and we start with the meaning. I have 8 objects, and I add 4 more. Did the quantity grow or shrink? It grew. When we join quantities: part + part = total. 8 + 4 = 12. Before writing, we find the first group, the second group, and then the total.", "label": "", "speech": "Hello, champion! Today we do addition, and we start with the meaning. I have 8 objects, and I add 4 more. Did the quantity grow or shrink? It grew. When we join quantities: part + part = total. 8 + 4 = 12. Before writing, we find the first group, the second group, and then the total.", "ar": "مرحبًا يا بطل! اليوم نتعلم الجمع ونبدأ بالمعنى. عندي 8 أشياء وأضفت 4. هل كبرت الكمية أم صغرت؟ كبرت. عندما نضمّ الكميات: جزء + جزء = المجموع. 8 + 4 = 12. وقبل أن نكتب نحدّد المجموعة الأولى ثم الثانية ثم المجموع.", "en": "Hello, champion! Today we do addition, and we start with the meaning. I have 8 objects, and I add 4 more. Did the quantity grow or shrink? It grew. When we join quantities: part + part = total. 8 + 4 = 12. Before writing, we find the first group, the second group, and then the total.", "fr": "Bonjour champion ! Aujourd'hui, l'addition, en commençant par le sens. J'ai 8 objets et j'en ajoute 4. La quantité a-t-elle augmenté ? Oui. Quand on réunit : partie + partie = total. 8 + 4 = 12. Avant d'écrire, on repère le premier groupe, le second, puis le total."}, {"t": "formula", "text": "8 + 4 = 12"}]}, {"id": "P2", "page": "17", "title": "Use a fact you know: make ten", "title_en": "Use a fact you know: make ten", "title_ar": "نستعمل حقيقة معروفة: نكمل العشرة", "title_fr": "Utiliser un fait connu : faire dix", "start_mode": "single", "steps": [{"t": "text", "text": "We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.", "label": "", "speech": "We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.", "ar": "نستطيع العدّ واحدًا واحدًا لكن هناك طرق أذكى. نعرف أن 7 + 3 = 10 فـ 7 + 4 أكبر بواحد: 11. وفي 8 + 5: العدد 8 يحتاج 2 ليصير 10 و5 = 2 + 3 إذن 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.", "en": "We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.", "fr": "On pourrait compter un par un, mais il y a plus malin. On sait 7 + 3 = 10 : 7 + 4 est un de plus : 11. Pour 8 + 5 : 8 a besoin de 2, et 5 = 2 + 3, donc 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13."}, {"t": "draw", "draw": "svgScene", "args": {"svg": "<rect id=\"Tb0\" x=\"186.0\" y=\"120\" width=\"160\" height=\"82\" rx=\"12\" fill=\"#e3f2fd\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_0\" cx=\"214.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_1\" cx=\"240.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_2\" cx=\"266.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_3\" cx=\"292.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_4\" cx=\"318.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_5\" cx=\"214.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_6\" cx=\"240.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_7\" cx=\"266.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_8\" cx=\"292.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_9\" cx=\"318.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To0\" cx=\"385.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To1\" cx=\"419.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To2\" cx=\"453.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text id=\"Tlab\" x=\"330\" y=\"340\" font-size=\"54\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1 ten + 3 ones = 13<\/text>", "vb": [660, 440], "show": ["Tb0", "Tc0_0", "Tc0_1", "Tc0_2", "Tc0_3", "Tc0_4", "Tc0_5", "Tc0_6", "Tc0_7", "Tc0_8", "Tc0_9", "To0", "To1", "To2", "Tlab"]}}, {"t": "formula", "text": "8 + 5 = 8 + 2 + 3 = 10 + 3 = 13"}]}, {"id": "P3", "page": "17", "title": "Find the missing addend", "title_en": "Find the missing addend", "title_ar": "نجد الحدّ الناقص", "title_fr": "Trouver le terme manquant", "start_mode": "single", "steps": [{"t": "formula", "text": "3 + ___ = 6"}, {"t": "text", "text": "3 + what = 6? We ask what part completes the total. 3 + 3 = 6, so the missing number is 3. We check: 3 + 3 = 6. Writing 9 would fail the check, because 3 + 9 = 12.", "label": "", "speech": "3 + what = 6? We ask what part completes the total. 3 + 3 = 6, so the missing number is 3. We check: 3 + 3 = 6. Writing 9 would fail the check, because 3 + 9 = 12.", "ar": "3 + كم = 6؟ نسأل أيّ جزء يكمل المجموع. 3 + 3 = 6 إذن العدد الناقص 3. نتحقق: 3 + 3 = 6. كتابة 9 تفشل في التحقق لأن 3 + 9 = 12.", "en": "3 + what = 6? We ask what part completes the total. 3 + 3 = 6, so the missing number is 3. We check: 3 + 3 = 6. Writing 9 would fail the check, because 3 + 9 = 12.", "fr": "3 + combien = 6 ? On cherche la partie qui complète le total. 3 + 3 = 6, le nombre manquant est 3. Vérification : 3 + 3 = 6. Écrire 9 échoue : 3 + 9 = 12."}]}, {"id": "P4", "page": "17", "title": "Compare the values", "title_en": "Compare the values", "title_ar": "نقارن القيم", "title_fr": "Comparer les valeurs", "start_mode": "single", "steps": [{"t": "formula", "text": "8 + 7 = 15      8 + 2 = 10      15 > 10"}, {"t": "text", "text": "To compare 8 + 7 and 8 + 2 we first calculate each side: 15 and 10. 15 > 10, so 8 + 7 > 8 + 2. We compare the values, not the look of the expressions.", "label": "", "speech": "To compare 8 + 7 and 8 + 2 we first calculate each side: 15 and 10. 15 > 10, so 8 + 7 > 8 + 2. We compare the values, not the look of the expressions.", "ar": "لمقارنة 8 + 7 و8 + 2 نحسب أولًا كل طرف: 15 و10. 15 > 10 إذن 8 + 7 > 8 + 2. نقارن القيم لا شكل العبارات.", "en": "To compare 8 + 7 and 8 + 2 we first calculate each side: 15 and 10. 15 > 10, so 8 + 7 > 8 + 2. We compare the values, not the look of the expressions.", "fr": "Pour comparer 8 + 7 et 8 + 2, on calcule d'abord chaque côté : 15 et 10. 15 > 10 donc 8 + 7 > 8 + 2. On compare les valeurs, pas l'apparence."}]}, {"id": "P5", "page": "17", "title": "A word problem", "title_en": "A word problem", "title_ar": "مسألة كلامية", "title_fr": "Un problème", "start_mode": "single", "steps": [{"t": "draw", "draw": "svgScene", "args": {"svg": "<rect id=\"Tb0\" x=\"152.0\" y=\"120\" width=\"160\" height=\"82\" rx=\"12\" fill=\"#e3f2fd\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_0\" cx=\"180.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_1\" cx=\"206.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_2\" cx=\"232.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_3\" cx=\"258.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_4\" cx=\"284.0\" cy=\"148\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_5\" cx=\"180.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_6\" cx=\"206.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_7\" cx=\"232.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_8\" cx=\"258.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"Tc0_9\" cx=\"284.0\" cy=\"174\" r=\"12\" fill=\"#1e63d6\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To0\" cx=\"351.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To1\" cx=\"385.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To2\" cx=\"419.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To3\" cx=\"453.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"To4\" cx=\"487.0\" cy=\"163\" r=\"12\" fill=\"#e53935\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text id=\"Tlab\" x=\"330\" y=\"340\" font-size=\"54\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">1 ten + 5 ones = 15<\/text>", "vb": [660, 440], "show": ["Tb0", "Tc0_0", "Tc0_1", "Tc0_2", "Tc0_3", "Tc0_4", "Tc0_5", "Tc0_6", "Tc0_7", "Tc0_8", "Tc0_9", "To0", "To1", "To2", "To3", "To4", "Tlab"]}}, {"t": "text", "text": "There are 9 crayons in a box. Sami adds 6 crayons. How many are in the box now? Given: 9. Change: 6 are added, so the quantity increased. 9 + 6: 9 needs 1 to make 10, 6 = 1 + 5, so 9 + 6 = 10 + 5 = 15. There are 15 crayons in the box.", "label": "", "speech": "There are 9 crayons in a box. Sami adds 6 crayons. How many are in the box now? Given: 9. Change: 6 are added, so the quantity increased. 9 + 6: 9 needs 1 to make 10, 6 = 1 + 5, so 9 + 6 = 10 + 5 = 15. There are 15 crayons in the box.", "ar": "في علبة 9 أقلام تلوين. أضاف سامي 6. كم قلمًا في العلبة الآن؟ المعطى: 9. التغيير: أضيف 6 فزادت الكمية. 9 + 6: العدد 9 يحتاج 1 ليصير 10 و6 = 1 + 5 إذن 9 + 6 = 10 + 5 = 15. في العلبة 15 قلمًا.", "en": "There are 9 crayons in a box. Sami adds 6 crayons. How many are in the box now? Given: 9. Change: 6 are added, so the quantity increased. 9 + 6: 9 needs 1 to make 10, 6 = 1 + 5, so 9 + 6 = 10 + 5 = 15. There are 15 crayons in the box.", "fr": "Il y a 9 crayons dans une boîte. Sami en ajoute 6. Combien y en a-t-il maintenant ? Donné : 9. Changement : on ajoute 6, la quantité augmente. 9 + 6 : 9 a besoin de 1, 6 = 1 + 5, donc 9 + 6 = 10 + 5 = 15. Il y a 15 crayons."}, {"t": "formula", "text": "9 + 6 = 15"}]}, {"id": "P6", "page": "17", "title": "Counting by 2", "title_en": "Counting by 2", "title_ar": "العدّ بالاثنين", "title_fr": "Compter de 2 en 2", "start_mode": "single", "steps": [{"t": "draw", "draw": "svgScene", "args": {"svg": "<g id=\"N0\"><rect x=\"24.0\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"58.75\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">4<\/text><\/g><g id=\"N1\"><rect x=\"101.5\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"136.25\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">6<\/text><\/g><g id=\"N2\"><rect x=\"179.0\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"213.75\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">8<\/text><\/g><g id=\"N3\"><rect x=\"256.5\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"291.25\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">10<\/text><\/g><g id=\"N4\"><rect x=\"334.0\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"368.75\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">12<\/text><\/g><g id=\"N5\"><rect x=\"411.5\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"446.25\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">14<\/text><\/g><g id=\"N6\"><rect x=\"489.0\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"523.75\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">16<\/text><\/g><g id=\"N7\"><rect x=\"566.5\" y=\"156\" width=\"69.5\" height=\"88\" rx=\"10\" fill=\"#ffffff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text x=\"601.25\" y=\"222\" font-size=\"30\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#0b3d5c\" font-family=\"sans-serif\">18<\/text><\/g>", "vb": [660, 440], "show": ["N0", "N1", "N2", "N3", "N4", "N5", "N6", "N7"]}}, {"t": "text", "text": "A butterfly flies from flower 4 to flower 18, counting by 2. Counting by 2 is adding 2 again and again: 4 + 2 = 6, 6 + 2 = 8, and so on up to 18.", "label": "", "speech": "A butterfly flies from flower 4 to flower 18, counting by 2. Counting by 2 is adding 2 again and again: 4 + 2 = 6, 6 + 2 = 8, and so on up to 18.", "ar": "تطير فراشة من الزهرة 4 إلى الزهرة 18 وهي تعدّ بالاثنين. العدّ بالاثنين هو إضافة 2 مرة بعد مرة: 4 + 2 = 6 و6 + 2 = 8 وهكذا حتى 18.", "en": "A butterfly flies from flower 4 to flower 18, counting by 2. Counting by 2 is adding 2 again and again: 4 + 2 = 6, 6 + 2 = 8, and so on up to 18.", "fr": "Un papillon vole de la fleur 4 à la fleur 18 en comptant de 2 en 2. C'est ajouter 2 encore et encore : 4 + 2 = 6, 6 + 2 = 8, … jusqu'à 18."}]}, {"id": "P7", "page": "", "title": "Summary", "title_en": "Summary", "title_ar": "الخلاصة", "title_fr": "Résumé", "start_mode": "single", "steps": [{"t": "text", "text": "Addition is part + part = total. We can make ten to calculate easily, find missing addends, compare sums after calculating them, and turn a word problem into a quantity relation.", "label": "", "speech": "Addition is part + part = total. We can make ten to calculate easily, find missing addends, compare sums after calculating them, and turn a word problem into a quantity relation.", "ar": "الجمع هو جزء + جزء = المجموع. نستطيع إكمال العشرة لنحسب بسهولة، ونجد الحدّ الناقص، ونقارن المجاميع بعد حسابها، ونحوّل المسألة الكلامية إلى علاقة بين كميات.", "en": "Addition is part + part = total. We can make ten to calculate easily, find missing addends, compare sums after calculating them, and turn a word problem into a quantity relation.", "fr": "Additionner, c'est partie + partie = total. On peut faire dix pour calculer facilement, trouver un terme manquant, comparer des sommes après les avoir calculées, et traduire un problème."}, {"t": "formula", "text": "SEE THE PARTS → JOIN → CALCULATE → CHECK THE TOTAL → EXPLAIN WHY"}]}, {"id": "EX-1", "page": "16", "exercise": "1", "solved": true, "title": "Exercise 1", "title_en": "Exercise 1", "title_ar": "التمرين 1", "title_fr": "Exercice 1", "start_mode": "single", "steps": [{"t": "text", "text": "Write the addition for each picture: 3 and 2 apples; 5 and 5 paper clips; 7 and 3 shapes; 12 beads and 4; 10 blocks and 6; a ten-rod and 8.", "label": "Problem", "speech": "Write the addition for each picture: 3 and 2 apples; 5 and 5 paper clips; 7 and 3 shapes; 12 beads and 4; 10 blocks and 6; a ten-rod and 8.", "ar": "اكتب عملية الجمع لكل صورة: 3 و2 تفاحات؛ 5 و5 مشابك؛ 7 و3 أشكال؛ 12 خرزة و4؛ 10 قوالب و6؛ عشرة و8.", "en": "Write the addition for each picture: 3 and 2 apples; 5 and 5 paper clips; 7 and 3 shapes; 12 beads and 4; 10 blocks and 6; a ten-rod and 8.", "fr": "Écris l'addition de chaque image : 3 et 2 pommes ; 5 et 5 trombones ; 7 et 3 formes ; 12 perles et 4 ; 10 blocs et 6 ; une barre de dix et 8."}, {"t": "formula", "text": "3 + 2 = 5      5 + 5 = 10      7 + 3 = 10"}, {"t": "formula", "text": "12 + 4 = 16      10 + 6 = 16      10 + 8 = 18"}]}, {"id": "EX-2", "page": "16", "exercise": "2", "solved": true, "title": "Exercise 2", "title_en": "Exercise 2", "title_ar": "التمرين 2", "title_fr": "Exercice 2", "start_mode": "single", "steps": [{"t": "text", "text": "Calculate: 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.", "label": "Problem", "speech": "Calculate: 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.", "ar": "احسب: 7 + 3 و7 + 4 و7 + 8 و7 + 9 و7 + 2؛ 8 + 5 و8 + 4 و8 + 6 و8 + 3 و8 + 9؛ 9 + 6 و9 + 9 و9 + 5 و9 + 4 و9 + 7.", "en": "Calculate: 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.", "fr": "Calcule : 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2 ; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9 ; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7."}, {"t": "formula", "text": "10   11   15   16   9"}, {"t": "formula", "text": "13   12   14   11   17"}, {"t": "formula", "text": "15   18   14   13   16"}, {"t": "text", "text": "For example 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 and 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.", "label": "", "speech": "For example 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 and 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.", "ar": "مثلًا 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 و9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.", "en": "For example 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 and 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.", "fr": "Par exemple 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 et 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15."}]}, {"id": "EX-3", "page": "17", "exercise": "3", "solved": true, "title": "Exerc "نستعمل حقيقة معروفة: نكمل العشرة", "We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.": "نستطيع العدّ واحدًا واحدًا لكن هناك طرق أذكى. نعرف أن 7 + 3 = 10 فـ 7 + 4 أكبر بواحد: 11. وفي 8 + 5: العدد 8 يحتاج 2 ليصير 10 و5 = 2 + 3 إذن 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.", "Find the missing addend": "نجد الحدّ الناقص", "3 + what = 6? We ask what part completes the total. 3 + 3 = 6, so the missing number is 3. We check: 3 + 3 = 6. Writing 9 would fail the check, because 3 + 9 = 12.": "3 + كم = 6؟ نسأل أيّ جزء يكمل المجموع. 3 + 3 = 6 إذن العدد الناقص 3. نتحقق: 3 + 3 = 6. كتابة 9 تفشل في التحقق لأن 3 + 9 = 12.", "Compare the values": "نقارن القيم", "To compare 8 + 7 and 8 + 2 we first calculate each side: 15 and 10. 15 > 10, so 8 + 7 > 8 + 2. We compare the values, not the look of the expressions.": "لمقارنة 8 + 7 و8 + 2 نحسب أولًا كل طرف: 15 و10. 15 > 10 إذن 8 + 7 > 8 + 2. نقارن القيم لا شكل العبارات.", "A word problem": "مسألة كلامية", "There are 9 crayons in a box. Sami adds 6 crayons. How many are in the box now? Given: 9. Change: 6 are added, so the quantity increased. 9 + 6: 9 needs 1 to make 10, 6 = 1 + 5, so 9 + 6 = 10 + 5 = 15. There are 15 crayons in the box.": "في علبة 9 أقلام تلوين. أضاف سامي 6. كم قلمًا في العلبة الآن؟ المعطى: 9. التغيير: أضيف 6 فزادت الكمية. 9 + 6: العدد 9 يحتاج 1 ليصير 10 و6 = 1 + 5 إذن 9 + 6 = 10 + 5 = 15. في العلبة 15 قلمًا.", "Counting by 2": "العدّ بالاثنين", "A butterfly flies from flower 4 to flower 18, counting by 2. Counting by 2 is adding 2 again and again: 4 + 2 = 6, 6 + 2 = 8, and so on up to 18.": "تطير فراشة من الزهرة 4 إلى الزهرة 18 وهي تعدّ بالاثنين. العدّ بالاثنين هو إضافة 2 مرة بعد مرة: 4 + 2 = 6 و6 + 2 = 8 وهكذا حتى 18.", "Summary": "الخلاصة", "Addition is part + part = total. We can make ten to calculate easily, find missing addends, compare sums after calculating them, and turn a word problem into a quantity relation.": "الجمع هو جزء + جزء = المجموع. نستطيع إكمال العشرة لنحسب بسهولة، ونجد الحدّ الناقص، ونقارن المجاميع بعد حسابها، ونحوّل المسألة الكلامية إلى علاقة بين كميات.", "Exercise 1": "التمرين 1", "Write the addition for each picture: 3 and 2 apples; 5 and 5 paper clips; 7 and 3 shapes; 12 beads and 4; 10 blocks and 6; a ten-rod and 8.": "اكتب عملية الجمع لكل صورة: 3 و2 تفاحات؛ 5 و5 مشابك؛ 7 و3 أشكال؛ 12 خرزة و4؛ 10 قوالب و6؛ عشرة و8.", "Exercise 2": "التمرين 2", "Calculate: 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.": "احسب: 7 + 3 و7 + 4 و7 + 8 و7 + 9 و7 + 2؛ 8 + 5 و8 + 4 و8 + 6 و8 + 3 و8 + 9؛ 9 + 6 و9 + 9 و9 + 5 و9 + 4 و9 + 7.", "For example 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 and 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.": "مثلًا 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 و9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.", "Exercise 3": "التمرين 3", "Add 5, add 4, add 6: 4, 3, 7 → +5; 8, 6, 5 → +4; 9, 6, 7 → +6.": "أضف 5 وأضف 4 وأضف 6: 4 و3 و7 → +5؛ 8 و6 و5 → +4؛ 9 و6 و7 → +6.", "Exercise 4": "التمرين 4", "Find the missing number: totals 6, 10 and 9.": "أوجد العدد الناقص: المجاميع 6 و10 و9.", "Exercise 5": "التمرين 5", "Complete with < or >: 8 + 7 _ 8 + 2; 6 + 5 _ 19; 7 + 6 _ 11; 6 + 3 _ 6 + 5; 5 _ 2 + 1; 8 _ 3 + 9.": "أكمل بـ < أو >: 8 + 7 _ 8 + 2؛ 6 + 5 _ 19؛ 7 + 6 _ 11؛ 6 + 3 _ 6 + 5؛ 5 _ 2 + 1؛ 8 _ 3 + 9.", "We calculate each side first: 15 > 10, 11 < 19, 13 > 11, 9 < 11, 5 > 3, 8 < 12.": "نحسب كل طرف أولًا: 15 > 10 و11 < 19 و13 > 11 و9 < 11 و5 > 3 و8 < 12.", "Exercise 6": "التمرين 6", "There are 9 crayons in a box. Sami adds 6. How many now?": "في علبة 9 أقلام تلوين. أضاف سامي 6. كم قلمًا الآن؟", "There are 15 crayons in the box.": "في العلبة 15 قلمًا.", "Exercise 7": "التمرين 7", "The butterfly flies from flower 4 to flower 18 counting by 2.": "تطير الفراشة من الزهرة 4 إلى الزهرة 18 بالعدّ بالاثنين.", "Exercise 8": "التمرين 8", "Challenge: I have 8 stickers and my friend gives me 7 more. How many?": "تحدٍّ: عندي 8 ملصقات وأعطاني صديقي 7 أخرى. كم صار عندي؟", "Exercise 9": "التمرين 9", "Error detective: 7 + 3 = 73. And 3 + __ = 6, a child writes 9. What went wrong?": "المحقق: 7 + 3 = 73. وفي 3 + __ = 6 كتب طفل 9. ما الخطأ؟", "Writing numbers side by side is not addition: 7 + 3 = 10. And 3 + 9 = 12, not 6, so the missing part is 3.": "كتابة الأعداد جنبًا إلى جنب ليست جمعًا: 7 + 3 = 10. و3 + 9 = 12 لا 6 إذن الناقص هو 3.", "Exercise 10": "التمرين 10", "Final check: 6 + 4; 8 + 6; 9 + 8; __ + 5 = 9; 7 + __ = 10; 7 + 8 _ 7 + 2; 6 birds and 5 more; continue 6, 8, 10, __, __.": "تقييم أخير: 6 + 4؛ 8 + 6؛ 9 + 8؛ __ + 5 = 9؛ 7 + __ = 10؛ 7 + 8 _ 7 + 2؛ 6 عصافير وتأتي 5؛ تابع 6، 8، 10، __، __."}, "en": {"Addition joins two quantities": "Addition joins two quantities", "Hello, champion! Today we do addition, and we start with the meaning. I have 8 objects, and I add 4 more. Did the quantity grow or shrink? It grew. When we join quantities: part + part = total. 8 + 4 = 12. Before writing, we find the first group, the second group, and then the total.": "Hello, champion! Today we do addition, and we start with the meaning. I have 8 objects, and I add 4 more. Did the quantity grow or shrink? It grew. When we join quantities: part + part = total. 8 + 4 = 12. Before writing, we find the first group, the second group, and then the total.", "Use a fact you know: make ten": "Use a fact you know: make ten", "We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.": "We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.", "Find the missing addend": "Find the missing addend", "3 + what = 6? We ask what part completes the total. 3 + 3 = 6, so the missing number is 3. We check: 3 + 3 = 6. Writing 9 would fail the check, because 3 + 9 = 12.": "3 + what ; 12 beads and 4; 10 blocks and 6; a ten-rod and 8.", "Exercise 2": "Exercise 2", "Calculate: 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.": "Calculate: 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.", "For example 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 and 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.": "For example 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 and 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.", "Exercise 3": "Exercise 3", "Add 5, add 4, add 6: 4, 3, 7 → +5; 8, 6, 5 → +4; 9, 6, 7 → +6.": "Add 5, add 4, add 6: 4, 3, 7 → +5; 8, 6, 5 → +4; 9, 6, 7 → +6.", "Exercise 4": "Exercise 4", "Find the missing number: totals 6, 10 and 9.": "Find the missing number: totals 6, 10 and 9.", "Exercise 5": "Exercise 5", "Complete with < or >: 8 + 7 _ 8 + 2; 6 + 5 _ 19; 7 + 6 _ 11; 6 + 3 _ 6 + 5; 5 _ 2 + 1; 8 _ 3 + 9.": "Complete with < or >: 8 + 7 _ 8 + 2; 6 + 5 _ 19; 7 + 6 _ 11; 6 + 3 _ 6 + 5; 5 _ 2 + 1; 8 _ 3 + 9.", "We calculate each side first: 15 > 10, 11 < 19, 13 > 11, 9 < 11, 5 > 3, 8 < 12.": "We calculate each side first: 15 > 10, 11 < 19, 13 > 11, 9 < 11, 5 > 3, 8 < 12.", "Exercise 6": "Exercise 6", "There are 9 crayons in a box. Sami adds 6. How many now?": "There are 9 crayons in a box. Sami adds 6. How many now?", "There are 15 crayons in the box.": "There are 15 crayons in the box.", "Exercise 7": "Exercise 7", "The butterfly flies from flower 4 to flower 18 counting by 2.": "The butterfly flies from flower 4 to flower 18 counting by 2.", "Exercise 8": "Exercise 8", "Challenge: I have 8 stickers and my friend gives me 7 more. How many?": "Challenge: I have 8 stickers and my friend gives me 7 more. How many?", "Exercise 9": "Exercise 9", "Error detective: 7 + 3 = 73. And 3 + __ = 6, a child writes 9. What went wrong?": "Error detective: 7 + 3 = 73. And 3 + __ = 6, a child writes 9. What went wrong?", "Writing numbers side by side is not addition: 7 + 3 = 10. And 3 + 9 = 12, not 6, so the missing part is 3.": "Writing numbers side by side is not addition: 7 + 3 = 10. And 3 + 9 = 12, not 6, so the missing part is 3.", "Exercise 10": "Exercise 10", "Final check: 6 + 4; 8 + 6; 9 + 8; __ + 5 = 9; 7 + __ = 10; 7 + 8 _ 7 + 2; 6 birds and 5 more; continue 6, 8, 10, __, __.": "Final check: 6 + 4; 8 + 6; 9 + 8; __ + 5 = 9; 7 + __ = 10; 7 + 8 _ 7 + 2; 6 birds and 5 more; continue 6, 8, 10, __, __."}, "fr": {"Addition joins two quantities": "L'addition réunit deux quantités", "Hello, champion! Today we do addition, and we start with the meaning. I have 8 objects, and I add 4 more. Did the quantity grow or shrink? It grew. When we join quantities: part + part = total. 8 + 4 = 12. Before writing, we find the first group, the second group, and then the total.": "Bonjour champion ! Aujourd'hui, l'addition, en commençant par le sens. J'ai 8 objets et j'en ajoute 4. La quantité a-t-elle augmenté ? Oui. Quand on réunit : partie + partie = total. 8 + 4 = 12. Avant d'écrire, on repère le premier groupe, le second, puis le total.", "Use a fact you know: make ten": "Utiliser un fait connu : faire dix", "We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.": "On pourrait compter un par un, mais il y a plus malin. On sait 7 + 3 = 10 : 7 + 4 est un de plus : 11. Pour 8 + 5 : 8 a besoin de 2, et 5 = 2 + 3, donc 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.", "Find the missing addend": "Trouver le terme manquant", "3 + what = 6? We ask what part completes the total. 3 + 3 = 6, so the missing number is 3. We check: 3 + 3 = 6. Writing 9 would fail the check, because 3 + 9 = 12.": "3 + combien = 6 ? On cherche la partie qui complète le total. 3 + 3 = 6, le nombre manquant est 3. Vérification : 3 + 3 = 6. Écrire 9 échoue : 3 + 9 = 12.", "Compare the values": "Comparer les valeurs", "To compare 8 + 7 and 8 + 2 we first calculate each side: 15 and 10. 15 > 10, so 8 + 7 > 8 + 2. We compare the values, not the look of the expressions.": "Pour comparer 8 + 7 et 8 + 2, on calcule d'abord chaque côté : 15 et 10. 15 > 10 donc 8 + 7 > 8 + 2. On compare les valeurs, pas l'apparence.", "A word problem": "Un problème", "There are 9 crayons in a box. Sami adds 6 crayons. How many are in the box now? Given: 9. Change: 6 are added, so the quantity increased. 9 + 6: 9 needs 1 to make 10, 6 = 1 + 5, so 9 + 6 = 10 + 5 = 15. There are 15 crayons in the box.": "Il y a 9 crayons dans une boîte. Sami en ajoute 6. Combien y en a-t-il maintenant ? Donné : 9. Changement : on ajoute 6, la quantité augmente. 9 + 6 : 9 a besoin de 1, 6 = 1 + 5, donc 9 + 6 = 10 + 5 = 15. Il y a 15 crayons.", "Counting by 2": "Compter de 2 en 2", "A butterfly flies from flower 4 to flower 18, counting by 2. Counting by 2 is adding 2 again and again: 4 + 2 = 6, 6 + 2 = 8, and so on up to 18.": "Un papillon vole de la fleur 4 à la fleur 18 en comptant de 2 en 2. C'est ajouter 2 encore et encore : 4 + 2 = 6, 6 + 2 = 8, … jusqu'à 18.", "Summary": "Résumé", "Addition is part + part = total. We can make ten to calculate easily, find missing addends, compare sums after calculating them, and turn a word problem into a quantity relation.": "Additionner, c'est partie + partie = total. On peut faire dix pour calculer facilement, trouver un terme manquant, comparer des sommes après les avoir calculées, et traduire un problème.", "Exercise 1": "Exercice 1", "Write the addition for each picture: 3 and 2 apples; 5 and 5 paper clips; 7 and 3 shapes; 12 beads and 4; 10 blocks and 6; a ten-rod and 8.": "Écris l'addition de chaque image : 3 et 2 pommes ; 5 et 5 trombones ; 7 et 3 formes ; 12 perles et 4 ; 10 blocs et 6 ; une barre de dix et 8.", "Exercise 2": "Exercice 2", "Calculate: 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.": "Calcule : 7 + 3, 7 + 4, 7 + 8, 7 + 9, 7 + 2 ; 8 + 5, 8 + 4, 8 + 6, 8 + 3, 8 + 9 ; 9 + 6, 9 + 9, 9 + 5, 9 + 4, 9 + 7.", "For example 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 and 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.": "Par exemple 7 + 8 = 7 + 3 + 5 = 10 + 5 = 15 et 9 + 6 = 9 + 1 + 5 = 10 + 5 = 15.", "Exercise 3": "Exercice 3", "Add 5, add 4, add 6: 4, 3, 7 → +5; 8, 6, 5 → +4; 9, 6, 7 → +6.": "Ajoute 5, ajoute 4, ajoute 6 : 4, 3, 7 → +5 ; 8, 6, 5 → +4 ; 9, 6, 7 → +6.", "Exercise 4": "Exercice 4", "Find the missing number: totals 6, 10 and 9.": "Trouve le nombre manquant : totaux 6, 10 et 9.", "Exercise 5": "Exercice 5", "Complete with < or >: 8 + 7 _ 8 + 2; 6 + 5 _ 19; 7 + 6 _ 11; 6 + 3 _ 6 + 5; 5 _ 2 + 1; 8 _ 3 + 9.": "Complète avec < ou > : 8 + 7 _ 8 + 2 ; 6 + 5 _ 19 ; 7 + 6 _ 11 ; 6 + 3 _ 6 + 5 ; 5 _ 2 + 1 ; 8 _ 3 + 9.", "We calculate each side first: 15 > 10, 11 < 19, 13 > 11, 9 < 11, 5 > 3, 8 < 12.": "On calcule chaque côté : 15 > 10, 11 < 19, 13 > 11, 9 < 11, 5 > 3, 8 < 12.", "Exercise 6": "Exercice 6", "There are 9 crayons in a box. Sami adds 6. How many now?": "Il y a 9 crayons dans une boîte. Sami en ajoute 6. Combien maintenant ?", "There are 15 crayons in the box.": "Il y a 15 crayons dans la boîte.", "Exercise 7": "Exercice 7", "The butterfly flies from flower 4 to flower 18 counting by 2.": "Le papillon vole de la fleur 4 à la fleur 18 en comptant de 2 en 2.", "Exercise 8": "Exercice 8", "Challenge: I have 8 stickers and my friend gives me 7 more. How many?": "Défi : j'ai 8 autocollants et mon ami m'en donne 7. Combien en ai-je ?", "Exercise 9": "Exercice 9", "Error detective: 7 + 3 = 73. And 3 + __ = 6, a child writes 9. What went wrong?": "Détective : 7 + 3 = 73. Et dans 3 + __ = 6, un enfant écrit 9. Où est l'erreur ?", "Writing numbers side by side is not addition: 7 + 3 = 10. And 3 + 9 = 12, not 6, so the missing part is 3.": "Écrire des nombres côte à côte n'est pas additionner : 7 + 3 = 10. Et 3 + 9 = 12, pas 6 : le terme manquant est 3.", "Exercise 10": "Exercice 10", "Final check: 6 + 4; 8 + 6; 9 + 8; __ + 5 = 9; 7 + __ = 10; 7 + 8 _ 7 + 2; 6 birds and 5 more; continue 6, 8, 10, __, __.": "Évaluation : 6 + 4 ; 8 + 6 ; 9 + 8 ; __ + 5 = 9 ; 7 + __ = 10 ; 7 + 8 _ 7 + 2 ; 6 oiseaux et 5 de plus ; continue 6, 8, 10, __, __."}}, "lesson_id": "G02-MATH-EN-003", "title": "Addition (1)", "mode": "lesson", "subject": "mathematics", "grade": "2", "source_lang": "en", "ideas": [{"title": "Addition joins two quantities", "page": "16", "steps": ["Hello, champion! Today we do addition, and we start with the meaning. I have 8 objects, and I add 4 more. Did the quantity grow or shrink? It grew. When we join quantities: part + part = total. 8 + 4 = 12. Before writing, we find the first group, the second group, and then the total."], "formulas": ["8 + 4 = 12"], "has_drawing": true}, {"title": "Use a fact you know: make ten", "page": "17", "steps": ["We could count one by one, but there are smarter ways. We know 7 + 3 = 10, so 7 + 4 is one more: 11. For 8 + 5: 8 needs 2 to make 10, and 5 = 2 + 3, so 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13."], "formulas": ["8 + 5 = 8 + 2 + 3 = 10 + 3 = 13"], "has_drawing": true}, {"title": "Find the missing addend", "page": "17", "steps": ["3 + what = 6? We ask what part completes the total. 3 + 3 = 6, so the missing number is 3. We check: 3 + 3 = 6. Writing 9 would fail the check, because 3 + 9 = 12."], "formulas": ["3 + ___ = 6"], "has_drawing": false}, {"title": "Compare the values", "page": "17", "steps": ["To compare 8 + 7 and 8 + 2 we first calculate each side: 15 and 10. 15 > 10, so 8 + 7 > 8 + 2. We compare the values, not the look of the expressions."], "formulas": ["8 + 7 = 15      8 + 2 = 10      15 > 10"], "has_drawing": false}, {"title": "A word problem", "page": "17", "steps": ["There are 9 crayons in a box. Sami adds 6 crayons. How many are in the box now? Given: 9. Change: 6 are added, so the quantity increased. 9 + 6: 9 needs 1 to make 10, 6 = 1 + 5, so 9 + 6 = 10 + 5 = 15. There are 15 crayons in the box."], "formulas": ["9 + 6 = 15"], "has_drawing": true}, {"title": "Counting by 2", "page": " /* ---------- math: canonical base^{exp} -> real superscripts, LTR isolation ---------- */
function supNodes(txt,into){
  const re=/([^\s^{}]*)\^\{([^{}]*)\}/g;let last=0,m;
  while((m=re.exec(txt))){
    if(m.index>last)into.appendChild(document.createTextNode(txt.slice(last,m.index)));

    const s=document.createElement('sup');s.className='nb-sup';s.textContent=m[2];into.appendChild(s);last=re.lastIndex}
  if(last<txt.length)into.appendChild(document.createTextNode(txt.slice(last)));
}

const PL=()=>window.NABILPageLanguage;
function trTo(s,lang){s=String(s||'');
  {const m=PLAN&&PLAN.tw&&PLAN.tw[lang];if(m&&m[s])return m[s]}
  if(lang===(DATA.lang||'en'))return s;
  try{const t=PL()&&PL().translateText?PL().translateText(s,lang):s;return t||s}catch(e){return s}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* canonical base^{exp} -> <sup> */
const mathHtml=s=>esc(s).replace(/([^\s^{}]*)\^\{([^{}]*)\}/g,(m,b,e)=>b+'<sup>'+e+'</sup>');
const blank=(l)=>'<span class="nb-blank">'+esc(L[l].blank)+'</span>';

function splitMinutes(total){
  const fr=[5,10,15,10,5],sum=45;let m=fr.map(f=>Math.max(1,Math.round(f*total/sum)));
  const diff=total-m.reduce((a,b)=>a+b,0);m[2]+=diff;return m}
function chunk(arr,n){const out=Array.from({length:n},()=>[]);arr.forEach((x,i)=>out[Math.min(n-1,Math.floor(i*n/arr.length))].push(x));return out}

function buildHtml(lang,minutes,sessions){
  const T=L[lang],P=PLAN,tr=s=>trTo(s,lang),H=S13[lang],X=X13[lang];
  const ideas=P.ideas.map(i=>({...i,title:tr(i.title),steps:i.steps.map(tr)}));
  const exs=P.exercises||[];
  const pages=P.pages&&P.pages.length?P.pages.join(', '):'';
  const sec=(n,body)=>'<h2>'+n+'. '+esc(H[n-1])+'</h2>'+body;
  let h='<h1>'+esc(T.plan)+' — '+mathHtml(tr(P.title))+'</h1>';
  h+='<table><tr><th>'+esc(T.subject)+'</th><td>'+(esc(P.subject)||blank(lang))+'</td><th>'+esc(T.klass)+'</th><td>'+(P.grade?esc(P.grade)+' — ':'')+blank(lang)+'</td></tr>'
   +'<tr><th>'+esc(T.date)+'</th><td>'+blank(lang)+'</td><th>'+esc(T.lesson)+'</th><td>'+mathHtml(tr(P.title))+'</td></tr>'
   +'<tr><th>'+esc(X.dur)+'</th><td colspan="3">'+sessions+' × '+minutes+' '+esc(T.min)+(pages?' — '+esc(T.pages)+': '+esc(pages):'')+'</td></tr></table>';
  h+=sec(1,'<p>'+blank(lang)+' <small>'+esc(T.priorHint)+'</small></p>');
  h+=sec(2,'<p>'+blank(lang)+' <small>'+esc(T.compHint)+'</small></p><p>'+esc(X.cog)+'</p>');
  h+=sec(3,'<ul>'+ideas.map(i=>'<li>'+esc(T.objItem)+mathHtml(i.title)+'</li>').join('')+'</ul>');
  h+=sec(4,'<ul>'+ideas.map(i=>'<li>'+mathHtml(i.title)+'</li>').join('')+'</ul>'+((P.key_results||[]).length?'<ul>'+P.key_results.map(x=>'<li>'+mathHtml(tr(x))+'</li>').join('')+'</ul>':''));
  h+=sec(5,'<ul>'+T.meansItems.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
  h+=sec(6,'<p>'+esc(T.tIntro)+'</p><p>'+esc(T.eIntro)+'</p>');
  h+=sec(7,'<ul>'+ideas.map(i=>'<li>'+mathHtml(i.title)+(i.has_drawing?' ✎':'')+'</li>').join('')+'</ul><p><small>'+esc(X.phases)+'</small></p>');
  let b='';
  const m=splitMinutes(minutes),parts=chunk(ideas,sessions),exParts=chunk(exs,sessions);
  b+='<h3>'+esc(T.flow)+'</h3>';
  for(let s=0;s<sessions;s++){
    const idea=parts[s]||[],ex=exParts[s]||[];
    const titles=idea.map(i=>mathHtml(tr(i.title))).join('; ')||blank(lang);
    const stepsTxt=idea.map(i=>mathHtml(tr(i.title))+(i.formulas&&i.formulas.length?' ('+i.formulas.slice(0,2).map(f=>mathHtml(tr(f))).join('، ')+')':'')).join('; ')||blank(lang);
    const exTxt=ex.length?ex.map(e=>esc(e.n)+(e.page?' ('+esc(T.pages)+' '+esc(e.page)+')':'')).join('، '):esc(T.noEx);
    const chk=(P.checks||[]).slice(0,2).map(mathHtml).join(' / ');
    if(sessions>1)b+='<h3>'+esc(T.session)+' '+(s+1)+'</h3>';
    const rows=[
     [T.tIntro,T.lIntro,esc(T.meansItems[1]),T.eIntro],
     [T.tExp+(idea[0]?tr(idea[0].title):''),T.lExp,esc(T.meansItems[1]),T.eExp],
     [T.tBuild+stepsTxt,T.lBuild,esc(T.meansItems[1]),T.eBuild+(chk?' — '+chk:'')],
     [T.tApply+exTxt,T.lApply,esc(T.meansItems[0]),T.eApply],
     [T.tEnd,T.lEnd,esc(T.meansItems[0]),T.eEnd]];
    b+='<table><tr>'+T.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
    rows.forEach((r,i)=>{
      const cell=(x,raw)=>'<td>'+(i===1||i===2||i===3?x:esc(x))+'</td>';
      b+='<tr><td>'+m[i]+' '+esc(T.min)+'</td><td>'+esc(T.phases[i])+'</td>'
        +'<td>'+(i===1?esc(T.tExp)+(idea[0]?mathHtml(idea[0].title):''):i===2?esc(T.tBuild)+stepsTxt:i===3?esc(T.tApply)+exTxt:esc(r[0]))+'</td>'
        +'<td>'+esc(r[1])+'</td><td>'+r[2]+'</td><td>'+(i===2?esc(T.eBuild)+(chk?' — '+chk:''):esc(r[3]))+'</td></tr>'});
    b+='</table>'}

  b+=ideas.map(i=>'<p><b>'+mathHtml(i.title)+'</b></p><ul>'+i.steps.map(x=>'<li>'+mathHtml(x)+'</li>').join('')
     +(i.formulas&&i.formulas.length?'<li>'+i.formulas.map(f=>mathHtml(tr(f))).join(' ; ')+'</li>':'')+'</ul>').join('');
  h+=sec(8,b);
  h+=sec(9,exs.length?'<ul>'+exs.map(e=>'<li>'+esc(e.n)+(e.page?' — '+esc(T.pages)+' '+esc(e.page):'')+(e.statement?': '+mathHtml(tr(e.statement)):'')+'</li>').join('')+'</ul>':'<p>'+esc(T.noEx)+'</p>');
  h+=sec(10,'<p>'+esc(X.types)+'</p><ul><li><b>'+esc(T.diag)+':</b> '+esc(T.eIntro)+'</li><li><b>'+esc(T.form)+':</b> '+((P.checks||[]).length?(P.checks||[]).map(c=>mathHtml(tr(c))).join(' / '):esc(T.eBuild))+'</li><li><b>'+esc(T.summ)+':</b> '+esc(T.eEnd)+'</li></ul>');
  h+=sec(11,'<p>'+esc(T.remedHint)+'</p>');
  h+=sec(12,'<p>'+esc(T.hwHint)+blank(lang)+'</p>');
  h+=sec(13,'<p>'+blank(lang)+'</p><p>'+blank(lang)+'</p>');
  h+='<p><small>'+esc(X.note)+'</small></p>';
  return h}

  const b1=el('button',{type:'button',class:'nb-solve-go',text:x.camera}),b2=el('button',{type:'button',class:'nb-solve-go',text:x.file});
  b1.onclick=()=>cam.click();b2.onclick=()=>fil.click();
  const prev=el('div',{class:'nb-solve-prev'});
  const pick=async f=>{if(!f)return;prev.replaceChildren();
    if(f.type.startsWith('image/')){const im=el('img',{alt:'',class:'nb-solve-thumb'});im.src=URL.createObjectURL(f);prev.append(im)}else prev.append(el('div',{text:'📄 '+f.name}));
    status(body,x.reading,'');const fd=new FormData();fd.append('file',f,f.name);fd.append('lang',L());
    try{const r=await fetch('/api/solver/read',{method:'POST',body:fd});const d=await r.json();
      if(!r.ok||d.status==='error'){status(body,d.message||('HTTP '+r.status),'err');return}
      if(d.status==='unreadable'){status(body,(d.unclear||[]).join(' · ')||x.edit,'err');return}
      confirmPane(body,{statement:d.statement+(d.has_figure&&d.figure_description?'\n['+x.figure+' '+d.figure_description+']':''),source:d.source,unclear:d.unclear||[]})}catch(e){status(body,String(e),'err')}};
  cam.onchange=()=>pick(cam.files[0]);fil.onchange=()=>pick(fil.files[0]);
  body.append(b1,b2,cam,fil,prev);status(body,'','')}

function confirmPane(body,p){
  const x=t();pending=p;body.replaceChildren();
  body.append(el('h4',{text:x.confirmT+' ('+((x.src||{})[p.source]||p.source)+')'}));
  if(p.image)body.append(el('a',{href:p.image,target:'_blank',rel:'noopener',text:'🖼'}));
  const ta=el('textarea',{id:'nbSolveConfirmText',rows:'6',dir:'auto'});ta.value=p.statement||'';
  const prevEl=el('div',{class:'nb-solve-render',id:'nbSolveRender',dir:'auto'});const draw=()=>{prevEl.textContent=pretty(ta.value)};draw();ta.oninput=draw;
  body.append(ta,prevEl);

  if((p.unclear||[]).length){
    body.append(el('div',{class:'nb-solve-unclear'},[el('b',{text:x.unclear}),el('ul',{},p.unclear.map(u=>el('li',{text:u})))]));

  const go=el('button',{type:'button',class:'nb-solve-go',id:'nbSolveConfirm',text:x.ok});
  if(sure){go.disabled=true;sure.onchange=()=>{go.disabled=!sure.checked};ta.addEventListener('input',()=>{go.disabled=false},{once:true})}

async function run(body,statement,go){
  const x=t();if(busy||statement.length<3)return;busy=true;go.disabled=true;status(body,x.solving,'');

    const d=await r.json();
    if(!r.ok||d.status==='error'){status(body,d.message||('HTTP '+r.status),'err');go.disabled=false;return}
    if(d.status==='needs_clarification'){body.append(el('div',{class:'nb-solve-unclear'},[el('b',{text:x.clar}),el('ul',{},d.questions.map(q=>el('li',{text:q})))]));status(body,x.edit,'err');go.disabled=false;return}
    const scenes=toScenes(d);close(false);O().enterInterlude(scenes,{kind:'solve'})}
  catch(e){status(body,String(e),'err');go.disabled=false}finally{busy=false}}

/* Property marks (equal ticks, equal-angle arcs, parallel arrows) are drawn by the shared `annotate` action:
   the hand points at the element and draws the mark while the lead-in sentence is spoken (NABIL rule LL-12). */
const PROP=new Set(['equal','equal_angle','parallel']);
function splitMarks(fig){
  const ms=(fig&&fig.marks)||[];
  const items=ms.filter(m=>PROP.has(m.type)).map(m=>m.type==='equal_angle'
    ?{kind:'arc',at:m.at,from:m.between[0],to:m.between[1],n:m.n,g:m.g}
    :{kind:m.type,segs:m.segs,n:m.n,g:m.g});
  return{rest:Object.assign({},fig,{marks:ms.filter(m=>!PROP.has(m.type))}),items}}
function toScenes(sol){
  const x=T[sol.lang]||t(),sl=sol.lang==='en'?undefined:sol.lang;
  const mk=(text,label,extra)=>Object.assign({t:'text',text:pretty(text),label:label||'',speech:String(text),speech_lang:sl},extra||{});
  const steps=[mk(sol.statement,x.problem)];
  const hasFig=!!(sol.figure&&Object.keys(sol.figure.points||{}).length>=2),fsteps=hasFig&&(sol.steps||[]).some(z=>z.figure_step);
  const baseSplit=hasFig?splitMarks(sol.figure):null;
  if(hasFig)steps.push({t:'draw',draw:'figure',args:baseSplit.rest});
  if(hasFig&&baseSplit.items.length)steps.push({t:'draw',draw:'annotate',clear:false,args:{items:baseSplit.items}});
  (sol.given||[]).forEach((g,i)=>steps.push(mk(g,i?'':x.given)));
  (sol.required||[]).forEach((g,i)=>steps.push(mk(g,i?'':x.required)));
  (sol.steps||[]).forEach((st,i)=>{
    const lead=st.say||(x.step+' '+(i+1));
    if(fsteps&&st.figure_step){
      const sp=splitMarks(st.figure_step),fa=Object.assign({points:sol.figure.points},sp.rest);
      if((fa.segments||[]).length||(fa.marks||[]).length||(fa.show||[]).length)steps.push({t:'draw',draw:'figure',clear:false,args:fa});
      if(sp.items.length)steps.push({t:'draw',draw:'annotate',clear:false,args:{items:sp.items},speech:st.say||'',speech_lang:sl})}
    if(st.construct&&st.construct.ops&&st.construct.ops.length)steps.push({t:'draw',draw:'construct',args:Object.assign({keep:true},st.construct),speech:st.say||st.text||'',speech_lang:sl});
    steps.push(mk(st.text||st.say,lead,Object.assign({speech:(st.say&&st.text?st.say+'. ':'')+(st.text||'')},st.justification?{hint:x.because+' '+st.justification}:{})));
    if(st.formula)steps.push({t:'formula',text:pretty(st.formula),speech:st.formula,speech_lang:sl})});

  if(v==='verified')steps.push(mk(x.verified,''));else if(v==='mismatch')steps.push(mk(x.mismatch,''));
  return [{id:'solve',title:x.badgeNew,start_mode:'single',steps,solved:true}]}
