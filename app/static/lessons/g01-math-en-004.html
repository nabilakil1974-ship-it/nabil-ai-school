bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><circle id=\"e3\" cx=\"240\" cy=\"110\" r=\"28\" fill=\"#51cf66\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e4\" cx=\"360\" cy=\"110\" r=\"28\" fill=\"#51cf66\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e5\" cx=\"480\" cy=\"110\" r=\"28\" fill=\"#51cf66\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e6\" cx=\"240\" cy=\"300\" r=\"28\" fill=\"#4dabf7\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e7\" cx=\"360\" cy=\"300\" r=\"28\" fill=\"#4dabf7\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e8\" cx=\"480\" cy=\"300\" r=\"28\" fill=\"#4dabf7\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><line id=\"e9\" x1=\"240\" y1=\"146\" x2=\"240\" y2=\"264\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e10\" x1=\"360\" y1=\"146\" x2=\"360\" y2=\"264\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e11\" x1=\"480\" y1=\"146\" x2=\"480\" y2=\"264\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9", "e10", "e11"]}, {"k": "t", "en": "Is there an object left without a partner in A? No. In B? No.", "ar": "هل بقي شيء بلا شريك في A؟ لا. وفي B؟ لا.", "fr": "Reste-t-il un objet sans partenaire dans A ? Non. Dans B ? Non.", "label": ""}, {"k": "t", "en": "So both groups have the same number. Let us check by counting. A: one, two, three. B: one, two, three. Yes: 3 and 3, the same number.", "ar": "إذن للمجموعتين العدد نفسه. لنتحقّق بالعدّ. A: one، two، three. B: one، two، three. نعم: 3 و3، العدد نفسه.", "fr": "Les deux groupes ont donc le même nombre. Vérifions en comptant. A : one, two, three. B : one, two, three. Oui : 3 et 3, le même nombre.", "label": ""}, {"k": "f", "f": "3 = 3   same number"}]}, {"title": {"en": "Spacing can trick our eyes", "ar": "التباعد قد يخدع أعيننا", "fr": "L'espacement peut tromper nos yeux"}, "items": [{"k": "t", "en": "A tricky question. Group A has 4 dots close together. Group B has 3 dots far apart. Which group looks bigger on the screen?", "ar": "سؤال فيه خدعة. المجموعة A فيها 4 نقاط متقاربة، والمجموعة B فيها 3 نقاط متباعدة جدًا. أي مجموعة تبدو أكبر على الشاشة؟", "fr": "Une question piège. Le groupe A a 4 points serrés. Le groupe B a 3 points très écartés. Quel groupe paraît le plus grand à l'écran ?", "label": ""}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"115\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><circle id=\"e2\" cx=\"248\" cy=\"110\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e3\" cx=\"302\" cy=\"110\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e4\" cx=\"358\" cy=\"110\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e5\" cx=\"412\" cy=\"110\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text id=\"e6\" x=\"40\" y=\"315\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><circle id=\"e7\" cx=\"130\" cy=\"310\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e8\" cx=\"340\" cy=\"310\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e9\" cx=\"550\" cy=\"310\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9"]}, {"k": "t", "en": "Yes, B takes more space. But the question is not who takes more space. The question is: who has more objects?", "ar": "نعم، B تأخذ مساحة أكبر. لكن السؤال ليس من يأخذ مساحة أكبر. السؤال: من عنده أشياء أكثر؟", "fr": "Oui, B prend plus de place. Mais la question n'est pas qui prend plus de place. La question est : qui a plus d'objets ?", "label": ""}, {"k": "t", "en": "Count A: one, two, three, four. Count B: one, two, three. So A has more.", "ar": "عدّ A: one، two، three، four. عدّ B: one، two، three. إذن A has more.", "fr": "Compte A : one, two, three, four. Compte B : one, two, three. A en a donc plus.", "label": ""}, {"k": "t", "en": "B was spread out, so it tricked our eyes. But the number does not change because of the distance.", "ar": "كانت B متباعدة فخدعت أعيننا. لكن العدد لا يتغيّر بسبب المسافة.", "fr": "B était écartée, elle a donc trompé nos yeux. Mais le nombre ne change pas à cause de la distance.", "label": ""}, {"k": "t", "en": "We compare quantities, not the space things take.", "ar": "نقارن الكميات وليس المساحة التي تأخذها الأشياء.", "fr": "On compare les quantités, pas la place que prennent les objets.", "label": ""}]}, {"title": {"en": "More, fewer, same", "ar": "more و fewer و same", "fr": "More, fewer, same"}, "items": [{"k": "t", "en": "Now we have three important words: MORE, FEWER, SAME.", "ar": "الآن عندنا ثلاث كلمات مهمة: MORE (أكثر) و FEWER (أقل) و SAME (نفسه).", "fr": "Nous avons maintenant trois mots importants : MORE (plus), FEWER (moins), SAME (autant).", "label": ""}, {"k": "t", "en": "If some objects are left in a group after pairing, that group has more. The other group has fewer. If nothing is left in either group, they have the same number.", "ar": "إذا بقيت أشياء في مجموعة بعد المزاوجة فهي فيها more، والمجموعة الأخرى فيها fewer. وإذا لم يبق شيء في أي مجموعة فالعدد نفسه same.", "fr": "S'il reste des objets dans un groupe après les paires, ce groupe en a plus. L'autre en a moins. S'il ne reste rien dans aucun groupe, les nombres sont les mêmes.", "label": ""}, {"k": "t", "en": "Case 1: A has 5, B has 3. After pairing, A has extra. A has more. B has fewer.", "ar": "الحالة 1: في A خمسة وفي B ثلاثة. بعد المزاوجة يبقى زائد في A. A has more. B has fewer.", "fr": "Cas 1 : A a 5, B a 3. Après les paires, il reste des objets dans A. A a plus. B a moins.", "label": ""}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><polygon id=\"e3\" points=\"200.0,82.4 207.3,100.0 226.2,101.5 211.8,113.8 216.2,132.3 200.0,122.4 183.8,132.3 188.2,113.8 173.8,101.5 192.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e4\" points=\"280.0,82.4 287.3,100.0 306.2,101.5 291.8,113.8 296.2,132.3 280.0,122.4 263.8,132.3 268.2,113.8 253.8,101.5 272.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e5\" points=\"360.0,82.4 367.3,100.0 386.2,101.5 371.8,113.8 376.2,132.3 360.0,122.4 343.8,132.3 348.2,113.8 333.8,101.5 352.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e6\" points=\"440.0,82.4 447.3,100.0 466.2,101.5 451.8,113.8 456.2,132.3 440.0,122.4 423.8,132.3 428.2,113.8 413.8,101.5 432.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e7\" points=\"520.0,82.4 527.3,100.0 546.2,101.5 531.8,113.8 536.2,132.3 520.0,122.4 503.8,132.3 508.2,113.8 493.8,101.5 512.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e8\" points=\"280.0,272.4 287.3,290.0 306.2,291.5 291.8,303.8 296.2,322.3 280.0,312.4 263.8,322.3 268.2,303.8 253.8,291.5 272.7,290.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e9\" points=\"360.0,272.4 367.3,290.0 386.2,291.5 371.8,303.8 376.2,322.3 360.0,312.4 343.8,322.3 348.2,303.8 333.8,291.5 352.7,290.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e10\" points=\"440.0,272.4 447.3,290.0 466.2,291.5 451.8,303.8 456.2,322.3 440.0,312.4 423.8,322.3 428.2 stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e7\" points=\"405.0,272.4 412.3,290.0 431.2,291.5 416.8,303.8 421.2,322.3 405.0,312.4 388.8,322.3 393.2,303.8 378.8,291.5 397.7,290.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e8\" points=\"495.0,272.4 502.3,290.0 521.2,291.5 506.8,303.8 511.2,322.3 495.0,312.4 478.8,322.3 483.2,303.8 468.8,291.5 487.7,290.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><line id=\"e9\" x1=\"315\" y1=\"142\" x2=\"225\" y2=\"268\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e10\" x1=\"405\" y1=\"142\" x2=\"315\" y2=\"268\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9", "e10"]}, {"k": "t", "en": "Case 3: A has 3 and B has 3. What do we say? Same number.", "ar": "الحالة 3: في A ثلاثة وفي B ثلاثة. ماذا نقول؟ Same number.", "fr": "Cas 3 : A a 3 et B a 3. Que dit-on ? Same number.", "label": ""}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><polygon id=\"e3\" points=\"250.0,82.4 257.3,100.0 276.2,101.5 261.8,113.8 266.2,132.3 250.0,122.4 233.8,132.3 238.2,113.8 223.8,101.5 242.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e4\" points=\"360.0,82.4 367.3,100.0 386.2,101.5 371.8,113.8 376.2,132.3 360.0,122.4 343.8,132.3 348.2,113.8 333.8,101.5 352.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e5\" points=\"470.0,82.4 477.3,100.0 496.2,101.5 481.8,113.8 486.2,132.3 470.0,122.4 453.8,132.3 458.2,113.8 443.8,101.5 462.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e6\" points=\"250.0,272.4 257.3,290.0 276.2,291.5 261.8,303.8 266.2,322.3 250.0,312.4 233.8,322.3 238.2,303.8 223.8,291.5 242.7,290.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e7\" points=\"360.0,272.4 367.3,290.0 386.2,291.5 371.8,303.8 376.2,322.3 360.0,312.4 343.8,322.3 348.2,303.8 333.8,291.5 352.7,290.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e8\" points=\"470.0,272.4 477.3,290.0 496.2,291.5 481.8,303.8 486.2,322.3 470.0,312.4 453.8,322.3 458.2,303.8 443.8,291.5 462.7,290.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><line id=\"e9\" x1=\"250\" y1=\"142\" x2=\"250\" y2=\"268\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e10\" x1=\"360\" y1=\"142\" x2=\"360\" y2=\"268\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e11\" x1=\"470\" y1=\"142\" x2=\"470\" y2=\"268\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9", "e10", "e11"]}, {"k": "f", "f": "5 > 3      2 < 4      3 = 3"}]}, {"title": {"en": "Connect the groups to the numbers", "ar": "نربط المجموعات بالأعداد", "fr": "Relier les groupes aux nombres"}, "items": [{"k": "t", "en": "Now we connect the objects to the numbers we know. Collection A has 2 balls. Collection B has 5 balls.", "ar": "الآن نربط الأشياء بالأعداد التي نعرفها. المجموعة A فيها كرتان. والمجموعة B فيها 5 كرات.", "fr": "Maintenant, on relie les objets aux nombres que l'on connaît. La collection A a 2 balles. La collection B a 5 balles.", "label": ""}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"115\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><g id=\"e2\"><circle cx=\"290\" cy=\"110\" r=\"28\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"290,97 302,106 298,120 282,120 278,106\" fill=\"#0b3d5c\"/><\/g><g id=\"e3\"><circle cx=\"370\" cy=\"110\" r=\"28\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"370,97 382,106 378,120 362,120 358,106\" fill=\"#0b3d5c\"/><\/g><text id=\"e4\" x=\"590\" y=\"130\" font-size=\"60\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">2<\/text><text id=\"e5\" x=\"40\" y=\"315\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><g id=\"e6\"><circle cx=\"170\" cy=\"310\" r=\"28\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"170,297 182,306 178,320 162,320 158,306\" fill=\"#0b3d5c\"/><\/g><g id=\"e7\"><circle cx=\"250\" cy=\"310\" r=\"28\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"250,297 262,306 258,320 242,320 238,306\" fill=\"#0b3d5c\"/><\/g><g id=\"e8\"><circle cx=\"330\" cy=\"310\" r=\"28\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"330,297 342,306 338,320 322,320 318,306\" fill=\"#0b3d5c\"/><\/g><g id=\"e9\"><circle cx=\"410\" cy=\"310\" r=\"28\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"410,297 422,306 418,320 402,320 398,306\" fill=\"#0b3d5c\"/><\/g><g id=\"e10\"><circle cx=\"490\" cy=\"310\" r=\"28\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"490,297 502,306 498,320 482,320 478,306\" fill=\"#0b3d5c\"/><\/g><text id=\"e11\" x=\"590\" y=\"330\" font-size=\"60\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">5<\/text>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9", "e10", "e11"]}, {"k": "t", "en": "Count A: 2. Count B: 5. Who has more? B.", "ar": "عدّ A: 2. عدّ B: 5. من عنده more؟ B.", "fr": "Compte A : 2. Compte B : 5. Qui en a plus ? B.", "label": ""}, {"k": "t", "en": "So between 2 and 5, the number for the bigger collection is 5. We do not memorise it without meaning. We saw it with objects first.", "ar": "إذن بين 2 و5 العدد الذي يمثّل المجموعة الأكبر هو 5. لا نحفظه بلا معنى. رأيناه بالأشياء أولًا.", "fr": "Entre 2 et 5, le nombre de la plus grande collection est 5. On ne le retient pas sans sens. On l'a d'abord vu avec des objets.", "label": ""}, {"k": "f", "f": "objects → count → compare → numbers"}]}, {"title": {"en": "Explain how you know", "ar": "نشرح كيف عرفنا", "fr": "Expliquer comment on le sait"}, "items": [{"k": "t", "en": "Now something even more important than the answer. Do not only say \"A has more\". Say how you know.", "ar": "الآن شيء أهم من الجواب. لا تقل فقط «A فيها أكثر». قل كيف عرفت.", "fr": "Maintenant, quelque chose de plus important que la réponse. Ne dis pas seulement « A en a plus ». Dis comment tu le sais.", "label": ""}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><circle id=\"e3\" cx=\"260\" cy=\"110\" r=\"28\" fill=\"#ff922b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e4\" cx=\"360\" cy=\"110\" r=\"28\" fill=\"#ff922b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e5\" cx=\"460\" cy=\"110\" r=\"28\" fill=\"#ff922b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e6\" cx=\"310\" cy=\"300\" r=\"28\" fill=\"#ff922b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e7\" cx=\"410\" cy=\"300\" r=\"28\" fill=\"#ff922b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7"]}, {"k": "t", "en": "Which group has more? A. Why? Here are good answers: \"Because A has 3 and B has 2.\" Or: \"Because we made pairs and one object was left in A.\"", "ar": "أي مجموعة فيها أكثر؟ A. لماذا؟ هذه أجوبة جيدة: «لأن في A ثلاثة وفي B اثنين». أو: «لأننا كوّنا أزواجًا وبقي شيء في A».", "fr": "Quel groupe en a le plus ? A. Pourquoi ? Voici de bonnes réponses : « Parce que A en a 3 et B en a 2. » Ou : « Parce qu'on a fait des paires et il est resté un objet dans A. »", "label": ""}, {"k": "t", "en": "A strong answer has two parts: the answer, and the reason.", "ar": "الجواب القوي له جزءان: الجواب والسبب.", "fr": "Une réponse solide a deux parties : la réponse et la raison.", "label": ""}, {"k": "f", "f": "Answer + Why"}]}, {"title": {"en": "Mistakes to avoid", "ar": "أخطاء يجب تجنّبها", "fr": "Erreurs à éviter"}, "items": [{"k": "t", "en": "Mistake 1: thinking bigger objects mean more. A has 2 big balls and B has 4 small balls. Big size does not decide the number. We count: B has 4, so B has more.", "ar": "الخطأ 1: ظن أن الأشياء الأكبر تعني عددًا أكثر. في A كرتان كبيرتان وفي B أربع كرات صغيرة. الحجم لا يحدّد العدد. نعدّ: في B أربع، إذن B has more.", "fr": "Erreur 1 : croire que de gros objets signifient plus. A a 2 grosses balles et B a 4 petites balles. La taille ne décide pas du nombre. On compte : B en a 4, B en a donc plus.", "label": ""}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"115\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><g id=\"e2\"><circle cx=\"255\" cy=\"110\" r=\"55\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"255,85 279,102 270,130 240,130 231,102\" fill=\"#0b3d5c\"/><\/g><g id=\"e3\"><circle cx=\"405\" cy=\"110\" r=\"55\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"405,85 429,102 420,130 390,130 381,102\" fill=\"#0b3d5c\"/><\/g><text id=\"e4\" x=\"40\" y=\"315\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><g id=\"e5\"><circle cx=\"225\" cy=\"310\" r=\"24\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"225,299 235,307 231,319 219,319 215,307\" fill=\"#0b3d5c\"/><\/g><g id=\"e6\"><circle cx=\"295\" cy=\"310\" r=\"24\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"295,299 305,307 301,319 289,319 285,307\" fill=\"#0b3d5c\"/><\/g><g id=\"e7\"><circle cx=\"365\" cy=\"310\" r=\"24\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"365,299 375,307 371,319 359,319 355,307\" fill=\"#0b3d5c\"/><\/g><g id=\"e8\"><circle cx=\"435\" cy=\"310\" r=\"24\" fill=\"#fff\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon points=\"435,299 445,307 441,319 429,319 425,307\" fill=\"#0b3d5c\"/><\/g>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8"]}, {"k": "t", "en": "Mistake 2: thinking the longer row has more. A row of 3 objects spread wide is not more than 4 objects close together. We count or we pair.", "ar": "الخطأ 2: ظن أن الصف الأطول فيه أكثر. صف من 3 أشياء متباعدة ليس أكثر من 4 أشياء متقاربة. نعدّ أو نزاوج.", "fr": "Erreur 2 : croire que la plus longue rangée en a plus. Une rangée de 3 objets écartés n'en a pas plus que 4 objets serrés. On compte ou on forme des paires.", "label": ""}, {"k": "t", "en": "Mistake 3: mixing up more and fewer. If A has more, what do we say about B? B has fewer. The two always go together.", "ar": "الخطأ 3: خلط more مع fewer. إذا كانت A فيها more فماذا نقول عن B؟ B has fewer. الكلمتان مترابطتان دائمًا.", "fr": "Erreur 3 : confondre more et fewer. Si A en a plus, que dit-on de B ? B en a moins. Les deux vont toujours ensemble.", "label": ""}, {"k": "t", "en": "Mistake 4: saying \"same\" without checking. 4 and 5 look close, so we never say same quickly. We count or we make pairs.", "ar": "الخطأ 4: قول same دون تحقّق. 4 و5 متقاربان في الشكل، لذلك لا نقول same بسرعة. نعدّ أو نكوّن أزواجًا.", "fr": "Erreur 4 : dire « same » sans vérifier. 4 et 5 se ressemblent, on ne dit donc jamais same trop vite. On compte ou on forme des paires.", "label": ""}]}, {"title": {"en": "Summary", "ar": "الخلاصة", "fr": "Résumé"}, "items": [{"k": "t", "en": "Well done! Today we learned to compare quantities from 1 to 5.", "ar": "أحسنت! تعلّمنا اليوم أن نقارن الكميات من 1 إلى 5.", "fr": "Bravo ! Aujourd'hui, nous avons appris à comparer des quantités de 1 à 5.", "label": ""}, {"k": "t", "en": "We do not decide from the size, the distance or the length of the row. We do something sure: we PAIR or we COUNT.", "ar": "لا نقرّر من الحجم ولا من المسافة ولا من طول الصف. نفعل شيئًا مضمونًا: نزاوج أو نعدّ.", "fr": "On ne décide ni d'après la taille, ni la distance, ni la longueur de la rangée. On fait quelque chose de sûr : on forme des paires ou on compte.", "label": ""}, {"k": "t", "en": "If objects are left in a group, that group has more. The other has fewer. If every object has a partner, they have the same number.", "ar": "إذا بقيت أشياء في مجموعة فهي فيها more والأخرى fewer. وإذا أخذ كل شيء شريكًا فالعدد نفسه same.", "fr": "S'il reste des objets dans un groupe, il en a plus. L'autre en a moins. Si chaque objet a un partenaire, les nombres sont les mêmes.", "label": ""}, {"k": "f", "f": "LOOK → PAIR → SEE WHAT REMAINS → SAY MORE / FEWER / SAME → CHECK"}, {"k": "t", "en": "A strong answer always has: the answer and the reason.", "ar": "الجواب القوي دائمًا فيه: الجواب والسبب.", "fr": "Une réponse solide a toujours : la réponse et la raison.", "label": ""}]}, {"title": {"en": "Exercise 1", "ar": "التمرين 1", "fr": "Exercice 1"}, "items": [{"k": "t", "en": "Group A has 4 stars. Group B has 3 stars. Pair them and decide.", "ar": "المجموعة A فيها 4 نجوم والمجموعة B فيها 3 نجوم. زاوج بينها وقرّر.", "fr": "Le groupe A a 4 étoiles. Le groupe B a 3 étoiles. Forme des paires et décide.", "label": "Problem"}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><polygon id=\"e3\" po 2, pair 3. Now every star of B has a partner.", "ar": "الزوج 1 والزوج 2 والزوج 3. الآن لكل نجمة من B شريك.", "fr": "Paire 1, paire 2, paire 3. Maintenant, chaque étoile de B a un partenaire.", "label": ""}, {"k": "t", "en": "One star is left in A, without a partner.", "ar": "بقيت نجمة واحدة في A بلا شريك.", "fr": "Il reste une étoile dans A, sans partenaire.", "label": ""}, {"k": "t", "en": "So who has more? A. And who has fewer? B.", "ar": "إذن من عنده more؟ A. ومن عنده fewer؟ B.", "fr": "Qui en a plus ? A. Qui en a moins ? B.", "label": ""}, {"k": "f", "f": "A has more.   B has fewer."}]}, {"title": {"en": "Exercise 2", "ar": "التمرين 2", "fr": "Exercice 2"}, "items": [{"k": "t", "en": "Group A: 4 cars. Group B: 4 teddy bears. Pair them. Same number or not? What is the number?", "ar": "المجموعة A: 4 سيارات. المجموعة B: 4 دببة. زاوج بينها. هل العدد نفسه؟ وما هو العدد؟", "fr": "Groupe A : 4 voitures. Groupe B : 4 nounours. Forme des paires. Même nombre ou non ? Quel est le nombre ?", "label": "Problem"}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><g id=\"e3\"><rect x=\"134\" y=\"100\" width=\"62\" height=\"23\" rx=\"6\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><rect x=\"149\" y=\"85\" width=\"31\" height=\"16\" rx=\"5\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"149\" cy=\"124\" r=\"8\" fill=\"#0b3d5c\"/><circle cx=\"181\" cy=\"124\" r=\"8\" fill=\"#0b3d5c\"/><\/g><g id=\"e4\"><rect x=\"264\" y=\"100\" width=\"62\" height=\"23\" rx=\"6\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><rect x=\"279\" y=\"85\" width=\"31\" height=\"16\" rx=\"5\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"279\" cy=\"124\" r=\"8\" fill=\"#0b3d ompte pour vérifier : one, two, three, four.", "label": ""}, {"k": "f", "f": "4 and 4 → same number"}]}, {"title": {"en": "Exercise 3", "ar": "التمرين 3", "fr": "Exercice 3"}, "items": [{"k": "t", "en": "Group A has 5 close stars. Group B has 4 stars far apart. Which has more?", "ar": "المجموعة A فيها 5 نجوم متقاربة، والمجموعة B فيها 4 نجوم متباعدة. أيّهما أكثر؟", "fr": "Le groupe A a 5 étoiles serrées. Le groupe B a 4 étoiles écartées. Lequel en a plus ?", "label": "Problem"}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"115\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><polygon id=\"e2\" points=\"230.0,87.0 236.1,101.6 251.9,102.9 239.8,113.2 243.5,128.6 230.0,120.3 216.5,128.6 220.2,113.2 208.1,102.9 223.9,101.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e3\" points=\"280.0,87.0 286.1,101.6 301.9,102.9 289.8,113.2 293.5,128.6 280.0,120.3 266.5,128.6 270.2,113.2 258.1,102.9 273.9,101.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e4\" points=\"330.0,87.0 336.1,101.6 351.9,102.9 339.8,113.2 343.5,128.6 330.0,120.3 316.5,128.6 320.2,113.2 308.1,102.9 323.9,101.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e5\" points=\"380.0,87.0 386.1,101.6 401.9,102.9 389.8,113.2 393.5,128.6 380.0,120.3 366.5,128.6 370.2,113.2 358.1,102.9 373.9,101.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e6\" points=\"430.0,87.0 436.1,101.6 451.9,102.9 439.8,113.2 443.5,128.6 430.0,120.3 416.5,128.6 420.2,113.2 408.1,102.9 423.9,101.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text id=\"e7\" x=\"40\" y=\"315\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><polygon id=\"e8\" points=\"105.0,287.0 111.1,301.6 126.9,302.9 114.8,313.2 118.5,328.6 105.0,320.4 91.5,328.6 95.2,313.2 83.1,302.9 98.9,301.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e9\" points=\"265.0,287.0 271.1,301.6 286.9,302.9 274.8,313.2 278.5,328.6 265.0,320.4 251.5,328.6 255.2,313.2 243.1,302.9 258.9,301.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e10\" points=\"425.0,287.0 431.1,301.6 446.9,302.9 434.8,313.2 438.5,328.6 425.0,320.4 411.5,328.6 415.2,313.2 403.1,302.9 418.9,301.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><polygon id=\"e11\" points=\"585.0,287.0 591.1,301.6 606.9,302.9 594.8,313.2 598.5,328.6 585.0,320.4 571.5,328.6 575.2,313.2 563.1,302.9 578.9,301.6\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9", "e10", "e11"]}, {"k": "t", "en": "B looks bigger because it is spread out. But we do not judge by the distance.", "ar": "تبدو B أكبر لأنها متباعدة. لكننا لا نحكم من المسافة.", "fr": "B paraît plus grande car elle est écartée. Mais on ne juge pas d'après la distance.", "label": ""}, {"k": "t", "en": "Count A: one, two, three, four, five. A has 5.", "ar": "عدّ A: one، two، three، four، five. في A خمس.", "fr": "Compte A : one, two, three, four, five. A en a 5.", "label": ""}, {"k": "t", "en": "Count B: one, two, three, four. B has 4.", "ar": "عدّ B: one، two، three، four. في B أربع.", "fr": "Compte B : one, two, three, four. B en a 4.", "label": ""}, {"k": "f", "f": "5 > 4      A has more."}, {"k": "t", "en": "Our eyes can be fooled. Counting tells the truth.", "ar": "قد تُخدع أعيننا. والعدّ يقول الحقيقة.", "fr": "Nos yeux peuvent être trompés. Compter dit la vérité.", "label": ""}]}, {"title": {"en": "Exercise 4", "ar": "التمرين 4", "fr": "Exercice 4"}, "items": [{"k": "t", "en": "A has 5 cookies, B has 3 cookies. Say: A compared with B, then B compared with A (more, fewer or same).", "ar": "في A خمس بسكويتات وفي B ثلاث. قل: A بالنسبة إلى B، ثم B بالنسبة إلى A (more أو fewer أو same).", "fr": "A a 5 biscuits, B en a 3. Dis : A par rapport à B, puis B par rapport à A (more, fewer ou same).", "label": "Problem"}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><g id=\"e3\"><circle cx=\"200\" cy=\"110\" r=\"28\" fill=\"#d9a05b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"193\" cy=\"105\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"206\" cy=\"108\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"198\" cy=\"118\" r=\"3\" fill=\"#5c3b1e\"/><\/g><g id=\"e4\"><circle cx=\"280\" cy=\"110\" r=\"28\" fill=\"#d9a05b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"273\" cy=\"105\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"286\" cy=\"108\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"278\" cy=\"118\" r=\"3\" fill=\"#5c3b1e\"/><\/g><g id=\"e5\"><circle cx=\"360\" cy=\"110\" r=\"28\" fill=\"#d9a05b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"353\" cy=\"105\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"366\" cy=\"108\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"358\" cy=\"118\" r=\"3\" fill=\"#5c3b1e\"/><\/g><g id=\"e6\"><circle cx=\"440\" cy=\"110\" r=\"28\" fill=\"#d9a05b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"433\" cy=\"105\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"446\" cy=\"108\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"438\" cy=\"118\" r=\"3\" fill=\"#5c3b1e\"/><\/g><g id=\"e7\"><circle cx=\"520\" cy=\"110\" r=\"28\" fill=\"#d9a05b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"513\" cy=\"105\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"526\" cy=\"108\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"518\" cy=\"118\" r=\"3\" fill=\"#5c3b1e\"/><\/g><g id=\"e8\"><circle cx=\"280\" cy=\"300\" r=\"28\" fill=\"#d9a05b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle cx=\"273\" cy=\"295\" r=\"3\" fill=\"#5c3b1e\"/><circle cx=\"286\" cy=\"298\" r=\"3\" fill=\"#5c3b1e r is more?", "ar": "قارن 4 أشياء زرقاء و5 أشياء حمراء بالمزاوجة. أي عدد هو الأكثر؟", "fr": "Compare 4 objets bleus et 5 objets rouges avec des paires. Quel nombre est le plus grand ?", "label": "Problem"}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><circle id=\"e3\" cx=\"225\" cy=\"110\" r=\"28\" fill=\"#4dabf7\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e4\" cx=\"315\" cy=\"110\" r=\"28\" fill=\"#4dabf7\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e5\" cx=\"405\" cy=\"110\" r=\"28\" fill=\"#4dabf7\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e6\" cx=\"495\" cy=\"110\" r=\"28\" fill=\"#4dabf7\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e7\" cx=\"180\" cy=\"300\" r=\"28\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e8\" cx=\"270\" cy=\"300\" r=\"28\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e9\" cx=\"360\" cy=\"300\" r=\"28\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e10\" cx=\"450\" cy=\"300\" r=\"28\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e11\" cx=\"540\" cy=\"300\" r=\"28\" fill=\"#e03131\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><line id=\"e12\" x1=\"225\" y1=\"146\" x2=\"180\" y2=\"264\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e13\" x1=\"315\" y1=\"146\" x2=\"270\" y2=\"264\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e14\" x1=\"405\" y1=\"146\" x2=\"360\" y2=\"264\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/><line id=\"e15\" x1=\"495\" y1=\"146\" x2=\"450\" y2=\"264\" stroke=\"#e8590c\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"10 8\"/>", "vb": [660, 440], "show": ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9", "e10", "e11", "e12", "e13", "e14", "e15"]}, {"k": "t", "en": "Count A: 4. Count B: 5.", "ar": "عدّ A: 4. عدّ B: 5.", "fr": "Compte A : 4. Compte B : 5.", "label": ""}, {"k": "t", "en": "We pair them: 4 pairs form, and one red object is left in B.", "ar": "نزاوجها: يتكوّن 4 أزواج وتبقى شيء أحمر واحد في B.", "fr": "On forme des paires : 4 paires se forment, et il reste un objet rouge dans B.", "label": ""}, {"k": "t", "en": "So B has more. 5 has more than 4. And 4 has fewer than 5.", "ar": "إذن B فيها more. 5 أكثر من 4. و4 أقل من 5.", "fr": "B en a donc plus. 5 est plus que 4. Et 4 est moins que 5.", "label": ""}, {"k": "f", "f": "5 > 4      4 < 5"}, {"k": "t", "en": "The proof: after pairing, one object is left in the group of 5.", "ar": "الدليل: بعد المزاوجة بقي شيء في مجموعة الـ5.", "fr": "La preuve : après les paires, il reste un objet dans le groupe de 5.", "label": ""}]}, {"title": {"en": "Exercise 6", "ar": "التمرين 6", "fr": "Exercice 6"}, "items": [{"k": "t", "en": "A has 5 stars, B has 3 stars. Which is right? A. A has fewer. B. A has more. C. A and B have the same number.", "ar": "في A خمس نجوم وفي B ثلاث. أيّها صحيح؟ A. فيها fewer. B. فيها more. C. العدد نفسه.", "fr": "A a 5 étoiles, B en a 3. Laquelle est juste ? A. A en a moins. B. A en a plus. C. A et B en ont autant.", "label": "Problem"}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"122\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><text id=\"e2\" x=\"40\" y=\"312\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><polygon id=\"e3\" points=\"200.0,82.4 207.3,100.0 226.2,101.5 211.8,113.8 216.2,132.3 200.0,122.4 183.8,132.3 188.2,113.8 173.8,101.5 192.7,100.0\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\" , "e13"]}, {"k": "t", "en": "Count: A has 5 and B has 3. 5 is more than 3.", "ar": "نعدّ: في A خمس وفي B ثلاث. 5 أكثر من 3.", "fr": "On compte : A en a 5 et B en a 3. 5 est plus que 3.", "label": ""}, {"k": "f", "f": "B. A has more."}, {"k": "t", "en": "Why is A wrong? Because A has more, not fewer.", "ar": "لماذا A خاطئة؟ لأن في A أكثر وليس أقل.", "fr": "Pourquoi A est-elle fausse ? Parce que A en a plus, pas moins.", "label": ""}, {"k": "t", "en": "Why is C wrong? Because 5 is not the same as 3.", "ar": "لماذا C خاطئة؟ لأن 5 ليست مثل 3.", "fr": "Pourquoi C est-elle fausse ? Parce que 5 n'est pas pareil que 3.", "label": ""}, {"k": "t", "en": "You knew the right one and you explained the wrong ones.", "ar": "عرفت الصحيحة وشرحت الخاطئة.", "fr": "Tu as trouvé la bonne réponse et tu as expliqué les fausses.", "label": ""}]}, {"title": {"en": "Exercise 7", "ar": "التمرين 7", "fr": "Exercice 7"}, "items": [{"k": "t", "en": "Three groups: A has 2, B has 5, C has 3. Who has the most? Who has the fewest? Put them in order from fewer to more.", "ar": "ثلاث مجموعات: A فيها 2، B فيها 5، C فيها 3. من عنده الأكثر؟ من عنده الأقل؟ رتّبها من الأقل إلى الأكثر.", "fr": "Trois groupes : A a 2, B a 5, C a 3. Qui en a le plus ? Qui en a le moins ? Range-les du moins au plus.", "label": "Problem"}, {"k": "d", "svg": "<text id=\"e1\" x=\"70\" y=\"100\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><circle id=\"e2\" cx=\"40\" cy=\"170\" r=\"22\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e3\" cx=\"100\" cy=\"170\" r=\"22\" fill=\"#ffd43b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><text id=\"e4\" x=\"330\" y=\"100\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">B<\/text><circle id=\"e5\" cx=\"226\" cy=\"170\" r=\"20\" fill=\"#ff922b\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e6\" cx=\"278\" cy=\"170\" r=\"20\" fill=\"#ff922b\" str , B has 5: more, fewer or same? 4) A has 4 close objects, B has 3 spread out: who has more? 5) A = 5, B = 4: say the answer and the reason.", "ar": "التحدي الأخير. 1) في A أربعة وفي B اثنان: من عنده more؟ 2) في A واحد وفي B ثلاثة: من عنده fewer؟ 3) في A خمسة وفي B خمسة: more أم fewer أم same؟ 4) في A أربعة أشياء متقاربة وفي B ثلاثة متباعدة: من عنده more؟ 5) A = 5 و B = 4: قل الجواب والسبب.", "fr": "Défi final. 1) A a 4, B a 2 : qui en a plus ? 2) A a 1, B a 3 : qui en a moins ? 3) A a 5, B a 5 : more, fewer ou same ? 4) A a 4 objets serrés, B en a 3 écartés : qui en a plus ? 5) A = 5, B = 4 : donne la réponse et la raison.", "label": "Problem"}, {"k": "t", "en": "Task 1: 4 and 2. After pairing, A has two objects left. A has more.", "ar": "المهمة 1: 4 و2. بعد المزاوجة يبقى في A شيئان. A has more.", "fr": "Tâche 1 : 4 et 2. Après les paires, il reste deux objets dans A. A en a plus.", "label": ""}, {"k": "f", "f": "A has more."}, {"k": "t", "en": "Task 2: 1 and 3. A has only 1, B has 3. So A has fewer.", "ar": "المهمة 2: 1 و3. في A واحد فقط وفي B ثلاثة. إذن A has fewer.", "fr": "Tâche 2 : 1 et 3. A n'en a qu'1, B en a 3. A en a donc moins.", "label": ""}, {"k": "f", "f": "A has fewer."}, {"k": "t", "en": "Task 3: 5 and 5. Every object has a partner and nothing is left. Same number.", "ar": "المهمة 3: 5 و5. لكل شيء شريك ولا يبقى شيء. Same number.", "fr": "Tâche 3 : 5 et 5. Chaque objet a un partenaire, il ne reste rien. Même nombre.", "label": ""}, {"k": "f", "f": "5 = 5   same"}, {"k": "d", "svg": "<text id=\"e1\" x=\"40\" y=\"115\" font-size=\"34\" font-family=\"sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#0b3d5c\">A<\/text><circle id=\"e2\" cx=\"248\" cy=\"110\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e3\" cx=\"302\" cy=\"110\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e4\" cx=\"358\" cy=\"110\" r=\"14\" fill=\"#0b3d5c\" stroke=\"#0b3d5c\" stroke-width=\"3\"/><circle id=\"e         fr:{"−":" moins ","+":" plus ","×":" fois ","·":" fois ","÷":" divisé par ","=":" égale ","→":" donne ","✓":" juste ","≈":" environ "}};
function mathSpeech(f){var m=MW[LANG];return f.replace(/[−+×·÷=→✓≈]/g,function(c){return m[c]||c}).replace(/\s+/g," ")}
function chunksOf(text){
  var parts=text.match(/[^.!?؟؛:]+[.!?؟؛:]*\s*/g)||[text],out=[],cur="";
  parts.forEach(function(p){if(cur&&(cur+p).length>170){out.push(cur);cur=p}else cur+=p});
  if(cur)out.push(cur);
  return out.join("")===text?out:[text];
}
function narStop(){narTok++;clearInterval(narTimer);speaking=false;try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
function narrate(text,el,onDone,onProg,estO){
  narStop();var tok=narTok;
  var words=el?$$(".w",el):[],starts=[],pos=0;
  words.forEach(function(w){var wo=w.dataset.o||w.textContent;var i=text.indexOf(wo,pos);if(i<0)i=pos;starts.push(i);pos=i+wo.length});
  function reveal(n,f){for(var i=0;i<words.length;i++)words[i].classList.toggle("on",i<n);if(onProg)onProg(f!=null?f:(words.length?n/words.length:0));
    if(n>0&&n<=words.length){var wp=wordPoint(n>1?(words[n-2].dataset.o||words[n-2].textContent):"",words[n-1].dataset.o||words[n-1].textContent);if(wp){target=wp;wtActive=true}}}
  var done=false;
  function finish(){if(tok!==narTok||done)return;done=true;clearInterval(narTimer);reveal(words.length,1);speaking=false;if(onDone){try{onDone()}catch(e){}}}
  reveal(0,0);speaking=true;
  var est=estO||Math.max(1400,text.length*(LANG==="ar"?100:82)/SPD*.8),t0=Date.now(),gotB=false,started=false;
  narTimer=setInterval(function(){if(tok!==narTok||gotB)return;var f0=Math.min(1,(Date.now()-t0)/est);reveal(Math.ceil(f0*words.length),f0)},100);
  if(!text||!(voiceOn&&SUPPORT)){setTimeout(finish,est+400);return}
  var ch=chunksOf(text),ci=0,base=0,lastAct=Date.now(),reqT=0,tries=0,cur=null,dead=false;
  function runTimed(){ /* the voice is not available right now: keep writing/drawing on a timer and move on */
    dead=true;clearInterval(narTimer);var t1=Date.now(),w0=starts.length?Math.max(0,words.filter(function(w){return w.classList.contains("on")}).length):0;
    narTimer=setInterval(function(){if(tok!==narTok){clearInterval(narTimer);return}var f=Math.min(1,(Date.now()-t1)/est);reveal(Math.max(w0,Math.ceil(f*words.length)),f);if(f>=1)finish()},100)}
  function speakNext(){
    if(tok!==narTok||dead)return;
    if(ci>=ch.length){finish();return}
    var u=new SpeechSynthesisUtterance(ch[ci]),off=base,len=ch[ci].length,mine=ci;
    cur={u:u,len:len,mine:mine};tries=0;
    u.lang=VOICES[LANG];u.rate=(LANG==="ar"?.9:1)*SPD;
    u.onstart=function(){if(cur&&cur.u===u){started=true;lastAct=Date.now()}};
    u.onboundary=function(e){
      if(tok!==narTok||!cur||cur.u!==u)return;gotB=true;started=true;lastAct=Date.now();var c=off+(e.charIndex||0),n=0;
      for(var i=0;i<starts.length;i++){if(starts[i]<=c+1)n=i+1}
      reveal(n,words.length?n/words.length:0);
    };
    u.onend=function(){if(tok!==narTok||!cur||cur.u!==u)return;lastAct=Date.now();ci=mine+1;base=off+len;speakNext()};
    u.onerror=function(e){if(tok!==narTok||!cur||cur.u!==u)return;if(e&&(e.error==="interrupted"||e.error==="canceled"))return;lastAct=Date.now();ci=mine+1;base=off+len;speakNext()};
    reqT=Date.now();started=false;
    try{window.speechSynthesis.speak(u)}catch(e){runTimed()}
  }
  var wd=setInterval(function(){
    if(tok!==narTok||done){clearInterval(wd);return}
    try{var ss=window.speechSynthesis;if(ss&&ss.paused)ss.resume()}catch(e){}
    if(dead||!cur)return;
    var now=Date.now(),allow=4500+cur.len*260;
    if(!started&&now-reqT>3500){ /* the phone dropped the request: ask again, then give up politely */
      if(tries<2){tries++;try{window.speechSynthesis.cancel()}catch(e){}var c0=cur;setTimeout(function(){if(tok===narTok&&cur===c0&&!dead){reqT=Date.now();try{window.speechSynthesis.speak(c0.u)}catch(e){runTimed()}}},350)}
      else{try{window.speechSynthesis.cancel()}catch(e){}runTimed()}
    }else if(started&&now-lastAct>allow){ /* stalled in the middle of a sentence: skip to the next one */
      var m=cur.mine,l=cur.len,o=base;cur=null;try{window.speechSynthesis.cancel()}catch(e){}
      ci=m+1;base=o+l;setTimeout(speakNext,300)}
  },500);
  try{window.speechSynthesis.cancel()}catch(e){}
  setTimeout(speakNext,300);
}

function frame(ts){
  cur.x+=(target[0]-cur.x)*.08;cur.y+=(target[1]-cur.y)*.08;

  var wob=Math.sin(ts/330)*3,tx=cur.x+wob,ty=cur.y+wob*.6;

  ring.setAttribute("cx",tx);ring.setAttribute("cy",ty);ring.setAttribute("r",24+Math.sin(ts/260)*5);
  dot.setAttribute("cx",tx);dot.setAttribute("cy",ty);
  var ang=Math.atan2(ty-my,tx-mx)*180/Math.PI;

function drawOp(o,c){
  c.save();c.lineCap="round";c.lineJoin="round";c.lineWidth=o.w;c.strokeStyle=o.c;
  if(o.k==="erase"){c.globalCompositeOperation="destination-out";c.lineWidth=o.w*4}
  if(o.k==="pen"||o.k==="erase"){
    c.beginPath();c.moveTo(o.p[0].x,o.p[0].y);
    if(o.p.length===1)c.lineTo(o.p[0].x+.1,o.p[0].y);
    for(var i=1;i<o.p.length;i++)c.lineTo(o.p[i].x,o.p[i].y);
    c.stroke();
  }else{
    var a=o.a,b=o.b;c.beginPath();
    if(o.k==="line"||o.k==="arrow"){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);
      if(o.k==="arrow"){var an=Math.atan2(b.y-a.y,b.x-a.x),h=14+o.w*2;
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an-.45),b.y-h*Math.sin(an-.45));
        c.moveTo(b.x,b.y);c.lineTo(b.x-h*Math.cos(an+.45),b.y-h*Math.sin(an+.45))}}
    else if(o.k==="rect"){c.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}
    else if(o.k==="circle"){c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,7)}
    else if(o.k==="tri"){c.moveTo((a.x+b.x)/2,a.y);c.lineTo(b.x,b.y);c.lineTo(a.x,b.y);c.closePath()}
    c.stroke();
  }
  c.restore();
}
