function T(k){return I[P.lang][k]||k}function fnum(x,n=2){return Math.abs(x)<1e-8?'0':Number(x).toFixed(n).replace(/\.?0+$/,'')}function vec(x,y,x2,y2,col='#0d9488',w=2,dash=false){return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="6 5"':''} />`}function dot(x,y,col='#1d4ed8',r=4){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`}function label(x,y,txt,col='#16324a',sz=15){return `<text x="${x}" y="${y}" fill="${col}" font-size="${sz}" font-weight="600">${txt}</text>`}function mark(x,y,col='#334155'){return vec(x,215-5,x,215+5,col,2)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function circlePt(x,y,r=4,col='#dc2626'){return dot(x,y,col,r)}function arrow(x,y,a,b,col='#0d9488',w=2){const ang=Math.atan2(b-y,a-x),len=11,spread=.47;return vec(x,y,a,b,col,w)+`<path d="M ${a-len*Math.cos(ang-spread)} ${b-len*Math.sin(ang-spread)} L ${a} ${b} L ${a-len*Math.cos(ang+spread)} ${b-len*Math.sin(ang+spread)}" stroke="${col}" stroke-width="${w}" fill="none"/>`}

function lens(){const px=395,cy=215,dist=P.d,fe=P.lens==='conv'?P.f:-P.f,eps=1e-7,p2=fe*dist/(dist-fe),finite=Math.abs(dist-fe)>eps,mag=finite?-p2/dist:0;let imgX=px+p2,imgY=cy-mag*P.h;let s='<rect width="800" height="440" fill="#fff"/>';for(let x=35;x<800;x+=35)s+=vec(x,0,x,440,'#eef1f5',1);s+=vec(28,cy,770,cy,'#6b7280',1.5,'stroke-dasharray="6 4"');s+=vec(px,40,px,389,'#0c7894',3)+label(px+8,43,'L','#0c7894')+label(px+9,cy+21,'O');const fa=px-fe,fb=px+fe;s+=mark(fa,cy)+mark(fb,cy)+label(fa-8,cy+30,'F')+label(fb-8,cy+30,'F′');s+=arrow(px-dist,cy,px-dist,cy-P.h,'#1d4ed8',3)+label(px-dist-18,cy+19,'A','#1d4ed8')+label(px-dist-18,cy-P.h-12,'B','#1d4ed8');let prop=P.p;const start=[px-dist,cy-P.h],lensHit=[px,cy-P.h],second=[px,cy],target=finite?[imgX,imgY]:[px+250,cy-P.h];

 if(prop>.6){let slope=P.h/dist,ex=px+clamp(imgX-px,0,370),ey=cy+slope*(ex-px);if(P.lens==='div'||(finite&&p2<0)){ex=px+300;ey=cy+slope*300}const f=clamp((prop-.6)*2.5,0,1);s+=arrow(px,cy,px+(ex-px)*f,cy+(ey-cy)*f,'#7c3aed',2.2)}

 const nature=!finite?T('infty'):P.lens==='div'||dist<P.f?T('virtual'):T('real');$('explanation').textContent=T('lensRule')+'\n'+nature+'; d = '+dist+', f = '+fe+'. '+T('lensOnly');$('equations').textContent='1/f = 1/do + 1/di\nf = '+fe+', do = '+dist+'\ndi = '+(!finite?'∞':fnum(p2,3))+'\nG = hi/ho = −di/do = '+(!finite?'∞':fnum(mag,3))+'\nhi = '+(!finite?'∞':fnum(mag*P.h,2));$('summary').textContent=T('lensRule')+' '+nature+'. 1/f = 1/do + 1/di. G = −di/do.';let vals=[];for(let d=45;d<=255;d+=3){if(d===P.f&&P.lens==='conv')vals.push(6);else vals.push(Math.min(6,Math.abs(fe/(d-fe))))}$('graph').innerHTML=axisPlot(vals,6,'d → / |G| ↑','#0d9488');$('graphText').textContent=T('lensGraph')+'\nG(d) = |f / (d − f)|';$('legend').innerHTML='<span class="pill">🔵 Object AB</span><span class="pill">🔴 Parallel ray</span><span class="pill">🟣 O ray</span><span class="pill">🟢 Image A′B′</span>';question(T('lensQuiz'),[T('qReal'),T('qVirtual'),T('qNo')],1)}
function projectile(){const angle=P.ang*Math.PI/180,vx=P.v0*Math.cos(angle),vy=P.v0*Math.sin(angle),flight=2*vy/P.g,range=vx*flight,apex=vy*vy/(2*P.g),t=flight*P.p,x=vx*t,y=vy*t-.5*P.g*t*t,vyt=vy-P.g*t,sx=xx=>70+xx/Math.max(range,1)*650,sy=yy=>378-yy/Math.max(apex*1.25,.1)*285;let s='<rect width="800" height="440" fill="#fff"/>'+vec(40,378,765,378,'#334155',2)+vec(70,398,70,45,'#334155',2)+label(752,400,'x')+label(77,55,'y')+label(78,421,'0');let pts=[];for(let i=0;i<=120;i++){const tt=flight*i/120;pts.push([sx(vx*tt),sy(Math.max(0,vy*tt-.5*P.g*tt*tt))])}s+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#92abc3" stroke-width="2.7" stroke-dasharray="7 5"/>';s+=vec(sx(0),sy(apex),sx(range),sy(apex),'#a5bbc9',1,true)+label(sx(0)+5,sy(apex)-10,'Hmax = '+fnum(apex)+' m','#475569',13);let shown=Math.max(2,Math.floor(120*P.p));s+='<polyline points="'+pts.slice(0,shown+1).map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#2563eb" stroke-width="4"/>';let X=sx(x),Y=sy(Math.max(0,y)),factor=3.5; s+=dot(X,Y,'#dc2626',7)+label(X+9,Y-13,'M','#dc2626');s+=arrow(X,Y,X+vx*factor,Y-vyt*factor,'#16a34a',2.5)+arrow(X,Y,X,Y+P.g*factor,'#b45309',2.5);$('scene').innerHTML=s;$('explanation').textContent=T('projectileTip')+'\n'+'t = '+fnum(t,2)+' s; x = '+fnum(x)+' m; y = '+fnum(y)+' m; vx = '+fnum(vx)+' m/s; vy = '+fnum(vyt)+' m/s.';$('equations').textContent='vx = v₀ cosθ = '+fnum(vx)+' m/s\nvy(t) = v₀ sinθ − gt = '+fnum(vyt)+' m/s\nx(t) = vx t = '+fnum(x)+' m\ny(t) = v₀ sinθ t − ½gt² = '+fnum(y)+' m\nT = 2v₀ sinθ/g = '+fnum(flight)+' s\nR = v₀² sin(2θ)/g = '+fnum(range)+' m\nH = v₀² sin²θ/(2g) = '+fnum(apex)+' m';$('summary').textContent=T('projectileTip')+' T='+fnum(flight)+' s, R='+fnum(range)+' m, H='+fnum(apex)+' m.';const graphPts=Array.from({length:101},(_,i)=>{const tt=flight*i/100;return Math.max(0,vy*tt-.5*P.g*tt*tt)});$('graph').innerHTML=axisPlot(graphPts,Math.max(apex,1),'x(t) → / y ↑','#2563eb');$('graphText').textContent=T('projectileGraph')+'\ny(x) = x tanθ − g x²/(2v₀²cos²θ)';$('legend').innerHTML='<span class="pill">🔵 Trajectory</span><span class="pill">🔴 M</span><span class="pill">🟢 v⃗</span><span class="pill">🟠 g⃗</span>';question(T('projQuiz'),[T('qVx'),T('qVy'),T('qBoth')],1)}
function rc(){const tau=P.R*P.C*1e-6,t=5*tau*P.p,ratio=1-Math.exp(-t/tau),voltage=P.Vs*ratio,current=P.Vs/P.R*Math.exp(-t/tau);let s='<rect width="800" height="440" fill="#fff"/>';const col='#1d4ed8',top=110,bottom=336,left=150,right=650;s+=vec(left,top,302,top,'#34465b',3)+vec(405,top,right,top,'#34465b',3)+vec(right,top,right,bottom,'#34465b',3)+vec(right,bottom,left,bottom,'#34465b',3)+vec(left,bottom,left,top,'#34465b',3);s+=vec(302,top,302,top-18,'#34465b',3)+vec(405,top,405,top-18,'#34465b',3)+vec(302,top-18,405,top-18,'#b45309',4)+label(341,top-30,'R = '+P.R+' Ω','#b45309');s+=vec(619,205,681,205,col,5)+vec(619,227,681,227,col,5)+label(678,183,'C = '+P.C+' µF',col,15);s+=vec(left,198,left,222,'#34465b',3)+vec(left-21,198,left+21,198,'#34465b',4)+vec(left-12,222,left+12,222,'#34465b',3)+label(45,194,'Vs = '+P.Vs+' V','#0f766e');const lines=28;for(let j=0;j<lines;j++){const startX=310+j*9,rr=1.7; s+=dot(startX,top, '#0d9488',rr);if(j<Math.floor(ratio*lines))s+=dot(625+(j%5)*9,188+(j%4)*1,'#dc2626',2)}s+=label(440,298,'Uᶜ = '+fnum(voltage,3)+' V','#2563eb',20)+label(440,322,'i = '+fnum(current*1000,3)+' mA','#0d9488',17);let chargeMarks=Math.floor(ratio*9);for(let i=0;i<chargeMarks;i++){s+=label(622+i*3,196,'+','#dc2626',13)+label(621+i*3,247,'−','#2563eb',14)}$('scene').innerHTML=s;$('explanation').textContent=T('charging')+'\nt = '+fnum(t,3)+' s, τ = '+fnum(tau,3)+' s, Uc = '+fnum(voltage,3)+' V, i = '+fnum(current*1000,3)+' mA.';$('equations').textContent='τ = R C = '+fnum(tau,4)+' s\nUc(t) = Vs[1 − exp(−t/τ)]\nUc = '+fnum(voltage,3)+' V\ni(t) = (Vs/R)exp(−t/τ)\ni = '+fnum(current*1000,3)+' mA\nUc(τ)/Vs = 1 − e⁻¹ ≈ 0.632';$('summary').textContent=T('charging')+' τ=RC='+fnum(tau,3)+' s.';$('graph').innerHTML=axisPlot(Array.from({length:101},(_,i)=>1-Math.exp(-i*5/100)),1,'t/τ → / Uc/Vs ↑','#2563eb',vec(32+267/5,25,32+267/5,188,'#a16207',1.5,true));$('graphText').textContent=T('rcGraph')+'\nAt t=τ: Uc/Vs≈0.632';$('legend').innerHTML='<span class="pill">🔵 Uc</sp function render(reControls=true){P.lang=$('lang').value;document.documentElement.lang=P.lang;document.documentElement.dir=P.lang==='ar'?'rtl':'ltr';$('intro').textContent=T('intro');$('scope').textContent=T('scope');$('title').textContent=T(P.mode);$('subtitle').textContent=T(P.mode+'Sub');for(const k of ['play','pause','reset','controls','controlHelp','observation','equation','question','summary','graph','safety']){const ids={play:'play',pause:'pause',reset:'restart',controls:'controlsTitle',controlHelp:'controlsIntro',observation:'observationLabel',equation:'equationLabel',question:'questionLabel',summary:'summaryTitle',graph:'graphLabel',safety:'safety'};$(ids[k]).textContent=T(k)}$('step').textContent=T('step');$('clock').textContent=T('time')+' '+fnum(P.p*100,0)+'%';for(const k of ['lens','projectile','rc'])$('tab'+(k==='rc'?'RC':k[0].toUpperCase()+k.slice(1))).classList.toggle('active',P.mode===k);if(reControls)controls();if(P.mode==='lens')lens();else if(P.mode==='projectile')projectile();else rc()}
