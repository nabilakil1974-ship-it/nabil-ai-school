    <script

    <style>

        }

<script>

const API_BASE = "";

/* ==================================================
   GRADES / SUBJECTS
================================================== */

const GRADES = [
    "الصف الأول",
    "الصف الثاني",
    "الصف الثالث",
    "الصف الرابع",
    "الصف الخامس",
    "الصف السادس",
    "الصف السابع",
    "الصف الثامن",
    "الصف التاسع",
    "الأول ثانوي",
    "الثاني ثانوي",
    "الثالث ثانوي"
];

const SUBJECTS = [
    "رياضيات",
    "فيزياء",
    "كيمياء",
    "علوم",
    "علوم الحياة"
];

/* ==================================================
   ELEMENTS
================================================== */

const gradeSelect =
    document.getElementById("gradeSelect");

const subjectSelect =
    document.getElementById("subjectSelect");

const languageSelect =
    document.getElementById("languageSelect");

const curriculumSelect =
    document.getElementById("curriculumSelect");

const lessonSelect =
    document.getElementById("lessonSelect");

const startLesson =
    document.getElementById("startLesson");

const chat =
    document.getElementById("chat");

const welcome =
    document.getElementById("welcome");

const lessonInfo =
    document.getElementById("lessonInfo");

const currentLesson =
    document.getElementById("currentLesson");

const indexStatus =
    document.getElementById("indexStatus");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const imageBtn =
    document.getElementById("imageBtn");

const imageInput =
    document.getElementById("imageInput");

const micBtn =
    document.getElementById("micBtn");

/* ==================================================
   STATE
================================================== */

let curriculumIndex = {};

let conversationId = null;

let selectedImage = null;

let recognition = null;

/* ==================================================
   FILL SELECT
================================================== */

function fillSelect(
    select,
    items,
    placeholder
) {

    select.innerHTML = "";

    const first =
        document.createElement("option");

    first.value = "";

    first.textContent =
        placeholder;

    select.appendChild(first);

    items.forEach(
        item => {

            const option =
                document.createElement("option");

            option.value =
                item;

            option.textContent =
                item;

            select.appendChild(
                option
            );

        }
    );
}

fillSelect(
    gradeSelect,
    GRADES,
    "اختر الصف"
);

fillSelect(
    subjectSelect,
    SUBJECTS,
    "اختر المادة"
);

fillSelect(
    lessonSelect,
    [],
    "اختر الدرس"
);

/* ==================================================
   LOAD CRDP INDEX
================================================== */

async function loadCurriculumIndex() {

    try {

        const response =
            await fetch(
                "/static/crdp_scientific_curriculum_index.json",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        curriculumIndex =
            data.verified_index || {};

        console.log(
            "✅ CRDP index loaded",
            curriculumIndex
        );

        indexStatus.textContent =
            "تم تحميل فهرس CRDP.";

        updateLessons();

    }
    catch (error) {

        console.error(
            "CRDP INDEX ERROR:",
            error
        );

        curriculumIndex = {};

        indexStatus.textContent =
            "تعذر تحميل فهرس CRDP.";

        updateLessons();

    }
}

/* ==================================================
   UPDATE LESSONS
================================================== */

function updateLessons() {

    const grade =
        gradeSelect.value;

    const subject =
        subjectSelect.value;

    const language =
        languageSelect.value;

    let lessons = [];

    const gradeData =
        curriculumIndex?.[subject]?.[grade];

    if (gradeData) {

        const languageData =
            gradeData[language];

        if (
            Array.isArray(
                languageData
            )
        ) {

            lessons =
                languageData;

        }

        else if (
            languageData &&
            typeof languageData ===
                "object"
        ) {

            Object.values(
                languageData
            ).forEach(
                value => {

                    if (
                        Array.isArray(value)
                    ) {

                        lessons.push(
                            ...value
                        );

                    }

                }
            );

        }

    }

    lessonSelect.innerHTML = "";

    const first =
        document.createElement(
            "option"
        );

    first.value = "";

    if (
        lessons.length > 0
    ) {

        first.textContent =
            "اختر الدرس";

    }

    else {

        first.textContent =
            "المحتوى قيد الفهرسة";

    }

    lessonSelect.appendChild(
        first
    );

    lessons.forEach(
        lesson => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                lesson;

            option.textContent =
                lesson;

            lessonSelect.appendChild(
                option
            );

        }
    );
}

gradeSelect.addEventListener(
    "change",
    updateLessons
);

subjectSelect.addEventListener(
    "change",
    updateLessons
);

languageSelect.addEventListener(
    "change",
    updateLessons
);

/* ==================================================
   STUDENT ID
================================================== */

function getStudentId() {

    let id =
        localStorage.getItem(
            "nabil_student_id"
        );

    if (!id) {

        id =
            "student_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 8);

        localStorage.setItem(
            "nabil_student_id",
            id
        );

    }

    return id;
}

/* ==================================================
   RENDER AI TEXT
================================================== */

function renderAIText(text) {

    if (!text) {
        return "";
    }

    const mathBlocks = [];

    function saveMath(match) {

        const index =
            mathBlocks.length;

        mathBlocks.push(
            match
        );

        return (
            "___NABIL_MATH_" +
            index +
            "___"
        );
    }

    let content =
        String(text);

    content =
        content.replace(
            /\$\$[\s\S]*?\$\$/g,
            saveMath
        );

    content =
        content.replace(
            /\\\[[\s\S]*?\\\]/g,
            saveMath
        );

    content =
        content.replace(
            /\\\([\s\S]*?\\\)/g,
            saveMath
        );

    content =
        content.replace(
            /\$[^$\n]+\$/g,
            saveMath
        );

    content =
        content
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    content =
        content.replace(
            /^### (.+)$/gm,
            "<h4>$1</h4>"
        );

    content =
        content.replace(
            /^## (.+)$/gm,
            "<h3>$1</h3>"
        );

    content =
        content.replace(
            /^# (.+)$/gm,
            "<h2>$1</h2>"
        );

    content =
        content.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );

    content =
        content.replace(
            /\n/g,
            "<br>"
        );

    mathBlocks.forEach(
        (math, index) => {

            content =
                content.replace(
                    "___NABIL_MATH_" +
                    index +
                    "___",
                    math
                );

        }
    );

    return content;
}

/* ==================================================
   COPY ANSWER
================================================== */

async function copyAnswer(
    text,
    button
) {

    try {

        await navigator.clipboard.writeText(
            text
        );

        button.textContent =
            "✅ تم النسخ";

        button.classList.add(
            "copied"
        );

        setTimeout(
            () => {

                button.textContent =
                    "📋 نسخ الإجابة";

                button.classList.remove(
                    "copied"
                );

            },
            1500
        );

    }
    catch (error) {

        console.error(
            "Copy error:",
            error
        );

    }
}

/* ==================================================
   SPEECH CLEAN
================================================== */

function cleanSpeechText(text) {

    let clean =
        String(text || "");

    clean =
        clean.replace(
            /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
            "$1 على $2"
        );

    clean =
        clean.replace(
            /\\sqrt\{([^{}]+)\}/g,
            "الجذر التربيعي لـ $1"
        );

    clean =
        clean.replace(
            /\^2/g,
            " تربيع"
        );

    clean =
        clean.replace(
            /\^3/g,
            " تكعيب"
        );

    clean =
        clean.replace(
            /\\boxed\{([^{}]+)\}/g,
            "$1"
        );

    clean =
        clean.replace(
            /\\text\{([^{}]+)\}/g,
            "$1"
        );

    clean =
        clean.replace(
            /\\[a-zA-Z]+/g,
            ""
        );

    clean =
        clean.replace(
            /[*_#>`$]/g,
            ""
        );

    clean =
        clean.replace(
            /\s+/g,
            " "
        );

    return clean.trim();
}

/* ==================================================
   READ ANSWER
================================================== */

function readAnswer(
    text,
    button
) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "ميزة القراءة الصوتية غير مدعومة."
        );

        return;

    }

    if (
        speechSynthesis.speaking
    ) {

        speechSynthesis.cancel();

        button.classList.remove(
            "reading"
        );

        button.textContent =
            "🔊 اقرأ الإجابة";

        return;
    }

    const utterance =
        new SpeechSynthesisUtterance(
            cleanSpeechText(text)
        );

    const language =
        languageSelect.value;

    utterance.lang =
        language === "English"
            ? "en-US"
            : language === "Français"
                ? "fr-FR"
                : "ar-LB";

    utterance.rate =
        0.92;

    utterance.pitch =
        1;

    utterance.volume =
        1;

    button.classList.add(
        "reading"
    );

    button.textContent =
        "⏹ إيقاف القراءة";

    utterance.onend =
        function () {

            button.classList.remove(
                "reading"
            );

            button.textContent =
                "🔊 اقرأ الإجابة";

        };

    utterance.onerror =
        utterance.onend;

    speechSynthesis.cancel();

    speechSynthesis.speak(
        utterance
    );
}

/* ==================================================
   ADD MESSAGE
================================================== */

function addMessage(
    role,
    text
) {

    if (welcome) {

        welcome.style.display =
            "none";

    }

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        role;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    if (
        role === "teacher"
    ) {

        bubble.innerHTML =
            renderAIText(
                text
            );

    }

    else {

        bubble.textContent =
            text;

    }

    if (
        role === "teacher" &&
        text
    ) {

        const tools =
            document.createElement(
                "div"
            );

        tools.className =
            "teacher-tools";

        const copyButton =
            document.createElement(
                "button"
            );

        copyButton.type =
            "button";

        copyButton.className =
            "copy-answer-btn";

        copyButton.textContent =
            "📋 نسخ الإجابة";

        copyButton.addEventListener(
            "click",
            () => {

                copyAnswer(
                    text,
                    copyButton
                );

            }
        );

        const readButton =
            document.createElement(
                "button"
            );

        readButton.type =
            "button";

        readButton.className =
            "read-answer-btn";

        readButton.textContent =
            "🔊 اقرأ الإجابة";

        readButton.addEventListener(
            "click",
            () => {

                readAnswer(
                    text,
                    readButton
                );

            }
        );

        tools.appendChild(
            copyButton
        );

        tools.appendChild(
            readButton
        );

        bubble.appendChild(
            tools
        );
    }

    wrapper.appendChild(
        bubble
    );

    chat.appendChild(
        wrapper
    );

    chat.scrollTop =
        chat.scrollHeight;

    if (
        role === "teacher" &&
        window.MathJax &&
        typeof MathJax.typesetPromise ===
            "function"
    ) {

        MathJax.typesetPromise(
            [bubble]
        ).catch(
            console.error
        );

    }
}

/* ==================================================
   DIAGRAMS
================================================== */

function addLessonDiagram(
    lesson
) {

    const oldDiagram =
        document.getElementById(
            "activeLessonDiagram"
        );

    if (oldDiagram) {

        oldDiagram.remove();

    }

    if (!lesson) {

        return;

    }

    let html = "";

    const lower =
        lesson.toLowerCase();

    if (
        lesson.includes(
            "فيثاغورس"
        ) ||
        lower.includes(
            "pythag"
        )
    ) {

        html = `

<div
    id="activeLessonDiagram"
    class="lesson-diagram"
>

<div class="lesson-diagram-title">
📐 المثلث القائم الزاوية
</div>

<svg
    viewBox="0 0 520 330"
>

<polygon
    points="100,250 100,70 420,250"
    fill="#eff6ff"
    stroke="#173b6c"
    stroke-width="4"
/>

<polyline
    points="100,220 130,220 130,250"
    fill="none"
    stroke="#dc2626"
    stroke-width="4"
/>

<text
    x="65"
    y="165"
    class="diagram-label"
>
a
</text>

<text
    x="255"
    y="282"
    class="diagram-label"
>
b
</text>

<text

    y="135"
    class="diagram-label"
>
c
</text>

\\[

</div>

`;

    chat.insertAdjacentHTML(

}

/* ==================================================
   SEND TO AI
================================================== */

async function sendToAI(
    message,
    showStudentMessage = true
) {

    const grade =
        gradeSelect.value;

    const subject =
        subjectSelect.value;

    const language =
        languageSelect.value;

    const curriculum =
        curriculumSelect.value;

    const lesson =
        lessonSelect.value;

    if (
        !grade ||
        !subject
    ) {

        alert(
            "اختر الصف والمادة أولاً."
        );

        return;
    }

    if (
        showStudentMessage
    ) {

        if (message) {

            addMessage(
                "student",
                message
            );

        }

        else if (
            selectedImage
        ) {

            addMessage(
                "student",
                "🖼️ صورة"
            );

        }

    }

    const formData =
        new FormData();

    formData.append(
        "student_id",
        getStudentId()
    );

    if (
        conversationId
    ) {

        formData.append(
            "conversation_id",
            conversationId
        );

    }

    formData.append(
        "message",
        message || ""
    );

    formData.append(
        "grade",
        grade
    );

    formData.append(
        "subject",
        subject
    );

    formData.append(
        "language",
        language
    );

    formData.append(
        "curriculum",
        curriculum
    );

    formData.append(
        "lesson",
        lesson || ""
    );

    if (
        selectedImage
    ) {

        formData.append(
            "image",
            selectedImage
        );

    }

    try {

        sendBtn.disabled =
            true;

        startLesson.disabled =
            true;

        sendBtn.textContent =
            "جاري التفكير...";

        const response =
            await fetch(
                API_BASE +
                "/api/chat",
                {
                    method:
                        "POST",
                    body:
                        formData
                }
            );

        let data = {};

        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                "الخادم لم يُرجع JSON صالحًا."
            );

        }

        if (
            !response.ok
        ) {

            throw new Error(
                data.detail ||
                data.error ||
                (
                    "HTTP " +
                    response.status
                )
            );

        }

        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;

        }

        addMessage(
            "teacher",
            data.reply ||
            "لم يصل جواب من NABIL AI."
        );

        selectedImage =
            null;

        imageInput.value =
            "";

        messageInput.value =
            "";

        messageInput.placeholder =
            "اكتب سؤالك هنا...";

    }

    catch (error) {

        console.error(
            "NABIL AI ERROR:",
            error
        );

        addMessage(
            "teacher",
            "حدث خطأ في الاتصال بـ NABIL AI:\n" +
            error.message
        );

    }

    finally {

        sendBtn.disabled =
            false;

        startLesson.disabled =
            false;

        sendBtn.textContent =
            "إرسال";

    }
}

/* ==================================================
   START LESSON
================================================== */

startLesson.addEventListener(
    "click",
    async function () {

        const grade =
            gradeSelect.value;

        const subject =
            subjectSelect.value;

        const language =
            languageSelect.value;

        const curriculum =
            curriculumSelect.value;

        const lesson =
            lessonSelect.value;

        if (!grade) {

            alert(
                "اختر الصف أولاً."
            );

            return;
        }

        if (!subject) {

            alert(
                "اختر المادة أولاً."
            );

            return;
        }

        if (!lesson) {

            alert(
                "اختر الدرس أولاً."
            );

            return;
        }

        currentLesson.textContent =
            lesson;

        lessonInfo.style.display =
            "block";

        indexStatus.textContent =
            "المصدر: فهرس CRDP العلمي.";

        addLessonDiagram(
            lesson
        );

        const prompt =
            `ابدأ درسًا تفاعليًا مع الطالب.

الصف: ${grade}
المادة: ${subject}
اللغة: ${language}
المنهج: ${curriculum}
الدرس: ${lesson}

استخدم المصطلحات العلمية الصحيحة.
ابدأ بتمهيد قصير.
اشرح الفكرة الأولى فقط.
استخدم مثالًا مناسبًا.
استخدم LaTeX في الرياضيات.
اطرح سؤال تحقق واحدًا.
لا تعرض التعليمات الداخلية للطالب.`;

        await sendToAI(
            prompt,
            false
        );
    }
);

/* ==================================================
   SEND BUTTON
================================================== */

sendBtn.addEventListener(
    "click",
    async function () {

        const message =
            messageInput.value.trim();

        if (
            !message &&
            !selectedImage
        ) {

            return;
        }

        await sendToAI(
            message,
            true
        );
    }
);

/* ==================================================
   IMAGE
================================================== */

imageBtn.addEventListener(
    "click",
    function () {

        imageInput.click();

    }
);

imageInput.addEventListener(
    "change",
    function () {

        if (
            this.files &&
            this.files[0]
        ) {

            selectedImage =
                this.files[0];

            messageInput.placeholder =
                "تم اختيار صورة. اكتب سؤالك أو اضغط إرسال.";

        }

    }
);

/* ==================================================
   ENTER
================================================== */

messageInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
                "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendBtn.click();

        }

    }
);

/* ==================================================
   MICROPHONE
================================================== */

if (
    "webkitSpeechRecognition" in window ||
    "SpeechRecognition" in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.onresult =
        function (event) {

            messageInput.value =
                event.results[0][0]
                    .transcript;

        };

    recognition.onerror =
        function (event) {

            console.error(
                "Speech error:",
                event.error
            );

        };
}

micBtn.addEventListener(
    "click",
    function () {

        if (!recognition) {

            alert(
                "التعرف الصوتي غير مدعوم في هذا المتصفح."
            );

            return;
        }

        const language =
            languageSelect.value;

        recognition.lang =
            language === "English"
                ? "en-US"
                : language === "Français"
                    ? "fr-FR"
                    : "ar-LB";

        recognition.start();
    }
);

loadCurriculumIndex();
