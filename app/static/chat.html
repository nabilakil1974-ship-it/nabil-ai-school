<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ نبيل - المنهاج اللبناني</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; direction: rtl; }
        .chat-container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; line-height: 1.5; max-width: 80%; }
        .student { background: #dcf8c6; margin-left: auto; text-align: right; }
        .teacher { background: #e2e8f0; margin-right: auto; text-align: right; }
        .input-area { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>🎓 الأستاذ نبيل - مساعدك التعليمي</h2>
    
    <div class="controls">
        <select id="subject">
            <option value="رياضيات">رياضيات</option>
            <option value="فيزياء">فيزياء</option>
            <option value="كيمياء">كيمياء</option>
        </select>
        <select id="grade">
            <option value="التاسع الأساسي (Brevet)">التاسع الأساسي (Brevet)</option>
            <option value="الثالث ثانوي (Terminale)">الثالث ثانوي (Terminale)</option>
        </select>
        <select id="curriculum">
            <option value="المنهج اللبناني">المنهج اللبناني</option>
        </select>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="previewImage()">
        <button onclick="document.getElementById('imageInput').click()" title="ارفاق صورة">📷</button>
        <input type="text" id="messageInput" placeholder="اكتب سؤالك أو ارفع صورة التمرين هنا..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">إرسال</button>
    </div>
    <div id="imagePreview" style="margin-top: 5px; font-size: 12px; color: #666;"></div>
</div>

<script>
    let selectedImage = null;
    const studentId = "student_" + Math.random().toString(36).substring(2, 9);
    let conversationId = null;

    function previewImage() {
        const fileInput = document.getElementById('imageInput');
        if (fileInput.files && fileInput.files[0]) {
            selectedImage = fileInput.files[0];
            document.getElementById('imagePreview').innerText = "تم اختيار صورة: " + selectedImage.name;
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();

        if (!text && !selectedImage) return;

        // عرض رسالة الطالب
        let displayHtml = text;
        if (selectedImage) {
            displayHtml += `<br><small>[صورة مرفقة: ${selectedImage.name}]</small>`;
        }
        chatBox.innerHTML += `<div class="message student"><b>أنت:</b> ${displayHtml}</div>`;
        
        const formData = new FormData();
        formData.append("student_id", studentId);
        if (text) formData.append("message", text);
        if (selectedImage) formData.append("image", selectedImage);
        if (conversationId) formData.append("conversation_id", conversationId);
        
        formData.append("subject", document.getElementById('subject').value);
        formData.append("grade", document.getElementById('grade').value);
        formData.append("curriculum", document.getElementById('curriculum').value);

        input.value = "";
        document.getElementById('imageInput').value = "";
        document.getElementById('imagePreview').innerText = "";
        selectedImage = null;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if (response.ok) {
                conversationId = data.conversation_id;
                chatBox.innerHTML += `<div class="message teacher"><b>الأستاذ نبيل:</b> ${data.reply}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message teacher" style="color:red;">عذراً، حدث خطأ في السيرفر.</div>`;
            }
        } catch (err) {
            chatBox.innerHTML += `<div class="message teacher" style="color:red;">تعذر الاتصال بالسيرفر.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
