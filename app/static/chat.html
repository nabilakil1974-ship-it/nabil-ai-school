// ==================================================
// FILL SELECT
// ==================================================

function fillSelect(
    select,
    items,
    placeholder
) {

    select.innerHTML = "";

    const first =
        document.createElement("option");

    first.value = "";

    first.textContent =
        placeholder;

    select.appendChild(first);


    items.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item;

        option.textContent = item;

        select.appendChild(option);

    });

}


// ==================================================
// INITIALIZE SELECTS
// ==================================================

fillSelect(
    gradeSelect,
    GRADES,
    "اختر الصف"
);

fillSelect(
    subjectSelect,
    SUBJECTS,
    "اختر المادة"
);

fillSelect(
    curriculumSelect,
    CURRICULA,
    "اختر المنهج"
);

fillSelect(
    lessonSelect,
    [],
    "اختر الدرس"
);


// ==================================================
// UPDATE LESSONS
// ==================================================

function updateLessons() {

    const grade =
        gradeSelect.value;

    const subject =
        subjectSelect.value;


    let lessons = [];


    if (
        LESSONS[grade] &&
        LESSONS[grade][subject]
    ) {

        lessons =
            LESSONS[grade][subject];

    }


    lessonSelect.innerHTML = "";


    const first =
        document.createElement("option");


    first.value = "";


    if (lessons.length > 0) {

        first.textContent =
            "اختر الدرس";

    }
    else {

        first.textContent =
            "اكتب اسم الدرس في سؤالك";

    }


    lessonSelect.appendChild(first);


    lessons.forEach(
        lesson => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                lesson;

            option.textContent =
                lesson;

            lessonSelect.appendChild(
                option
            );

        }
    );

}

    if (!id) {

        id =

            "_" +
            Math.random()
                .toString(36)
                .substring(2, 8);


        localStorage.setItem(
            "nabil_student_id",
            id

    return id;

}

        String(text);


    // ==============================================
    // حفظ المعادلات قبل HTML
    // ==============================================

    content =
        content.replace(
            /\$\$[\s\S]*?\$\$/g,
            saveMath
        );


    content =
        content.replace(
            /\\\[[\s\S]*?\\\]/g,
            saveMath
        );


    content =
        content.replace(
            /\\\([\s\S]*?\\\)/g,
            saveMath
        );


    content =
        content.replace(
            /\$[^$\n]+\$/g,
            saveMath
        );


    // ==============================================
    // حماية HTML
    // ==============================================

    content =
        content
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );


    // ==============================================
    // العناوين
    // ==============================================

    content =
        content.replace(
            /^### (.+)$/gm,
            "<h4>$1</h4>"
        );


    content =
        content.replace(
            /^## (.+)$/gm,
            "<h3>$1</h3>"
        );


    content =
        content.replace(
            /^# (.+)$/gm,
            "<h2>$1</h2>"
        );


    // ==============================================
    // Bold
    // ==============================================

    content =
        content.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


    // ==============================================
    // Italic
    // ==============================================

    content =
        content.replace(
            /\*(.+?)\*/g,
            "<em>$1</em>"
        );


    // ==============================================
    // القوائم
    // ==============================================

    content =
        content.replace(
            /^[-•] (.+)$/gm,
            "• $1"
        );


    // ==============================================
    // الأسطر
    // ==============================================

    content =
        content.replace(
            /\n/g,
            "<br>"
        );


    // ==============================================
    // إعادة المعادلات
    // ==============================================

    mathBlocks.forEach(
        (math, index) => {

            const token =
                `___NABIL_MATH_${index}___`;

            content =
                content.replace(
                    token,
                    math
                );

        }
    );


    return content;

}


// ==================================================
// COPY ANSWER
// ==================================================

async function copyAnswer(
    text,
    button
) {

    try {

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            await navigator.clipboard.writeText(
                text
            );

        }
        else {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                text;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();

        }


        const oldText =
            button.textContent;


        button.textContent =
            "✅ تم النسخ";


        button.classList.add(
            "copied"
        );


        setTimeout(
            function () {

                button.textContent =
                    oldText;

                button.classList.remove(
                    "copied"
                );

            },
            1500
        );

    }
    catch (error) {

        console.error(
            "Copy error:",
            error
        );

        alert(
            "تعذر نسخ الإجابة."
        );

    }

}


// ==================================================
// ADD MESSAGE
// ==================================================

function addMessage(
    role,
    text,
    sources = []
) {

    if (welcome) {

        welcome.style.display =
            "none";

    }


    const wrapper =
        document.createElement("div");


    wrapper.className =
        "message " + role;


    const bubble =
        document.createElement("div");


    bubble.className =
        "bubble";


    if (role === "teacher") {

        bubble.innerHTML =
            renderAIText(text);

    }
    else {

        bubble.textContent =
            text;

    }


    // ==============================================
    // COPY BUTTON
    // ==============================================

    if (
        role === "teacher" &&
        text
    ) {

        const tools =
            document.createElement("div");


        tools.className =
            "teacher-tools";


        const copyButton =
            document.createElement("button");


        copyButton.type =
            "button";


        copyButton.className =
            "copy-answer-btn";


        copyButton.textContent =
            "📋 نسخ الإجابة";


        copyButton.addEventListener(
            "click",
            function () {

                copyAnswer(
                    text,
                    copyButton
                );

            }
        );


        tools.appendChild(
            copyButton
        );


        bubble.appendChild(
            tools
        );

    }


    // ==============================================
    // SOURCES
    // ==============================================

    if (
        sources &&
        sources.length
    ) {

        const sourceDiv =
            document.createElement(
                "div"
            );


        sourceDiv.className =
            "sources";


        const sourceText =
            sources
                .map(
                    source => {

                        if (
                            typeof source ===
                            "string"
                        ) {

                            return source;

                        }


                        if (
                            source &&
                            source.title
                        ) {

                            return source.title;

                        }


                        return "";

                    }
                )
                .filter(Boolean)
                .join("، ");


        if (sourceText) {

            sourceDiv.textContent =
                "المصادر: " +
                sourceText;


            bubble.appendChild(
                sourceDiv
            );

        }

    }


    wrapper.appendChild(
        bubble
    );


    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
        chat.scrollHeight;


    // ==============================================
    // MATHJAX
    // ==============================================

    if (
        role === "teacher" &&
        window.MathJax &&
        typeof MathJax.typesetPromise ===
            "function"
    ) {

        MathJax.typesetPromise(
            [bubble]
        ).catch(
            error => {

                console.error(
                    "MathJax error:",
                    error
                );

            }
        );

    }

}

// ==================================================
// SEND TO AI
// ==================================================

async function sendToAI(
    message,
    showStudentMessage = true
) {


    const grade =
        gradeSelect.value;


    const subject =
        subjectSelect.value;


    const language =
        languageSelect.value;


    const curriculum =
        curriculumSelect.value;


    const lesson =
        lessonSelect.value;


    if (!grade || !subject) {

        alert(
            "اختر الصف والمادة أولاً."
        );

        return;

    }


    // ==============================================
    // عرض رسالة الطالب فقط عند الحاجة
    // ==============================================

    if (showStudentMessage) {

        if (message) {

            addMessage(
                "student",
                message
            );

        }
        else if (selectedImage) {

            addMessage(
                "student",
                "🖼️ صورة"
            );

        }

    }


    messageInput.value = "";


    const formData =
        new FormData();


    formData.append(
        "student_id",
        getStudentId()
    );


    if (conversationId) {

        formData.append(
            "conversation_id",
            conversationId
        );

    }


    formData.append(
        "message",
        message || ""
    );


    formData.append(
        "grade",
        grade
    );


    formData.append(
        "subject",
        subject
    );


    formData.append(
        "language",
        language
    );


    formData.append(
        "curriculum",
        curriculum
    );


    formData.append(
        "lesson",
        lesson || ""
    );


    if (selectedImage) {

        formData.append(
            "image",
            selectedImage
        );

    }


    try {


        sendBtn.disabled =
            true;


        startLesson.disabled =
            true;


        sendBtn.textContent =
            "جاري التفكير...";


        const response =
            await fetch(
                API_BASE +
                "/api/chat",
                {
                    method: "POST",
                    body: formData
                }
            );


        let data = {};


        try {

            data =
                await response.json();

        }
        catch (error) {

            throw new Error(
                "الخادم لم يُرجع JSON صالحًا."
            );

        }


        if (!response.ok) {

            throw new Error(

                data.detail ||

                data.error ||

                "HTTP " +
                response.status

            );

        }


        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;

        }


        addMessage(

            "teacher",

            data.reply ||

            "لم يصل جواب من NABIL AI.",

            data.sources || []

        );


        selectedImage =
            null;


        imageInput.value =
            "";


        messageInput.placeholder =
            "اكتب سؤالك هنا...";


    }
    catch (error) {


        console.error(
            "NABIL AI ERROR:",
            error
        );


        addMessage(

            "teacher",

            "حدث خطأ في الاتصال بـ NABIL AI:\n" +
            error.message

        );

    }
    finally {


        sendBtn.disabled =
            false;


        startLesson.disabled =
            false;


        sendBtn.textContent =
            "إرسال";

    }

}

// ==================================================
// SPEECH RECOGNITION
// ==================================================

let recognition = null;


if (
    "webkitSpeechRecognition" in window ||
    "SpeechRecognition" in window
) {


    const SpeechRecognition =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onresult =
        function (event) {


            const text =
                event.results[0][0]
                    .transcript;


            messageInput.value =
                text;

        };


    recognition.onerror =
        function (event) {

            console.error(
                "Speech error:",
                event.error
            );

        };

}

// MICROPHONE
// ==================================================

micBtn.addEventListener(
    "click",
    function () {


        if (!recognition) {

            alert(
                "التعرف الصوتي غير مدعوم في هذا المتصفح."
            );

            return;

        }


        const language =
            languageSelect.value;


        if (
            language ===
            "English"
        ) {

            recognition.lang =
                "en-US";

        }
        else if (
            language ===
            "Français"
        ) {

            recognition.lang =
                "fr-FR";

        }
        else {

            recognition.lang =
                "ar-LB";

        }


        recognition.start();

    }
);
