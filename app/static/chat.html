<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النبيل التعليمية الذكية</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #173b6c, #2563eb);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            text-align: center;
        }

        select,
        button {
            margin: 8px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }

        button {
            background: #16a34a;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    منصة النبيل التعليمية الذكية
</div>

<div class="container">

    <div class="card">

        <h2>NABIL AI 👨‍🏫</h2>

        <p>
            الواجهة تعمل بنجاح.
        </p>

        <select>
            <option>الصف التاسع</option>
        </select>

        <select>
            <option>رياضيات</option>
        </select>

        <select>
            <option>العربية</option>
        </select>

        <button>
            ▶ ابدأ الدرس
        </button>

    </div>

</div>

</body>
</html>
