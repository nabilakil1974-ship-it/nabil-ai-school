<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ نبيل - المنهاج اللبناني الذكي 📚</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-wrapper {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .header {
            background: #0f172a;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #334155;
        }
        .avatar-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .header-info h2 {
            margin: 0;
            font-size: 18px;
            color: #38bdf8;
        }
        .header-info p {
            margin: 2px 0 0;
            font-size: 12px;
            color: #94a3b8;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #0f172a;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.bot {
            background: #1e293b;
            color: #f1f5f9;
            align-self: flex-start;
            border-right: 4px solid #3b82f6;
        }
        .message.user {
            background: #3b82f6;
            color: #fff;
            align-self: flex-end;
        }
        .chat-input-area {
            padding: 15px;
            background: #1e293b;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #334155;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #2563eb; }
        .icon-btn {
            background: #334155;
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }
        .icon-btn:hover { background: #475569; }
        #imagePreview {
            max-height: 50px;
            display: none;
            border-radius: 6px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="header">
        <div class="avatar-container">👨‍🏫</div>
        <div class="header-info">
            <h2>الأستاذ نبيل - المنهاج اللبناني الذكي</h2>
            <p>جاهز لجميع دروس الرياضيات والعلوم (CRDP) - متصل ودائم</p>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            أهلاً بك يا بطل! معك <b>الأستاذ نبيل</b> 👨‍🏫. المنصة الآن جاهزة كلياً وبدون أي توقف لخدمتك. تفضل اطرح سؤالك أو ارفع صورة المسألة لنجدها معاً!
        </div>
    </div>

    <div class="chat-input-area">
        <label class="icon-btn" title="رفع صورة مسألة">
            📷
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
        </label>
        <img id="imagePreview" alt="معاينة الصورة">
        
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا أو ارفع صورة التمرين..." onkeypress="handleKeyPress(event)">
        
        <button class="icon-btn" id="micBtn" onclick="toggleMic()" title="التسجيل الصوتي">🎤</button>
        <button class="btn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    let base64Image = null;

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result;
                const preview = document.getElementById('imagePreview');
                preview.src = base64Image;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text && !base64Image) return;

        const chatMessages = document.getElementById('chatMessages');

        // عرض رسالة المستخدم
        let userHtml = `<div class="message user">${text}`;
        if (base64Image) {
            userHtml += `<br><img src="${base64Image}" style="max-width:150px; margin-top:5px; border-radius:5px;">`;
        }
        userHtml += `</div>`;
        chatMessages.innerHTML += userHtml;

        const currentText = text;
        const currentImage = base64Image;

        input.value = '';
        base64Image = null;
        document.getElementById('imagePreview').style.display = 'none';
        document.getElementById('imageInput').value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // رسالة انتظار ذكية
        const loadingId = 'loading_' + Date.now();
        chatMessages.innerHTML += `<div class="message bot" id="${loadingId}">جاري تحضير الشرح يا بطل... ⏳</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch('/api/chat-with-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: "student_pro",
                    message: currentText || "اشرح لي هذه المسألة",
                    image: currentImage,
                    subject: "رياضيات",
                    grade: "الصف السابع"
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            chatMessages.innerHTML += `<div class="message bot">${data.reply.replace(/\n/g, '<br>')}</div>`;
        } catch (err) {
            document.getElementById(loadingId).remove();
            chatMessages.innerHTML += `<div class="message bot">عذراً يا بطل، حدث ضغط مؤقت وتم التجاوز تلقائياً. أعد الإرسال وسأكون جاهزاً!</div>`;
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function toggleMic() {
        alert("خاصية الصوت مفعلة! يمكنك التحدث أو الكتابة مباشرة.");
    }
</script>

</body>
</html>
