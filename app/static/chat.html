/* ================================================
   SELECTS
================================================ */


function fillSelect(
    select,
    items,
    placeholder
) {

    select.innerHTML = "";


    const first =
        document.createElement(
            "option"
        );


    first.value = "";

    first.textContent =
        placeholder;


    select.appendChild(
        first
    );


    items.forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                item;


            option.textContent =
                item;


            select.appendChild(
                option
            );

        }
    );

}


fillSelect(
    gradeSelect,
    GRADES,
    "اختر الصف"
);


fillSelect(
    subjectSelect,
    SUBJECTS,
    "اختر المادة"
);


fillSelect(
    lessonSelect,
    [],
    "اختر الدرس"
);


/* ================================================
   CURRICULUM INDEX
================================================ */


async function loadCurriculumIndex() {

    try {

        const response =
            await fetch(
                "/static/crdp_scientific_curriculum_index.json",
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        curriculumIndex =
            data.verified_index ||
            {};


        indexStatus.textContent =
            "تم تحميل فهرس الدروس.";


        updateLessons();

    }

    catch(error) {

        console.error(
            "INDEX ERROR:",
            error
        );


        curriculumIndex = {};


        indexStatus.textContent =
            "تعذر تحميل فهرس الدروس.";


        updateLessons();

    }

}


/* ================================================
   UPDATE LESSONS
================================================ */


function updateLessons() {

    const grade =
        gradeSelect.value;


    const subject =
        subjectSelect.value;


    const language =
        languageSelect.value;


    let lessons = [];


    const gradeData =
        curriculumIndex?.[subject]?.[grade];


    if (gradeData) {

        const languageData =
            gradeData[language];


        if (
            Array.isArray(
                languageData
            )
        ) {

            lessons.push(
                ...languageData
            );

        }

        else if (
            languageData &&
            typeof languageData ===
                "object"
        ) {

            Object.values(
                languageData
            ).forEach(
                value => {

                    if (
                        Array.isArray(
                            value
                        )
                    ) {

                        lessons.push(
                            ...value
                        );

                    }

                }
            );

        }


        if (
            lessons.length === 0
        ) {

            Object.values(
                gradeData
            ).forEach(
                value => {

                    if (
                        Array.isArray(
                            value
                        )
                    ) {

                        lessons.push(
                            ...value
                        );

                    }

                    else if (
                        value &&
                        typeof value ===
                            "object"
                    ) {

                        Object.values(
                            value
                        ).forEach(
                            nested => {

                                if (
                                    Array.isArray(
                                        nested
                                    )
                                ) {

                                    lessons.push(
                                        ...nested
                                    );

                                }

                            }
                        );

                    }

                }
            );

        }

    }


    lessons = [
        ...new Set(
            lessons
        )
    ];


    lessonSelect.innerHTML =
        "";


    const first =
        document.createElement(
            "option"
        );


    first.value = "";


    first.textContent =
        lessons.length
            ? "اختر الدرس"
            : "لا توجد دروس مفهرسة بعد";


    lessonSelect.appendChild(
        first
    );


    lessons.forEach(
        lesson => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                lesson;


            option.textContent =
                lesson;


            lessonSelect.appendChild(
                option
            );

        }
    );

}


gradeSelect.addEventListener(
    "change",
    updateLessons
);


subjectSelect.addEventListener(
    "change",
    updateLessons
);


languageSelect.addEventListener(
    "change",
    updateLessons
);

function getStudentId() {

    let id =
        localStorage.getItem(
            "nabil_student_id"
        );


    if (!id) {

        id =
            "student_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8);


        localStorage.setItem(
            "nabil_student_id",
            id
        );

    }


    return id;

}


/* ================================================
   TEXT RENDER
================================================ */


function renderAIText(text) {

    if (!text) {

        return "";

    }


    const mathBlocks = [];


    function saveMath(match) {

        const i =
            mathBlocks.length;


        mathBlocks.push(
            match
        );


        return (
            "___NABIL_MATH_" +
            i +
            "___"
        );

    }


    let content =
        String(text);


    content =
        content.replace(
            /\$\$[\s\S]*?\$\$/g,
            saveMath
        );


    content =
        content.replace(
            /\\\[[\s\S]*?\\\]/g,
            saveMath
        );


    content =
        content.replace(
            /\\\([\s\S]*?\\\)/g,
            saveMath
        );


    content =
        content.replace(
            /\$[^$\n]+\$/g,
            saveMath
        );


    content =
        content
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            );


    content =
        content.replace(
            /^### (.+)$/gm,
            "<h4>$1</h4>"
        );


    content =
        content.replace(
            /^## (.+)$/gm,
            "<h3>$1</h3>"
        );


    content =
        content.replace(
            /^# (.+)$/gm,
            "<h2>$1</h2>"
        );


    content =
        content.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );


    content =
        content.replace(
            /\n/g,
            "<br>"
        );


    mathBlocks.forEach(
        (math, i) => {

            content =
                content.replace(
                    "___NABIL_MATH_" +
                    i +
                    "___",
                    math
                );

        }
    );


    return content;

}

async function copyAnswer(text) {

    try {

        await navigator
            .clipboard
            .writeText(
                text
            );

    }

    catch(error) {

        console.error(
            "COPY ERROR:",
            error
        );

    }

}


/* ================================================
   SPEECH
================================================ */


function cleanSpeechText(text) {

    return String(
        text || ""
    )

        .replace(
            /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
            "$1 على $2"
        )

        .replace(
            /\\sqrt\{([^{}]+)\}/g,
            "الجذر التربيعي لـ $1"
        )

        .replace(
            /\^2/g,
            " تربيع"
        )

        .replace(
            /\^3/g,
            " تكعيب"
        )

        .replace(
            /\\boxed\{([^{}]+)\}/g,
            "$1"
        )

        .replace(
            /\\text\{([^{}]+)\}/g,
            "$1"
        )

        .replace(
            /\\[a-zA-Z]+/g,
            ""
        )

        .replace(
            /[*_#>`$]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}

    ) {

        alert(
            "القراءة الصوتية غير مدعومة."
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            cleanSpeechText(
                text
            )
        );


    const language =
        languageSelect.value;


    utterance.lang =
        language ===
            "English"

            ? "en-US"

            : language ===
                "Français"

                ? "fr-FR"

                : "ar-LB";


    utterance.rate =
        .92;


    speechSynthesis.speak(
        utterance
    );

}


/* ================================================
   GRAPH FUNCTIONS
================================================ */


function functionY(
    kind,
    x
) {

    switch(kind) {

        case "ln":

            return (
                x > 0
                    ? Math.log(x)
                    : null
            );


        case "exp":

            return Math.exp(x);


        case "square":

            return x * x;


        case "linear":

            return x;


        case "inverse":

            return (
                Math.abs(x) <
                    0.0001

                    ? null

                    : 1 / x
            );


        default:

            return null;

    }

}


/* ================================================
   FUNCTION GRAPH
================================================ */


function renderFunction(
    drawing
) {

    const width = 820;

    const height = 430;


    const left = 58;

    const right = 28;

    const top = 28;

    const bottom = 48;


    let xMin =
        Number(
            drawing.x_min ??
            -1
        );


    let xMax =
        Number(
            drawing.x_max ??
            7
        );


    let yMin =
        Number(
            drawing.y_min ??
            -3.5
        );


    let yMax =
        Number(
            drawing.y_max ??
            2.5
        );


    if (
        drawing.function ===
        "ln"
    ) {

        xMin =
            Math.min(
                xMin,
                -1
            );


        xMax =
            Math.max(
                xMax,
                6.5
            );


        yMin =
            Math.min(
                yMin,
                -3.5
            );


        yMax =
            Math.max(
                yMax,
                2.5
            );

    }


    const plotWidth =
        width -
        left -
        right;


    const plotHeight =
        height -
        top -
        bottom;


    function sx(x) {

        return (
            left +
            (
                (x - xMin) /
                (xMax - xMin)
            ) *
            plotWidth
        );

    }


    function sy(y) {

        return (
            top +
            (
                (yMax - y) /
                (yMax - yMin)
            ) *
            plotHeight
        );

    }


    let path = "";

    let penDown =
        false;


    const steps =
        850;


    for (
        let i = 0;
        i <= steps;
        i++
    ) {

        const x =
            xMin +
            (
                (xMax - xMin) *
                i /
                steps
            );


        const y =
            functionY(
                drawing.function,
                x
            );


        if (
            y === null ||
            !Number.isFinite(y)
        ) {

            penDown =
                false;

            continue;

        }


        if (
            y <
                yMin - 1 ||
            y >
                yMax + 1
        ) {

            penDown =
                false;

            continue;

        }


        const px =
            sx(x);


        const py =
            sy(y);


        if (!penDown) {

            path +=
                `M ${px} ${py} `;


            penDown =
                true;

        }

        else {

            path +=
                `L ${px} ${py} `;

        }

    }


    let grid = "";

    let ticks = "";


    for (
        let x =
            Math.ceil(xMin);
        x <=
            Math.floor(xMax);
        x++
    ) {

        const px =
            sx(x);


        grid += `
            <line
                x1="${px}"
                y1="${top}"
                x2="${px}"
                y2="${height-bottom}"
                stroke="#dfe5ec"
                stroke-width="1"
            />
        `;


        if (x !== 0) {

            ticks += `
                <text
                    x="${px}"
                    y="${sy(0) + 24}"
                    text-anchor="middle"
                    class="graph-tick"
                >
                    ${x}
                </text>
            `;

        }

    }


    for (
        let y =
            Math.ceil(yMin);
        y <=
            Math.floor(yMax);
        y++
    ) {

        const py =
            sy(y);


        grid += `
            <line
                x1="${left}"
                y1="${py}"
                x2="${width-right}"
                y2="${py}"
                stroke="#dfe5ec"
                stroke-width="1"
            />
        `;


        ticks += `
            <text
                x="${sx(0) - 18}"
                y="${py + 5}"
                text-anchor="end"
                class="graph-tick"
            >
                ${y}
            </text>
        `;

    }


    let points = "";


    const pointList =
        Array.isArray(
            drawing.points
        )
        ? [...drawing.points]
        : [];


    if (
        drawing.function ===
        "ln"
    ) {

        const specialPoints = [

            {
                x: 1,
                y: 0,
                label: "(1, 0)",
                color: "#15803d"
            },

            {
                x:
                    Math.E,
                y: 1,
                label: "(e, 1)",
                color: "#7e22ce"
            },

            {
                x:
                    1 / Math.E,
                y: -1,
                label:
                    "(1/e, -1)",
                color:
                    "#dc2626"
            }

        ];


        specialPoints.forEach(
            p => {

                const exists =
                    pointList.some(
                        item =>
                            Math.abs(
                                Number(
                                    item.x
                                ) -
                                p.x
                            ) <
                            0.01 &&
                            Math.abs(
                                Number(
                                    item.y
                                ) -
                                p.y
                            ) <
                            0.01
                    );


                if (!exists) {

                    pointList.push(
                        p
                    );

                }

            }
        );

    }


    pointList.forEach(
        point => {

            const px =
                sx(
                    Number(
                        point.x
                    )
                );


            const py =
                sy(
                    Number(
                        point.y
                    )
                );


            const color =
                point.color ||
                "#dc2626";


            points += `
                <circle
                    cx="${px}"
                    cy="${py}"
                    r="6"
                    fill="${color}"
                />

                <text
                    x="${px + 10}"
                    y="${py - 12}"
                    class="graph-label"
                    fill="${color}"
                    style="
                        fill:${color}
                        !important;
                    "
                >
                    ${point.label || ""}
                </text>
            `;

        }
    );


    let asymptote =
        "";


    if (
        drawing.vertical_asymptote !==
            undefined &&
        drawing.vertical_asymptote !==
            null
    ) {

        const value =
            Number(
                drawing.vertical_asymptote
            );


        const px =
            sx(value);


        asymptote = `
            <line
                x1="${px}"
                y1="${top}"
                x2="${px}"
                y2="${height-bottom}"
                stroke="#ef4444"
                stroke-width="3"
                stroke-dasharray="8 6"
            />

            <text
                x="${px + 14}"
                y="${height-bottom-10}"
                class="graph-label"
                fill="#dc2626"
                style="
                    fill:#dc2626
                    !important;
                "
            >
                x = ${value}
            </text>
        `;

    }


    const xAxisY =
        (
            yMin <= 0 &&
            yMax >= 0
        )
        ? sy(0)
        : height -
          bottom;


    const yAxisX =
        (
            xMin <= 0 &&
            xMax >= 0
        )
        ? sx(0)
        : left;


    let properties =
        "";


    if (
        drawing.function ===
        "ln"
    ) {

        properties = `

            <strong>
                خصائص الدالة
                ln(x)
            </strong>

            <div>
                • المجال:
                \(]0,+\infty[\)
            </div>

            <div>
                • المدى:
                \(\mathbb{R}\)
            </div>

            <div>
                • تمر بالنقطة:
                \((1,0)\)
            </div>

            <div>
                • تمر بالنقطة:
                \((e,1)\)
            </div>

            <div>
                • متزايدة على مجالها
            </div>

            <div>
                • مقعّرة نحو الأسفل
            </div>

            <div>
                • المستقيم
                \(x=0\)
                مقارب رأسي
            </div>

        `;

    }

    else {

        properties = `

            <strong>
                خصائص الرسم
            </strong>

            <div>
                الدالة:
                ${drawing.expression || ""}
            </div>

        `;

    }


    return `

        <div class="drawing-title">
            📊
            ${
                drawing.title ||
                drawing.expression ||
                "الرسم البياني"
            }
        </div>


        <div class="graph-shell">


            <div class="graph-layout">


                <div class="graph-canvas">


                    <svg
                        viewBox="
                            0 0
                            ${width}
                            ${height}
                        "
                        role="img"
                    >


                        <defs>

                            <marker
                                id="arrowX"
                                markerWidth="8"
                                markerHeight="8"
                                refX="6"
                                refY="3"
                                orient="auto"
                            >

                                <path
                                    d="
                                        M0,0
                                        L0,6
                                        L7,3
                                        z
                                    "
                                    fill="#111827"
                                />

                            </marker>

                        </defs>


                        ${grid}


                        <line
                            x1="${left}"
                            y1="${xAxisY}"
                            x2="${width-right}"
                            y2="${xAxisY}"
                            stroke="#111827"
                            stroke-width="2"
                            marker-end="
                                url(#arrowX)
                            "
                        />


                        <line
                            x1="${yAxisX}"
                            y1="${height-bottom}"
                            x2="${yAxisX}"
                            y2="${top}"
                            stroke="#111827"
                            stroke-width="2"
                            marker-end="
                                url(#arrowX)
                            "
                        />


                        ${ticks}


                        ${asymptote}


                        <path
                            d="${path}"
                            fill="none"
                            stroke="#1672e8"
                            stroke-width="4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />


                        ${points}


                        <text
                            x="${width-right-12}"
                            y="${xAxisY-11}"
                            class="
                                graph-axis-label
                            "
                        >
                            x
                        </text>


                        <text
                            x="${yAxisX+13}"
                            y="${top+17}"
                            class="
                                graph-axis-label
                            "
                        >
                            y
                        </text>


                    </svg>


                </div>


                <div
                    class="
                        graph-properties
                    "
                >

                    ${properties}

                </div>


            </div>


        </div>

    `;

}

/* ================================================
   CHEMISTRY MOLECULE
================================================ */


function renderMolecule(
    drawing
) {

    const atoms =
        drawing.atoms ||
        [];


    if (!atoms.length) {

        return "";

    }


    const width =
        720;


    const centerY =
        210;


    const gap =
        atoms.length > 1

            ? 470 /
              (
                atoms.length - 1
              )

            : 0;


    let output = "";


    atoms.forEach(
        (atom, index) => {

            const x =
                atoms.length === 1

                    ? 360

                    : 125 +
                      gap *
                      index;


            if (
                index <
                atoms.length - 1
            ) {

                const nextX =
                    125 +
                    gap *
                    (
                        index + 1
                    );


                output += `

                    <line
                        x1="${x + 38}"
                        y1="${centerY}"
                        x2="${nextX - 38}"
                        y2="${centerY}"
                        stroke="#334155"
                        stroke-width="6"
                    />

                `;

            }


            output += `

                <circle
                    cx="${x}"
                    cy="${centerY}"
                    r="42"
                    fill="#eef6ff"
                    stroke="#2563eb"
                    stroke-width="4"
                />


                <text
                    x="${x}"
                    y="${centerY + 8}"
                    text-anchor="middle"
                    class="graph-label"
                >
                    ${
                        atom.label ||
                        "X"
                    }
                </text>

            `;

        }
    );


    return `

        <div class="drawing-title">

            🧪
            ${
                drawing.title ||
                "البنية الجزيئية"
            }

        </div>


        <div class="graph-shell">


            <svg
                viewBox="
                    0 0
                    ${width}
                    420
                "
            >

                ${output}

            </svg>


        </div>

    `;

}


/* ================================================
   DRAWING DISPATCH
================================================ */


function renderDrawing(
    drawing
) {

    if (
        !drawing ||
        !drawing.type
    ) {

        return `

            <div class="drawing-title">

                لا توجد رسمة مرتبطة
                بهذا الجواب.

            </div>

        `;

    }


    switch(
        drawing.type
    ) {

        case "function":

            return renderFunction(
                drawing
            );


        case "right_triangle":

            return renderTriangle(
                drawing
            );


        case "circle_tangent":

            return renderCircle(
                drawing
            );


        case "forces":

            return renderForces(
                drawing
            );


        case "molecule":

            return renderMolecule(
                drawing
            );


        default:

            return `

                <div class="drawing-title">

                    لا يوجد محرّك رسم
                    لهذا النوع بعد.

                </div>

            `;

    }

}

function addMessage(
    role,
    text,
    drawing = null
) {

    if (welcome) {

        welcome.style.display =
            "none";

    }


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        role;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    if (
        role ===
        "teacher"
    ) {

        bubble.innerHTML =
            renderAIText(
                text
            );

    }

    else {

        bubble.textContent =
            text;

    }


    if (
        role ===
            "teacher" &&
        text
    ) {

        const tools =
            document.createElement(
                "div"
            );


        tools.className =
            "teacher-tools";


        const copyButton =
            document.createElement(
                "button"
            );


        copyButton.type =
            "button";


        copyButton.textContent =
            "📋 نسخ الإجابة";


        copyButton.onclick =
            () => {

                copyAnswer(
                    text
                );

            };


        const readButton =
            document.createElement(
                "button"
            );


        readButton.type =
            "button";


        readButton.textContent =
            "🔊 اقرأ الإجابة";


        readButton.onclick =
            () => {

                readAnswer(
                    text
                );

            };


        tools.appendChild(
            copyButton
        );


        tools.appendChild(
            readButton
        );


        if (drawing) {

            const drawingBox =
                document.createElement(
                    "div"
                );


            drawingBox.className =
                "answer-drawing";


            const drawButton =
                document.createElement(
                    "button"
                );


            drawButton.type =
                "button";


            drawButton.className =
                "draw-answer-btn";


            drawButton.textContent =
                "📐 إظهار الرسمة";


            drawButton.onclick =
                () => {

                    const visible =
                        drawingBox
                            .classList
                            .contains(
                                "visible"
                            );


                    if (visible) {

                        drawingBox
                            .classList
                            .remove(
                                "visible"
                            );


                        drawButton
                            .classList
                            .remove(
                                "active"
                            );


                        drawButton.textContent =
                            "📐 إظهار الرسمة";

                    }

                    else {

                        if (
                            !drawingBox
                                .dataset
                                .rendered
                        ) {

                            drawingBox.innerHTML =
                                renderDrawing(
                                    drawing
                                );


                            drawingBox
                                .dataset
                                .rendered =
                                "true";


                            if (
                                window.MathJax &&
                                typeof
                                MathJax.typesetPromise ===
                                    "function"
                            ) {

                                MathJax
                                    .typesetPromise(
                                        [
                                            drawingBox
                                        ]
                                    )
                                    .catch(
                                        console.error
                                    );

                            }

                        }


                        drawingBox
                            .classList
                            .add(
                                "visible"
                            );


                        drawButton
                            .classList
                            .add(
                                "active"
                            );


                        drawButton.textContent =
                            "📐 إخفاء الرسمة";

                    }

                };


            tools.appendChild(
                drawButton
            );


            bubble.appendChild(
                tools
            );


            bubble.appendChild(
                drawingBox
            );

        }

        else {

            bubble.appendChild(
                tools
            );

        }

    }


    wrapper.appendChild(
        bubble
    );


    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
        chat.scrollHeight;


    if (
        role === "teacher" &&
        window.MathJax &&
        typeof MathJax.typesetPromise ===
            "function"
    ) {

        MathJax
            .typesetPromise(
                [bubble]
            )
            .catch(
                console.error
            );

    }

}

        if (message) {

            addMessage(
                "student",
                message
            );

        }

        else if (
            selectedImage
        ) {

            addMessage(
                "student",
                "🖼️ صورة"
            );

        }

    }


    const formData =
        new FormData();


    formData.append(
        "student_id",
        getStudentId()
    );


    if (
        conversationId
    ) {

        formData.append(
            "conversation_id",
            conversationId
        );

    }


    formData.append(
        "message",
        message || ""
    );


    formData.append(
        "grade",
        grade
    );


    formData.append(
        "subject",
        subject
    );


    formData.append(
        "language",
        language
    );


    formData.append(
        "curriculum",
        FIXED_CURRICULUM
    );


    formData.append(
        "lesson",
        lesson || ""
    );


    if (
        selectedImage
    ) {

        formData.append(
            "image",
            selectedImage
        );

    }


    try {

        sendBtn.disabled =
            true;


        startLesson.disabled =
            true;


        sendBtn.textContent =
            "جاري التفكير...";


        const response =
            await fetch(
                API_BASE +
                "/api/chat",
                {
                    method:
                        "POST",

                    body:
                        formData
                }
            );


        let data = {};


        try {

            data =
                await response.json();

        }

        catch {

            throw new Error(
                "الخادم لم يُرجع JSON صالحًا."
            );

        }


        if (
            !response.ok
        ) {

            throw new Error(
                data.detail ||
                data.error ||
                (
                    "HTTP " +
                    response.status
                )
            );

        }


        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;

        }


        addMessage(
            "teacher",

            data.reply ||
            "لم يصل جواب.",

            data.drawing ||
            null
        );


        selectedImage =
            null;


        imageInput.value =
            "";


        messageInput.value =
            "";


        messageInput.placeholder =
            "اكتب سؤالك هنا...";

    }

    catch(error) {

        console.error(
            "NABIL AI ERROR:",
            error
        );


        addMessage(
            "teacher",

            "حدث خطأ في الاتصال بـ NABIL AI:\n" +
            error.message
        );

    }

    finally {

        sendBtn.disabled =
            false;


        startLesson.disabled =
            false;


        sendBtn.textContent =
            "إرسال";

    }

}


/* ================================================
   START LESSON
================================================ */


startLesson.addEventListener(
    "click",

    async () => {

        const grade =
            gradeSelect.value;


        const subject =
            subjectSelect.value;


        const language =
            languageSelect.value;


        const lesson =
            lessonSelect.value;


        if (
            !grade ||
            !subject ||
            !lesson
        ) {

            alert(
                "اختر الصف والمادة والدرس."
            );

            return;

        }


        currentLesson.textContent =
            lesson;


        lessonInfo.style.display =
            "block";


        indexStatus.textContent =
            "المنهج اللبناني الرسمي";


        const prompt =
`ابدأ درسًا تفاعليًا مع الطالب.

الصف: ${grade}
المادة: ${subject}
اللغة: ${language}
الدرس: ${lesson}

ابدأ بتمهيد قصير.
اشرح الفكرة الأولى بطريقة واضحة.
استخدم مثالًا مناسبًا.
إذا كان الرسم مفيدًا أرسل DRAWING_JSON.
لا تستخدم رسومات ASCII.
إذا كانت الإجابة بالعربية فلا تخلط كلمات أجنبية غير ضرورية.
اطرح سؤال تحقق واحدًا في النهاية.`;


        await sendToAI(
            prompt,
            false
        );

    }
);


/* ================================================
   SEND BUTTON
================================================ */


sendBtn.addEventListener(
    "click",

    async () => {

        const message =
            messageInput
                .value
                .trim();


        if (
            !message &&
            !selectedImage
        ) {

            return;

        }


        await sendToAI(
            message,
            true
        );

    }
);


/* ================================================
   IMAGE
================================================ */


imageBtn.addEventListener(
    "click",

    () => {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",

    function() {

        if (
            this.files &&
            this.files[0]
        ) {

            selectedImage =
                this.files[0];


            messageInput.placeholder =
                "تم اختيار صورة. اكتب طلبك أو اضغط إرسال.";

        }

    }
);


/* ================================================
   ENTER
================================================ */


messageInput.addEventListener(
    "keydown",

    event => {

        if (
            event.key ===
                "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();


            sendBtn.click();

        }

    }
);


/* ================================================
   SPEECH INPUT
================================================ */


if (
    "webkitSpeechRecognition"
        in window ||

    "SpeechRecognition"
        in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onresult =
        event => {

            messageInput.value =
                event.results[0][0]
                    .transcript;

        };


    recognition.onerror =
        event => {

            console.error(
                "SPEECH ERROR:",
                event.error
            );

        };

}


micBtn.addEventListener(
    "click",

    () => {

        if (!recognition) {

            alert(
                "التعرف الصوتي غير مدعوم في هذا المتصفح."
            );

            return;

        }


        recognition.lang =
            languageSelect.value ===
                "English"

                ? "en-US"

                : languageSelect.value ===
                    "Français"

                    ? "fr-FR"

                    : "ar-LB";


        recognition.start();

    }
);


/* ================================================
   START
================================================ */


loadCurriculumIndex();


</script>
