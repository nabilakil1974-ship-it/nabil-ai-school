<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة النبيل التعليمية الذكية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #173b6c, #2563eb);
            color: white;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.15);
        }

        .header-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .controls {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr) auto;
            gap: 10px;
            align-items: end;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control label {
            font-size: 14px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            color: #222;
            outline: none;
        }

        #startLesson {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
            white-space: nowrap;
        }

        #startLesson:hover {
            background: #15803d;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .lesson-info {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            display: none;
        }

        .lesson-info strong {
            color: #173b6c;
        }

        .chat {
            background: white;
            min-height: 500px;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .welcome {
            text-align: center;
            padding: 70px 20px;
            color: #64748b;
        }

        .welcome h2 {
            color: #173b6c;
            margin-bottom: 10px;
        }

        .message {
            display: flex;
            margin: 12px 0;
        }

        .message.student {
            justify-content: flex-start;
        }

        .message.teacher {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .student .bubble {
            background: #e0ecff;
        }

        .teacher .bubble {
            background: #eef8ee;
        }

        .input-area {
            margin-top: 15px;
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 55px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendBtn {
            background: #2563eb;
            color: white;
        }

        #sendBtn:hover {
            background: #1d4ed8;
        }

        #imageBtn {
            background: #64748b;
            color: white;
        }

        #micBtn {
            background: #7c3aed;
            color: white;
        }

        #imageInput {
            display: none;
        }

        .sources {
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
        }

        @media (max-width: 900px) {
            .controls {
                grid-template-columns: repeat(2, 1fr);
            }

            #startLesson {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .input-area {
                flex-wrap: wrap;
            }

            textarea {
                width: 100%;
                flex-basis: 100%;
            }

            .bubble {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="header-title">
        منصة النبيل التعليمية الذكية
    </div>

    <div class="controls">

        <!-- الصف -->
        <div class="control">
            <label for="gradeSelect">الصف</label>
            <select id="gradeSelect"></select>
        </div>

        <!-- المادة -->
        <div class="control">
            <label for="subjectSelect">المادة</label>
            <select id="subjectSelect"></select>
        </div>

        <!-- اللغة -->
        <div class="control">
            <label for="languageSelect">اللغة</label>
            <select id="languageSelect">
                <option value="العربية">العربية</option>
                <option value="Français">Français</option>
                <option value="English">English</option>
            </select>
        </div>

        <!-- المنهج -->
        <div class="control">
            <label for="curriculumSelect">المنهج</label>
            <select id="curriculumSelect"></select>
        </div>

        <!-- الدرس -->
        <div class="control">
            <label for="lessonSelect">الدرس</label>
            <select id="lessonSelect"></select>
        </div>

        <!-- ابدأ الدرس -->
        <button id="startLesson">
            ▶ ابدأ الدرس
        </button>

    </div>

</header>


<main class="container">

    <div id="lessonInfo" class="lesson-info">
        <strong>الدرس الحالي:</strong>
        <span id="currentLesson"></span>
    </div>

    <section id="chat" class="chat">

        <div id="welcome" class="welcome">
            <h2>مرحباً بك في NABIL AI 👨‍🏫</h2>
            <p>
                اختر الصف والمادة واللغة والمنهج والدرس،
                ثم اضغط <strong>▶ ابدأ الدرس</strong>.
            </p>
        </div>

    </section>

    <div class="input-area">

        <textarea
            id="messageInput"
            placeholder="اكتب سؤالك هنا..."
        ></textarea>

        <button id="imageBtn" type="button">
            🖼️
        </button>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >

        <button id="micBtn" type="button">
            🎤
        </button>

        <button id="sendBtn" type="button">
            إرسال
        </button>

    </div>

</main>
