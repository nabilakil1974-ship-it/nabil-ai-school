<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ نبيل - المنصة التعليمية اللبنانية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f7f3eb;
            background-image: linear-gradient(#e5ddd0 1px, transparent 1px);
            background-size: 100% 32px;
            color: #2c2c2c;
            font-family: system-ui, -apple-system, sans-serif;
        }

        @keyframes avatarIdle {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(197, 160, 89, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(197, 160, 89, 0.8); }
        }
        @keyframes avatarSpeaking {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
            50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(16, 185, 129, 1); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        }
        @keyframes avatarListening {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); }
            50% { transform: scale(1.12); box-shadow: 0 0 35px rgba(239, 68, 68, 1); }
        }

        .anim-idle { animation: avatarIdle 3s infinite ease-in-out; }
        .anim-speaking { animation: avatarSpeaking 0.8s infinite ease-in-out; }
        .anim-listening { animation: avatarListening 1.2s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header & Selections -->
    <header class="bg-[#1e3d2f] text-white p-4 shadow-md">
        <div class="max-w-3xl mx-auto flex flex-col space-y-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div id="avatarContainer" class="w-12 h-12 rounded-full bg-[#c5a059] flex items-center justify-center font-bold text-xl text-white anim-idle transition-all duration-300 shadow-inner">
                        <span id="avatarFace">👨‍🏫</span>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-[#f3e9dc]">الأستاذ نبيل</h1>
                        <p class="text-xs text-[#b8c5bd]">منجاوب على أسئلتك بكل المواد، خطوة بخطوة</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <button onclick="resetConversation()" title="سؤال جديد" class="bg-[#2c5e4a] hover:bg-[#1e3d2f] text-xs px-3 py-2 rounded-lg text-white transition border border-[#c5a059]/40 flex items-center space-x-1 space-x-reverse">
                        <span>🔄</span>
                        <span class="hidden sm:inline">سؤال جديد</span>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <select id="gradeSelect" class="bg-[#162e23] text-[#f3e9dc] text-xs p-2 rounded-lg border border-[#2c5e4a] focus:outline-none">
                    <option value="الصف الأول">الصف الأول</option>
                    <option value="الصف السابع" selected>الصف السابع (Grade 7)</option>
                    <option value="الصف التاسع">الصف التاسع (Brevet)</option>
                    <option value="الصف الثالث ثانوي">التوجيهي / البكالوريا</option>
                </select>
                <select id="subjectSelect" class="bg-[#162e23] text-[#f3e9dc] text-xs p-2 rounded-lg border border-[#2c5e4a] focus:outline-none">
                    <option value="لغة عربية">لغة عربية</option>
                    <option value="رياضيات" selected>رياضيات (Maths)</option>
                    <option value="علوم / فيزياء">علوم / فيزياء (Sciences)</option>
                    <option value="لغة فرنسية">لغة فرنسية (Français)</option>
                </select>
            </div>
            <div class="w-full">
                <select id="curriculumSelect" class="w-full bg-[#162e23] text-[#f3e9dc] text-xs p-2 rounded-lg border border-[#2c5e4a] focus:outline-none">
                    <option value="CRDP">المنهج اللبناني الرسمي (CRDP)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 max-w-3xl w-full mx-auto p-4 overflow-y-auto space-y-4 mb-28">
        <div class="text-center py-6">
            <h2 class="text-xl font-bold text-[#1e3d2f] mb-2">يلا نبلش؟</h2>
            <p class="text-sm text-slate-600">اختر صفك ومادتك فوق، واكتب سؤالك أو اضغط على المايكروفون للتحدث وسيحول صوتك لنص تلقائياً.</p>
        </div>
    </main>

    <!-- Footer Input -->
    <footer class="fixed bottom-0 left-0 right-0 bg-[#f7f3eb] border-t border-[#e2d9cc] p-3 shadow-lg">
        <div class="max-w-3xl mx-auto flex flex-col space-y-2">
            <div class="flex justify-center">
                <button id="urgencyBtn" onclick="toggleUrgency()" class="bg-white hover:bg-[#f3e9dc] text-[#b48a3d] text-xs px-4 py-1.5 rounded-full border border-[#d8c5a0] shadow-sm flex items-center space-x-1.5 space-x-reverse transition">
                    <span>⚡</span>
                    <span id="urgencyText">أنا مستعجل - بدي حل مباشر</span>
                </button>
            </div>

            <div class="flex items-center space-x-2 space-x-reverse">
                <!-- Mic Button (Speech-to-Text) -->
                <button id="micBtn" onclick="toggleVoiceRecognition()" title="التحدث الصوتي" class="bg-[#1e3d2f] hover:bg-[#2c5e4a] text-white p-3 rounded-xl transition shrink-0 flex items-center justify-center w-11 h-11 shadow">
                    🎤
                </button>
                <textarea id="userInput" rows="1" placeholder="اكتب سؤالك أو اضغط المايكروفون للتحدث..." class="flex-1 bg-white border border-[#d8c5a0] rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-[#1e3d2f] resize-none text-sm shadow-inner"></textarea>
                <button onclick="sendMessage()" class="bg-[#1e3d2f] hover:bg-[#2c5e4a] text-white p-3 rounded-xl transition shrink-0 font-bold flex items-center justify-center w-11 h-11 shadow">
                    ➤
                </button>
            </div>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const BACKEND_URL = "/api/chat";

        let studentId = localStorage.getItem('nabil_student_id') || 'student_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('nabil_student_id', studentId);

        let conversationId = localStorage.getItem('nabil_conv_id') || null;
        let isUrgent = false;
        let recognition = null;
        let isListening = false;

        // إعداد خاصية تحويل الصوت إلى نص الحقيقية
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-LB'; // محاولة مطابقة اللهجة أو العربية العامة
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechText;
                stopListeningUI();
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                stopListeningUI();
            };

            recognition.onend = () => {
                stopListeningUI();
            };
        }

        function toggleVoiceRecognition() {
            if (!recognition) {
                alert("متصفحك لا يدعم التحويل المباشر للصوت إلى نص. يرجى استخدام متصفح حديث مثل كروم.");
                return;
            }

            if (!isListening) {
                try {
                    recognition.start();
                    isListening = true;
                    document.getElementById('micBtn').classList.add('bg-red-600', 'animate-pulse');
                    setAvatarState('listening');
                } catch (e) {
                    console.error(e);
                    stopListeningUI();
                }
            } else {
                recognition.stop();
                stopListeningUI();
            }
        }

        function stopListeningUI() {
            isListening = false;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) micBtn.classList.remove('bg-red-600', 'animate-pulse');
            setAvatarState('idle');
        }

        function toggleUrgency() {
            isUrgent = !isUrgent;
            const btn = document.getElementById('urgencyBtn');
            const textSpan = document.getElementById('urgencyText');
            if (isUrgent) {
                btn.classList.add('bg-[#d8c5a0]', 'text-white', 'font-bold');
                textSpan.textContent = "تم تفعيل الاستعجال: سيتم إعطاء الحل المباشر!";
            } else {
                btn.classList.remove('bg-[#d8c5a0]', 'text-white', 'font-bold');
                textSpan.textContent = "أنا مستعجل - بدي حل مباشر";
            }
        }

        function resetConversation() {
            localStorage.removeItem('nabil_conv_id');
            conversationId = null;
            document.getElementById('chatContainer').innerHTML = `
                <div class="text-center py-6">
                    <h2 class="text-xl font-bold text-[#1e3d2f] mb-2">يلا نبلش سؤال جديد؟</h2>
                    <p class="text-sm text-slate-600">تم تصفير السياق. تفضل بطرح سؤالك الجديد!</p>
                </div>
            `;
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const grade = document.getElementById('gradeSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const curriculum = document.getElementById('curriculumSelect').value;
            let text = inputField.value.trim();
            
            if (!text) return;

            if (isUrgent) {
                text = "[بدي الحل المباشر بلا خطوات تدريجية] " + text;
            }

            appendMessage(inputField.value.trim(), 'user');
            inputField.value = '';

            setAvatarState('thinking');

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: studentId,
                        conversation_id: conversationId,
                        message: text,
                        subject: subject,
                        grade: grade,
                        curriculum: curriculum
                    })
                });

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                conversationId = data.conversation_id;
                localStorage.setItem('nabil_conv_id', conversationId);

                const replyText = data.reply || "عذراً، حدث خطأ في معالجة الإجابة.";

                appendMessage(replyText, 'bot');
                speakText(replyText);

            } catch (error) {
                const fallbackReply = "أهلاً بك يا بطل! لم يتمكن التطبيق من الاتصال بالخادم، تأكد من الإنترنت.";
                appendMessage(fallbackReply, 'bot');
                speakText(fallbackReply);
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const isUser = sender === 'user';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-2 space-x-reverse mb-4 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-[#2c5e4a] text-white' : 'bg-[#1e3d2f] text-white'} flex items-center justify-center shrink-0 text-xs font-bold shadow">${isUser ? 'أنت' : 'نبيل'}</div>
                <div class="${isUser ? 'bg-[#1e3d2f] text-white' : 'bg-white border border-[#e2d9cc] text-slate-800'} rounded-2xl p-3.5 max-w-[80%] shadow-sm leading-relaxed text-sm">
                    ${escapeHtml(text).replace(/\n/g, '<br>')}
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setAvatarState(state) {
            const avatar = document.getElementById('avatarContainer');
            const face = document.getElementById('avatarFace');
            
            avatar.className = "w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl text-white transition-all duration-300 shadow-inner";

            if (state === 'speaking') {
                avatar.classList.add('bg-emerald-600', 'anim-speaking');
                face.textContent = "🗣️";
            } else if (state === 'listening') {
                avatar.classList.add('bg-red-600', 'anim-listening');
                face.textContent = "👂";
            } else {
                avatar.classList.add('bg-[#c5a059]', 'anim-idle');
                face.textContent = "👨‍🏫";
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                
                if (/[a-zA-Z]/.test(text)) {
                    utterance.lang = 'en-US';
                } else if (/[àâäéèêëîïôöùûüç]/.test(text)) {
                    utterance.lang = 'fr-FR';
                } else {
                    utterance.lang = 'ar-SA';
                }

                utterance.rate = 1.0;
                utterance.onstart = () => setAvatarState('speaking');
                utterance.onend = () => setAvatarState('idle');
                utterance.onerror = () => setAvatarState('idle');

                window.speechSynthesis.speak(utterance);
            }
        }

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
