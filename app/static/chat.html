<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأستاذ نبيل - سبورة الصف الحقيقية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board-bg: #14281D;
    --board-dark: #0D1C13;
    --board-border: #2C4A35;
    --chalk-yellow: #F4D35E;
    --chalk-white: #F8F9FA;
    --chalk-green: #A3C9A8;
    --wood-frame: #5C3A21;
    --wood-dark: #3D2513;
    --accent-red: #E07A5F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--wood-dark);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Tajawal', sans-serif;
    color: var(--chalk-white);
  }
  
  /* إطار خشبي خارجي يحيط بالتطبيق كأنه سبورة معلقة على الحائط */
  .app-frame {
    width:100%;
    max-width:800px;
    height:100vh;
    max-height:920px;
    background: var(--board-bg);
    border: 12px solid var(--wood-frame);
    border-radius: 6px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 50px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
    position: relative;
  }

  header{
    background: var(--board-dark);
    color: var(--chalk-white);
    padding: 16px 20px;
    border-bottom: 4px solid var(--board-border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .avatar{
    width:52px; height:52px; border-radius:50%;
    background: var(--chalk-yellow);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:22px;
    color: var(--board-dark);
    box-shadow: 0 0 10px rgba(244,211,94,0.5);
    flex-shrink:0;
  }
  .avatar.speaking{ animation:pulse-speak 0.9s infinite; }
  @keyframes pulse-speak{
    0%{ transform:scale(1); box-shadow:0 0 0 0 rgba(244,211,94,0.8); }
    50%{ transform:scale(1.06); box-shadow:0 0 0 10px rgba(244,211,94,0); }
    100%{ transform:scale(1); }
  }
  h1{ font-family:'Cairo', sans-serif; font-weight:800; font-size:20px; margin:0; color: var(--chalk-yellow); }
  .subtitle{ font-size:13px; color: var(--chalk-green); margin-top:2px; font-weight:500; }

  .setup-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .setup-row select{
    flex:1;
    min-width:110px;
    background: #1B3625;
    color: var(--chalk-white);
    border: 1px solid var(--board-border);
    border-radius: 8px;
    padding: 8px 12px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    font-weight:600;
  }

  .chat-area{
    flex:1;
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
    overflow-y:auto;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color: var(--chalk-green);
    max-width:380px;
    line-height:2.0;
    font-size:14.5px;
  }
  .empty-state b{
    display:block;
    font-family:'Cairo',sans-serif;
    color: var(--chalk-yellow);
    font-size:17px;
    margin-bottom:6px;
  }

  .msg{
    max-width:92%;
    padding: 16px 18px;
    line-height:2.2;
    font-size:16px;
    font-weight:600;
    position:relative;
    animation: rise .25s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .msg.teacher{
    align-self:flex-start;
    background: #1B3625;
    border: 1px solid var(--board-border);
    border-radius: 6px 16px 16px 16px;
    width: 100%;
    color: var(--chalk-white);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .msg.student{
    align-self:flex-end;
    background: var(--chalk-yellow);
    color: var(--board-dark);
    border-radius: 16px 6px 16px 16px;
    font-size:15.5px;
  }
  
  .msg .images-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .msg img.attached{
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--board-border);
  }

  /* تنسيق بطاقة السبورة للحل */
  .chalk-card {
    background: #112419;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2B5239;
    margin-top: 4px;
  }
  .chalk-acad-header {
    background: #183322;
    color: var(--chalk-yellow);
    padding: 10px 14px;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 14px;
  }
  .chalk-acad-body {
    padding: 14px;
  }
  .chalk-section {
    margin-bottom: 12px;
    padding: 10px 12px;
    background: #162D1F;
    border-right: 4px solid var(--chalk-yellow);
    border-radius: 6px;
  }
  .chalk-section.steps { border-right-color: var(--chalk-green); }
  .chalk-section.result { border-right-color: var(--accent-red); font-weight: 700; color: #FFF; }

  .chalk-sec-title {
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 13.5px;
    color: var(--chalk-yellow);
    margin-bottom: 6px;
  }

  .msg .page-ref{
    display:block;
    margin-top:12px;
    font-size:12px;
    color: var(--chalk-green);
    border-top: 1px dashed var(--board-border);
    padding-top:8px;
    font-weight:500;
  }

  .msg .actions-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    align-items:center;
    flex-wrap: wrap;
  }
  .msg .action-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: #254732;
    color: var(--chalk-white);
    border: 1px solid var(--board-border);
    border-radius: 18px;
    padding: 6px 14px;
    font-size:12.5px;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    cursor:pointer;
    transition: background 0.2s;
  }
  .msg .action-btn.speaking{ background: var(--chalk-yellow); color: var(--board-dark); }
  .msg .action-btn:hover{ background: #2F593E; }

  .typing{
    align-self:flex-start;
    display:flex;
    gap:6px;
    padding:14px 18px;
    background: #1B3625;
    border: 1px solid var(--board-border);
    border-radius: 6px 16px 16px 16px;
  }
  .typing span{
    width:8px; height:8px; border-radius:50%;
    background: var(--chalk-green);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0);opacity:.5;} 30%{transform:translateY(-5px);opacity:1;} }

  .preview-row{
    padding: 8px 16px;
    display:none;
    gap:8px;
    overflow-x:auto;
    background: var(--board-dark);
    border-top: 1px solid var(--board-border);
  }
  .preview-row.active{ display:flex; }
  .preview-thumb-container{ position:relative; flex-shrink:0; }
  .preview-row img{ width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid var(--board-border); }
  .remove-thumb{
    position:absolute; top:-5px; right:-5px;
    background: var(--accent-red); color:#fff; border:none; border-radius:50%;
    width:18px; height:18px; font-size:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .composer{
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--board-dark);
    border-top: 4px solid var(--board-border);
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  .icon-btn{
    width:44px; height:44px; border-radius:50%;
    border: 1px solid var(--board-border); background: #1B3625;
    color: var(--chalk-yellow); font-size:18px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.recording{ background: var(--accent-red) !important; color:#fff !important; animation: pulse-mic 1s infinite; }
  @keyframes pulse-mic{ 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }

  .composer textarea{
    flex:1; resize:none; border: 1px solid var(--board-border);
    border-radius: 16px; padding: 10px 16px; font-family:'Tajawal',sans-serif;
    font-size:15px; font-weight:600; max-height:110px; background: #112419; color: var(--chalk-white);
  }
  .composer textarea:focus{ outline:none; border-color: var(--chalk-yellow); }
  .send-btn{
    width:46px; height:46px; border-radius:50%; border:none;
    background: var(--chalk-yellow); color: var(--board-dark); font-size:18px;
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-weight: bold;
  }
  .send-btn:active{ transform:scale(0.92); }
  .send-btn:disabled{ opacity:.4; cursor:default; }

  ::-webkit-scrollbar{ width:5px; height:5px; }
  ::-webkit-scrollbar-thumb{ background: var(--board-border); border-radius:5px; }
</style>
</head>
<body>

<div class="app-frame">
  <header>
    <div class="header-row">
      <div class="avatar" id="avatarBox">ن</div>
      <div>
        <h1>الأستاذ نبيل</h1>
        <div class="subtitle">سبورة الصف التفاعلية - حلول دورات ومسائل نموذجية</div>
      </div>
    </div>
    <div class="setup-row">
      <select id="gradeSelect"></select>
      <select id="subjectSelect"></select>
      <select id="curriculumSelect"></select>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <b>السبورة جاهزة لشرح أروع الدروس!</b>
      ارفع صور المسائل أو اكتب سؤالك، وسيكتب الأستاذ نبيل الحل بخطوات واضحة تماماً مثل سبورة الصف الحقيقية.
    </div>
  </div>

  <div class="preview-row" id="previewRow"></div>

  <div class="composer">
    <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
    <button class="icon-btn" id="attachBtn" aria-label="إرفاق صور">📎</button>
    <button class="icon-btn" id="micBtn" aria-label="تسجيل صوتي">🎤</button>
    <textarea id="messageInput" rows="1" placeholder="اكتب مسألتك على السبورة..."></textarea>
    <button class="send-btn" id="sendBtn" aria-label="إرسال">➤</button>
  </div>
</div>

<script>
(function(){
  const API_BASE = window.location.origin;

  const GRADES = ["الصف الأول","الصف الثاني","الصف الثالث","الصف الرابع","الصف الخامس","الصف السادس","الصف السابع","الصف الثامن","الصف التاسع","الصف الأول ثانوي","الصف الحادي عشر","الصف الثاني عشر"];
  const SUBJECTS = ["رياضيات","فيزياء","كيمياء","علوم","لغة عربية","لغة إنكليزية","تاريخ","جغرافيا"];
  const CURRICULA = ["المنهج اللبناني الرسمي","Building Up","المنهج الفرنسي (CRDP)"];

  function fillSelect(el, items){
    el.innerHTML = items.map(v => `<option value="${v}">${v}</option>`).join("");
  }
  fillSelect(document.getElementById("gradeSelect"), GRADES);
  fillSelect(document.getElementById("subjectSelect"), SUBJECTS);
  fillSelect(document.getElementById("curriculumSelect"), CURRICULA);

  function getStudentId(){
    let id = localStorage.getItem("nabilai_student_id");
    if(!id){
      id = "student-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("nabilai_student_id", id);
    }
    return id;
  }

  let conversationId = localStorage.getItem("nabilai_conversation_id") || null;
  let pendingFiles = [];

  const chatArea = document.getElementById("chatArea");
  const emptyState = document.getElementById("emptyState");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const attachBtn = document.getElementById("attachBtn");
  const micBtn = document.getElementById("micBtn");
  const avatarBox = document.getElementById("avatarBox");
  const imageInput = document.getElementById("imageInput");
  const previewRow = document.getElementById("previewRow");

  attachBtn.addEventListener("click", () => imageInput.click());

  imageInput.addEventListener("change", () => {
    const files = Array.from(imageInput.files);
    if(files.length === 0) return;
    files.forEach(file => pendingFiles.push(file));
    renderPreviews();
    imageInput.value = "";
  });

  function renderPreviews() {
    previewRow.innerHTML = "";
    if(pendingFiles.length === 0) {
      previewRow.classList.remove("active");
      return;
    }
    previewRow.classList.add("active");
    pendingFiles.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const container = document.createElement("div");
        container.className = "preview-thumb-container";
        const img = document.createElement("img");
        img.src = e.target.result;
        container.appendChild(img);

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-thumb";
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => {
          pendingFiles.splice(index, 1);
          renderPreviews();
        });
        container.appendChild(removeBtn);
        previewRow.appendChild(container);
      };
      reader.readAsDataURL(file);
    });
  }

  let currentUtterance = null;
  let cachedArabicVoice = null;

  function pickBestArabicVoice(){
    const voices = speechSynthesis.getVoices();
    const arabicVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
    if(arabicVoices.length === 0) return null;
    const local = arabicVoices.find(v => v.localService);
    if(local) return local;
    return arabicVoices[0];
  }

  if("speechSynthesis" in window){
    speechSynthesis.onvoiceschanged = () => { cachedArabicVoice = pickBestArabicVoice(); };
    cachedArabicVoice = pickBestArabicVoice();
  }

  function speak(text, btn){
    if(!("speechSynthesis" in window)) return;
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      document.querySelectorAll(".action-btn.speaking").forEach(b => {
        b.classList.remove("speaking");
        b.textContent = "🔊 استماع";
      });
      if(btn && btn.classList.contains("__was_speaking")){
        btn.classList.remove("__was_speaking");
        return;
      }
    }
    if(btn) btn.classList.add("__was_speaking");
    currentUtterance = new SpeechSynthesisUtterance(text);
    if(cachedArabicVoice){
      currentUtterance.voice = cachedArabicVoice;
      currentUtterance.lang = cachedArabicVoice.lang;
    }
    currentUtterance.rate = 0.95;
    currentUtterance.onstart = () => { if(btn){ btn.classList.add("speaking"); btn.textContent = "⏸ إيقاف"; } avatarBox.classList.add("speaking"); };
    currentUtterance.onend = () => { if(btn){ btn.classList.remove("speaking"); btn.textContent = "🔊 استماع"; btn.classList.remove("__was_speaking"); } avatarBox.classList.remove("speaking"); };
    speechSynthesis.speak(currentUtterance);
  }

  let recognition = null;
  let isListening = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = navigator.language || 'ar';

    recognition.onresult = (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript;
      input.value = (input.value ? input.value + ' ' : '') + transcript;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 110) + 'px';
    };
    recognition.onend = () => { stopListeningUI(); };
  }

  function startListening(){
    if (!recognition) { alert("متصفحك لا يدعم التعرف الصوتي."); return; }
    try {
      recognition.start();
      isListening = true;
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
    } catch(e){}
  }
  function stopListening(){
    isListening = false;
    if (recognition) { try { recognition.stop(); } catch(e){} }
    stopListeningUI();
  }
  function stopListeningUI(){
    isListening = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
  }

  micBtn.addEventListener("click", () => {
    if (!isListening) startListening(); else stopListening();
  });

  function buildChalkCard(rawText) {
    const card = document.createElement("div");
    card.className = "chalk-card";

    card.innerHTML = `
      <div class="chalk-acad-header">✏️ الحل النموذجي على السبورة</div>
      <div class="chalk-acad-body">
        <div class="chalk-section">
          <div class="chalk-sec-title">📌 فهم المسألة والمعطيات</div>
          <div>${rawText}</div>
        </div>
      </div>
    `;
    return card;
  }

  function addMessage(role, text, sources, imageObjects){
    if(emptyState) emptyState.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;

    if(imageObjects && imageObjects.length > 0){
      const grid = document.createElement("div");
      grid.className = "images-grid";
      imageObjects.forEach(imgSrc => {
        const img = document.createElement("img");
        img.className = "attached";
        img.src = imgSrc;
        grid.appendChild(img);
      });
      div.appendChild(grid);
    }

    if(text){
      if(role === "teacher"){
        div.appendChild(buildChalkCard(text));
      } else {
        const p = document.createElement("div");
        p.textContent = text;
        div.appendChild(p);
      }
    }

    if(sources && sources.length){
      const ref = document.createElement("span");
      ref.className = "page-ref";
      ref.textContent = "المصدر المنهجي: " + sources.map(s => `${s.book} - صفحة ${s.page}`).join(" / ");
      div.appendChild(ref);
    }

    if(role === "teacher" && text){
      const actionsRow = document.createElement("div");
      actionsRow.className = "actions-row";

      const speakBtn = document.createElement("button");
      speakBtn.className = "action-btn";
      speakBtn.textContent = "🔊 استماع";
      speakBtn.addEventListener("click", () => speak(text, speakBtn));
      actionsRow.appendChild(speakBtn);

      const copyBtn = document.createElement("button");
      copyBtn.className = "action-btn";
      copyBtn.textContent = "📋 نسخ الحل";
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = "✅ تم النسخ";
          setTimeout(() => { copyBtn.textContent = "📋 نسخ الحل"; }, 2000);
        });
      });
      actionsRow.appendChild(copyBtn);

      div.appendChild(actionsRow);
    }

    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showTyping(){
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  function hideTyping(){
    const el = document.getElementById("typingIndicator");
    if(el) el.remove();
  }

  async function sendMessage(){
    if (isListening) stopListening();

    const text = input.value.trim();
    if(!text && pendingFiles.length === 0) return;

    const imageUrls = pendingFiles.map(file => URL.createObjectURL(file));
    addMessage("student", text, null, imageUrls);

    const messageToSend = text;
    const filesToSend = [...pendingFiles];

    input.value = "";
    input.style.height = "auto";
    pendingFiles = [];
    renderPreviews();
    sendBtn.disabled = true;
    showTyping();

    const formData = new FormData();
    formData.append("student_id", getStudentId());
    if(conversationId) formData.append("conversation_id", conversationId);
    if(messageToSend) formData.append("message", messageToSend);
    formData.append("subject", document.getElementById("subjectSelect").value);
    formData.append("grade", document.getElementById("gradeSelect").value);
    formData.append("curriculum", document.getElementById("curriculumSelect").value);
    
    filesToSend.forEach(file => { formData.append("image", file); });

    try{
      const res = await fetch(API_BASE + "/api/chat", { method: "POST", body: formData });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      conversationId = data.conversation_id;
      if(conversationId) localStorage.setItem("nabilai_conversation_id", conversationId);

      hideTyping();
      addMessage("teacher", data.reply, data.sources, null);
    }catch(err){
      hideTyping();
      addMessage("teacher", "عذراً يا بطل، حدث خطأ بسيط في الاتصال بالسبورة، جرب مرة أخرى 🙏");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
    }
  }

  sendBtn.display = "flex";
  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 110) + "px";
  });
})();
</script>
</body>
</html>
