<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأستاذ نبيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-line:#E7DFC9;
    --chalkboard:#223B2E;
    --chalkboard-2:#1A2F24;
    --chalk-yellow:#E8B94D;
    --plum:#B5697A;
    --plum-soft:#F3E3E6;
    --ink:#26241F;
    --muted:#7A7563;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 42px;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:720px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:transparent;
  }

  /* الهيدر */
  header{
    background:var(--chalkboard);
    color:var(--paper);
    padding:22px 20px 18px;
    position:relative;
    overflow:hidden;
    border-bottom:6px solid var(--chalk-yellow);
  }
  header::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 6px);
    pointer-events:none;
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .avatar{
    width:52px;height:52px;border-radius:50%;
    background:var(--chalk-yellow);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;
    color:var(--chalkboard);
    flex-shrink:0;
  }
  h1{
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size:20px;
    margin:0;
  }
  .subtitle{
    font-size:13px;
    color:#C9D6CC;
    margin-top:2px;
  }

  .setup-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .setup-row select{
    flex:1;
    min-width:110px;
    background:var(--chalkboard-2);
    color:var(--paper);
    border:1px solid #375243;
    border-radius:10px;
    padding:9px 10px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
  }

  /* المحادثة */
  .chat-area{
    flex:1;
    padding:22px 18px 10px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    max-width:320px;
    line-height:1.9;
    font-size:14.5px;
  }
  .empty-state b{
    display:block;
    font-family:'Cairo',sans-serif;
    color:var(--ink);
    font-size:17px;
    margin-bottom:6px;
  }

  .msg{
    max-width:78%;
    padding:12px 16px;
    line-height:1.85;
    font-size:15px;
    position:relative;
    animation: rise .25s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .msg.teacher{
    align-self:flex-start;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:4px 16px 16px 16px;
    box-shadow:0 1px 0 rgba(0,0,0,0.03);
  }
  .msg.student{
    align-self:flex-end;
    background:var(--plum);
    color:#fff;
    border-radius:16px 4px 16px 16px;
  }
  .msg .page-ref{
    display:block;
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
    border-top:1px dashed var(--paper-line);
    padding-top:6px;
  }

  .typing{
    align-self:flex-start;
    display:flex;
    gap:5px;
    padding:14px 16px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:4px 16px 16px 16px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0);opacity:.5;} 30%{transform:translateY(-4px);opacity:1;} }

  /* شريط الإدخال */
  .composer{
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--paper);
    border-top:1px solid var(--paper-line);
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .composer textarea{
    flex:1;
    resize:none;
    border:1.5px solid var(--paper-line);
    border-radius:16px;
    padding:12px 16px;
    font-family:'Tajawal',sans-serif;
    font-size:15px;
    max-height:110px;
    background:#fff;
    color:var(--ink);
  }
  .composer textarea:focus{
    outline:none;
    border-color:var(--plum);
  }
  .send-btn{
    width:46px;height:46px;
    border-radius:50%;
    border:none;
    background:var(--chalkboard);
    color:var(--chalk-yellow);
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .send-btn:active{ transform:scale(0.92); }
  .send-btn:disabled{ opacity:.4; cursor:default; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--paper-line); border-radius:6px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="header-row">
      <div class="avatar">ن</div>
      <div>
        <h1>الأستاذ نبيل</h1>
        <div class="subtitle">منجاوب على أسئلتك بكل المواد، خطوة خطوة</div>
      </div>
    </div>
    <div class="setup-row">
      <select id="gradeSelect"></select>
      <select id="subjectSelect"></select>
      <select id="curriculumSelect"></select>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <b>يلا نبلش؟</b>
      اختار صفك ومادتك فوق، واكتبلي سؤالك بالأسفل — منشتغل عليه سوا لحتى تفهمو منيح.
    </div>
  </div>

  <div class="composer">
    <textarea id="messageInput" rows="1" placeholder="اكتب سؤالك هون..."></textarea>
    <button class="send-btn" id="sendBtn" aria-label="إرسال">➤</button>
  </div>

</div>

<script>
(function(){
  const API_BASE = window.location.origin;

  const GRADES = ["الصف الأول","الصف الثاني","الصف الثالث","الصف الرابع","الصف الخامس","الصف السادس","الصف السابع","الصف الثامن","الصف التاسع","الصف الأول ثانوي","الصف الحادي عشر","الصف الثاني عشر"];
  const SUBJECTS = ["لغة عربية","لغة إنكليزية","لغة فرنسية","رياضيات","علوم","فيزياء","كيمياء","تاريخ","جغرافيا","التربية المدنية"];
  const CURRICULA = ["المنهج اللبناني الرسمي","Building Up","المنهج الفرنسي (CRDP)"];

  function fillSelect(el, items){
    el.innerHTML = items.map(v => `<option value="${v}">${v}</option>`).join("");
  }
  fillSelect(document.getElementById("gradeSelect"), GRADES);
  fillSelect(document.getElementById("subjectSelect"), SUBJECTS);
  fillSelect(document.getElementById("curriculumSelect"), CURRICULA);

  function getStudentId(){
    let id = localStorage.getItem("nabilai_student_id");
    if(!id){
      id = "student-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("nabilai_student_id", id);
    }
    return id;
  }

  let conversationId = localStorage.getItem("nabilai_conversation_id") || null;

  const chatArea = document.getElementById("chatArea");
  const emptyState = document.getElementById("emptyState");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(role, text, sources){
    if(emptyState) emptyState.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    if(sources && sources.length){
      const ref = document.createElement("span");
      ref.className = "page-ref";
      ref.textContent = "المصدر: " + sources.map(s => `${s.book} - صفحة ${s.page}`).join(" / ");
      div.appendChild(ref);
    }
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showTyping(){
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  function hideTyping(){
    const el = document.getElementById("typingIndicator");
    if(el) el.remove();
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text) return;

    addMessage("student", text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    showTyping();

    const payload = {
      student_id: getStudentId(),
      conversation_id: conversationId,
      message: text,
      subject: document.getElementById("subjectSelect").value,
      grade: document.getElementById("gradeSelect").value,
      curriculum: document.getElementById("curriculumSelect").value,
    };

    try{
      const res = await fetch(API_BASE + "/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      conversationId = data.conversation_id;
      localStorage.setItem("nabilai_conversation_id", conversationId);

      hideTyping();
      addMessage("teacher", data.reply, data.sources);
    }catch(err){
      hideTyping();
      addMessage("teacher", "صار في مشكلة تقنية بسيطة، جرب ابعت السؤال كمان مرة بعد شوي 🙏");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 110) + "px";
  });
})();
</script>
</body>
</html>
