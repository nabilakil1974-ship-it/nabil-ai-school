<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأستاذ نبيل - النظام الأكاديمي المرتب بوضوح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EB;
    --paper-line:#E3DAC9;
    --chalkboard:#111D15;
    --chalkboard-2:#0A130D;
    --chalk-yellow:#F4D06F;
    --plum:#8E3B46;
    --plum-soft:#F4E5E7;
    --ink:#14120E;
    --muted:#524B3D;
    --card-bg:#FFFFFF;
    --border-color:#D6C9B0;
    --divider-color:#E2D6BE;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 50px;
    font-family:'Tajawal', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:780px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:transparent;
  }

  header{
    background:var(--chalkboard);
    color:var(--paper);
    padding:20px;
    border-bottom:6px solid var(--chalk-yellow);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .avatar{
    width:58px;height:58px;border-radius:50%;
    background:var(--chalk-yellow);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cairo',sans-serif;font-weight:800;font-size:26px;
    color:var(--chalkboard);
    flex-shrink:0;
    box-shadow: 0 0 15px rgba(244,208,111,0.4);
  }
  .avatar.speaking{ animation:pulse-speak 0.9s infinite; }
  @keyframes pulse-speak{
    0%{ box-shadow:0 0 0 0 rgba(244,208,111,0.8); transform:scale(1); }
    50%{ transform:scale(1.06); }
    100%{ box-shadow:0 0 0 0 rgba(244,208,111,0); transform:scale(1); }
  }
  h1{ font-family:'Cairo', sans-serif; font-weight:800; font-size:22px; margin:0; }
  .subtitle{ font-size:13px; color:#A7C4B0; margin-top:4px; font-weight:600; }

  .setup-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .setup-row select{
    flex:1;
    min-width:110px;
    background:var(--chalkboard-2);
    color:var(--paper);
    border:1px solid #1F3827;
    border-radius:10px;
    padding:9px 12px;
    font-family:'Tajawal',sans-serif;
    font-size:13.5px;
    font-weight:600;
  }

  .chat-area{
    flex:1;
    padding:24px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:20px;
    overflow-y:auto;
  }
  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted);
    max-width:380px;
    line-height:2.1;
    font-size:15px;
  }
  .empty-state b{
    display:block;
    font-family:'Cairo',sans-serif;
    color:var(--ink);
    font-size:19px;
    margin-bottom:8px;
  }

  .msg{
    max-width:94%;
    padding:18px 20px;
    line-height:2.2;
    font-size:16.5px;
    font-weight:600;
    position:relative;
    animation: rise .25s ease;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .msg.teacher{
    align-self:flex-start;
    background:var(--card-bg);
    border:1.5px solid var(--border-color);
    border-radius:10px 22px 22px 22px;
    box-shadow:0 3px 8px rgba(0,0,0,0.05);
    width: 100%;
  }
  .msg.student{
    align-self:flex-end;
    background:var(--plum);
    color:#fff;
    border-radius:22px 10px 22px 22px;
    font-size:16px;
  }
  
  .msg .images-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .msg img.attached{
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border-color);
  }

  /* بطاقة الحل المنظمة بعناوين وفواصل واضحة */
  .super-card {
    background: #FFFFFF;
    border-radius: 12px;
    overflow: hidden;
    border: 1.5px solid var(--border-color);
    margin-top: 4px;
  }
  .super-header {
    background: #111D15;
    color: var(--chalk-yellow);
    padding: 14px 18px;
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 15.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--chalk-yellow);
  }
  .super-body {
    padding: 20px;
  }
  
  /* أقسام الإجابة بفواصل واضحة */
  .super-section {
    margin-bottom: 16px;
    padding: 14px 18px;
    background: #FAF6EC;
    border-right: 5px solid var(--plum);
    border-radius: 8px;
  }
  .super-section:not(:last-child) {
    border-bottom: 1px solid var(--divider-color);
  }

  .super-sec-title {
    font-family: 'Cairo', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--chalkboard);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px dashed var(--border-color);
    padding-bottom: 6px;
  }

  .msg .page-ref{
    display:block;
    margin-top:16px;
    font-size:13.5px;
    color:var(--muted);
    border-top:2px solid var(--divider-color);
    padding-top:12px;
    font-weight:600;
  }

  .msg .actions-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    align-items:center;
    flex-wrap: wrap;
    border-top: 1px dashed var(--border-color);
    padding-top: 14px;
  }
  .msg .action-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--plum-soft);
    color:var(--plum);
    border:none;
    border-radius:20px;
    padding:8px 16px;
    font-size:13px;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    cursor:pointer;
    transition: opacity 0.2s;
  }
  .msg .action-btn.speaking{ background:var(--plum); color:#fff; }
  .msg .action-btn:hover{ opacity: 0.85; }

  .typing{
    align-self:flex-start;
    display:flex;
    gap:6px;
    padding:16px 20px;
    background:#fff;
    border:1.5px solid var(--border-color);
    border-radius:10px 22px 22px 22px;
  }
  .typing span{
    width:8px;height:8px;border-radius:50%;
    background:var(--muted);
    animation:bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0);opacity:.5;} 30%{transform:translateY(-5px);opacity:1;} }

  .preview-row{
    padding:10px 18px;
    display:none;
    gap:10px;
    overflow-x:auto;
    background: rgba(214,201,176,0.3);
    border-top: 1px dashed var(--border-color);
  }
  .preview-row.active{ display:flex; }
  .preview-thumb-container{ position:relative; flex-shrink:0; }
  .preview-row img{ width:66px;height:66px;object-fit:cover; border-radius:10px; border:1.5px solid var(--border-color); }
  .remove-thumb{
    position:absolute; top:-6px; right:-6px;
    background:var(--plum); color:#fff; border:none; border-radius:50%;
    width:20px; height:20px; font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .composer{
    padding:14px 18px calc(16px + env(safe-area-inset-bottom));
    background:var(--paper);
    border-top:1.5px solid var(--border-color);
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .icon-btn{
    width:48px;height:48px; border-radius:50%;
    border:1.5px solid var(--border-color); background:#fff;
    color:var(--chalkboard); font-size:20px; cursor:pointer; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn.recording{ background:var(--plum) !important; color:#fff !important; border-color:var(--plum) !important; animation: pulse-mic 1s infinite; }
  @keyframes pulse-mic{ 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }

  .composer textarea{
    flex:1; resize:none; border:1.5px solid var(--border-color);
    border-radius:18px; padding:12px 18px; font-family:'Tajawal',sans-serif;
    font-size:16px; font-weight:600; max-height:120px; background:#fff; color:var(--ink);
  }
  .composer textarea:focus{ outline:none; border-color:var(--plum); }
  .send-btn{
    width:50px;height:50px; border-radius:50%; border:none;
    background:var(--chalkboard); color:var(--chalk-yellow); font-size:20px;
    cursor:pointer; flex-shrink:0; display:flex;align-items:center;justify-content:center;
  }
  .send-btn:active{ transform:scale(0.92); }
  .send-btn:disabled{ opacity:.4; cursor:default; }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--border-color); border-radius:6px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="header-row">
      <div class="avatar" id="avatarBox">ن</div>
      <div>
        <h1>الأستاذ نبيل</h1>
        <div class="subtitle">النظام الأكاديمي المرتب بفواصل وعناوين واضحة</div>
      </div>
    </div>
    <div class="setup-row">
      <select id="gradeSelect"></select>
      <select id="subjectSelect"></select>
      <select id="curriculumSelect"></select>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <b>جاهز لتدريسك بأعلى وضوح وترتيب!</b>
      ارفع أسئلتك، وسيقوم الأستاذ نبيل بتقديم الشرح مقسماً بعناوين رئيسية وفواصل دقيقة.
    </div>
  </div>

  <div class="preview-row" id="previewRow"></div>

  <div class="composer">
    <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
    <button class="icon-btn" id="attachBtn" aria-label="إرفاق صور">📎</button>
    <button class="icon-btn" id="micBtn" aria-label="تسجيل صوتي">🎤</button>
    <textarea id="messageInput" rows="1" placeholder="اطرح مسألتك التعليمية هنا..."></textarea>
    <button class="send-btn" id="sendBtn" aria-label="إرسال">➤</button>
  </div>

</div>

<script>
(function(){
  const API_BASE = window.location.origin;

  const GRADES = ["الصف الأول","الصف الثاني","الصف الثالث","الصف الرابع","الصف الخامس","الصف السادس","الصف السابع","الصف الثامن","الصف التاسع","الصف الأول ثانوي","الصف الحادي عشر","الصف الثاني عشر"];
  const SUBJECTS = ["رياضيات","فيزياء","كيمياء","علوم","لغة عربية","لغة إنكليزية","تاريخ","جغرافيا"];
  const CURRICULA = ["المنهج اللبناني الرسمي","Building Up","المنهج الفرنسي (CRDP)"];

  function fillSelect(el, items){
    el.innerHTML = items.map(v => `<option value="${v}">${v}</option>`).join("");
  }
  fillSelect(document.getElementById("gradeSelect"), GRADES);
  fillSelect(document.getElementById("subjectSelect"), SUBJECTS);
  fillSelect(document.getElementById("curriculumSelect"), CURRICULA);

  function getStudentId(){
    let id = localStorage.getItem("nabilai_student_id");
    if(!id){
      id = "student-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("nabilai_student_id", id);
    }
    return id;
  }

  let conversationId = localStorage.getItem("nabilai_conversation_id") || null;
  let pendingFiles = [];

  const chatArea = document.getElementById("chatArea");
  const emptyState = document.getElementById("emptyState");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const attachBtn = document.getElementById("attachBtn");
  const micBtn = document.getElementById("micBtn");
  const avatarBox = document.getElementById("avatarBox");
  const imageInput = document.getElementById("imageInput");
  const previewRow = document.getElementById("previewRow");

  attachBtn.addEventListener("click", () => imageInput.click());

  imageInput.addEventListener("change", () => {
    const files = Array.from(imageInput.files);
    if(files.length === 0) return;
    files.forEach(file => pendingFiles.push(file));
    renderPreviews();
    imageInput.value = "";
  });

  function renderPreviews() {
    previewRow.innerHTML = "";
    if(pendingFiles.length === 0) {
      previewRow.classList.remove("active");
      return;
    }
    previewRow.classList.add("active");
    pendingFiles.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const container = document.createElement("div");
        container.className = "preview-thumb-container";
        const img = document.createElement("img");
        img.src = e.target.result;
        container.appendChild(img);

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-thumb";
        removeBtn.textContent = "✕";
        removeBtn.addEventListener("click", () => {
          pendingFiles.splice(index, 1);
          renderPreviews();
        });
        container.appendChild(removeBtn);
        previewRow.appendChild(container);
      };
      reader.readAsDataURL(file);
    });
  }

  let currentUtterance = null;
  let cachedArabicVoice = null;

  function pickBestArabicVoice(){
    const voices = speechSynthesis.getVoices();
    const arabicVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
    if(arabicVoices.length === 0) return null;
    const local = arabicVoices.find(v => v.localService);
    if(local) return local;
    return arabicVoices[0];
  }

  if("speechSynthesis" in window){
    speechSynthesis.onvoiceschanged = () => { cachedArabicVoice = pickBestArabicVoice(); };
    cachedArabicVoice = pickBestArabicVoice();
  }

  function speak(text, btn){
    if(!("speechSynthesis" in window)) return;
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      document.querySelectorAll(".action-btn.speaking").forEach(b => {
        b.classList.remove("speaking");
        b.textContent = "🔊 استماع للشرح";
      });
      if(btn && btn.classList.contains("__was_speaking")){
        btn.classList.remove("__was_speaking");
        return;
      }
    }
    if(btn) btn.classList.add("__was_speaking");
    currentUtterance = new SpeechSynthesisUtterance(text);
    if(cachedArabicVoice){
      currentUtterance.voice = cachedArabicVoice;
      currentUtterance.lang = cachedArabicVoice.lang;
    }
    currentUtterance.rate = 0.95;
    currentUtterance.onstart = () => { if(btn){ btn.classList.add("speaking"); btn.textContent = "⏸ إيقاف"; } avatarBox.classList.add("speaking"); };
    currentUtterance.onend = () => { if(btn){ btn.classList.remove("speaking"); btn.textContent = "🔊 استماع للشرح"; btn.classList.remove("__was_speaking"); } avatarBox.classList.remove("speaking"); };
    speechSynthesis.speak(currentUtterance);
  }

  let recognition = null;
  let isListening = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = navigator.language || 'ar';

    recognition.onresult = (event) => {
      const transcript = event.results[event.results.length - 1][0].transcript;
      input.value = (input.value ? input.value + ' ' : '') + transcript;
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    };
    recognition.onend = () => { stopListeningUI(); };
  }

  function startListening(){
    if (!recognition) { alert("متصفحك لا يدعم التعرف الصوتي."); return; }
    try {
      recognition.start();
      isListening = true;
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
    } catch(e){}
  }
  function stopListening(){
    isListening = false;
    if (recognition) { try { recognition.stop(); } catch(e){} }
    stopListeningUI();
  }
  function stopListeningUI(){
    isListening = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
  }

  micBtn.addEventListener("click", () => {
    if (!isListening) startListening(); else stopListening();
  });

  function buildSuperCard(rawText) {
    const card = document.createElement("div");
    card.className = "super-card";

    card.innerHTML = `
      <div class="super-header">
        <span>⚡ الأستاذ نبيل - الحل الأكاديمي المنسق</span>
        <span style="font-size:12px; font-weight:500; color:#F4D06F;">عناوين وفواصل واضحة</span>
      </div>
      <div class="super-body">
        <div class="super-section">
          <div class="super-sec-title">📌 التحليل العلمي والخطوات النموذجية</div>
          <div>${rawText}</div>
        </div>
      </div>
    `;
    return card;
  }

  function addMessage(role, text, sources, imageObjects){
    if(emptyState) emptyState.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;

    if(imageObjects && imageObjects.length > 0){
      const grid = document.createElement("div");
      grid.className = "images-grid";
      imageObjects.forEach(imgSrc => {
        const img = document.createElement("img");
        img.className = "attached";
        img.src = imgSrc;
        grid.appendChild(img);
      });
      div.appendChild(grid);
    }

    if(text){
      if(role === "teacher"){
        div.appendChild(buildSuperCard(text));
      } else {
        const p = document.createElement("div");
        p.textContent = text;
        div.appendChild(p);
      }
    }

    if(sources && sources.length){
      const ref = document.createElement("span");
      ref.className = "page-ref";
      ref.textContent = "المصدر المنهجي: " + sources.map(s => `${s.book} - صفحة ${s.page}`).join(" / ");
      div.appendChild(ref);
    }

    if(role === "teacher" && text){
      const actionsRow = document.createElement("div");
      actionsRow.className = "actions-row";

      const speakBtn = document.createElement("button");
      speakBtn.className = "action-btn";
      speakBtn.textContent = "🔊 استماع للشرح";
      speakBtn.addEventListener("click", () => speak(text, speakBtn));
      actionsRow.appendChild(speakBtn);

      const copyBtn = document.createElement("button");
      copyBtn.className = "action-btn";
      copyBtn.textContent = "📋 نسخ الحل";
      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = "✅ تم النسخ";
          setTimeout(() => { copyBtn.textContent = "📋 نسخ الحل"; }, 2000);
        });
      });
      actionsRow.appendChild(copyBtn);

      div.appendChild(actionsRow);
    }

    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showTyping(){
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typingIndicator";
    div.innerHTML = "<span></span><span></span><span></span>";
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  function hideTyping(){
    const el = document.getElementById("typingIndicator");
    if(el) el.remove();
  }

  async function sendMessage(){
    if (isListening) stopListening();

    const text = input.value.trim();
    if(!text && pendingFiles.length === 0) return;

    const imageUrls = pendingFiles.map(file => URL.createObjectURL(file));
    addMessage("student", text, null, imageUrls);

    const messageToSend = text;
    const filesToSend = [...pendingFiles];

    input.value = "";
    input.style.height = "auto";
    pendingFiles = [];
    renderPreviews();
    sendBtn.disabled = true;
    showTyping();

    const formData = new FormData();
    formData.append("student_id", getStudentId());
    if(conversationId) formData.append("conversation_id", conversationId);
    if(messageToSend) formData.append("message", messageToSend);
    formData.append("subject", document.getElementById("subjectSelect").value);
    formData.append("grade", document.getElementById("gradeSelect").value);
    formData.append("curriculum", document.getElementById("curriculumSelect").value);
    
    filesToSend.forEach(file => { formData.append("image", file); });

    try{
      const res = await fetch(API_BASE + "/api/chat", { method: "POST", body: formData });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      conversationId = data.conversation_id;
      if(conversationId) localStorage.setItem("nabilai_conversation_id", conversationId);

      hideTyping();
      addMessage("teacher", data.reply, data.sources, null);
    }catch(err){
      hideTyping();
      addMessage("teacher", "عذراً يا بطل، حدث خطأ في النظام التعليمي، جرب إرسال السؤال مرة أخرى 🙏");
      console.error(err);
    }finally{
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
})();
</script>
</body>
</html>
