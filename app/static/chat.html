<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ نبيل - محادثة تفاعلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e2923;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #132219;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #285430;
        }
        h1 { margin: 0; font-size: 22px; color: #a3e635; }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #285430;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-msg {
            background-color: #2d3748;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #4a5568;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tts-btn {
            background-color: #3b7a46;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 5px;
        }
        .tts-btn:hover { background-color: #4e9a5c; }
        #input-container {
            padding: 15px;
            background-color: #132219;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #285430;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a5568;
            background-color: #2d3748;
            color: white;
            font-size: 16px;
        }
        button {
            background-color: #285430;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover { background-color: #3b7a46; }
        button.recording { background-color: #dc2626 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .preview-box {
            padding: 5px 20px;
            background: #132219;
            font-size: 13px;
            color: #a3e635;
        }
    </style>
</head>
<body>

    <header>
        <h1>👨‍🏫 الأستاذ نبيل - المنهاج اللبناني الرسمي</h1>
    </header>

    <div id="chat-container">
        <div class="message bot-msg">
            <span>أهلاً بك يا بطل! معك الأستاذ نبيل. تفضل اطرح سؤالك أو ارفع صورة المسألة لنحلها سوياً خطوة بخطوة.</span>
        </div>
    </div>

    <div id="preview-container" class="preview-box" style="display:none;">🖼️ تم اختيار صورة للمسألة</div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب سؤالك أو استخدم المايك..." />
        <input type="file" id="image-input" accept="image/*" style="display: none;" />
        <button id="image-btn" title="رفع صورة">📷</button>
        <button id="mic-btn" title="تحدث بالمايك">🎤</button>
        <button id="stop-audio-btn" title="إيقاف الصوت" style="background-color: #7f1d1d;">🔇</button>
        <button id="send-btn">إرسال</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const stopAudioBtn = document.getElementById('stop-audio-btn');
        const imageBtn = document.getElementById('image-btn');
        const imageInput = document.getElementById('image-input');
        const previewContainer = document.getElementById('preview-container');

        let base64Image = null;
        let recognition = null;
        let isListening = false;
        let silenceTimer = null;
        let finalTranscriptBuffer = "";

        // تهيئة محرك التعرف على الصوت (Speech Recognition)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-LB';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let currentSessionText = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentSessionText += event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscriptBuffer += event.results[i][0].transcript + " ";
                    }
                }
                userInput.value = cleanRepeatedWords(finalTranscriptBuffer + currentSessionText);

                clearTimeout(silenceTimer);
                silenceTimer = setTimeout(() => {
                    if (userInput.value.trim().length > 2 && isListening) {
                        sendMessage();
                        stopMic();
                    }
                }, 2000);
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        function cleanRepeatedWords(text) {
            let words = text.trim().split(/\s+/);
            let uniqueWords = [];
            for (let i = 0; i < words.length; i++) {
                if (i === 0 || words[i] !== words[i - 1]) {
                    uniqueWords.push(words[i]);
                }
            }
            return uniqueWords.join(' ');
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                alert('عذراً، متصفحك لا يدعم الإدخال الصوتي.');
                return;
            }
            if (isListening) {
                stopMic();
            } else {
                startMic();
            }
        });

        function startMic() {
            isListening = true;
            finalTranscriptBuffer = "";
            micBtn.classList.add('recording');
            micBtn.textContent = '🛑';
            try { recognition.start(); } catch(e) {}
        }

        function stopMic() {
            isListening = false;
            clearTimeout(silenceTimer);
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎤';
            try { recognition.stop(); } catch(e) {}
        }

        stopAudioBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        imageBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    base64Image = uploadEvent.target.result;
                    previewContainer.style.display = 'block';
                    previewContainer.textContent = `🖼️ تم إرفاق الصورة: ${file.name}`;
                };
                reader.readAsDataURL(file);
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !base64Image) return;

            appendMessage(text || "أرسل صورة المسألة", 'user-msg');
            userInput.value = '';
            finalTranscriptBuffer = "";

            const currentImage = base64Image;
            base64Image = null;
            previewContainer.style.display = 'none';
            imageInput.value = '';

            const loadingId = appendMessage("الأستاذ نبيل يقرأ المسألة ويفكر بالحل...", 'bot-msg', false);

            try {
                const response = await fetch('/api/chat-with-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: "student_1",
                        message: text,
                        image: currentImage
                    })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (response.ok) {
                    // إرسال الرد مع زر استماع خاص به فقط
                    appendBotMessage(data.reply);
                } else {
                    appendMessage("حدث خطأ في الاتصال بالسيرفر، يرجى المحاولة لاحقاً.", 'bot-msg', false);
                }
            } catch (err) {
                removeMessage(loadingId);
                appendMessage("حدث خطأ في الشبكة.", 'bot-msg', false);
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            const id = 'msg_' + Date.now();
            msgDiv.id = id;
            return id;
        }

        function appendBotMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot-msg';
            
            const textSpan = document.createElement('span');
            textSpan.innerHTML = text.replace(/\n/g, '<br>');
            msgDiv.appendChild(textSpan);

            // زر الاستماع الخاص بهذه الرسالة
            const ttsButton = document.createElement('button');
            ttsButton.className = 'tts-btn';
            ttsButton.innerHTML = '🔊 استمع للشرح';
            ttsButton.onclick = () => speakText(text);
            msgDiv.appendChild(ttsButton);

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let cleanText = text
                .replace(/\$\$(.*?)\$\$/g, ' نقطة ')
                .replace(/\$(.*?)\$/g, ' ')
                .replace(/[\*\_\#\$\^\\\{\}]/g, ' ')
                .replace(/OM/g, 'أو إم')
                .replace(/O'M/g, 'أو فتحه إم')
                .replace(/OO'/g, 'أو أو فتحه');

            let sentences = cleanText.split(/[.،؟\n]/);
            let shortText = sentences.slice(0, 4).join('. ');

            const utterance = new SpeechSynthesisUtterance(shortText);
            utterance.lang = 'ar-SA';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
