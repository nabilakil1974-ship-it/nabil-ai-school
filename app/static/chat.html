function fillSelect(
    select,
    items,
    placeholder
) {

    select.innerHTML = "";

    const first =
        document.createElement(
            "option"
        );

    first.value = "";

    first.textContent =
        placeholder;

    select.appendChild(
        first

    items.forEach(
        item => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                item;

            option.textContent =
                item;

            select.appendChild(
                option
            );

        }
    );

}

/* ================================================
   INDEX
================================================ */

async function loadCurriculumIndex() {

    try {

        const response =
            await fetch(
                "/static/crdp_scientific_curriculum_index.json",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        curriculumIndex =
            data.verified_index ||
            {};

        updateLessons();

    }

    catch (error) {

        console.error(
            "INDEX ERROR",
            error
        );

        curriculumIndex = {};

        updateLessons();

    }

}


function updateLessons() {

    const grade =
        gradeSelect.value;

    const subject =
        subjectSelect.value;

    const language =
        languageSelect.value;

    let lessons = [];

    const gradeData =
        curriculumIndex?.[subject]?.[grade];

    if (gradeData) {

        const languageData =
            gradeData[language];

        if (
            Array.isArray(
                languageData
            )
        ) {

            lessons.push(
                ...languageData
            );

        }

        else if (
            languageData &&
            typeof languageData ===
                "object"
        ) {

            Object.values(
                languageData
            ).forEach(
                value => {

                    if (
                        Array.isArray(
                            value
                        )
                    ) {

                        lessons.push(
                            ...value
                        );

                    }

                }
            );

        }

        if (
            lessons.length === 0
        ) {

            Object.values(
                gradeData
            ).forEach(
                value => {

                    if (
                        Array.isArray(
                            value
                        )
                    ) {

                        lessons.push(
                            ...value
                        );

                    }

                    else if (
                        value &&
                        typeof value ===
                            "object"
                    ) {

                        Object.values(
                            value
                        ).forEach(
                            nested => {

                                if (
                                    Array.isArray(
                                        nested
                                    )
                                ) {

                                    lessons.push(
                                        ...nested
                                    );

                                }

                            }
                        );

                    }

                }
            );

        }

    }

    lessons = [
        ...new Set(
            lessons
        )
    ];

    lessonSelect.innerHTML =
        "";

    const first =
        document.createElement(
            "option"
        );

    first.value = "";

    first.textContent =
        lessons.length
            ? "اختر الدرس"
            : "لا توجد دروس مفهرسة بعد";

    lessonSelect.appendChild(
        first
    );

    lessons.forEach(
        lesson => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                lesson;

            option.textContent =
                lesson;

            lessonSelect.appendChild(
                option
            );

        }
    );

}

/* ================================================
   TEXT RENDER
================================================ */

function renderAIText(text) {

    if (!text) {
        return "";
    }

    const mathBlocks = [];

    function saveMath(match) {

        const i =
            mathBlocks.length;

        mathBlocks.push(
            match
        );

        return (
            "___MATH_" +
            i +
            "___"
        );

    }

    let content =
        String(text);

    content =
        content.replace(
            /\$\$[\s\S]*?\$\$/g,
            saveMath
        );

    content =
        content.replace(
            /\\\[[\s\S]*?\\\]/g,
            saveMath
        );

    content =
        content.replace(
            /\\\([\s\S]*?\\\)/g,
            saveMath
        );

    content =
        content.replace(
            /\$[^$\n]+\$/g,
            saveMath
        );

    content =
        content
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            );

    content =
        content.replace(
            /^### (.+)$/gm,
            "<h4>$1</h4>"
        );

    content =
        content.replace(
            /^## (.+)$/gm,
            "<h3>$1</h3>"
        );

    content =
        content.replace(
            /^# (.+)$/gm,
            "<h2>$1</h2>"
        );

    content =
        content.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );

    content =
        content.replace(
            /\n/g,
            "<br>"
        );

    mathBlocks.forEach(
        (math,i) => {

            content =
                content.replace(
                    "___MATH_" +
                    i +
                    "___",
                    math
                );

        }
    );

    return content;

}

function cleanSpeechText(text) {

    return String(text || "")
        .replace(
            /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
            "$1 على $2"
        )
        .replace(
            /\\sqrt\{([^{}]+)\}/g,
            "الجذر التربيعي لـ $1"
        )
        .replace(
            /\^2/g,
            " تربيع"
        )
        .replace(
            /\^3/g,
            " تكعيب"
        )
        .replace(
            /\\boxed\{([^{}]+)\}/g,
            "$1"
        )
        .replace(
            /\\[a-zA-Z]+/g,
            ""
        )
        .replace(
            /[*_#>`$]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}

/* ================================================
   GRAPH ENGINE
================================================ */

function functionY(
    kind,
    x
) {

    switch(kind) {

        case "ln":
            return (
                x > 0
                    ? Math.log(x)
                    : null
            );

        case "exp":
            return Math.exp(x);

        case "square":
            return x * x;

        case "linear":
            return x;

        case "inverse":
            return (
                Math.abs(x) < .0001
                    ? null
                    : 1 / x
            );

        default:
            return null;

    }

}


function renderFunction(
    drawing
) {

    const width = 700;
    const height = 420;

    const left = 65;
    const right = 30;
    const top = 30;
    const bottom = 55;

    const xMin =
        Number(
            drawing.x_min ?? -5
        );

    const xMax =
        Number(
            drawing.x_max ?? 5
        );

    const yMin =
        Number(
            drawing.y_min ?? -5
        );

    const yMax =
        Number(
            drawing.y_max ?? 5
        );

    const plotWidth =
        width -
        left -
        right;

    const plotHeight =
        height -
        top -
        bottom;

    function sx(x) {

        return (
            left +
            (
                (x - xMin) /
                (xMax - xMin)
            ) *
            plotWidth
        );

    }

    function sy(y) {

        return (
            top +
            (
                (yMax - y) /
                (yMax - yMin)
            ) *
            plotHeight
        );

    }

    let path = "";

    let penDown = false;

    const steps = 550;

    for (
        let i = 0;
        i <= steps;
        i++
    ) {

        const x =
            xMin +
            (
                (xMax - xMin) *
                i /
                steps
            );

        const y =
            functionY(
                drawing.function,
                x
            );

        if (
            y === null ||
            !Number.isFinite(y) ||
            y < yMin - 5 ||
            y > yMax + 5
        ) {

            penDown =
                false;

            continue;

        }

        const px =
            sx(x);

        const py =
            sy(y);

        if (!penDown) {

            path +=
                `M ${px} ${py} `;

            penDown =
                true;

        }

        else {

            path +=
                `L ${px} ${py} `;

        }

    }

    let grid = "";

    for (
        let x =
            Math.ceil(xMin);
        x <= Math.floor(xMax);
        x++
    ) {

        const px =
            sx(x);

        grid += `
<line
    x1="${px}"
    y1="${top}"
    x2="${px}"
    y2="${height-bottom}"
    stroke="#e2e8f0"
    stroke-width="1"
/>
`;

    }

    for (
        let y =
            Math.ceil(yMin);
        y <= Math.floor(yMax);
        y++
    ) {

        const py =
            sy(y);

        grid += `
<line
    x1="${left}"
    y1="${py}"
    x2="${width-right}"
    y2="${py}"
    stroke="#e2e8f0"
    stroke-width="1"
/>
`;

    }

    let points = "";

    (
        drawing.points ||
        []
    ).forEach(
        point => {

            const px =
                sx(
                    Number(
                        point.x
                    )
                );

            const py =
                sy(
                    Number(
                        point.y
                    )
                );

            points += `
<circle
    cx="${px}"
    cy="${py}"
    r="5"
    fill="#dc2626"
/>

<text
    x="${px + 10}"
    y="${py - 10}"
    class="graph-label"
>
${point.label || ""}
</text>
`;

        }
    );

    let asymptote = "";

    if (
        drawing.vertical_asymptote !==
        undefined &&
        drawing.vertical_asymptote !==
        null
    ) {

        const px =
            sx(
                Number(
                    drawing.vertical_asymptote
                )
            );

        asymptote = `
<line
    x1="${px}"
    y1="${top}"
    x2="${px}"
    y2="${height-bottom}"
    stroke="#dc2626"
    stroke-width="2"
    stroke-dasharray="7 6"
/>

<text
    x="${px + 7}"
    y="${height-bottom-8}"
    class="graph-label"
    fill="#dc2626"
>
x = ${drawing.vertical_asymptote}
</text>
`;

    }

    const xAxisY =
        (
            yMin <= 0 &&
            yMax >= 0
        )
        ? sy(0)
        : height - bottom;

    const yAxisX =
        (
            xMin <= 0 &&
            xMax >= 0
        )
        ? sx(0)
        : left;

    return `
<div class="drawing-title">
📈 ${drawing.title || drawing.expression || "الرسم البياني"}
</div>

<svg
    viewBox="0 0 ${width} ${height}"
>

${grid}

<line
    x1="${left}"
    y1="${xAxisY}"
    x2="${width-right}"
    y2="${xAxisY}"
    stroke="#334155"
    stroke-width="2"
/>

<line
    x1="${yAxisX}"
    y1="${top}"
    x2="${yAxisX}"
    y2="${height-bottom}"
    stroke="#334155"
    stroke-width="2"
/>

${asymptote}

<path
    d="${path}"
    fill="none"
    stroke="#2563eb"
    stroke-width="4"
/>

${points}

<text
    x="${width-right-10}"
    y="${xAxisY-8}"
    class="graph-label"
>
x
</text>

<text
    x="${yAxisX+9}"
    y="${top+15}"
    class="graph-label"
>
y
</text>

</svg>
`;

}


/* ================================================
   RIGHT TRIANGLE
================================================ */

function renderTriangle(
    drawing
) {

    const a =
        drawing.labels?.a ??

/* ================================================
   FORCES
================================================ */

function renderForces(
    drawing
) {

    let arrows = "";

    (
        drawing.forces ||
        []
    ).forEach(
        force => {

            let x2 = 350;
            let y2 = 190;

            if (
                force.direction ===
                "up"
            ) {
                y2 = 70;
            }

            if (
                force.direction ===
                "down"
            ) {
                y2 = 315;
            }

            if (
                force.direction ===
                "left"
            ) {
                x2 = 170;
            }

            if (
                force.direction ===
                "right"
            ) {
                x2 = 530;
            }

            arrows += `
<line
    x1="350"
    y1="190"
    x2="${x2}"
    y2="${y2}"
    stroke="#dc2626"
    stroke-width="4"
/>

<circle
    cx="${x2}"
    cy="${y2}"
    r="4"
    fill="#dc2626"
/>

<text
    x="${x2 + 10}"
    y="${y2 - 8}"
    class="graph-label"
>
${force.label || "F"}
</text>
`;

        }
    );

    return `
<div class="drawing-title">
⚙️ ${drawing.title || "مخطط القوى"}
</div>

<svg viewBox="0 0 700 380">

<rect
    x="300"
    y="145"
    width="100"
    height="90"
    rx="10"
    fill="#eff6ff"
    stroke="#2563eb"
    stroke-width="3"
/>

<text
    x="342"
    y="198"
    class="graph-label"
>
${drawing.object || "m"}
</text>

${arrows}

</svg>
`;

}


/* ================================================
   MOLECULE
================================================ */

function renderMolecule(
    drawing
) {

    const atoms =
        drawing.atoms ||
        [];

    if (!atoms.length) {

        return "";

    }

    const width = 700;
    const centerY = 190;

    const gap =
        atoms.length > 1
            ? 450 /
              (
                atoms.length -
                1
              )
            : 0;

    let output = "";

    atoms.forEach(
        (atom,index) => {

            const x =
                atoms.length === 1
                    ? 350
                    : 125 +
                      gap *
                      index;

            if (
                index <
                atoms.length - 1
            ) {

                const nextX =
                    125 +
                    gap *
                    (
                        index +
                        1
                    );

                output += `
<line
    x1="${x + 35}"
    y1="${centerY}"
    x2="${nextX - 35}"
    y2="${centerY}"
    stroke="#334155"
    stroke-width="5"
/>
`;

            }

            output += `
<circle
    cx="${x}"
    cy="${centerY}"
    r="38"
    fill="#eff6ff"
    stroke="#2563eb"
    stroke-width="3"
/>

<text
    x="${x}"
    y="${centerY + 7}"
    text-anchor="middle"
    class="graph-label"
>
${atom.label || "X"}
</text>
`;

        }
    );

    return `
<div class="drawing-title">
🧪 ${drawing.title || "البنية الجزيئية"}
</div>

<svg viewBox="0 0 ${width} 380">
${output}
</svg>
`;

}


/* ================================================
   DRAWING DISPATCH
================================================ */

function renderDrawing(
    drawing
) {

    if (
        !drawing ||
        !drawing.type
    ) {

        return `
<div class="drawing-title">
لا توجد رسمة مرتبطة بهذا الجواب.
</div>
`;

    }

    switch(
        drawing.type
    ) {

        case "function":

            return renderFunction(
                drawing
            );

        case "right_triangle":

            return renderTriangle(
                drawing
            );

        case "circle_tangent":

            return renderCircle(
                drawing
            );

        case "forces":

            return renderForces(
                drawing
            );

        case "molecule":

            return renderMolecule(
                drawing
            );

        default:

            return `
<div class="drawing-title">
لا يوجد محرّك رسم لهذا النوع بعد.
</div>
`;

    }

}


/* ================================================
   ADD MESSAGE
================================================ */

function addMessage(
    role,
    text,
    drawing = null
) {

    if (welcome) {

        welcome.style.display =
            "none";

    }

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        role;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    if (
        role === "teacher"
    ) {

        bubble.innerHTML =
            renderAIText(
                text
            );

    }

    else {

        bubble.textContent =
            text;

    }

    if (
        role === "teacher" &&
        text
    ) {

        const tools =
            document.createElement(
                "div"
            );

        tools.className =
            "teacher-tools";


        const copyButton =
            document.createElement(
                "button"
            );

        copyButton.textContent =
            "📋 نسخ الإجابة";

        copyButton.onclick =
            () =>
                copyAnswer(
                    text
                );


        const readButton =
            document.createElement(
                "button"
            );

        readButton.textContent =
            "🔊 اقرأ الإجابة";

        readButton.onclick =
            () =>
                readAnswer(
                    text
                );


        tools.appendChild(
            copyButton
        );

        tools.appendChild(
            readButton
        );


        if (drawing) {

            const drawingBox =
                document.createElement(
                    "div"
                );

            drawingBox.className =
                "answer-drawing";


            const drawButton =
                document.createElement(
                    "button"
                );

            drawButton.className =
                "draw-answer-btn";

            drawButton.textContent =
                "📐 إظهار الرسمة";


            drawButton.onclick =
                () => {

                    const visible =
                        drawingBox
                            .classList
                            .contains(
                                "visible"
                            );

                    if (visible) {

                        drawingBox
                            .classList
                            .remove(
                                "visible"
                            );

                        drawButton
                            .classList
                            .remove(
                                "active"
                            );

                        drawButton
                            .textContent =
                            "📐 إظهار الرسمة";

                    }

                    else {

                        if (
                            !drawingBox
                                .dataset
                                .rendered
                        ) {

                            drawingBox
                                .innerHTML =
                                renderDrawing(
                                    drawing
                                );

                            drawingBox
                                .dataset
                                .rendered =
                                "true";

                        }

                        drawingBox
                            .classList
                            .add(
                                "visible"
                            );

                        drawButton
                            .classList
                            .add(
                                "active"
                            );

                        drawButton
                            .textContent =
                            "📐 إخفاء الرسمة";

                    }

                };


            tools.appendChild(
                drawButton
            );

            bubble.appendChild(
                tools
            );

            bubble.appendChild(
                drawingBox
            );

        }

        else {

            bubble.appendChild(
                tools
            );

        }

    }

    wrapper.appendChild(
        bubble
    );

    chat.appendChild(
        wrapper
    );

    chat.scrollTop =
        chat.scrollHeight;

    if (
        role === "teacher" &&
        window.MathJax &&
        typeof MathJax.typesetPromise ===
            "function"
    ) {

        MathJax.typesetPromise(
            [bubble]
        ).catch(
            console.error
        );

    }

}


/* ================================================
   SEND
================================================ */

async function sendToAI(
    message,
    showStudentMessage = true
) {

    const grade =
        gradeSelect.value;

    const subject =
        subjectSelect.value;

    const language =
        languageSelect.value;

    const lesson =
        lessonSelect.value;


    if (
        !grade ||
        !subject
    ) {

        alert(
            "اختر الصف والمادة أولاً."
        );

        return;

    }


    if (
        showStudentMessage
    ) {

        if (message) {

            addMessage(
                "student",
                message
            );

        }

        else if (
            selectedImage
        ) {

            addMessage(
                "student",
                "🖼️ صورة"
            );

        }

    }


    const formData =
        new FormData();


    formData.append(
        "student_id",
        getStudentId()
    );


    if (
        conversationId
    ) {

        formData.append(
            "conversation_id",
            conversationId
        );

    }


    formData.append(
        "message",
        message || ""
    );

    formData.append(
        "grade",
        grade
    );

    formData.append(
        "subject",
        subject
    );

    formData.append(
        "language",
        language
    );

    formData.append(
        "curriculum",
        FIXED_CURRICULUM
    );

    formData.append(
        "lesson",
        lesson || ""
    );


    if (
        selectedImage
    ) {

        formData.append(
            "image",
            selectedImage
        );

    }


    try {

        sendBtn.disabled =
            true;

        startLesson.disabled =
            true;

        sendBtn.textContent =
            "جاري التفكير...";


        const response =
            await fetch(
                API_BASE +
                "/api/chat",
                {
                    method:
                        "POST",
                    body:
                        formData
                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.detail ||
                "حدث خطأ في الخادم."
            );

        }


        if (
            data.conversation_id
        ) {

            conversationId =
                data.conversation_id;

        }


        addMessage(
            "teacher",
            data.reply ||
            "لم يصل جواب.",
            data.drawing ||
            null
        );


        selectedImage =
            null;

        imageInput.value =
            "";

        messageInput.value =
            "";

        messageInput.placeholder =
            "اكتب سؤالك هنا...";

    }

    catch(error) {

        console.error(
            error
        );

        addMessage(
            "teacher",
            "حدث خطأ في الاتصال بـ NABIL AI:\n" +
            error.message
        );

    }

    finally {

        sendBtn.disabled =
            false;

        startLesson.disabled =
            false;

        sendBtn.textContent =
            "إرسال";

    }

}


/* ================================================
   START LESSON
================================================ */

startLesson.addEventListener(
    "click",
    async () => {

        const grade =
            gradeSelect.value;

        const subject =
            subjectSelect.value;

        const language =
            languageSelect.value;

        const lesson =
            lessonSelect.value;


        if (
            !grade ||
            !subject ||
            !lesson
        ) {

            alert(
                "اختر الصف والمادة والدرس."
            );

            return;

        }


        currentLesson.textContent =
            lesson;

        lessonInfo.style.display =
            "block";


        const prompt =
`ابدأ درسًا تفاعليًا.

الصف: ${grade}
المادة: ${subject}
اللغة: ${language}
الدرس: ${lesson}

ابدأ بتمهيد قصير.
اشرح الفكرة الأولى.
استخدم مثالًا مناسبًا.
إذا كان الرسم مفيدًا أرسل DRAWING_JSON.
لا تستخدم رسومات ASCII.
اطرح سؤال تحقق واحدًا.`;


        await sendToAI(
            prompt,
            false
        );

    }
);


/* ================================================
   SEND BUTTON
================================================ */

sendBtn.addEventListener(
    "click",
    async () => {

        const message =
            messageInput
                .value
                .trim();

        if (
            !message &&
            !selectedImage
        ) {

            return;

        }

        await sendToAI(
            message,
            true
        );

    }
);


/* ================================================
   IMAGE
================================================ */

imageBtn.addEventListener(
    "click",
    () =>
        imageInput.click()
);


imageInput.addEventListener(
    "change",
    function() {

        if (
            this.files &&
            this.files[0]
        ) {

            selectedImage =
                this.files[0];

            messageInput.placeholder =
                "تم اختيار صورة. اكتب طلبك أو اضغط إرسال.";

        }

    }
);


/* ================================================
   ENTER
================================================ */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
                "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendBtn.click();

        }

    }
);


/* ================================================
   SPEECH INPUT
================================================ */

if (
    "webkitSpeechRecognition"
        in window ||
    "SpeechRecognition"
        in window
) {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onresult =
        event => {

            messageInput.value =
                event.results[0][0]
                    .transcript;

        };

}


micBtn.addEventListener(
    "click",
    () => {

        if (!recognition) {

            alert(
                "التعرف الصوتي غير مدعوم."
            );

            return;

        }


        recognition.lang =
            languageSelect.value ===
                "English"
            ? "en-US"
            : languageSelect.value ===
                "Français"
                ? "fr-FR"
                : "ar-LB";


        recognition.start();

    }
);


loadCurriculumIndex();

</script>
