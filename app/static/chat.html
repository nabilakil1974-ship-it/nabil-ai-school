<!DOCTYPE html>
<html lang="ar" dir="rtl">
 
<head>
    <meta charset="UTF-8">
 
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
 
    <meta name="color-scheme" content="light">
 
    <title>منصة النبيل التعليمية الذكية</title>
 
    <script>

                fontCache: 'global'
            }

    <style>
 
        :root {
            color-scheme: only light;
 
            --blue-dark: #173b6c;
            --blue: #2563eb;
            --blue-light: #3b82f6;
            --green: #16a34a;
            --text: #111827;
            --muted: #64748b;
            --border: #d9e3ef;
            --page: #f6f9fd;
            --teacher: #f1fff5;
            --student: #e8f1ff;
        }
 
        * {
            box-sizing: border-box;
        }
 
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--page) !important;
            color: var(--text) !important;
            color-scheme: only light;
        }
 
        body {
            font-family: Arial, Tahoma, sans-serif;
        }
 
        .header {
            background:
                linear-gradient(
                    135deg,
                    #2e78c9,
                    #173b6c
                );
 
            color: white;
            padding: 18px 22px;
 
            box-shadow:
                0 3px 12px
                rgba(15, 23, 42, .16);
        }
 
        .header-title {
            text-align: center;
            font-size: 29px;
            font-weight: 800;
            margin-bottom: 20px;
        }
 
        .controls {
            max-width: 1450px;
            margin: auto;
 
            display: grid;
 
            grid-template-columns:
                repeat(
                    4,
                    minmax(150px, 1fr)
                )
                auto;
 
            gap: 14px;
            align-items: end;
        }
 
        .control {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
 
        .control label {
            font-size: 15px;
            font-weight: 800;
            color: white;
        }
 
        select {
            width: 100%;
            min-height: 48px;
            padding: 10px 13px;
 
            border:
                1px solid #d4dfec;
 
            border-radius: 9px;
 
            background:
                white !important;
 
            color:
                #172033 !important;
 
            font-size: 15px;
            outline: none;
        }
 
        select:focus {
            border-color: #60a5fa;
 
            box-shadow:
                0 0 0 3px
                rgba(
                    59,
                    130,
                    246,
                    .14
                );
        }
 
        #startLesson {
            min-height: 48px;
            padding: 11px 24px;
            border: none;
            border-radius: 9px;
 
            background:
                linear-gradient(
                    180deg,
                    #22c55e,
                    #16a34a
                );
 
            color: white;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
 
            box-shadow:
                0 4px 12px
                rgba(
                    22,
                    163,
                    74,
                    .22
                );
        }
 
        #startLesson:disabled {
            opacity: .6;
            cursor: not-allowed;
        }
 
        .container {
            max-width: 1180px;
            margin: 18px auto;
            padding: 0 15px 90px;
        }
 
        .lesson-info {
            display: none;
            background: white;
            padding: 14px 18px;
 
            border:
                1px solid
                var(--border);
 
            border-radius: 12px;
            margin-bottom: 12px;
 
            box-shadow:
                0 2px 8px
                rgba(
                    15,
                    23,
                    42,
                    .06
                );
        }
 
        .lesson-info strong {
            color: var(--blue-dark);
        }
 
        .index-status {
            margin-top: 6px;
            font-size: 13px;
            color: var(--muted);
        }
 
        .chat {
            min-height: 520px;
            max-height: 720px;
            overflow-y: auto;
            padding: 18px;
            background: white;
 
            border:
                1px solid
                #e2eaf3;
 
            border-radius: 16px;
 
            box-shadow:
                0 8px 28px
                rgba(
                    15,
                    23,
                    42,
                    .07
                );
        }
 
        .welcome {
            text-align: center;
            padding: 75px 20px;
            color: var(--muted);
        }
 
        .welcome h2 {
            color: var(--blue-dark);
        }
 
        .message {
            display: flex;
            margin: 12px 0;
        }
 
        .message.student {
            justify-content: flex-start;
        }
 
        .message.teacher {
            justify-content: stretch;
        }
 
        .bubble {
            padding: 15px 18px;
            border-radius: 15px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }
 
        .bubble.ltr-content {
            direction: ltr;
            text-align: left;
        }
 
        .bubble.rtl-content {
            direction: rtl;
            text-align: right;
        }
 
        .bubble.ltr-content,
        .bubble.ltr-content *:not(mjx-container):not(mjx-container *) {
            direction: ltr;
            text-align: left;
        }
 
        .bubble.ltr-content ul,
        .bubble.ltr-content ol {
            direction: ltr;
            text-align: left;
            padding-left: 24px;
            padding-right: 0;
        }
 
        .bubble.rtl-content h2,
        .bubble.rtl-content h3,
        .bubble.rtl-content h4,
        .bubble.rtl-content p,
        .bubble.rtl-content li {
            direction: rtl;
            text-align: right;
        }
 
        .bubble.ltr-content .teacher-tools {
            direction: ltr;
            justify-content: flex-start;
        }
 
        .bubble.rtl-content .teacher-tools {
            direction: rtl;
            justify-content: flex-start;
        }
 
        .student .bubble {
            max-width: 82%;
            background: var(--student);
 
            border:
                1px solid
                #cfe1ff;
        }
 
        .teacher .bubble {
            width: 100%;
            max-width: 100%;
 
            background:
                linear-gradient(
                    180deg,
                    #f6fff8,
                    #effcf3
                );
 
            border:
                1px solid
                #cbead3;
 
            box-shadow:
                0 3px 14px
                rgba(
                    22,
                    101,
                    52,
                    .06
                );
        }
 
        .teacher .bubble h2,
        .teacher .bubble h3,
        .teacher .bubble h4 {
            color: #123c2a;
        }
 
        .bubble mjx-container {
            direction: ltr !important;
            color: #111827 !important;
        }
 
        .teacher-tools {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
 
        .teacher-tools button {
            min-height: 38px;
            padding: 8px 14px;
 
            border:
                1px solid
                #35475a;
 
            border-radius: 8px;
            background: #263341;
            color: white;
            font-weight: 800;
            cursor: pointer;
        }
 
        .teacher-tools button:hover {
            filter: brightness(1.08);
        }
 
        .draw-answer-btn.active {
            background: #1672e8;
            border-color: #1672e8;
        }
 
        .answer-drawing {
            display: none;
            margin-top: 14px;
            padding: 0;
 
            background:
                white !important;
 
            color:
                #111827 !important;
 
            border:
                1px solid
                #a8c8ef;
 
            border-radius: 13px;
            overflow: hidden;
 
            box-shadow:
                0 4px 18px
                rgba(
                    37,
                    99,
                    235,
                    .08
                );
        }
 
        .answer-drawing.visible {
            display: block;
        }

        .drawing-item {
            margin-top: 14px;
        }

        .drawing-item + .drawing-item {
            padding-top: 14px;
            border-top: 1px dashed #cbd5e1;
        }

        .drawing-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .drawing-actions button {
            min-height: 36px;
            padding: 7px 12px;
            border-radius: 8px;
            background: #263341;
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        .drawing-actions .draw-answer-btn.active {
            background: #1672e8;
        }
 
        .drawing-title {
            margin: 0;
            padding: 12px 16px;
            text-align: center;
            font-size: 19px;
            font-weight: 800;
            color: white;
 
            background:
                linear-gradient(
                    180deg,
                    #34495d,
                    #283848
                );
        }
 
        .graph-shell {
            padding: 16px;
            background: white;
        }
 
        .graph-layout {
            display: grid;
 
            grid-template-columns:
                minmax(0, 1fr)
                230px;
 
            gap: 16px;
            direction: ltr;
        }
 
        .graph-canvas {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
 
        .graph-properties {
            direction: rtl;
            padding: 11px 12px;
 
            background:
                linear-gradient(
                    180deg,
                    #fffbea,
                    #fff6cf
                );
 
            border:
                1px solid
                #f2c94c;
 
            border-radius: 10px;
            color: #111827;
            font-size: 12px;
            line-height: 1.55;
            overflow: hidden;
        }
 
        .graph-properties strong {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            text-align: center;
        }
 
        .graph-properties .property-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin: 4px 0;
            font-size: 12px;
            line-height: 1.45;
        }
 
        .graph-properties .property-value {
            direction: ltr;
            unicode-bidi: isolate;
            font-weight: 800;
            font-size: 12px;
            white-space: nowrap;
        }
 
        .graph-properties mjx-container,
        .graph-properties mjx-container svg {
            max-width: 100% !important;
            font-size: 12px !important;
        }
 
        .answer-drawing svg {
            display: block;
            width: 100%;
            height: auto;
            max-width: none;
            min-width: 0;
            background: white !important;
        }
 
        .graph-label,
        .graph-tick {
            font-size: 14px;
            font-weight: 700;
            fill: #111827;
        }
 
        .graph-axis-label {
            font-size: 18px;
            font-weight: 800;
            font-style: italic;
            fill: #111827;
        }
 
        .input-area {
            position: sticky;
            bottom: 0;
            z-index: 10;
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding: 10px;
 
            background:
                rgba(
                    247,
                    251,
                    255,
                    .97
                );
 
            border-top:
                1px solid
                #dfe8f2;
 
            backdrop-filter: blur(8px);
        }
 
        textarea {
            flex: 1;
            min-height: 56px;
            resize: none;
            padding: 13px 15px;
 
            border:
                1px solid
                #cbd5e1;
 
            border-radius: 10px;
            background: white;
            color: #111827;
            font-size: 16px;
            outline: none;
        }
 
        textarea:focus {
            border-color: #60a5fa;
 
            box-shadow:
                0 0 0 3px
                rgba(
                    59,
                    130,
                    246,
                    .12
                );
        }
 
        button {
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
 
        #sendBtn,
        #imageBtn,
        #micBtn {
            min-width: 62px;
            border-radius: 10px;
            color: white;
        }
 
        #sendBtn {
            background: #0f67e8;
            padding: 0 22px;
        }
 
        #imageBtn {
            background: #8da0b4;
            padding: 0 18px;
        }
 
        #micBtn {
            background: #7c2bd4;
            padding: 0 18px;
        }
 
        #imageInput {
            display: none;
        }
 
        @media(max-width:900px) {
            .graph-layout {
                grid-template-columns: 1fr;
            }
        }
 
        @media(max-width:700px) {
            .controls {
                grid-template-columns: 1fr 1fr;
            }
 
            .student .bubble {
                max-width: 96%;
            }
        }
 
        @media(max-width:550px) {
            .controls {
                grid-template-columns: 1fr;
            }
 
            .input-area {
                flex-wrap: wrap;
            }
 
            textarea {
                flex-basis: 100%;
            }
        }
 
    
        /* ===== NABIL AI header portrait ===== */
        .brand-title-with-photo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
 
        .nabil-profile-photo {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 24%;
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.22);
            flex: 0 0 54px;
            background: #ffffff;
        }
 
        @media (max-width: 700px) {
            .brand-title-with-photo {
                gap: 8px;
            }
 
            .nabil-profile-photo {
                width: 44px;
                height: 44px;
                flex-basis: 44px;
                border-width: 2px;
            }
        }
 
    </style>
</head>

<header class="header">
 
    <div class="header-title"><span class="brand-title-with-photo"><img class="nabil-profile-photo" src="/static/nabil-profile.jpg" alt="صورة الأستاذ نبيل" onerror="this.style.display='none'"><span>منصة النبيل التعليمية الذكية</span></span></div>
 
    <div class="controls">
 
        <div class="control">
            <label>الصف</label>
            <select id="gradeSelect"></select>
        </div>

        <div class="control" id="branchControl" style="display:none;">
            <label>الفرع</label>
            <select id="branchSelect"></select>
        </div>
 
        <div class="control">
            <label>المادة</label>
            <select id="subjectSelect"></select>
        </div>
 
        <div class="control">
            <label>اللغة</label>

                <option value="العربية">العربية</option>

        </div>
 
        <button
            id="startLesson"
            type="button"
        >
            ▶ ابدأ الدرس
        </button>
 
    </div>
 
</header>
 
<main class="container">
 
    <div
        id="lessonInfo"
        class="lesson-info"
    >
        <strong>
            الدرس الحالي:
        </strong>
 
        <span id="currentLesson"></span>
 
        <div
            id="indexStatus"
            class="index-status"
        ></div>
    </div>
 
    <section
        id="chat"
        class="chat"
    >
        <div
            id="welcome"
            class="welcome"
        >
            <h2>
                مرحباً بك في NABIL AI 👨🏫
            </h2>
 
            <p>
                اختر الصف والمادة واللغة والدرس ثم ابدأ.
            </p>
        </div>
    </section>
 
    <div class="input-area">
 
        <textarea
            id="messageInput"
            placeholder="اكتب سؤالك هنا..."
        ></textarea>
 
        <button
            id="imageBtn"
            type="button"
        >
            🖼️
        </button>
 
        <input
            id="imageInput"
            type="file"
            accept="image/*"
        >
 
        <button
            id="micBtn"
            type="button"
        >
            🎤
        </button>
 
        <button
            id="sendBtn"
            type="button"
        >
            إرسال
        </button>
 
    </div>
 
</main>

   دمج الفهرسة الداخلية مع الخارجية
========================================================= */
 
function mergeCurriculumIndexes(
    baseIndex,
    remoteIndex
) {
    const merged =
        JSON.parse(
            JSON.stringify(
                baseIndex || {}
            )
        );
 
    Object.entries(
        remoteIndex || {}
    ).forEach(
        ([subject, subjectData]) => {
 
            if (!merged[subject]) {
                merged[subject] = {};
            }
 
            Object.entries(
                subjectData || {}
            ).forEach(
                ([grade, gradeData]) => {
 
                    if (
                        !merged[subject][grade]
                    ) {
                        merged[subject][grade] = {};
                    }
 
                    Object.entries(
                        gradeData || {}
                    ).forEach(
                        ([language, lessons]) => {
 
                            if (
                                Array.isArray(
                                    lessons
                                )
                            ) {
 
                                const current =
                                    Array.isArray(
                                        merged[subject][grade][language]
                                    )
                                    ? merged[subject][grade][language]
                                    : [];
 
                                merged[subject][grade][language] =
                                    [
                                        ...new Set(
                                            [
                                                ...current,
                                                ...lessons
                                            ]
                                        )
                                    ];
                            }
                        }
                    );
                }
            );
        }
    );
 
    return merged;
}

async function loadCurriculumIndex() {
 
    curriculumIndex =
        mergeCurriculumIndexes(
            {},
            FALLBACK_CURRICULUM_INDEX
        );
 
    try {
        const response =
            await fetch(
                "/static/crdp_scientific_curriculum_index.json",
                {
                    cache:
                        "no-store"
                }
            );
 
        if (response.ok) {
 
            const data =
                await response.json();
 
            curriculumIndex =
                mergeCurriculumIndexes(
                    curriculumIndex,
                    data.verified_index ||
                    {}
                );

            secondaryStructure =
                data.secondary_structure ||
                {};
 
            indexStatus.textContent =
                "تم تحميل فهرس الدروس.";
 
        }
 
        else {
 
            indexStatus.textContent =
                "تم تشغيل الفهرس الداخلي.";
 
        }
    }
 
    catch(error) {
 
        console.warn(
            "INDEX:",
            error
        );
 
        indexStatus.textContent =
            "تم تشغيل الفهرس الداخلي.";
    }
 
    updateLessons();
}

function updateBranchAndSubjects() {
    const grade = gradeSelect.value;
    const branchesObject = secondaryStructure?.[grade]?.branches || {};
    const branches = Object.keys(branchesObject);

    branchControl.style.display = branches.length ? "flex" : "none";

    if (!branches.length) {
        fillSelect(subjectSelect, SUBJECTS, "اختر المادة");
        branchSelect.innerHTML = "";
        return;
    }

    const oldBranch = branchSelect.value;
    fillSelect(branchSelect, branches, "اختر الفرع");

    if (branches.includes(oldBranch)) {
        branchSelect.value = oldBranch;
    }

    const branch = branchSelect.value;
    const subjects = branch ? (branchesObject?.[branch]?.subjects || []) : [];
    fillSelect(subjectSelect, subjects, branch ? "اختر المادة" : "اختر الفرع أولاً");
}

function updateLessons() {
    const grade = gradeSelect.value;
    const branch = branchSelect.value;
    const subject = subjectSelect.value;
    const language = languageSelect.value;
    let lessons = [];

    const branchData =
        secondaryStructure?.[grade]?.branches?.[branch]?.[subject];

    if (branchData && typeof branchData === "object") {
        const direct = branchData[language];
        if (Array.isArray(direct)) lessons.push(...direct);

        if (!lessons.length) {
            Object.values(branchData).forEach(value => {
                if (Array.isArray(value)) lessons.push(...value);
            });
        }
    }

    if (!lessons.length) {
        const gradeData = curriculumIndex?.[subject]?.[grade];

        if (gradeData) {
            const direct = gradeData[language];
            if (Array.isArray(direct)) lessons.push(...direct);

            if (!lessons.length) {
                Object.values(gradeData).forEach(value => {
                    if (Array.isArray(value)) lessons.push(...value);
                });
            }
        }
    }

    lessons = [...new Set(lessons)];
    lessonSelect.innerHTML = "";

    const first = document.createElement("option");
    first.value = "";
    first.textContent = lessons.length ? "اختر الدرس" : "لا توجد دروس مفهرسة بعد";
    lessonSelect.appendChild(first);

    lessons.forEach(lesson => {
        const option = document.createElement("option");
        option.value = lesson;
        option.textContent = lesson;
        lessonSelect.appendChild(option);
    });
}

function renderAIText(text) {
 
    if (!text) {
        return "";
    }
 
    const mathBlocks = [];
 
    function saveMath(match) {
 
        const i =
            mathBlocks.length;
 
        mathBlocks.push(
            match
        );
 
        return (
            "___NABIL_MATH_" +
            i +
            "___"
        );
    }
 
    let content =
        String(text);
 
    content =
        content.replace(
            /\$\$[\s\S]*?\$\$/g,
            saveMath
        );
 
    content =
        content.replace(
            /\\\[[\s\S]*?\\\]/g,
            saveMath
        );
 
    content =
        content.replace(
            /\\\([\s\S]*?\\\)/g,
            saveMath
        );
 
    content =
        content.replace(
            /\$[^$\n]+\$/g,
            saveMath
        );
 
    content =
        content
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            );
 
    content =
        content.replace(
            /^### (.+)$/gm,
            "<h4>$1</h4>"
        );
 
    content =
        content.replace(
            /^## (.+)$/gm,
            "<h3>$1</h3>"
        );
 
    content =
        content.replace(
            /^# (.+)$/gm,
            "<h2>$1</h2>"
        );
 
    content =
        content.replace(
            /\*\*(.+?)\*\*/g,
            "<strong>$1</strong>"
        );
 
    content =
        content.replace(
            /\n/g,
            "<br>"
        );
 
    mathBlocks.forEach(
        (math, i) => {
 
            content =
                content.replace(
                    "___NABIL_MATH_" +
                    i +
                    "___",
                    math
                );
        }
    );
 
    return content;
}

function toUnicodeSuperscript(value) {
 
    const map = {
        "0": "⁰",
        "1": "¹",
        "2": "²",
        "3": "³",
        "4": "⁴",
        "5": "⁵",
        "6": "⁶",
        "7": "⁷",
        "8": "⁸",
        "9": "⁹",
        "+": "⁺",
        "-": "⁻",
        "=": "⁼",
        "(": "⁽",
        ")": "⁾",
        "n": "ⁿ"
    };
 
    return String(value)
        .split("")
        .map(
            ch =>
                map[ch] || ch
        )
        .join("");
}
 
 
function formatAnswerForSharing(text) {
 
    let value =
        String(text || "");
 
    // إزالة محددات LaTeX مع الإبقاء على المحتوى
    value = value
        .replace(/\\\[/g, "")
        .replace(/\\\]/g, "")
        .replace(/\\\(/g, "")
        .replace(/\\\)/g, "")
        .replace(/\$\$/g, "")
        .replace(/\$/g, "");
 
    // أوامر شائعة
    const replacements = [
        [/\\times/g, "×"],
        [/\\cdot/g, "·"],
        [/\\div/g, "÷"],
        [/\\pm/g, "±"],
        [/\\mp/g, "∓"],
        [/\\leq?/g, "≤"],
        [/\\geq?/g, "≥"],
        [/\\neq/g, "≠"],
        [/\\approx/g, "≈"],
        [/\\infty/g, "∞"],
        [/\\pi/g, "π"],
        [/\\theta/g, "θ"],
        [/\\alpha/g, "α"],
        [/\\beta/g, "β"],
        [/\\gamma/g, "γ"],
        [/\\Delta/g, "Δ"],
        [/\\sqrt/g, "√"],
        [/\\rightarrow/g, "→"],
        [/\\leftarrow/g, "←"],
        [/\\Rightarrow/g, "⇒"],
        [/\\in/g, "∈"],
        [/\\notin/g, "∉"],
        [/\\mathbb\{R\}/g, "ℝ"],
        [/\\mathbb\{N\}/g, "ℕ"],
        [/\\mathbb\{Z\}/g, "ℤ"],
        [/\\mathbb\{Q\}/g, "ℚ"]
    ];
 
    replacements.forEach(
        ([pattern, replacement]) => {
 
            value =
                value.replace(
                    pattern,
                    replacement
                );
        }
    );
 
    // الكسور البسيطة والمتداخلة على عدة دورات
    for (
        let i = 0;
        i < 5;
        i++
    ) {
 
        value = value.replace(
            /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
            "($1)⁄($2)"
        );
    }
 
    // الجذور
    value = value.replace(
        /√\{([^{}]+)\}/g,
        "√($1)"
    );
 
    // الأسس الرقمية
    value = value.replace(
        /\^\{([0-9+\-=()n]+)\}/g,
        (_, exp) =>
            toUnicodeSuperscript(
                exp
            )
    );
 
    value = value.replace(
        /\^([0-9])/g,
        (_, exp) =>
            toUnicodeSuperscript(
                exp
            )
    );
 
    // تنظيف أوامر التنسيق
    value = value
        .replace(
            /\\(?:text|mathrm|mathbf|boxed)\{([^{}]+)\}/g,
            "$1"
        )
        .replace(/\\left/g, "")
        .replace(/\\right/g, "")
        .replace(/\\,/g, " ")
        .replace(/\\;/g, " ")
        .replace(/\\!/g, "")
        .replace(/\\\\/g, "\n")
        .replace(/\{([^{}]+)\}/g, "$1")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
 
    return value;
}
 
 
 
/* =========================================================
   النسخ المنسق إلى Microsoft Word
   - يحول جداول Markdown إلى جداول HTML حقيقية
   - ينظف أوامر LaTeX غير المناسبة عند اللصق
========================================================= */
 
function escapeWordHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}
 
function isMarkdownTableSeparator(line) {
    const cells = String(line || "")
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map(v => v.trim());
 
    return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
}
 
function splitMarkdownTableRow(line) {
    return String(line || "")
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map(v => v.trim());
}
 
function wordInlineHtml(text) {
    let value = formatAnswerForSharing(text);
    value = escapeWordHtml(value);
 
    value = value
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>");
 
    return value;
}
 
function formatAnswerForWord(text) {
    const raw = String(text || "").replace(/\r/g, "");
    const lines = raw.split("\n");
    let html = "";
    let i = 0;
 
    while (i < lines.length) {
        const line = lines[i];
 
        // جدول Markdown: سطر عناوين + سطر --- + البيانات
        if (
            line.includes("|") &&
            i + 1 < lines.length &&
            isMarkdownTableSeparator(lines[i + 1])
        ) {
            const headers = splitMarkdownTableRow(line);
            i += 2;
            const rows = [];
 
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
                rows.push(splitMarkdownTableRow(lines[i]));
                i++;
            }
 
            html += '<table style="border-collapse:collapse;width:auto;margin:10px 0;font-family:Arial,sans-serif;font-size:11pt;">';
            html += "<thead><tr>" + headers.map(cell =>
                '<th style="border:1px solid #666;padding:6px 10px;text-align:center;font-weight:bold;background:#f2f2f2;">' +
                wordInlineHtml(cell) + "</th>"
            ).join("") + "</tr></thead><tbody>";
 
            rows.forEach(row => {
                html += "<tr>" + row.map(cell =>
                    '<td style="border:1px solid #666;padding:6px 10px;text-align:center;vertical-align:middle;">' +
                    wordInlineHtml(cell) + "</td>"
                ).join("") + "</tr>";
            });
 
            html += "</tbody></table>";
            continue;
        }
 
        const trimmed = line.trim();
 
        if (!trimmed) {
            html += '<div style="height:7px"></div>';
            i++;
            continue;
        }
 
        if (/^###\s+/.test(trimmed)) {
            html += '<h3 style="margin:10px 0 5px;font-size:13pt;">' + wordInlineHtml(trimmed.replace(/^###\s+/, "")) + "</h3>";
        } else if (/^##\s+/.test(trimmed)) {
            html += '<h2 style="margin:12px 0 6px;font-size:14pt;">' + wordInlineHtml(trimmed.replace(/^##\s+/, "")) + "</h2>";
        } else if (/^#\s+/.test(trimmed)) {
            html += '<h1 style="margin:12px 0 6px;font-size:16pt;">' + wordInlineHtml(trimmed.replace(/^#\s+/, "")) + "</h1>";
        } else if (/^[-*]\s+/.test(trimmed)) {
            html += '<div style="margin:3px 0;">• ' + wordInlineHtml(trimmed.replace(/^[-*]\s+/, "")) + "</div>";
        } else {
            html += '<div style="margin:4px 0;">' + wordInlineHtml(line) + "</div>";
        }
 
        i++;
    }
 
    const dir = languageSelect.value === "العربية" ? "rtl" : "ltr";
    const align = dir === "rtl" ? "right" : "left";
 
    return '<div dir="' + dir + '" style="font-family:Arial,sans-serif;font-size:11pt;line-height:1.5;text-align:' + align + ';">' + html + "</div>";
}
 
async function copyAnswerForWord(text, button = null) {
    const html = formatAnswerForWord(text);
    const plain = formatAnswerForSharing(text);
 
    try {
        if (navigator.clipboard && typeof ClipboardItem !== "undefined") {
            const item = new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([plain], { type: "text/plain" })
            });
            await navigator.clipboard.write([item]);
        } else {
            const holder = document.createElement("div");
            holder.innerHTML = html;
            holder.style.position = "fixed";
            holder.style.left = "-99999px";
            document.body.appendChild(holder);
 
            const range = document.createRange();
            range.selectNodeContents(holder);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand("copy");
            selection.removeAllRanges();
            holder.remove();
        }
 
        if (button) {
            const old = button.textContent;
            button.textContent = "✅ تم النسخ إلى Word";
            setTimeout(() => button.textContent = old, 1800);
        }
    } catch (error) {
        console.error("WORD COPY ERROR:", error);
        await copyAnswer(text);
        alert("تم نسخ نسخة نصية. إذا لم يحافظ Word على الجدول استخدم متصفح Chrome أو Edge ثم أعد المحاولة.");
    }
}
 
async function copyAnswer(text) {
 
    const shareText =
        formatAnswerForSharing(
            text
        );
 
    try {
 
        await navigator
            .clipboard
            .writeText(
                shareText
            );
 
    }
 
    catch(error) {
 
        console.error(
            "COPY ERROR:",
            error
        );
 
        const area =
            document.createElement(
                "textarea"
            );
 
        area.value =
            shareText;
 
        area.style.position =
            "fixed";
 
        area.style.opacity =
            "0";
 
        document.body
            .appendChild(
                area
            );
 
        area.select();
 
        document.execCommand(
            "copy"
        );
 
        area.remove();
    }
}

function cleanSpeechText(text) {
 
    return String(
        text || ""
    )
        .replace(
            /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
            "$1 على $2"
        )
        .replace(
            /\\sqrt\{([^{}]+)\}/g,
            "الجذر التربيعي لـ $1"
        )
        .replace(
            /\^2/g,
            " تربيع"
        )
        .replace(
            /\^3/g,
            " تكعيب"
        )
        .replace(
            /\\boxed\{([^{}]+)\}/g,
            "$1"
        )
        .replace(
            /\\text\{([^{}]+)\}/g,
            "$1"
        )
        .replace(
            /\\[a-zA-Z]+/g,
            ""
        )
        .replace(
            /[*_#>`$]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}

let activeUtterance = null;
 
 
function stopReading() {
 
    if (
        "speechSynthesis"
        in window
    ) {
 
        speechSynthesis.cancel();
    }
 
    if (activeReadButton) {
 
        activeReadButton.textContent =
            "🔊 اقرأ الإجابة";
 
        activeReadButton.dataset.reading =
            "false";
    }
 
    activeReadButton = null;
    activeUtterance = null;
}
 
 
function readAnswer(
    text,
    button = null
) {
 
    if (
        !(
            "speechSynthesis"
            in window
        )
    ) {
 
        alert(
            "القراءة الصوتية غير مدعومة."
        );
 
        return;
    }
 
    if (
        button &&
        button.dataset.reading ===
            "true"
    ) {
 
        stopReading();
        return;
    }
 
    stopReading();
 
    const utterance =
        new SpeechSynthesisUtterance(
            cleanSpeechText(
                text
            )
        );
 
    const language =
        languageSelect.value;
 
    utterance.lang =
        language ===
            "English"
            ? "en-US"
            : language ===
                "Français"
                ? "fr-FR"
                : "ar-LB";
 
    utterance.rate =
        0.92;
 
    if (button) {
 
        activeReadButton =
            button;
 
        button.dataset.reading =
            "true";
 
        button.textContent =
            "⏹ إيقاف القراءة";
    }
 
    activeUtterance =
        utterance;
 
    utterance.onend =
        stopReading;
 
    utterance.onerror =
        stopReading;
 
    speechSynthesis.speak(
        utterance
    );
}
 
 
/* =========================================================
   دوال الرسم الرياضي
========================================================= */
 
function functionY(
    kind,
    x,
    drawing = {}
) {

    const coefficient =
        Number(
            drawing.coefficient ??
            1
        );

    const xShift =
        Number(
            drawing.x_shift ??
            0
        );

    const yShift =
        Number(
            drawing.y_shift ??
            0
        );

    switch(kind) {

        case "ln": {

            const inside =
                x - xShift;

            return (
                inside > 0
                    ? coefficient *
                      Math.log(inside) +
                      yShift
                    : null
            );
        }

        case "exp": {

            const base =
                Number(
                    drawing.base ??
                    Math.E
                );

            if (
                !Number.isFinite(base) ||
                base <= 0 ||
                Math.abs(base - 1) <
                    0.0000001
            ) {
                return null;
            }

            return (
                coefficient *
                Math.pow(
                    base,
                    x - xShift
                ) +
                yShift
            );
        }

        case "square":

            return (
                coefficient *
                Math.pow(
                    x - xShift,
                    2
                ) +
                yShift
            );

        case "linear":

            return (
                Number(
                    drawing.slope ??
                    1
                ) *
                x +
                Number(
                    drawing.intercept ??
                    0
                )
            );

        case "inverse": {

            const denominator =
                x - xShift;

            return (
                Math.abs(
                    denominator
                ) < 0.0001
                    ? null
                    : coefficient /
                      denominator +
                      yShift
            );
        }

        default:
            return null;
    }
}


/* =========================================================
   رسم الدوال
========================================================= */
 
function renderFunction(
    drawing
) {
 
    const width = 820;
    const height = 430;
 
    const left = 58;
    const right = 28;
    const top = 28;
    const bottom = 48;
 
    let xMin =
        Number(
            drawing.x_min ??
            -1
        );
 
    let xMax =
        Number(
            drawing.x_max ??
            7
        );
 
    let yMin =
        Number(
            drawing.y_min ??
            -3.5
        );
 
    let yMax =
        Number(
            drawing.y_max ??
            2.5
        );
 
    if (
        drawing.function ===
        "ln"
    ) {
 
        xMin =
            Math.min(
                xMin,
                -1
            );
 
        xMax =
            Math.max(
                xMax,
                6.5
            );
 
        yMin =
            Math.min(
                yMin,
                -3.5
            );
 
        yMax =
            Math.max(
                yMax,
                2.5
            );
    }
 
    const plotWidth =
        width -
        left -
        right;
 
    const plotHeight =
        height -
        top -
        bottom;
 
    function sx(x) {
        return (
            left +
            (
                (x - xMin) /
                (xMax - xMin)
            ) *
            plotWidth
        );
    }
 
    function sy(y) {
        return (
            top +
            (
                (yMax - y) /
                (yMax - yMin)
            ) *
            plotHeight
        );
    }
 
    let path = "";
    let penDown = false;
 
    const steps = 850;
 
    for (
        let i = 0;
        i <= steps;
        i++
    ) {
 
        const x =
            xMin +
            (
                (xMax - xMin) *
                i /
                steps
            );
 
        const y =
            functionY(
                drawing.function,
                x,
                drawing
            );
 
        if (
            y === null ||
            !Number.isFinite(y)
        ) {
 
            penDown = false;
            continue;
        }
 
        if (
            y < yMin - 1 ||
            y > yMax + 1
        ) {
 
            penDown = false;
            continue;
        }
 
        const px = sx(x);
        const py = sy(y);
 
        if (!penDown) {
 
            path +=
                `M ${px} ${py} `;
 
            penDown = true;
 
        }
 
        else {
 
            path +=
                `L ${px} ${py} `;
        }
    }
 
    let grid = "";
    let ticks = "";
 
    for (
        let x =
            Math.ceil(xMin);
        x <=
            Math.floor(xMax);
        x++
    ) {
 
        const px = sx(x);
 
        grid += `
            <line
                x1="${px}"
                y1="${top}"
                x2="${px}"
                y2="${height-bottom}"
                stroke="#dfe5ec"
                stroke-width="1"
            />
        `;
 
        if (x !== 0) {
 
            ticks += `
                <text
                    x="${px}"
                    y="${sy(0) + 24}"
                    text-anchor="middle"
                    class="graph-tick"
                >
                    ${x}
                </text>
            `;
        }
    }
 
    for (
        let y =
            Math.ceil(yMin);
        y <=
            Math.floor(yMax);
        y++
    ) {
 
        const py = sy(y);
 
        grid += `
            <line
                x1="${left}"
                y1="${py}"
                x2="${width-right}"
                y2="${py}"
                stroke="#dfe5ec"
                stroke-width="1"
            />
        `;
 
        ticks += `
            <text
                x="${sx(0) - 18}"
                y="${py + 5}"
                text-anchor="end"
                class="graph-tick"
            >
                ${y}
            </text>
        `;
    }
 
    const pointList =
        Array.isArray(
            drawing.points
        )
        ? [...drawing.points]
        : [];
 
    if (
        drawing.function ===
        "ln"
    ) {
 
        const specialPoints = [
            {
                x: 1,
                y: 0,
                label: "(1, 0)",
                color: "#15803d"
            },
            {
                x: Math.E,
                y: 1,
                label: "(e, 1)",
                color: "#7e22ce"
            },
            {
                x: 1 / Math.E,
                y: -1,
                label: "(1/e, -1)",
                color: "#dc2626"
            }
        ];
 
        specialPoints.forEach(
            p => {
 
                const exists =
                    pointList.some(
                        item =>
                            Math.abs(
                                Number(
                                    item.x
                                ) -
                                p.x
                            ) < 0.01
                            &&
                            Math.abs(
                                Number(
                                    item.y
                                ) -
                                p.y
                            ) < 0.01
                    );
 
                if (!exists) {
                    pointList.push(p);
                }
            }
        );
    }
 
    let points = "";
 
    pointList.forEach(
        point => {
 
            const px =
                sx(
                    Number(
                        point.x
                    )
                );
 
            const py =
                sy(
                    Number(
                        point.y
                    )
                );
 
            const color =
                point.color ||
                "#dc2626";
 
            points += `
                <circle
                    cx="${px}"
                    cy="${py}"
                    r="6"
                    fill="${color}"
                />
 
                <text
                    x="${px + 10}"
                    y="${py - 12}"
                    style="
                        fill:${color};
                        font-size:14px;
                        font-weight:700;
                    "
                >
                    ${point.label || ""}
                </text>
            `;
        }
    );
 
    let asymptote = "";
 
    if (
        drawing.vertical_asymptote !==
            undefined &&
        drawing.vertical_asymptote !==
            null
    ) {
 
        const value =
            Number(
                drawing.vertical_asymptote
            );
 
        const px =
            sx(value);
 
        asymptote = `
            <line
                x1="${px}"
                y1="${top}"
                x2="${px}"
                y2="${height-bottom}"
                stroke="#ef4444"
                stroke-width="3"
                stroke-dasharray="8 6"
            />
 
            <text
                x="${px + 14}"
                y="${height-bottom-10}"
                style="
                    fill:#dc2626;
                    font-size:14px;
                    font-weight:700;
                "
            >
                x = ${value}
            </text>
        `;
    }
 
    const xAxisY =
        (
            yMin <= 0 &&
            yMax >= 0
        )
        ? sy(0)
        : height - bottom;
 
    const yAxisX =
        (
            xMin <= 0 &&
            xMax >= 0
        )
        ? sx(0)
        : left;
 
    let properties = "";
 
    if (
        drawing.function ===
        "ln"
    ) {
 
        properties = `
            <strong>
                خصائص الدالة ln(x)
            </strong>
 
            <div class="property-row">
                <span>• المجال:</span>
                <span class="property-value">]0, +∞[</span>
            </div>
 
            <div class="property-row">
                <span>• المدى:</span>
                <span class="property-value">ℝ</span>
            </div>
 
            <div class="property-row">
                <span>• تمر بالنقطة:</span>
                <span class="property-value">(1, 0)</span>
            </div>
 
            <div class="property-row">
                <span>• تمر بالنقطة:</span>
                <span class="property-value">(e, 1)</span>
            </div>
 
            <div class="property-row">
                <span>• التغيّر:</span>
                <span>متزايدة على مجالها</span>
            </div>
 
            <div class="property-row">
                <span>• التقعّر:</span>
                <span>مقعّرة نحو الأسفل</span>
            </div>
 
            <div class="property-row">
                <span>• المقارب:</span>
                <span class="property-value">x = 0</span>
                <span>رأسي</span>
            </div>
        `;
    }
 
    else {
 
        properties = `
            <strong>
                خصائص الرسم
            </strong>
 
            <div>
                الدالة:
                ${drawing.expression || ""}
            </div>
        `;
    }
 
    return `
        <div class="drawing-title">
            📊
            ${
                drawing.title ||
                drawing.expression ||
                "الرسم البياني"
            }
        </div>
 
        <div class="graph-shell">
 
            <div class="graph-layout">
 
                <div class="graph-canvas">
 
                    <svg
                        viewBox="0 0 ${width} ${height}"
                        role="img"
                    >
 
                        <defs>
                            <marker
                                id="arrowX"
                                markerWidth="8"
                                markerHeight="8"
                                refX="6"
                                refY="3"
                                orient="auto"
                            >
                                <path
                                    d="M0,0 L0,6 L7,3 z"
                                    fill="#111827"
                                />
                            </marker>
                        </defs>
 
                        ${grid}
 
                        <line
                            x1="${left}"
                            y1="${xAxisY}"
                            x2="${width-right}"
                            y2="${xAxisY}"
                            stroke="#111827"
                            stroke-width="2"
                            marker-end="url(#arrowX)"
                        />
 
                        <line
                            x1="${yAxisX}"
                            y1="${height-bottom}"
                            x2="${yAxisX}"
                            y2="${top}"
                            stroke="#111827"
                            stroke-width="2"
                            marker-end="url(#arrowX)"
                        />
 
                        ${ticks}
 
                        ${asymptote}
 
                        <path
                            d="${path}"
                            fill="none"
                            stroke="#1672e8"
                            stroke-width="4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
 
                        ${points}
 
                        <text
                            x="${width-right-12}"
                            y="${xAxisY-11}"
                            class="graph-axis-label"
                        >
                            x
                        </text>
 
                        <text
                            x="${yAxisX+13}"
                            y="${top+17}"
                            class="graph-axis-label"
                        >
                            y
                        </text>
 
                    </svg>
 
                </div>
 
                <div class="graph-properties">
                    ${properties}
                </div>
 
            </div>
 
        </div>
    `;
}

function renderMolecule(
    drawing
) {
 
    const atoms =
        drawing.atoms ||
        [];
 
    if (!atoms.length) {
        return "";
    }
 
    const width = 720;
    const centerY = 210;
 
    const gap =
        atoms.length > 1
            ? 470 /
              (
                  atoms.length - 1
              )
            : 0;
 
    let output = "";
 
    atoms.forEach(
        (atom, index) => {
 
            const x =
                atoms.length === 1
                    ? 360
                    : 125 +
                      gap *
                      index;
 
            if (
                index <
                atoms.length - 1
            ) {
 
                const nextX =
                    125 +
                    gap *
                    (
                        index + 1
                    );
 
                output += `
                    <line
                        x1="${x + 38}"
                        y1="${centerY}"
                        x2="${nextX - 38}"
                        y2="${centerY}"
                        stroke="#334155"
                        stroke-width="6"
                    />
                `;
            }
 
            output += `
                <circle
                    cx="${x}"
                    cy="${centerY}"
                    r="42"
                    fill="#eef6ff"
                    stroke="#2563eb"
                    stroke-width="4"
                />
 
                <text
                    x="${x}"
                    y="${centerY + 8}"
                    text-anchor="middle"
                    class="graph-label"
                >
                    ${
                        atom.label ||
                        "X"
                    }
                </text>
            `;
        }
    );
 
    return `
        <div class="drawing-title">
            🧪
            ${
                drawing.title ||
                "البنية الجزيئية"
            }
        </div>
 
        <div class="graph-shell">
 
            <svg
                viewBox="0 0 ${width} 420"
            >

            </svg>
 
        </div>
    `;
}

    }
 
    switch(
        drawing.type
    ) {
 
        case "function":
 
            return renderFunction(
                drawing
            );
 
        case "right_triangle":
 
            return renderTriangle(
                drawing
            );
 
        case "circle_tangent":
 
            return renderCircle(
                drawing
            );
 
        case "forces":
 
            return renderForces(
                drawing
            );
 
        case "molecule":
 
            return renderMolecule(
                drawing
            );
 
        default:
 
            return `
                <div class="drawing-title">
                    لا يوجد محرّك رسم لهذا النوع بعد.
                </div>
            `;
    }
}
 
 
/* =========================================================
   تحميل html2canvas عند الحاجة
========================================================= */
 
function ensureHtml2Canvas() {
 
    return new Promise(
        (resolve, reject) => {
 
            if (
                window.html2canvas
            ) {
                resolve(
                    window.html2canvas
                );
 
                return;
            }
 
            const existing =
                document.querySelector(
                    'script[data-nabil-html2canvas="1"]'
                );
 
            if (existing) {
 
                existing.addEventListener(
                    "load",
                    () =>
                        resolve(
                            window.html2canvas
                        )
                );
 
                existing.addEventListener(
                    "error",
                    reject
                );
 
                return;
            }
 
            const script =
                document.createElement(
                    "script"
                );
 
            script.src =
                "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
 
            script.async = true;
 
            script.dataset
                .nabilHtml2canvas =
                "1";
 
            script.onload =
                () =>
                    resolve(
                        window.html2canvas
                    );
 
            script.onerror =
                () =>
                    reject(
                        new Error(
                            "تعذر تحميل أداة إنشاء الصورة."
                        )
                    );
 
            document.head
                .appendChild(
                    script
                );
        }
    );
}
 
 
/* =========================================================
   تحويل الرسمة إلى PNG
========================================================= */
 
async function drawingToPngBlob(
    drawingBox
) {
 
    await ensureHtml2Canvas();
 
    const wasVisible =
        drawingBox
            .classList
            .contains(
                "visible"
            );
 
    if (!wasVisible) {
 
        drawingBox
            .classList
            .add(
                "visible"
            );
    }
 
    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                120
            )
    );
 
    const exportClone =
        drawingBox.cloneNode(
            true
        );
 
    exportClone.classList.add(
        "visible"
    );
 
    exportClone.style.position =
        "fixed";
 
    exportClone.style.left =
        "-10000px";
 
    exportClone.style.top =
        "0";
 
    exportClone.style.width =
        "980px";
 
    exportClone.style.maxWidth =
        "980px";
 
    exportClone.style.background =
        "#ffffff";
 
    const cloneLayout =
        exportClone.querySelector(
            ".graph-layout"
        );
 
    if (cloneLayout) {
 
        cloneLayout.style.display =
            "grid";
 
        cloneLayout.style.gridTemplateColumns =
            "minmax(0, 1fr) 220px";
 
        cloneLayout.style.direction =
            "ltr";
    }
 
    const cloneProperties =
        exportClone.querySelector(
            ".graph-properties"
        );
 
    if (cloneProperties) {
 
        cloneProperties.style.fontSize =
            "12px";
 
        cloneProperties.style.lineHeight =
            "1.45";
 
        cloneProperties.style.direction =
            "rtl";
    }
 
    document.body.appendChild(
        exportClone
    );
 
    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                80
            )
    );
 
    const canvas =
        await window.html2canvas(
            exportClone,
            {
                backgroundColor:
                    "#ffffff",
 
                scale:
                    2,
 
                useCORS:
                    true,
 
                logging:
                    false,
 
                width:
                    exportClone.scrollWidth,
 
                height:
                    exportClone.scrollHeight,
 
                windowWidth:
                    1200
            }
        );
 
    exportClone.remove();
 
    if (!wasVisible) {
 
        drawingBox
            .classList
            .remove(
                "visible"
            );
    }
 
    return new Promise(
        (resolve, reject) => {
 
            canvas.toBlob(
                blob => {
 
                    if (blob) {
 
                        resolve(blob);
 
                    }
 
                    else {
 
                        reject(
                            new Error(
                                "تعذر إنشاء ملف PNG."
                            )
                        );
                    }
                },
 
                "image/png",
                1
            );
        }
    );
}

async function downloadDrawing(
    drawingBox
) {
 
    try {
 
        const blob =
            await drawingToPngBlob(
                drawingBox
            );
 
        const url =
            URL.createObjectURL(
                blob
            );
 
        const link =
            document.createElement(
                "a"
            );
 
        link.href = url;
 
        link.download =
            "NABIL-AI-drawing.png";
 
        document.body
            .appendChild(
                link
            );
 
        link.click();
 
        link.remove();
 
        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            1000
        );
    }
 
    catch(error) {
 
        console.error(
            "DOWNLOAD DRAWING:",
            error
        );
 
        alert(
            "تعذر تنزيل الرسمة."
        );
    }
}
 
 
/* =========================================================
   مشاركة الرسمة
========================================================= */
 
async function shareDrawing(
    drawingBox
) {
 
    try {
 
        const blob =
            await drawingToPngBlob(
                drawingBox
            );
 
        const file =
            new File(
                [blob],
                "NABIL-AI-drawing.png",
                {
                    type:
                        "image/png"
                }
            );
 
        // 1) المشاركة الأصلية للملف على الهاتف والأجهزة التي تدعم Web Share
        if (
            typeof navigator.share === "function" &&
            typeof navigator.canShare === "function" &&
            navigator.canShare(
                {
                    files: [file]
                }
            )
        ) {
 
            await navigator.share(
                {
                    title:
                        "NABIL AI",
 
                    text:
                        "رسمة تعليمية من منصة النبيل التعليمية الذكية",
 
                    files:
                        [file]
                }
            );
 
            return;
        }
 
        // 2) على بعض الأجهزة يمكن فتح نافذة المشاركة لكن من دون ملفات
        // نشارك رابط المنصة وننسخ الصورة للحافظة إن أمكن
        let copiedToClipboard = false;
 
        if (
            navigator.clipboard &&
            typeof ClipboardItem !== "undefined"
        ) {
 
            try {
 
                await navigator.clipboard.write(
                    [
                        new ClipboardItem(
                            {
                                "image/png": blob
                            }
                        )
                    ]
                );
 
                copiedToClipboard = true;
 
            }
 
            catch(copyError) {
 
                console.warn(
                    "COPY IMAGE TO CLIPBOARD:",
                    copyError
                );
            }
        }
 
        if (
            typeof navigator.share === "function"
        ) {
 
            try {
 
                await navigator.share(
                    {
                        title:
                            "NABIL AI",
 
                        text:
                            copiedToClipboard
                                ? "تم نسخ الرسمة إلى الحافظة. الصقها في المحادثة التي تريد إرسالها إليها."
                                : "رسمة تعليمية من منصة النبيل التعليمية الذكية",
 
                        url:
                            window.location.href
                    }
                );
 
                return;
 
            }
 
            catch(shareError) {
 
                if (
                    shareError.name ===
                    "AbortError"
                ) {
                    return;
                }
 
                console.warn(
                    "TEXT SHARE FALLBACK:",
                    shareError
                );
            }
        }
 
        // 3) الحل المضمون على الكمبيوتر:
        // تنزيل الصورة كـ PNG ليتم إرسالها عبر واتساب أو أي تطبيق
        const url =
            URL.createObjectURL(
                blob
            );
 
        const link =
            document.createElement(
                "a"
            );
 
        link.href =
            url;
 
        link.download =
            "NABIL-AI-drawing.png";
 
        document.body.appendChild(
            link
        );
 
        link.click();
 
        link.remove();
 
        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            1000
        );
 
        if (
            copiedToClipboard
        ) {
 
            alert(
                "تم نسخ الرسمة إلى الحافظة وتنزيلها أيضًا. يمكنك لصقها مباشرة في واتساب أو أي محادثة."
            );
 
        }
 
        else {
 
            alert(
                "المشاركة المباشرة غير مدعومة على هذا المتصفح، لذلك تم تنزيل الرسمة كصورة PNG لتتمكن من إرسالها."
            );
        }
 
    }
 
    catch(error) {
 
        if (
            error.name ===
            "AbortError"
        ) {
            return;
        }
 
        console.error(
            "SHARE DRAWING:",
            error
        );
 
        // كحل أخير، نحاول تنزيل الرسمة بدل إظهار خطأ فقط
        try {
 
            await downloadDrawing(
                drawingBox
            );
 
            alert(
                "تعذرت المشاركة المباشرة، لذلك تم تنزيل الرسمة كصورة PNG."
            );
 
        }
 
        catch(downloadError) {
 
            console.error(
                "FINAL DOWNLOAD FALLBACK:",
                downloadError
            );
 
            alert(
                "تعذر تجهيز الرسمة للمشاركة. جرّب زر تنزيل الرسمة."
            );
        }
    }
}

function addMessage(

    text,
    drawings = null
) {

            "none";
    }


    const wrapper =
        document.createElement(
            "div"
        );

        "message " +
        role;

        document.createElement(
            "div"
        );

        "bubble";

        languageSelect.value;

        selectedLanguage === "English" ||
        selectedLanguage === "Français";


    bubble.classList.add(
        isLTR
            ? "ltr-content"
            : "rtl-content"
    );

    bubble.setAttribute(
        "dir",
        isLTR
            ? "ltr"
            : "rtl"
    );


    if (
        role ===
        "teacher"
    ) {

        bubble.innerHTML =
            renderAIText(
                text
            );
    }

    else {

        bubble.textContent =
            text;
    }


    if (
        role ===
            "teacher" &&
        text
    ) {

        const tools =
            document.createElement(
                "div"
            );

        tools.className =
            "teacher-tools";


        const copyButton =
            document.createElement(
                "button"
            );

        copyButton.type =
            "button";

        copyButton.textContent =
            "📋 نسخ الإجابة";

        copyButton.onclick =

            };

            document.createElement(

            );

        wordButton.type =
            "button";

        wordButton.textContent =
            "📝 نسخ إلى Word";

        wordButton.onclick =
            () => {
                copyAnswerForWord(
                    text,
                    wordButton
                );
            };


        const readButton =
            document.createElement(
                "button"
            );

        readButton.type =
            "button";

        readButton.textContent =
            "🔊 اقرأ الإجابة";

        readButton.onclick =
            () => {
                readAnswer(
                    text,
                    readButton
                );
            };


        tools.appendChild(
            copyButton
        );

        tools.appendChild(
            wordButton
        );

        tools.appendChild(
            readButton
        );

        bubble.appendChild(
            tools
        );


        const drawingList =
            Array.isArray(
                drawings
            )
                ? drawings
                    .filter(
                        Boolean
                    )
                    .slice(
                        0,
                        3
                    )
                : drawings
                    ? [drawings]
                    : [];


        drawingList.forEach(
            (
                drawing,
                drawingIndex
            ) => {

                const drawingItem =
                    document.createElement(
                        "div"
                    );

                drawingItem.className =
                    "drawing-item";


                const drawingActions =
                    document.createElement(
                        "div"
                    );

                drawingActions.className =
                    "drawing-actions";


                const drawingBox =
                    document.createElement(
                        "div"
                    );

                drawingBox.className =
                    "answer-drawing";


                function ensureDrawingRendered() {

                    if (
                        !drawingBox
                            .dataset
                            .rendered
                    ) {

                        drawingBox.innerHTML =
                            renderDrawing(
                                drawing
                            );

                        drawingBox
                            .dataset
                            .rendered =
                            "true";


                        if (
                            window.MathJax &&
                            typeof
                            MathJax.typesetPromise ===
                            "function"
                        ) {

                            MathJax
                                .typesetPromise(
                                    [
                                        drawingBox
                                    ]
                                )
                                .catch(
                                    console.error
                                );
                        }
                    }
                }


                const numberLabel =
                    drawingList.length >
                        1
                        ? (
                            " " +
                            (
                                drawingIndex +
                                1
                            )
                        )
                        : "";


                const drawButton =
                    document.createElement(
                        "button"
                    );

                drawButton.type =
                    "button";

                drawButton.className =
                    "draw-answer-btn";

                drawButton.textContent =
                    "📐 إظهار الرسمة" +
                    numberLabel;


                drawButton.onclick =
                    () => {

                        ensureDrawingRendered();


                        const visible =
                            drawingBox
                                .classList
                                .contains(
                                    "visible"
                                );


                        if (visible) {

                            drawingBox
                                .classList
                                .remove(
                                    "visible"
                                );

                            drawButton
                                .classList
                                .remove(
                                    "active"
                                );

                            drawButton.textContent =
                                "📐 إظهار الرسمة" +
                                numberLabel;
                        }

                        else {

                            drawingBox
                                .classList
                                .add(
                                    "visible"
                                );

                            drawButton
                                .classList
                                .add(
                                    "active"
                                );

                            drawButton.textContent =
                                "📐 إخفاء الرسمة" +
                                numberLabel;
                        }
                    };


                const downloadButton =
                    document.createElement(
                        "button"
                    );

                downloadButton.type =
                    "button";

                downloadButton.textContent =
                    "⬇️ تنزيل" +
                    numberLabel;


                downloadButton.onclick =
                    async () => {

                        ensureDrawingRendered();

                        downloadButton.disabled =
                            true;

                        const oldText =
                            downloadButton
                                .textContent;

                        downloadButton.textContent =
                            "⏳ تجهيز الصورة";


                        try {

                            await downloadDrawing(
                                drawingBox
                            );
                        }

                        finally {

                            downloadButton.disabled =
                                false;

                            downloadButton.textContent =
                                oldText;
                        }
                    };


                const shareButton =
                    document.createElement(
                        "button"
                    );

                shareButton.type =
                    "button";

                shareButton.textContent =
                    "📤 مشاركة" +
                    numberLabel;


                shareButton.onclick =
                    async () => {

                        ensureDrawingRendered();

                        shareButton.disabled =
                            true;

                        const oldText =
                            shareButton
                                .textContent;

                        shareButton.textContent =
                            "⏳ تجهيز المشاركة";


                        try {

                            await shareDrawing(
                                drawingBox
                            );
                        }

                        finally {

                            shareButton.disabled =
                                false;

                            shareButton.textContent =
                                oldText;
                        }
                    };


                drawingActions.appendChild(
                    drawButton
                );

                drawingActions.appendChild(
                    downloadButton
                );

                drawingActions.appendChild(
                    shareButton
                );


                drawingItem.appendChild(
                    drawingActions
                );

                drawingItem.appendChild(
                    drawingBox
                );


                bubble.appendChild(
                    drawingItem
                );
            }
        );
    }


    wrapper.appendChild(
        bubble
    );

    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
        chat.scrollHeight;


    if (
        role ===
            "teacher" &&
        window.MathJax &&
        typeof
        MathJax.typesetPromise ===
            "function"
    ) {

        MathJax
            .typesetPromise(
                [
                    bubble
                ]
            )
            .catch(
                console.error
            );
    }
}


/* =========================================================
   الإرسال إلى NABIL AI
========================================================= */
 
async function sendToAI(
    message,
    showStudentMessage = true
) {
 
    const grade =
        gradeSelect.value;
 
    const subject =
        subjectSelect.value;
 
    const language =
        languageSelect.value;
 
    const lesson =
        lessonSelect.value;
 
    if (
        !grade ||
        !subject
    ) {
 
        alert(
            "اختر الصف والمادة أولاً."
        );
 
        return;
    }
 
    if (
        showStudentMessage
    ) {
 
        if (message) {
 
            addMessage(
                "student",
                message
            );
        }
 
        else if (
            selectedImage
        ) {
 
            addMessage(
                "student",
                "🖼️ صورة"
            );
        }
    }
 
    const formData =
        new FormData();
 
    formData.append(
        "student_id",
        getStudentId()
    );
 
    if (
        conversationId
    ) {
 
        formData.append(
            "conversation_id",
            conversationId
        );
    }
 
    formData.append(
        "message",
        message || ""
    );
 
    formData.append(
        "grade",
        grade
    );

    formData.append(
        "branch",
        branchSelect.value || ""
    );
 
    formData.append(
        "subject",
        subject
    );
 
    formData.append(
        "language",
        language
    );
 
    formData.append(
        "curriculum",
        FIXED_CURRICULUM
    );
 
    formData.append(
        "lesson",
        lesson || ""
    );
 
    if (
        selectedImage
    ) {
 
        formData.append(
            "image",
            selectedImage
        );
    }
 
    try {
 
        sendBtn.disabled =
            true;
 
        startLesson.disabled =
            true;
 
        sendBtn.textContent =
            "جاري التفكير...";
 
        const response =
            await fetch(
                API_BASE +
                "/api/chat",
                {
                    method:
                        "POST",
 
                    body:
                        formData
                }
            );
 
        let data = {};
 
        try {
 
            data =
                await response.json();
 
        }
 
        catch {
 
            throw new Error(
                "الخادم لم يُرجع JSON صالحًا."
            );
        }
 
        if (
            !response.ok
        ) {
 
            throw new Error(
                data.detail ||
                data.error ||
                (
                    "HTTP " +
                    response.status
                )
            );
        }
 
        if (
            data.conversation_id
        ) {
 
            conversationId =
                data.conversation_id;
        }
 
        addMessage(
            "teacher",
            data.reply ||
            "لم يصل جواب.",
            (
                Array.isArray(
                    data.drawings
                ) &&
                data.drawings.length
            )
                ? data.drawings
                : (
                    data.drawing
                        ? [
                            data.drawing
                        ]
                        : []
                )
        );
 
        selectedImage =
            null;
 
        imageInput.value =
            "";
 
        messageInput.value =
            "";
 
        messageInput.placeholder =
            "اكتب سؤالك هنا...";
 
    }
 
    catch(error) {
 
        console.error(
            "NABIL AI ERROR:",
            error
        );
 
        addMessage(
            "teacher",
            "حدث خطأ في الاتصال بـ NABIL AI:\n" +
            error.message
        );
    }
 
    finally {
 
        sendBtn.disabled =
            false;
 
        startLesson.disabled =
            false;
 
        sendBtn.textContent =
            "إرسال";
    }
}

                    .transcript;
        };
 
    recognition.onerror =
        event => {
 
            console.error(
                "SPEECH ERROR:",
                event.error
            );
        };
}
 
 
micBtn.addEventListener(
    "click",
    () => {
 
        if (!recognition) {
 
            alert(
                "التعرف الصوتي غير مدعوم في هذا المتصفح."
            );
 
            return;
        }
 
        recognition.lang =
            languageSelect.value ===
                "English"
                ? "en-US"
                : languageSelect.value ===
                    "Français"
                    ? "fr-FR"
                    : "ar-LB";
 
        recognition.start();
    }
);
 
 
/* =========================================================
   تشغيل
========================================================= */
 
loadCurriculumIndex();
 
</script>
