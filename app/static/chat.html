<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأستاذ نبيل - المنهاج اللبناني</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        .chat-container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 85vh;
        }
        .chat-header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.student {
            background-color: #e8f4fd;
            color: #2c3e50;
            align-self: flex-start;
        }
        .message.teacher {
            background-color: #eafaf1;
            color: #1e8449;
            align-self: flex-end;
            border: 1px solid #d4efdf;
        }
        .chat-input-area {
            padding: 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background-color: #219653;
        }
        .speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            الأستاذ نبيل - المنهاج اللبناني الذكي 📚
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message teacher">
                أهلاً بك يا بطل! أنا الأستاذ نبيل، جاهز لأساعدك بأي سؤال رياضيات أو فيزياء بالمنهاج اللبناني. تفضل اطرح سؤالك أو ارفع صورتك!
                <br>
                <button class="speak-btn" onclick="speakText(this.parentElement.innerText)">🔊 استمع للشرح</button>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب سؤالك هنا أو ارفع صورة..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        // دالة نطق النص مع تنظيف الرموز والشرطات المزعجة تماماً قبل القراءة
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            // تنظيف النص تماماً من الشرطات، النجوم، والرموز البرمجية المزعجة
            let cleanText = text
                .replace(/[_#*`~>-]/g, ' ') // إزالة الشرطات والرموز
                .replace(/\$\$(.*?)\$\$/g, ' نقطة ')
                .replace(/\$(.*?)\$/, ' ')
                .replace(/OM/g, 'أو إم')
                .replace(/O'M/g, 'أو فتحه إم')
                .replace(/OO'/g, 'أو أو فتحه');

            // ترتيب الجمل لنطقها بسلاسة وبدون إطالة مزعجة
            let sentences = cleanText.split(/[.،؟\n]/);
            let shortText = sentences.filter(s => s.trim().length > 0).slice(0, 5).join('. ');

            const utterance = new SpeechSynthesisUtterance(shortText);
            utterance.lang = 'ar-SA'; // لغة النطق
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const messages = document.getElementById('chatMessages');
            if (!input.value.trim()) return;

            // إضافة رسالة الطالب
            const studentDiv = document.createElement('div');
            studentDiv.className = 'message student';
            studentDiv.innerText = input.value;
            messages.appendChild(studentDiv);

            const userQuery = input.value;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // إرسال الطلب للسيرفر الخلفي (FastAPI)
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: "student_1",
                    message: userQuery
                })
            })
            .then(res => res.json())
            .then(data => {
                const teacherDiv = document.createElement('div');
                teacherDiv.className = 'message teacher';
                teacherDiv.innerHTML = data.reply.replace(/\n/g, '<br>') + 
                    '<br><button class="speak-btn" onclick="speakText(this.parentElement.innerText)">🔊 استمع للشرح</button>';
                messages.appendChild(teacherDiv);
                messages.scrollTop = messages.scrollHeight;
            })
            .catch(err => {
                console.error("خطأ بالاتصال:", err);
            });
        }
    </script>
</body>
</html>
