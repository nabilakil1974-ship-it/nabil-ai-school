<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABIL AI | Virtual Labs</title><style>
:root{font-family:system-ui,Arial;color:#e9f5ff;background:#081c31}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#123b66,#0d9488);padding:23px max(18px,calc((100vw - 1050px)/2));}h1{margin:0;font-size:clamp(23px,4vw,36px)}header p{line-height:1.7}.wrap{max-width:1050px;margin:18px auto;padding:0 12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,select,input{font:inherit}button,select{padding:10px 14px;border-radius:10px;border:1px solid #497492;cursor:pointer}button{background:#163d5d;color:white}button.active,button.primary{background:#0d9488;color:white;border-color:#5eead4}button:hover{filter:brightness(1.2)}select{background:#fff;color:#132943;max-width:100%}.box{background:#112f4a;border:1px solid #346481;border-radius:15px;padding:15px;margin:12px 0}main{display:grid;grid-template-columns:1fr 300px;gap:14px}@media(max-width:800px){main{grid-template-columns:1fr}}svg{width:100%;height:auto;display:block;background:#fff;border-radius:10px;touch-action:none}.controls label{display:block;margin:14px 0}.controls input[type=range]{width:100%}.muted{color:#aac3d6;font-size:14px;line-height:1.7}.readout{background:#071e32;padding:12px;border-radius:10px;line-height:1.85;min-height:70px}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.hidden{display:none!important}details{background:#103f50;border:1px solid #4d8c96;border-radius:12px;margin:12px 0;padding:10px 14px}summary{cursor:pointer;font-weight:bold}#quiz{margin-top:10px}#quiz button{margin:4px}.kbd{font-family:monospace;direction:ltr;unicode-bidi:embed;display:inline-block}footer{max-width:1050px;margin:30px auto;color:#b5ccdc;padding:12px}
</style></head><body><header><h1>🔬 NABIL AI · Virtual Labs</h1><p id="intro">مختبرات تفاعلية أولية: الكيمياء والضوء والرياضيات. اختر لغة الشرح وشاهد التجربة خطوة خطوة.</p></header><div class="wrap"><div class="toolbar"><button id="chemTab" class="active" onclick="tab('chem')">🧪 Chemistry</button><button id="lightTab" onclick="tab('light')">💡 Light</button><button id="mathTab" onclick="tab('math')">📐 Mathematics</button><label for="lang">🌐</label><select id="lang" onchange="render()"><option value="ar">العربية</option><option value="en">English only</option><option value="fr">Français uniquement</option></select></div><main><section class="box"><h2 id="title"></h2><svg id="view" viewBox="0 0 640 410" role="img" aria-label="Interactive scientific drawing"></svg><div class="btnrow"><button class="primary" id="run" onclick="start()">▶</button><button onclick="stop()" id="pause">⏸</button><button onclick="reset()" id="again">↺</button></div><div id="explain" class="readout"></div><div id="quiz"></div><details><summary id="notebookTitle">📘 ملخّص الدرس للدفتر</summary><p id="notebook"></p></details></section><aside class="box controls" id="controls"></aside></main></div><footer id="note"></footer>
<script>
"use strict";let mode='chem',state=0,timer=null;const $=id=>document.getElementById(id);let prefs={angle:35,n1:1,n2:1.5,ax:2,ay:3,bx:6,by:1};
const tr={
 ar:{intro:'مختبرات تفاعلية أولية: الكيمياء والضوء والرياضيات. اختر لغة الشرح وشاهد التجربة خطوة خطوة.',chem:'تفاعل الخل وبيكربونات الصوديوم',light:'انعكاس الضوء وانكساره',math:'المعلم المتعامد والمتجانس — النقاط والمتجهات والمستقيم',run:'ابدأ التجربة',pause:'إيقاف',again:'إعادة',notebook:'📘 ملخّص الدرس للدفتر',note:'نماذج توضيحية تعليمية، وليست بديلًا عن قراءة النشاط الحقيقي في الكتاب أو إجراء تجربة تحت إشراف المختبر.',chemHelp:'أولًا توقّع النتيجة، ثم اضغط ابدأ لإضافة المادة الثانية. راقب الفقاعات تدريجيًا.',lightHelp:'حرّك زاوية السقوط أو غيّر معاملي الانكسار، ثم شغّل الشعاع. الزوايا تقاس من العمود المقام.',mathHelp:'غيّر إحداثيات A وB. سيُعاد بناء النقطتين والمتجهة والمستقيم وفق القيم الصحيحة.',angle:'زاوية السقوط',n1:'معامل انكسار الوسط الأول',n2:'معامل انكسار الوسط الثاني',ax:'إحداثي A الأفقي',ay:'إحداثي A العمودي',bx:'إحداثي B الأفقي',by:'إحداثي B العمودي',q:'سؤال سريع',correct:'أحسنت، إجابة صحيحة!',wrong:'راجع الشرح ثم جرّب مجددًا.',chemQuestion:'ما الغاز الذي تُمثله الفقاعات؟',lightQuestion:'عند انتقال الضوء من الهواء إلى الزجاج، هل يقترب عادة من العمود المقام؟',mathQuestion:'كيف نحسب إحداثيي المتجهة AB؟',yes:'نعم',no:'لا',chemAnswer:'ينتج غاز ثاني أكسيد الكربون CO₂. تكوّن الفقاعات هو الملاحظة وليس التخمين قبل الخلط.',chemPending:'انتظر: المادة الثانية لم تُضَف بعد.',chemProcess:'تُضاف بيكربونات الصوديوم إلى الخل؛ تتكوّن الفقاعات تدريجيًا.',lightPending:'اختر الزاوية ثم اضغط ابدأ لمشاهدة الشعاع.',mathAnswer:'انقل من A إلى B: اطرح إحداثيي A من إحداثيي B.',lightTIR:'انعكاس كلي داخلي: لا يوجد شعاع منكسر نافذ وفق النموذج المثالي.',chemical:'المعادلة: NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑',page:'التوثيق المدرسي: هذه محاكاة مستقلة. لا تدّعي أنها رسم أو تجربة محددة من كتاب الدولة.'},
 en:{intro:'Prototype interactive labs for chemistry, optics and mathematics. Choose the teaching language and run each experiment.',chem:'Vinegar and sodium bicarbonate reaction',light:'Reflection and refraction of light',math:'2D orthonormal system — points, vector and line',run:'Run experiment',pause:'Pause',again:'Reset',notebook:'📘 Notebook Summary',note:'Educational simulations. They do not replace a verified textbook activity or a supervised real laboratory.',chemHelp:'Predict the result, then press Run to add the second substance. Watch the bubbles develop.',lightHelp:'Change the angle or refractive indices, then launch the ray. Angles are measured from the normal.',mathHelp:'Change the coordinates of A and B. Points, the vector and the line update using the actual values.',angle:'Angle of incidence',n1:'First medium refractive index',n2:'Second medium refractive index',ax:'A x-coordinate',ay:'A y-coordinate',bx:'B x-coordinate',by:'B y-coordinate',q:'Quick check',correct:'Correct! Well done.',wrong:'Check the explanation and try again.',chemQuestion:'Which gas forms the bubbles?',lightQuestion:'Going from air to glass, does the ray generally bend toward the normal?',mathQuestion:'How do we calculate vector AB coordinates?',yes:'Yes',no:'No',chemAnswer:'The gas is carbon dioxide (CO₂). Bubbles are the observable evidence after mixing.',chemPending:'The second substance has not been added yet.',chemProcess:'Sodium bicarbonate is added to vinegar; CO₂ bubbles develop progressively.',lightPending:'Choose an angle, then press Run to trace the ray.',mathAnswer:'Move from A to B: subtract A’s coordinates from B’s coordinates.',lightTIR:'Total internal reflection: the ideal model has no transmitted refracted ray.',chemical:'Equation: NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑',page:'Source status: standalone simulation, not attributed to a particular textbook figure.'},
 fr:{intro:'Laboratoires interactifs de démonstration : chimie, optique et mathématiques. Choisissez la langue et lancez une expérience.',chem:'Réaction du vinaigre avec le bicarbonate de sodium',light:'Réflexion et réfraction de la lumière',math:'Repère orthonormé — points, vecteur et droite',run:'Démarrer',pause:'Pause',again:'Recommencer',notebook:'📘 Résumé pour le cahier',note:'Simulations pédagogiques : elles ne remplacent pas une activité vérifiée du manuel ou un laboratoire encadré.',chemHelp:'Prévoyez le résultat, puis démarrez pour ajouter le second réactif. Observez les bulles.',lightHelp:'Modifiez l’angle ou les indices, puis lancez le rayon. Les angles sont mesurés à partir de la normale.',mathHelp:'Modifiez les coordonnées de A et B. Points, vecteur et droite sont recalculés.',angle:'Angle d’incidence',n1:'Indice du premier milieu',n2:'Indice du deuxième milieu',ax:'Abscisse de A',ay:'Ordonnée de A',bx:'Abscisse de B',by:'Ordonnée de B',q:'Vérification rapide',correct:'Bravo, bonne réponse !',wrong:'Relisez l’explication et réessayez.',chemQuestion:'Quel gaz forme les bulles ?',lightQuestion:'De l’air vers le verre, le rayon se rapproche-t-il généralement de la normale ?',mathQuestion:'Comment calculer les coordonnées du vecteur AB ?',yes:'Oui',no:'Non',chemAnswer:'Le gaz est le dioxyde de carbone (CO₂). Les bulles sont une observation après le mélange.',chemPending:'Le deuxième réactif n’a pas encore été ajouté.',chemProcess:'Le bicarbonate est ajouté au vinaigre : les bulles de CO₂ apparaissent progressivement.',lightPending:'Choisissez un angle puis lancez le rayon.',mathAnswer:'Pour aller de A à B, soustrayez les coordonnées de A de celles de B.',lightTIR:'Réflexion totale interne : pas de rayon réfracté transmis dans ce modèle idéal.',chemical:'Équation : NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑',page:'Source : simulation autonome, sans attribution à une figure précise du manuel.'}};
function L(){return tr[$('lang').value]}function txt(x,y,s,color='#20334a',size=16){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" fill="'+color+'" font-weight="600">'+s+'</text>'}function ln(x,y,a,b,color='#64748b',width=2,extra=''){return '<line x1="'+x+'" y1="'+y+'" x2="'+a+'" y2="'+b+'" stroke="'+color+'" stroke-width="'+width+'" '+extra+'/>'}
function controls(){let h='<p class="muted">'+L()[mode+'Help']+'</p>';let keys=mode==='light'?['angle','n1','n2']:mode==='math'?['ax','ay','bx','by']:[];for(let k of keys){const min=['ax','ay','bx','by'].includes(k)?-7:k==='angle'?0:1,max=['ax','ay','bx','by'].includes(k)?7:k==='angle'?85:2,step=k.startsWith('n')?0.1:1;h+='<label>'+L()[k]+' <strong id="v'+k+'">'+prefs[k]+'</strong><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+prefs[k]+'" oninput="prefs.'+k+'=+this.value;render()"></label>'}if(mode==='chem')h+='<p>NaHCO₃ + CH₃COOH</p><p class="muted">'+L().chemical+'</p>';return h}
function quiz(q,options,correct){$('quiz').innerHTML='<p><strong>'+L().q+':</strong> '+q+'</p>'+options.map((o,i)=>'<button onclick="answer('+i+','+correct+')">'+o+'</button>').join('')+'<p id="feedback"></p>'}
function answer(i,c){$('feedback').textContent=i===c?L().correct:L().wrong}
function chemistry(){const bubbles=Array.from({length:Math.floor(state/3)},(_,i)=>{let y=326-((state*5+i*37)%140),x=270+Math.sin(i*2.5+state/8)*55;return '<circle cx="'+x+'" cy="'+y+'" r="'+(3+i%4)+'" fill="none" stroke="#0f766e" stroke-width="2"/>'}).join('');$('view').innerHTML='<rect x="0" y="0" width="640" height="410" fill="#f8fbff"/>'+txt(25,40,'CH₃COOH + NaHCO₃ → CO₂', '#173c62',22)+'<path d="M195 90 L195 344 Q195 360 215 360 L395 360 Q415 360 415 344 L415 90" fill="none" stroke="#366c99" stroke-width="6"/><path d="M200 252 L410 252 L410 342 Q410 355 395 355 L215 355 Q200 355 200 342Z" fill="#a5f3fc" opacity=".8"/>'+bubbles+txt(240,392,'CO₂ ↑','#0d9488',21)+(state>5?txt(435,220,'NaHCO₃ ↓','#0f766e'):txt(435,220,'NaHCO₃','#0f766e'));$('explain').textContent=state?L().chemProcess+' '+L().chemAnswer:L().chemPending;$('notebook').textContent=L().chemical;quiz(L().chemQuestion,['CO₂','O₂','H₂'],0)}
function optics(){const {angle,n1,n2}=prefs, a=angle*Math.PI/180,k=n1*Math.sin(a)/n2,tir=k>1;const b=tir?0:Math.asin(Math.min(1,k)),ix=320,iy=205,len=225;let x=ix-len*Math.sin(a),y=iy-len*Math.cos(a),rx=ix+len*Math.sin(a),ry=y,tx=ix+len*Math.sin(b),ty=iy+len*Math.cos(b);const prog=Math.min(1,state/48),g=(xx,yy,ex,ey,f)=>[xx+(ex-xx)*f,yy+(ey-yy)*f];let inc=g(x,y,ix,iy,Math.min(1,prog*2)),ref=g(ix,iy,rx,ry,Math.max(0,prog*2-1)),trn=g(ix,iy,tx,ty,Math.max(0,prog*2-1));$('view').innerHTML='<rect width="640" height="205" fill="#e7f4ff"/><rect y="205" width="640" height="205" fill="#d6f4f0"/>'+ln(0,iy,640,iy,'#245a81',3)+ln(ix,25,ix,390,'#6b7280',2,'stroke-dasharray="7 6"')+txt(22,38,'n₁ = '+n1)+txt(22,240,'n₂ = '+n2)+ln(x,y,inc[0],inc[1],'#ea580c',4)+(prog>.5?ln(ix,iy,ref[0],ref[1],'#7c3aed',3):'')+(prog>.5&&!tir?ln(ix,iy,trn[0],trn[1],'#059669',4):'')+txt(332,193,'O','#23334b')+txt(410,50,'i = '+angle+'°','#ea580c')+txt(415,365,tir?'TIR':'r = '+(b*180/Math.PI).toFixed(1)+'°','#059669');$('explain').textContent=(tir?L().lightTIR:'n₁ sin(i) = n₂ sin(r) · i = '+angle+'° · r = '+(b*180/Math.PI).toFixed(1)+'°')+' '+(state?'':L().lightPending);$('notebook').textContent=tir?L().lightTIR:'Snell: n₁ sin(i)=n₂ sin(r); i='+angle+'°, r='+(b*180/Math.PI).toFixed(1)+'°';quiz(L().lightQuestion,[L().yes,L().no],0)}
function mathematics(){
 const {ax,ay,bx,by}=prefs,ox=320,oy=205,scale=23,sx=x=>ox+x*scale,sy=y=>oy-y*scale,dx=bx-ax,dy=by-ay;
 const mx=(ax+bx)/2,my=(ay+by)/2,same=dx===0&&dy===0;
 let g='<rect width="640" height="410" fill="#fff"/>';
 for(let x=-13;x<=13;x++)g+=ln(sx(x),0,sx(x),410,'#e6edf5',1);
 for(let y=-8;y<=8;y++)g+=ln(0,sy(y),640,sy(y),'#e6edf5',1);
 g+=ln(0,oy,640,oy,'#1e293b',2)+ln(ox,0,ox,410,'#1e293b',2)+txt(620,196,'x')+txt(329,20,'y');
 if(!same){
  if(dx===0)g+=ln(sx(ax),0,sx(ax),410,'#0d9488',3);
  else{const slope=dy/dx,g0=ay-slope*ax;g+=ln(0,sy(g0+slope*((0-ox)/scale)),640,sy(g0+slope*((640-ox)/scale)),'#0d9488',3)}
 }
 const arrow=(x,y,z,w,color)=>ln(sx(x),sy(y),sx(z),sy(w),color,4)+(!same?'<circle cx="'+sx(z)+'" cy="'+sy(w)+'" r="5" fill="'+color+'"/>':'');
 g+=arrow(0,0,ax,ay,'#2563eb')+arrow(ax,ay,bx,by,'#dc2626');
 // Label layout: reserve each pixel region so midpoint M never overlays A, B or vector AB.
 const occupied=[];function pointLabel(x,y,label,color){
  const px=sx(x),py=sy(y),width=Math.max(70,label.length*8+16),height=23;
  const opts=[[12,-10],[-width-12,-10],[12,22],[-width-12,22],[12,-36],[-width-12,-36],[12,44],[-width-12,44]];
  let position=opts[0],best=Infinity;
  for(const o of opts){
   const xx=px+o[0],yy=py+o[1],rect={x:xx,y:yy-17,w:width,h:height};
   const overlap=occupied.reduce((n,v)=>n+Math.max(0,Math.min(rect.x+rect.w,v.x+v.w)-Math.max(rect.x,v.x))*Math.max(0,Math.min(rect.y+rect.h,v.y+v.h)-Math.max(rect.y,v.y)),0);
   const out=Math.max(0,-rect.x)+Math.max(0,rect.x+rect.w-638)+Math.max(0,-rect.y)+Math.max(0,rect.y+rect.h-408);
   const score=overlap*100+out*200+Math.abs(o[1])*.15;
   if(score<best){best=score;position=o}
  }
  const xx=px+position[0],yy=py+position[1];
  occupied.push({x:xx,y:yy-17,w:width,h:height});
  g+='<circle cx="'+px+'" cy="'+py+'" r="5" fill="'+color+'"/>';
  g+=txt(xx,yy,label,color,14);
 }
 pointLabel(ax,ay,'A('+ax+','+ay+')','#111827');
 if(!same)pointLabel(bx,by,'B('+bx+','+by+')','#111827');
 else g+=txt(Math.min(540,sx(bx)+12),Math.min(390,sy(by)+25),'A = B','#111827',13);
 // Separate midpoint mark with its OWN label placement, instead of drawing AB and M text at the same coordinates.
 if(!same){pointLabel(mx,my,'M('+mx+','+my+')','#15803d');const ll=txt(Math.min(575,Math.max(10,(sx(ax)+sx(bx))/2-18)),Math.min(399,Math.max(18,(sy(ay)+sy(by))/2-28)),'AB⃗','#dc2626',13);g+=ll}
 $('view').innerHTML=g;
 const eq=same?'undefined: A = B':dx===0?'x = '+ax:'y = '+(dy/dx).toFixed(2)+'x '+(ay-dy/dx*ax>=0?'+ ':'− ')+Math.abs(ay-dy/dx*ax).toFixed(2);
 $('explain').textContent=L().mathAnswer+' A('+ax+','+ay+') → B('+bx+','+by+'); AB⃗ = ('+dx+','+dy+'); M = ('+mx+','+my+'); (AB): '+eq;
 $('notebook').textContent='AB⃗ = (xB − xA, yB − yA) = ('+dx+','+dy+'); M = ('+mx+','+my+'); droite (AB): '+eq;
 quiz(L().mathQuestion,['B − A','A + B','A − B'],0)
}
function render(){$('intro').textContent=L().intro;$('title').textContent=L()[mode];$('run').textContent='▶ '+L().run;$('pause').textContent='⏸ '+L().pause;$('again').textContent='↺ '+L().again;$('notebookTitle').textContent=L().notebook;$('note').textContent=L().note;$('controls').innerHTML=controls();if(mode==='chem')chemistry();else if(mode==='light')optics();else mathematics()}
function stop(){if(timer){clearInterval(timer);timer=null}}function reset(){stop();state=0;render()}function start(){stop();state=1;render();timer=setInterval(()=>{state++;render();if(state>= (mode==='chem'?58:mode==='light'?48:1))stop()},mode==='chem'?65:mode==='light'?35:40)}function tab(m){mode=m;for(const t of ['chem','light','math'])$(t+'Tab').classList.toggle('active',t===m);reset()}render();
</script></body></html>
