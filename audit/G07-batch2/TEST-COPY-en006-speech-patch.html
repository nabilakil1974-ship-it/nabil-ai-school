<style>/* NABIL AI Golden V6 board — static engine styles (never regenerated per lesson).

#nabilWholeLessonSmartLab{font-family:Arial,"Noto Naskh Arabic",Tahoma,sans-serif;color:#12324b;background:#eaf0f6;border-radius:14px;overflow:hidden;position:relative}
#nabilWholeLessonSmartLab *{box-sizing:border-box}
.nb-open{min-height:min(88vh,760px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:28px 18px;background:linear-gradient(160deg,#f4f9ff,#dcecf9)}
.nb-open img{width:min(34vw,170px);height:min(34vw,170px);border-radius:50%;object-fit:cover;border:4px solid #1762aa;background:#fff;cursor:pointer}
.nb-brand{font-size:clamp(20px,4vw,30px);font-weight:800;color:#075987;direction:rtl}
.nb-title-en{font-size:clamp(24px,5vw,40px);font-weight:800;direction:ltr;color:#12324b}
.nb-title-fr{font-size:clamp(18px,3.4vw,26px);direction:ltr;color:#3b5f7d}
.nb-start{font-size:clamp(20px,4vw,28px);font-weight:800;padding:16px 36px;border:0;border-radius:14px;background:#1762aa;color:#fff;cursor:pointer;min-height:56px}
.nb-start:focus-visible,.nb-ctl button:focus-visible{outline:3px solid #f2a93b}
.nb-hint{font-size:14px;color:#456}
/* full-screen overlay (real Fullscreen API when allowed, fixed overlay otherwise) */
#nabilWholeLessonSmartLab.nb-active{position:fixed;inset:0;z-index:2147483000;border-radius:0;display:flex;flex-direction:column;height:100vh;height:100dvh;background:#fff}
#nabilWholeLessonSmartLab.nb-active .nb-open{display:none}
.nb-stage{display:none}
#nabilWholeLessonSmartLab.nb-active .nb-stage{display:flex;flex-direction:column;flex:1;min-height:0}
.nb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:2px solid #e1edf4;background:#fff}
.nb-head h2{margin:0;font-size:clamp(17px,2.4vw,26px);color:#075987;font-weight:750;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-head .nb-prog{font-size:14px;color:#456;white-space:nowrap}
.nb-workspace{flex:1;min-height:0;display:grid;grid-template-columns:1fr;position:relative}
.nb-workspace[data-board-mode="dual"]{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}

.nb-diagram svg{width:100%;max-height:100%;height:auto;display:block}

.nb-step[dir="rtl"]{text-align:right;unicode-bidi:plaintext;font-family:Tahoma,Arial,sans-serif}
.nb-step[dir="ltr"]{text-align:left}
.nb-step .nb-label{display:block;font-size:.58em;font-weight:800;color:#b25a00;letter-spacing:.02em;margin-bottom:2px;direction:inherit}

.nb-check button{margin-top:8px}
.nb-fb{margin-top:8px;font-weight:700}
.nb-lost{margin:0 0 18px;padding:14px;border:2px solid #d98a28;border-radius:10px;background:#fff8ec;font-size:clamp(18px,1.7vw,24px)}
.nb-ctl{display:flex;flex-wrap:wrap;gap:7px;padding:8px 10px;background:#dceafa;justify-content:center;align-items:center;border-top:1px solid #bcd2e5}
.nb-ctl button,.nb-ctl select{font-size:15px;font-weight:700;padding:10px 12px;min-height:44px;border:0;border-radius:8px;background:#1762aa;color:#fff;cursor:pointer}
.nb-ctl select{background:#fff;color:#12324b;border:1px solid #9bb7d0}
.nb-ctl .nb-lost-btn{background:#d98a28}
.nb-status{font-size:13px;color:#234;padding:2px 8px}
.nb-voice-note{display:none;padding:6px 10px;background:#fff2cf;font-size:14px;text-align:center}
.nb-voice-note.on{display:block}
.nb-voice-note button{margin-inline-start:8px;padding:6px 12px;min-height:34px;border:0;border-radius:6px;background:#1762aa;color:#fff;font-weight:700}
#teacherHand{position:fixed;z-index:2147483600;width:clamp(100px,13vw,155px);height:auto;pointer-events:none;opacity:0;transform:translate(-18%,-16%);transition:left .38s ease,top .38s ease,opacity .16s ease;will-change:left,top}

.nb-golden{display:none;overflow-y:auto;padding:12px;background:#fff}
.nb-golden.on{display:block}
.nb-sq{display:none}
@media(max-width:760px){
 .nb-workspace[data-board-mode="dual"]{grid-template-columns:1fr;grid-template-rows:minmax(190px,38%) minmax(0,1fr)}

 #teacherHand{width:105px}
}

جب ستة."},{"t":"formula","text":"(+3) × (+2) = +6","speech":"موجب ثلاثة ضرب موجب اثنين يساوي موجب ستة."},{"t":"text","text":"إذن إشارتان متشابهتان تعطيان حاصل ضرب موجبًا، وإشارتان مختلفتان تعطيان حاصل ضرب سالبًا. والقيمة المطلقة للحاصل تساوي حاصل ضرب القيمتين المطْلقتين.","speech":"إذن إشارتان متشابهتان تعطيان حاصل ضرب موجبًا، وإشارتان مختلفتان تعطيان حاصل ضرب سالبًا. والقيمة المطلقة للحاصل تساوي حاصل ضرب القيمتين المطْلقتين."}]},{"id":"CH06-003-prep2","title":"Preparatory Activity 2 — Sign of a quotient","start_mode":"dual","source_student_page":66,"source_guide_page":38,"steps":[{"t":"draw","draw":"sourceFigure","args":{"key":"prep_activity_2"}},{"t":"text","text":"النشاط التحضيري الثاني يطلب اختيار عددين موقّعين يكون خارج قسمتهما موجب ثلاثة، ثم عددين خارج قسمتهما سالب ثلاثة.","speech":"النشاط التحضيري الثاني يطلب اختيار عددين موقّعين يكون خارج قسمتهما موجب ثلاثة، ثم عددين خارج قسمتهما سالب ثلاثة."},{"t":"text","text":"مثال إجابة للنشاط المفتوح، لا تمرين جديد:","speech":"مثال إجابة للنشاط المفتوح، لا تمرين جديد:"},{"t":"formula","text":"(+6) ÷ (+2) = +3","speech":"موجب ستة مقسومًا على موجب اثنين يساوي موجب ثلاثة."},{"t":"formula","text":"(-6) ÷ (+2) = -3","speech":"سالب ستة مقسومًا على موجب اثنين يساوي سالب ثلاثة."},{"t":"text","text":"نستنتج أن قسمة عددين لهما الإشارة نفسها تعطي عددًا موجبًا، وإذا اختلفت الإشارتان فالخارج سالب. ويُمنع القسمة على صفر.","speech":"نستنتج أن قسمة عددين لهما الإشارة نفسها تعطي عددًا موجبًا، وإذا اختلفت الإشارتان فالخارج سالب. ويُمنع القسمة على صفر."}]},{"id":"CH06-004-rule1","title":"Definition 1 — Multiplication of signed numbers","start_mode":"single","source_student_page":67,"source_guide_page":38,"steps":[{"t":"text","text":"التعريف الأول في صفحة 67: نضرب القيمتين المطْلقتين، ثم نحدد الإشارة: موجب عند تطابق الإشارتين وسالب عند اختلافهما.","speech":"التعريف الأول في صفحة 67: نضرب القيمتين المطْلقتين، ثم نحدد الإشارة: موجب عند تطابق الإشارتين وسالب عند اختلافهما."},{"t":"formula","text":"(+10) × (+14) = +140","speech":"موجب عشرة ضرب موجب أربعة عشر يساوي موجب مئة وأربعين."},{"t":"formula","text":"(-7) × (-3) = +21","speech":"سالب سبعة ضرب سالب ثلاثة يساوي موجب واحد وعشرين."},{"t":"formula","text":"(+4) × (-11) = -44","speech":"موجب أربعة ضرب سالب أحد عشر يساوي سالب أربعة وأربعين."},{"t":"formula","text":"(-9) × (+3) = -27","speech":"سالب تسعة ضرب موجب ثلاثة يساوي سالب سبعة وعشرين."}]},{"id":"CH06-005-special","title":"Properties 1 and 2 — Minus one and zero","start_mode":"single","source_student_page":67,"source_guide_page":38,"steps":[{"t":"text","text":"الضرب بسالب واحد يغيّر إشارة العدد. والضرب بصفر يعطي صفرًا مهما كانت قيمة العامل الآخر.","speech":"الضرب بسالب واحد يغيّر إشارة العدد. والضرب بصفر يعطي صفرًا مهما كانت قيمة العامل الآخر."},{"t":"formula","text":"(8.4) × (-1) = -8.4","speech":"ثمانية فاصلة أربعة ضرب سالب واحد يساوي سالب ثمانية فاصلة أربعة."},{"t":"formula","text":"(-6) × (-1) = +6","speech":"سالب ستة ضرب سالب واحد يساوي موجب ستة."},{"t":"formula","text":"0 × (-52) = 0","speech":"صفر ضرب سالب اثنين وخمسين يساوي صفرًا."},{"t":"text","text":"إذا كان حاصل ضرب عددين صفرًا، فلا بد أن أحد العاملين على الأقل يساوي صفرًا.","speech":"إذا كان حاصل ضرب عددين صفرًا، فلا بد أن أحد العاملين على الأقل يساوي صفرًا."}]},{"id":"CH06-006-division","title":"Definition 2 — Quotient of two signed numbers","start_mode":"single","source_student_page":67,"source_guide_page":38,"steps":[{"t":"text","text":"في الصفحتين 67 و68: إشارة خارج القسمة موجبة عند تماثل الإشارتين، وسالبة عند اختلافهما.","speech":"في الصفحتين 67 و68: إشارة خارج القسمة موجبة عند تماثل الإشارتين، وسالبة عند اختلافهما."},{"t":"formula","text":"(-15) ÷ (-3) = +5","speech":"سالب خمسة عشر على سالب ثلاثة يساوي موجب خمسة."},{"t":"formula","text":"(+15) ÷ (-3) = -5","speech":"موجب خمسة عشر على سالب ثلاثة يساوي سالب خمسة."},{"t":"text","text":"تنبيه علمي: إحدى العبارات التفسيرية المطبوعة في أعلى الصفحة 68 لا تتوافق مع قاعدة الإشارات؛ نعتمد الحساب الرياضي الصحيح ولا نكرر الخطأ الطباعي.","speech":"تنبيه علمي: إحدى العبارات التفسيرية المطبوعة في أعلى الصفحة 68 لا تتوافق مع قاعدة الإشارات؛ نعتمد الحساب الرياضي الصحيح ولا نكرر الخطأ الطباعي."}]},{"id":"CH06-007-priority","title":"Priorities and rules for calculation","start_mode":"single","source_student_page":68,"source_guide_page":38,"steps":[{"t":"text","text":"ترتيب العمليات من الصفحة 68: نبدأ بما داخل الأقواس من الداخل إلى الخارج، ثم الضرب والقسمة، ثم الجمع والطرح. العمليات ذات الأولوية نفسها تُجرى من اليسار إلى اليمين.","speech":"ترتيب العمليات من الصفحة 68: نبدأ بما داخل الأقواس من الداخل إلى الخارج، ثم الضرب والقسمة، ثم الجمع والطرح. العمليات ذات الأولوية نفسها تُجرى من اليسار إلى اليمين."},{"t":"formula","text":"(23.5 - 8.1) × 4 = 15.4 × 4 = 61.6","speech":"نحسب داخل القوس أولًا: ثلاثة وعشرون فاصلة خمسة ناقص ثمانية فاصلة واحد يساوي خمسة عشر فاصلة أربعة، ثم نضرب بأربعة، فالنتيجة واحد وستون فاصلة ستة."},{"t":"formula","text":"12 - 4 + 8 - 3 = 13","speech":"من اليسار إلى اليمين: اثنا عشر ناقص أربعة يساوي ثمانية، زائد ثمانية يساوي ستة عشر، ناقص ثلاثة يساوي ثلاثة عشر."},{"t":"formula","text":"2 × 8 ÷ 5 × 4 = 12.8","speech":"نبدأ من اليسار إلى اليمين: اثنان ضرب ثمانية يساوي ستة عشر، على خمسة يساوي ثلاثة فاصلة اثنين، ضرب أربعة يساوي اثني عشر فاصلة ثمانية."}]},{"id":"CH06-008-focus","title":"Focus — Multiplication and division sign table","start_mode":"dual","source_student_page":69,"source_guide_page":38,"steps":[{"t":"draw","draw":"sourceFigure","args":{"key":"focus_sign_rules"}},{"t":"text","text":"ملخص الكتاب في الصفحة 69: في الضرب والقسمة إشارتان متماثلتان تعطِيان موجبًا، وإشارتان مختلفتان تعطِيان سالبًا.","speech":"ملخص الكتاب في الصفحة 69: في الضرب والقسمة إشارتان متماثلتان تعطِيان موجبًا، وإشارتان مختلفتان تعطِيان سالبًا."},{"t":"text","text":"عند وجود عدة عوامل، إذا كان عدد العوامل السالبة زوجيًا فالحاصل موجب، وإذا كان فرديًا فالحاصل سالب، بشرط ألا يكون عامل صفرًا.","speech":"عند وجود عدة عوامل، إذا كان عدد العوامل السالبة زوجيًا فالحاصل موجب، وإذا كان فرديًا فالحاصل سالب، بشرط ألا يكون عامل صفرًا."},{"t":"text","text":"البطاقة تعرض مقتطفًا من جدول الإشارات الأصلي في الكتاب، وليس مختبرًا مستحدثًا.","speech":"البطاقة تعرض مقتطفًا من جدول الإشارات الأصلي في الكتاب، وليس مختبرًا مستحدثًا."}]},{"id":"CH06-009-exercise1","title":"Exercise 1 — Determine product signs","start_mode":"single","source_student_page":70,"source_guide_page":38,"steps":[{"t":"text","text":"التمرين الأول، صفحة 70: المطلوب تحديد إشارة كل حاصل ضرب دون حساب القيمة.","speech":"التمرين الأول، صفحة 70: المطلوب تحديد إشارة كل حاصل ضرب دون حساب القيمة."},{"t":"formula","text":"32 × (-12) → negative","speech":"موجب ضرب سالب، إذن الإشارة سالبة."},{"t":"formula","text":"4.75 × (-2.4) × 3 → negative","speech":"يوجد عامل سالب واحد، فالنتيجة سالبة."},{"t":"formula","text":"(-2.15) × (-14.6) → positive","speech":"سالب ضرب سالب يساوي موجبًا."},{"t":"formula","text":"(-2) × (-3) × (-7) → negative","speech":"ثلاثة عوامل سالبة، فالنتيجة سالبة."},{"t":"formula","text":"10.5 × (-2) × (-3.5) → positive","speech":"عاملان سالبان، فالنتيجة موجبة."},{"t":"formula","text":"(-3.7) × (-2.6) × (-0.7) × 4 → negative","speech":"ثلاثة عوامل سالبة، فالنتيجة سالبة."}]},{"id":"CH06-010-exercise2","title":"Exercise 2 — Mental products","start_mode":"single","source_student_page":70,"source_guide_page":38,"steps":[{"t":"text","text":"التمرين الثاني، صفحة 70: احسب ذهنيًا مع الانتباه إلى الإشارات.","speech":"التمرين الثاني، صفحة 70: احسب ذهنيًا مع الانتباه إلى الإشارات."},{"t":"formula","text":"4×(-5)=-20 ; (-2)×7=-14","speech":"أربعة ضرب سالب خمسة يساوي سالب عشرين. سالب اثنين ضرب سبعة يساوي سالب أربعة عشر."},{"t":"formula","text":"(-3)×(-7)=21 ; (-4)×7=-28","speech":"سالب ثلاثة ضرب سالب سبعة يساوي موجب واحد وعشرين. سالب أربعة ضرب سبعة يساوي سالب ثمانية وعشرين."},{"t":"formula","text":"2×(-9)=-18 ; (-8)×9=-72","speech":"اثنان ضرب سالب تسعة يساوي سالب ثمانية عشر. سالب ثمانية ضرب تسعة يساوي سالب اثنين وسبعين."},{"t":"formula","text":"(-6)×(-7)=42 ; 6×(-9)=-54","speech":"سالب ستة ضرب سالب سبعة يساوي موجب اثنين وأربعين. ستة ضرب سالب تسعة يساوي سالب أربعة وخمسين."},{"t":"formula","text":"(-5.6)×(-1)=5.6 ; (5.6)×(-1)=-5.6","speech":"الضرب بسالب واحد يعكس الإشارة."},{"t":"formula","text":"(-1)×(-1)=1","speech":"سالب واحد ضرب سالب واحد يساوي موجب واحد."}]},{"id":"CH06-011-exercise3","title":"Exercise 3 — Products of a and b","start_mode":"single","source_student_page":70,"source_guide_page":38,"steps":[{"t":"text","text":"التمرين الثالث: نعوّض قيمتي a وb ثم نطبّق قاعدة الإشارات.","speech":"التمرين الثالث: نعوّض قيمتي a وb ثم نطبّق قاعدة الإشارات."},{"t":"formula","text":"a=-7.5, b=0.25 ⇒ ab=-1.875","speech":"سالب سبعة فاصلة خمسة ضرب صفر فاصلة خمسة وعشرين يساوي سالب واحد فاصلة ثمانمئة وخمسة وسبعين."},{"t":"formula","text":"a=-2.5, b=-18 ⇒ ab=45","speech":"سالب اثنين فاصلة خمسة ضرب سالب ثمانية عشر يساوي موجب خمسة وأربعين."},{"t":"formula","text":"a=-812, b=-0.75 ⇒ ab=609","speech":"سالب ثمانمئة واثني عشر ضرب سالب صفر فاصلة خمسة وسبعين يساوي موجب ستمئة وتسعة."},{"t":"formula","text":"a=4.25, b=-326 ⇒ ab=-1385.5","speech":"موجب أربعة فاصلة خمسة وعشرين ضرب سالب ثلاثمئة وستة وعشرين يساوي سالب ألف وثلاثمئة وخمسة وثمانين فاصلة خمسة."}]},{"id":"CH06-012-exercise4","title":"Exercise 4 — Products with decimals","start_mode":"single","source_student_page":70,"source_guide_page":39,"steps":[{"t":"text","text":"التمرين الرابع: نضرب القيم المطلقة، ثم نحدد الإشارة.","speech":"التمرين الرابع: نضرب القيم المطلقة، ثم نحدد الإشارة."},{"t":"formula","text":"62×(-1)=-62 ; 62×(-0.1)=-6.2","speech":"الضرب بسالب واحد يعكس الإشارة، والضرب بسالب عُشر يعطي سالب ستة فاصلة اثنين."},{"t":"formula","text":"(-0.1)×(-0.1)=0.01","speech":"سالب عُشر ضرب سالب عُشر يساوي موجب جزء من مئة."},{"t":"formula","text":"(-22)×(-4)=88 ; 10×(-0.1)=-1","speech":"سالب اثنين وعشرين ضرب سالب أربعة يساوي موجب ثمانية وثمانين. عشرة ضرب سالب عُشر يساوي سالب واحد."},{"t":"formula","text":"100×(-0.01)=-1 ; 400×(-0.01)=-4","speech":"مئة ضرب سالب جزء من مئة يساوي سالب واحد. أربعمئة ضرب سالب جزء من مئة يساوي سالب أربعة."},{"t":"formula","text":"(-11)×(-30)=330 ; 0.001×(-325)=-0.325","speech":"سالب أحد عشر ضرب سالب ثلاثين يساوي موجب ثلاثمئة وثلاثين. واحد بالألف ضرب سالب ثلاثمئة وخمسة وعشرين يساوي سالب صفر فاصلة ثلاثمئة وخمسة وعشرين."}]},{"id":"CH06-013-exercise5","title":"Exercise 5 — Find the signs of a, b, c, d","start_mode":"dual","source_student_page":70,"source_guide_page":39,"steps":[{"t":"draw","draw":"sourceFigure","args":{"key":"exercise_5_source"}},{"t":"text","text":"التمرين الخامس: المطلوب تحديد إشارة a وb وc وd من إشارة حاصل الضرب. نقرأ نص الطالب بدقة.","speech":"التمرين الخامس: المطلوب تحديد إشارة a وb وc وd من إشارة حاصل الضرب. نقرأ نص الطالب بدقة."},{"t":"formula","text":"(-4)×a > 0 ⇒ a < 0","speech":"بما أن سالب أربعة ضرب a موجب، فإن a سالب."},{"t":"formula","text":"(-3)×b < 0 ⇒ b > 0","speech":"بما أن سالب ثلاثة ضرب b سالب، فإن b موجب."},{"t":"formula","text":"c×(-0.75)×(-17) > 0 ⇒ c > 0","speech":"سالب ضرب سالب موجب، ولذلك يجب أن يكون c موجبًا."},{"t":"formula","text":"(-32)×d×735 < 0 ⇒ d > 0","speech":"العوامل الثابتة سالب اثنين وثلاثون وموجب سبعمئة وخمسة وثلاثون حاصلها سالب، فيكون d موجبًا."},{"t":"text","text":"تنبيه موثّق: دليل المعلم في الصفحة 39 يكتب في سطر b أن حاصل ضرب سالب ثلاثة في b موجب، لكن كتاب الطالب يذكر أنه سالب. نعتمد نص الطالب ونستنتج أن b موجب، كما أن دليل المعلم نفسه لم يعطِ قيمة b صراحة.","speech":"تنبيه موثّق: دليل المعلم في الصفحة 39 يكتب في سطر b أن حاصل ضرب سالب ثلاثة في b موجب، لكن كتاب الطالب يذكر أنه سالب. نعتمد نص الطالب ونستنتج أن b موجب، كما أن دليل المعلم نفسه لم يعطِ قيمة b صراحة."}]},{"id":"CH06-014-exercise5-guide","title":"Exercise 5 — Guide discrepancy evidence","start_mode":"dual","source_student_page":70,"source_guide_page":39,"steps":[{"t":"draw","draw":"sourceFigure","args":{"key":"guide_5_discrepancy"}},{"t":"text","text":"هذه صورة من دليل المعلم صفحة 39. لاحظ أن العبارة المطبوعة فيه حول b تخالف السؤال في كتاب الطالب.","speech":"هذه صورة من دليل المعلم صفحة 39. لاحظ أن العبارة المطبوعة فيه حول b تخالف السؤال في كتاب الطالب."},{"t":"text","text":"لم نغيّر نص التمرين أو نؤلف مسألة بديلة. سجلنا الاختلاف، واحتفظنا بالحل المتوافق مع نص الطالب وقاعدة الإشارات.","speech":"لم نغيّر نص التمرين أو نؤلف مسألة بديلة. سجلنا الاختلاف، واحتفظنا بالحل المتوافق مع نص الطالب وقاعدة الإشارات."}]},{"id":"CH06-015-exercise6","title":"Exercise 6 — Mental decimal products","start_mode":"single","source_student_page":70,"source_guide_page":39,"steps":[{"t":"text","text":"التمرين السادس: نضرب الأعداد الموقّعة ذات الأجزاء العشرية.","speech":"التمرين السادس: نضرب الأعداد الموقّعة ذات الأجزاء العشرية."},{"t":"formula","text":"(-8)×0.4=-3.2 ; (-9)×0.6=-5.4","speech":"سالب ثمانية ضرب صفر فاصلة أربعة يساوي سالب ثلاثة فاصلة اثنين. سالب تسعة ضرب صفر فاصلة ستة يساوي سالب خمسة فاصلة أربعة."},{"t":"formula","text":"(-7)×(-0.6)=4.2 ; 0.7×(-0.2)=-0.14","speech":"سالب سبعة ضرب سالب صفر فاصلة ستة يساوي موجب أربعة فاصلة اثنين. صفر فاصلة سبعة ضرب سالب صفر فاصلة اثنين يساوي سالب صفر فاصلة أربعة عشر."},{"t":"formula","text":"0.7×(-0.02)=-0.014 ; (-0.8)×30=-24","speech":"صفر فاصلة سبعة ضرب سالب جزءين من مئة يساوي سالب أربعة عشر بالألف. سالب صفر فاصلة ثمانية ضرب ثلاثين يساوي سالب أربعة وعشرين."}]},{"id":"CH06-016-exercise7","title":"Exercise 7 — Several signed factors","start_mode":"single","source_student_page":70,"source_guide_page":39,"steps":[{"t":"text","text":"التمرين السابع: نعدّ العوامل السالبة ثم نحسب القيم المطلقة.","speech":"التمرين السابع: نعدّ العوامل السالبة ثم نحسب القيم المطلقة."},{"t":"formula","text":"(-6)×(-3)×(-4)=-72","speech":"ثلاثة عوامل سالبة: الإشارة سالبة. ستة ضرب ثلاثة ضرب أربعة يساوي اثنين وسبعين."},{"t":"formula","text":"(-6)×(-5)×(-4)=-120","speech":"ثلاثة عوامل سالبة: الناتج سالب مئة وعشرين."},{"t":"formula","text":"(-3)×8×(-2)=48","speech":"عاملان سالبان: الناتج موجب ثمانية وأربعين."},{"t":"formula","text":"(-4)×3×(-2)=24","speech":"عاملان سالبان: الناتج موجب أربعة وعشرين."},{"t":"formula","text":"7×(-3)×5=-105","speech":"عامل سالب واحد: الناتج سالب مئة وخمسة."},{"t":"formula","text":"(-5)×(-8)×(-1)×(-7)=280","speech":"أربعة عوامل سالبة: الناتج موجب مئتين وثمانين."}]},{"id":"CH06-017-exercise8","title":"Exercise 8 — Quotient signs","start_mode":"single","source_student_page":70,"source_guide_page":39,"steps":[{"t":"text","text":"التمرين الثامن: حدّد إشارة خارج القسمة دون إجراء حساب القيمة.","speech":"التمرين الثامن: حدّد إشارة خارج القسمة دون إجراء حساب القيمة."},{"t":"formula","text":"(-3)/17 → negative ; (-3)/(-17) → positive","speech":"سالب على موجب يعطي سالبًا، وسالب على سالب يعطي موجبًا."},{"t":"formula","text":"2.1/(-1) → negative ; (-27)/1 → negative","speech":"موجب على سالب يعطي سالبًا، وسالب على موجب يعطي سالبًا."},{"t":"formula","text":"(-0.01)/(-32.6) → positive","speech":"سالب على سالب يعطي موجبًا."}]},{"id":"CH06-018-exercise9","title":"Exercise 9 — Decimal quotients","start_mode":"single","source_student_page":70,"source_guide_page":39,"steps":[{"t":"text","text":"التمرين التاسع: اكتب كل خارج قسمة بالصيغة العشرية.","speech":"التمرين التاسع: اكتب كل خارج قسمة بالصيغة العشرية."},{"t":"formula","text":"(-32)/5 = -6.4","speech":"سالب اثنين وثلاثين على خمسة يساوي سالب ستة فاصلة أربعة."},{"t":"formula","text":"(-25)/(-1.25) = +20","speech":"سالب خمسة وعشرين على سالب واحد فاصلة خمسة وعشرين يساوي موجب عشرين."},{"t":"formula","text":"8.1/(-0.9) = -9","speech":"موجب ثمانية فاصلة واحد على سالب صفر فاصلة تسعة يساوي سالب تسعة."},{"t":"formula","text":"6.25/1.25 = +5","speech":"ستة فاصلة خمسة وعشرين على واحد فاصلة خمسة وعشرين يساوي موجب خمسة."}]},{"id":"CH06-019-exercise10","title":"Exercise 10 — Unknown factor signs","start_mode":"single","source_student_page":70,"source_guide_page":39,"steps":[{"t":"text","text":"التمرين العاشر: نستنتج إشارة المتغيّر من إشارة حاصل الضرب وعدد العوامل السالبة الأخرى.","speech":"التمرين العاشر: نستنتج إشارة المتغيّر من إشارة حاصل الضرب وعدد العوامل السالبة الأخرى."},{"t":"formula","text":"(-2)×(-14)×4×a×(-70) > 0 ⇒ a < 0","speech":"العوامل الثابتة تتضمن ثلاثة عوامل سالبة، لذا يلزم أن يكون a سالبًا ليصبح الحاصل موجبًا."},{"t":"formula","text":"38×b×(-9)×(-8.5)×(-6.5) > 0 ⇒ b < 0","speech":"ثلاثة عوامل ثابتة سالبة، <script data-nabil-no-translate="1">/* NABIL AI Golden V6 engine — ONE static engine, lesson DATA only.
   Hand image, pen/hand travel, word-by-word writing, cube drawing actions and the

(()=>{
'use strict';
const root=document.getElementById('nabilWholeLessonSmartLab');
if(!root)return;
const $=id=>document.getElementById(id);
const raw=$('nabilV6Data').textContent;
const DATA=JSON.parse(raw);
const LANG=DATA.lang||'en';
/* language follows the page translation runtime (NABILPageLanguage) when present */
const PL=()=>window.NABILPageLanguage;

const tr=s=>{s=String(s||'');try{return PL()&&PL().translateText?PL().translateText(s,cur()):s}catch(_){return s}};
const U=()=>(DATA.ui_all&&DATA.ui_all[cur()])||{};

const NS='http://www.w3.org/2000/svg';

const FINAL=SCENES.length;

  ink=$('nbInk'),svg=$('nbBoard'),statusEl=$('nbStatus'),headTitle=$('nbHeadTitle'),
  progEl=$('nbProg'),hand=$('teacherHand'),voiceNote=$('nbVoiceNote'),golden=$('nbGolden');
const playBtn=$('nabilWholePlay'),voiceBtn=$('nabilWholeVoice'),speedSel=$('nbSpeed'),
  prevBtn=$('nabilWholePrev'),nextBtn=$('nabilWholeNext'),replayBtn=$('nabilWholeRestart'),
  lostBtn=$('nbLost'),fsBtn=$('nbFullscreen'),exitBtn=$('nbExit'),startBtn=$('nbStart'),avatarOpen=$('nbAvatarOpen');

let index=0,run=0,paused=false,voice=true,speed=1.25,started=false,speaking=false,boardMode='single',
    finished=false,activeAnchor=null,studentWait=false,lastText='',curStepNo=0,gotUnderstood=null;
let handUrl=null,avatarUrl=null;
const modeLog=[];

/* ---------- assets (Blob URLs, never data: URIs) ---------- */
function blobUrl(b64,type){const bytes=Uint8Array.from(atob(b64.trim()),c=>c.charCodeAt(0));return URL.createObjectURL(new Blob([bytes],{type}))}
try{handUrl=blobUrl($('nabilV6HandPayload').textContent,'image/png');hand.src=handUrl}catch(e){}
try{avatarUrl=blobUrl(DATA.avatar_base64||'','image/jpeg');avatarOpen.src=avatarUrl}catch(e){}
window.addEventListener('pagehide',()=>{[handUrl,avatarUrl].forEach(u=>u&&URL.revokeObjectURL(u))});

/* ---------- math: canonical base^{exp} -> real superscripts, LTR isolation ---------- */
function supNodes(txt,into){
  const re=/([^\s^{}]*)\^\{([^{}]*)\}/g;let last=0,m;
  while((m=re.exec(txt))){
    if(m.index>last)into.appendChild(document.createTextNode(txt.slice(last,m.index)));
    if(m[1])into.appendChild(document.createTextNode(m[1]));
    const s=document.createElement('sup');s.className='nb-sup';s.textContent=m[2];into.appendChild(s);last=re.lastIndex}
  if(last<txt.length)into.appendChild(document.createTextNode(txt.slice(last)));
}
/* text -> array of reveal units (DOM nodes) */
function unitsOf(text,rtl,formula){
  const units=[];
  const pushPlain=s=>{(s.match(/\S+\s*/g)||[]).forEach(w=>{const sp=document.createElement('span');sp.textContent=w;units.push(sp)})};
  if(formula){
    (String(text).match(/\S+\s*/g)||[]).forEach(w=>{const sp=document.createElement('span');supNodes(w,sp);units.push(sp)});
    return units}
  const words=String(text).match(/\S+\s*/g)||[];
  const isMath=w=>/[0-9^{}=+×÷−<>≤≥≠≈√]/.test(w);
  const isLatin=w=>/^[A-Za-z][A-Za-z'’-]*[.,;:!?]?\s*$/.test(w);
  let i=0;
  const bdiOf=str=>{const b=document.createElement('bdi');b.dir='ltr';b.className='nb-math';supNodes(str,b);return b};
  while(i<words.length){
    const w=words[i];
    if(rtl&&(isMath(w)||isLatin(w))){
      /* RTL page: keep a Latin/math run together, isolated LTR, so it never flips */
      let j=i,buf='';
      while(j<words.length&&(isMath(words[j])||isLatin(words[j]))){buf+=words[j];j++}
      const b=bdiOf(buf.replace(/\s+$/,''));units.push(b);
      const sp=document.createElement('span');sp.textContent=' ';units.push(sp);i=j}
    else if(isMath(w)){const b=bdiOf(w.replace(/\s+$/,''));units.push(b);
      const sp=document.createElement('span');sp.textContent=' ';units.push(sp);i++}
    else{const sp=document.createElement('span');sp.textContent=w;units.push(sp);i++}}
  return units}
/* Golden Card / vendored engine text: turn canonical base^{exp} into real superscripts */
function enhanceDom(host){
  const w=document.createTreeWalker(host,NodeFilter.SHOW_TEXT,null);const hits=[];
  while(w.nextNode()){const n=w.currentNode;if(/\^\{/.test(n.nodeValue)&&!n.parentElement.closest('script,style'))hits.push(n)}
  hits.forEach(n=>{const f=document.createDocumentFragment();
    const b=document.createElement('bdi');b.dir='ltr';b.className='nb-math';supNodes(n.nodeValue,b);f.appendChild(b);n.replaceWith(f)})}
function speakable(t){
  return String(t||'').replace(/\^\{\s*(-?[^{}]+)\s*\}/g,' to the power $1 ')
    .replace(/×/g,' ضرب ').replace(/÷/g,' مقسوم على ').replace(/−/g,' سالب ')
    .replace(/=/g,' يساوي ').replace(/≠/g,' لا يساوي ').replace(/\s+/g,' ').trim()}

/* ---------- timing: every wait honours pause + speed ---------- */
async function wait(ms,id){
  if(FAST)return id===run;
  let t=0;
  while(t<ms){
    if(id!==run)return false;
    if(paused){await new Promise(r=>setTimeout(r,60));continue}
    await new Promise(r=>setTimeout(r,25));t+=25*speed}
  return id===run}
async function tick(id){
  while(paused&&id===run)await new Promise(r=>setTimeout(r,60));
  return id===run}

/* ---------- the one photorealistic hand ---------- */
function handAtClient(x,y){hand.style.left=x+'px';hand.style.top=y+'px';hand.classList.add('is-visible')}
function hideHand(){hand.classList.remove('is-visible');activeAnchor=null}
function tipOf(node,rtl){const r=node.getBoundingClientRect();return{x:rtl?r.left+4:r.right-4,y:r.top+Math.min(r.height*.7,30)}}
function placeHandAtNode(node,rtl){activeAnchor={node,rtl};const p=tipOf(node,rtl);handAtClient(p.x,p.y);return p}
function svgPoint(x,y){
  const p=svg.createSVGPoint();p.x=x;p.y=y;const m=svg.getScreenCTM();
  if(m){const q=p.matrixTransform(m);handAtClient(q.x,q.y)}}
function relayout(){ /* coordinates are recomputed from live rectangles after any layout change */
  if(activeAnchor&&activeAnchor.node.isConnected){const p=tipOf(activeAnchor.node,activeAnchor.rtl);handAtClient(p.x,p.y)}}
window.addEventListener('resize',relayout);
try{new ResizeObserver(relayout).observe(workspace)}catch(e){}
async function glide(from,to,id,ms){
  const n=8;
  for(let k=1;k<=n;k++){
    if(id!==run)return false;
    const t=k/n,e=t*t*(3-2*t);
    handAtClient(from.x+(to.x-from.x)*e,from.y+(to.y-from.y)*e);
    if(!await wait(ms/n,id))return false}
  return true}

/* ---------- SINGLE / DUAL board: one engine, switch without reload ---------- */
function setBoardMode(mode,opts){
  opts=opts||{};
  if(mode!=='single'&&mode!=='dual')mode='single';
  if(boardMode!==mode||opts.force){
    boardMode=mode;workspace.setAttribute('data-board-mode',mode);root.setAttribute('data-board-mode',mode);
    modeLog.push({mode,scene:index,at:Date.now()});
    /* writing, ink, hand, audio and progress are NOT touched: preserveState */
    requestAnimationFrame(relayout)}
  return boardMode}

/* ---------- Arabic speech fallback (browser TTS; not natural-audio certified) ---------- */
function arVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  return vs.find(v=>/^ar[-_]LB/i.test(v.lang))||vs.find(v=>/^ar/i.test(v.lang))||null}
function availableVoiceFor(lang){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const primary=lang==='fr'?'fr':lang==='en'?'en':'ar';
  return vs.find(v=>v.lang.toLowerCase().startsWith(primary+'-'))||vs.find(v=>v.lang.toLowerCase()===primary)||null;

  }else if(kind==='sas'){
    // AB=4cm, AC=3cm, included angle A=45deg.
    const C=[300+310*3/4*Math.cos(Math.PI/4),450-310*3/4*Math.sin(Math.PI/4)];
    await line(A,B);P(...A,'A');P(...B,'B');
    await arc(...A,52,-45,0);await line(A,C,'#d14c66');P(...C,'C');
    await line(C,B,'#21a69c');label('AB = 4 cm',405,482);label('AC = 3 cm',350,340);label('45°',363,429);
  }else if(kind==='sss'){
    // AB=5, AC=4, BC=3, 3-4-5 right triangle.
    const C=[300+310*16/25,450-310*12/25];
    await line(A,B);P(...A,'A');P(...B,'B');
    await arc(...A,310*4/5,-80,10);await arc(...B,310*3/5,160,270);
    await line(A,C,'#d14c66');await line(B,C,'#21a69c');P(...C,'C');
    label('5 cm',420,482);label('4 cm',370,310);label('3 cm',555,300);
  }
  return id===run;
}
/* REV4: diagram-board demonstrations for recall activities, drawn progressively. */
async function triangleTypes(id){
  ink.replaceChildren();
  const tri=[
    {p:[[195,325],[385,325],[290,150]],name:'Isosceles',color:'#1762aa',ticks:[0,2]},
    {p:[[425,325],[625,325],[525,152]],name:'Equilateral',color:'#159b7b',ticks:[0,1,2]},
    {p:[[680,325],[850,325],[680,155]],name:'Right triangle',color:'#d18a28',ticks:[]}
  ];
  for(let tix=0;tix<tri.length;tix++){
    const t=tri[tix];
    for(let j=0;j<3;j++)if(!await drawLine(...t.p[j],...t.p[(j+1)%3],t.color,id))return false;
    for(let j=0;j<3;j++){
      const v=t.p[j];label('ABC'[j],v[0]+(j===2?4:-12),v[1]-(j===2?14:-22),t.color);
    }
    // Equal-length sides are encoded with identical perpendicular hatch marks.
    for(let j of t.ticks){
      const a=t.p[j],b=t.p[(j+1)%3],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
      const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
      if(!await drawLine(mx-nx*10,my-ny*10,mx+nx*10,my+ny*10,'#b42e61',id))return false;
    }
    if(tix===1){label('60°',507,274,t.color);label('60°',440,308,t.color);label('60°',575,308,t.color)}
    if(tix===2){
      if(!await drawLine(680,299,706,299,'#b42e61',id))return false;
      if(!await drawLine(706,299,706,325,'#b42e61',id))return false;
      label('90°',715,292,t.color);
    }
    label(t.name,t.p[0][0],388,t.color);
  }
  label('AB = AC',205,430,'#1762aa');
  label('AB = BC = CA',430,430,'#159b7b');
  label('AB ⟂ AC',687,430,'#d18a28');
  return id===run;
}
async function congruenceCases(id,args){
  ink.replaceChildren();const k=(args&&args.case)||'SSS';
  const pairs=[[[225,325],[390,325],[305,155]],[[530,325],[695,325],[610,155]]];
  for(let n=0;n<2;n++){
    const p=pairs[n],c=n?'#159b7b':'#1762aa';
    for(let j=0;j<3;j++)if(!await drawLine(...p[j],...p[(j+1)%3],c,id))return false;
    for(let j=0;j<3;j++)label((n?'MNP':'ABC')[j],p[j][0]-12,p[j][1]-14,c);
    if(k==='ASA'||k==='SAS'){
      label(k==='ASA'?'∠B = ∠N':'∠B = ∠N',p[0][0]+12,p[0][1]-25,'#b42e61');
    }
    if(k==='SSS'){
      label('3 equal corresponding sides',p[0][0],390,c);
    }else label(k==='ASA'?'2 angles + included side':'2 sides + included angle',p[0][0],390,c);
  }
  label('△ABC ≅ △MNP  ('+k+')',290,465,'#1762aa');
  return id===run;
}
async function triangleElements(id){
  ink.replaceChildren();const A=[470,145],B=[250,480],C=[750,480],M=[500,480];
  for(const [p,q] of [[A,B],[B,C],[C,A]])if(!await drawLine(...p,...q,'#1762aa',id))return false;
  label('A',470,120);label('B',230,505);label('C',755,505);label('M',490,515);
  if(!await drawLine(...A,...M,'#d18a28',id))return false;

}
const DRAW={triangleTypes,triangleElements,congruenceCases,cubeOutline,cubeColor,cubeRotate,cubeUnfold,powerFactors,coordinatePlot,locusSketch,sourceFigure,verifiedConstruction};
async function doDraw(step,id){
  const fn=DRAW[step.draw];
  if(!fn)return true;
  if(step.clear!==false&&(step.draw==='cubeOutline'||step.draw==='cubeRotate'||step.draw==='cubeUnfold'||step.draw==='powerFactors'||step.draw==='locusSketch'))ink.replaceChildren();
  await fn(id,step.args||{});return id===run}

/* ---------- student checks and «I did not understand» ---------- */
function showCheck(check,id){
  return new Promise(resolve=>{
    studentWait=true;
    const box=document.createElement('div');box.className='nb-check';
    const q=document.createElement('p');q.dir=cur()==='ar'?'rtl':'ltr';q.textContent=tr(check.question);
    const inp=document.createElement('input');inp.type='text';inp.setAttribute('aria-label',tr(check.question));
    const ok=document.createElement('button');ok.type='button';ok.textContent=U().check||'Check';
    const fb=document.createElement('div');fb.className='nb-fb';fb.setAttribute('aria-live','polite');
    const go=document.createElement('button');go.type='button';go.textContent=U().understood||'Continue';
    box.append(q,inp,ok,fb,go);writing.appendChild(box);box.scrollIntoView({block:'nearest'});
    const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
    ok.onclick=()=>{fb.textContent=(norm(inp.value)&&norm(inp.value)===norm(check.expected))?tr(check.correct_feedback||'✓'):tr(check.wrong_feedback||U().try_again||'Try again.')};
    go.onclick=()=>{studentWait=false;resolve(id===run)};
    gotUnderstood=()=>{studentWait=false;resolve(id===run)}})}
function iDidNotUnderstand(){
  if(!started||studentWait)return;
  paused=true;try{speechSynthesis.pause()}catch(e){}
  playBtn.textContent=U().resume||'▶';
  const box=document.createElement('div');box.className='nb-lost';
  const p=document.createElement('p');p.textContent=U().lost_help||'';
  const again=document.createElement('button');again.type='button';again.textContent=U().repeat_scene||'Repeat';
  const go=document.createElement('button');go.type='button';go.id='nbUnderstood';go.textContent=U().understood||'Continue';
  box.append(p,again,document.createTextNode(' '),go);writing.appendChild(box);box.scrollIntoView({block:'nearest'});
  go.onclick=()=>{box.remove();resume()};
  again.onclick=()=>{box.remove();goTo(index)}}

/* ---------- lesson flow ---------- */
function relabel(){
  root.querySelectorAll('[data-nb-l]').forEach(n=>{const v=U()[n.dataset.nbL];if(v)n.textContent=v});
  voiceBtn.textContent=voice?(U().voice_on||'🔊'):(U().voice_off||'🔇');
  playBtn.textContent=(started&&!paused&&!finished)?(U().pause||'⏸'):(started&&paused?(U().resume||'▶'):(U().play||'▶'))}
function setStatus(){
  progEl.textContent=index<FINAL?((index+1)+' / '+FINAL):'✓';
  statusEl.textContent=paused?(U().paused||'Paused'):(U().playing||'')}
async function playScene(){
  const id=++run;paused=false;studentWait=false;finished=false;golden.classList.remove('on');workspace.style.display='';
  ink.replaceChildren();clearWriting();hideHand();stopSpeech();
  if(index>=FINAL){showFinal();return}
  relabel();
  const sc=SCENES[index];
  if(sc.steps.some(st=>st.t==='draw'))sc.start_mode='dual';
  headTitle.textContent=tr(sc.title||DATA.title);setStatus();playBtn.textContent=U().pause||'⏸';
  setBoardMode(sc.start_mode||'single');
  curStepNo=0;
  for(const step of sc.steps){
    if(id!==run)return;
    curStepNo++;
    if(step.t==='text'||step.t==='formula'){if(!await writeStep(step,id))return}
    else if(step.t==='draw'){setBoardMode('dual',{preserveState:true});await new Promise(r=>requestAnimationFrame(r));if(!await doDraw(step,id))return}
    else if(step.t==='mode'){setBoardMode(step.mode,{preserveState:true})}
    else if(step.t==='check'&&step.check){if(!await showCheck(step.check,id))return}
    if(!await wait(300,id))return}
  hideHand();
  if(!await wait(FAST?0:1800,id))return;
  if(id===run){if(window.NABIL_V6_QA_HOLD)return;index++;playScene()}}
function renderVerifiedSignedNumbersGolden(host){
  const panel=host.querySelector('.nabil-sci-visual');
  const stage=host.querySelector('.nabil-sci-stage');
  const rows=host.querySelector('.nabil-sci-rows');
  const summary=host.querySelector('.nabil-sci-final-b');
  if(!panel||!stage||!rows||!summary)throw new Error('GOLDEN_SIGN_RULES_HOST_MISSING');
  const h=panel.querySelector('h3');if(h)h.textContent='Signed numbers — Multiplication and division (pp.65–70)';
  rows.replaceChildren();
  const desc=document.createElement('div');desc.dir='rtl';
  desc.textContent='ضرب وقسمة الأعداد الموقعة: نضرب أو نقسم القيم المطلقة أولًا، ثم نضع إشارة موجبة عند تماثل الإشارتين، وسالبة عند اختلافهما. الضرب بصفر يعطي صفرًا، ولا تجوز القسمة على صفر.';
  desc.style.cssText='font-size:18px;line-height:1.9;color:#f5fbff;padding:12px';rows.appendChild(desc);
  stage.replaceChildren();
  const table=document.createElement('table');table.setAttribute('data-source-derived-sign-table','true');
  table.style.cssText='margin:20px auto;border-collapse:collapse;font-size:25px;background:#fff;color:#12324b;text-align:center;width:min(100%,500px)';
  [['× / ÷','+','−'],['+','+','−'],['−','−','+']].forEach((vals,i)=>{
    const tr=document.createElement('tr');vals.forEach((v,j)=>{const c=document.createElement(i===0||j===0?'th':'td');c.textContent=v;
      c.style.cssText='border:2px solid #3178a8;padding:15px;background:'+(i===0||j===0?'#dbefff':'#fff')+';font-weight:800';tr.appendChild(c)});table.appendChild(tr)});
  stage.appendChild(table);
  const cite=document.createElement('p');cite.textContent='Source: Student textbook pp.67–69. Sign table is a verified summary, not a new laboratory.';
  cite.style.cssText='color:#d6efff;font-size:13px;text-align:center';stage.appendChild(cite);
  summary.replaceChildren();const rule=document.createElement('div');rule.dir='rtl';
  rule.textContent='QA_PENDING_PARTIAL: تم شرح الصفحات 65–69 وحل التمارين 1–11 من الصفحة 70 وفق الدليل 38–39، مع تسجيل اختلاف التمرين 5. بقية أعمال الفصل 12–19 والتقييمات والمسائل والنشاط الختامي لم تُستكمل. لا يوجد تسجيل صوت طبيعي مدمج أو مزامنة صوت معتمدة، ولم يكتمل اختبار التشغيل المتواصل.';
  rule.style.cssText='font-size:17px;line-height:1.8;padding:12px;color:#fff';summary.appendChild(rule);
}
function showFinal(){
  index=FINAL;finished=true;root.classList.add('is-final');hideHand();stopSpeech();setBoardMode('single');
  headTitle.textContent=DATA.title;progEl.textContent='✓';
  workspace.style.display='none';golden.classList.add('on');golden.replaceChildren();
  const host=document.createElement('div');host.id='goldenReferenceCard';host.setAttribute('data-nabil-v18-golden','true');golden.appendChild(host);
  try{const g=Object.assign({},DATA.golden,{language:LANG,avatar_src:avatarUrl||''});
    (window.__NABIL_V18_CARDS||window.NABILScientificCards).fromLesson(g,host);enhanceDom(host);renderVerifiedSignedNumbersGolden(host)}catch(e){host.textContent=String(e)}
  playBtn.textContent=U().play||'▶';paused=true}
function stop(){run++;stopSpeech();hideHand();paused=false;playBtn.textContent=U().play||'▶'}
function goTo(i){if(!started){started=true;root.classList.add('nb-active')}stop();root.classList.remove('is-final');index=Math.max(0,Math.min(FINAL,i|0));paused=false;playScene()}
function pause(){if(!started||paused)return;paused=true;try{speechSynthesis.pause()}catch(e){}playBtn.textContent=U().resume||'▶';setStatus()}
function resume(){
  if(!started)return;
  paused=false;
  try{
    if(speechSynthesis.paused)speechSynthesis.resume();
    else if(voice&&lastText&&!speechSynthesis.speaking&&speaking){/* engine dropped the utterance: re-speak current step */ speakText(lastText,run)}
  }catch(e){}
  playBtn.textContent=U().pause||'⏸';setStatus()}
function begin(){
  started=true;root.classList.add('nb-active');
  try{const r=root.requestFullscreen&&root.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}
  /* the click is the user gesture that also unlocks speech on mobile browsers */
  try{if(voice&&!FAST){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  index=0;playScene()}
if(FAST)window.__NABIL_V6_TEST={goTo,sceneCount:FINAL,getIndex:()=>index};
startBtn.onclick=begin;avatarOpen.onclick=begin;
playBtn.onclick=()=>{if(!started){begin();return}if(finished){goTo(0);return}paused?resume():pause()};
prevBtn.onclick=()=>goTo(Math.max(0,index-1));
nextBtn.onclick=()=>goTo(Math.min(FINAL,index+1));
replayBtn.onclick=()=>goTo(0);
lostBtn.onclick=iDidNotUnderstand;
voiceBtn.onclick=()=>{voice=!voice;voiceBtn.textContent=voice?(U().voice_on||'🔊'):(U().voice_off||'🔇');
  voiceBtn.setAttribute('aria-pressed',String(voice));
  if(!voice)stopSpeech();else if(lastText&&started&&!paused)speakText(lastText,run);updateVoiceStatus()};
speedSel.onchange=()=>{speed=+speedSel.value};
voiceNote.querySelector('button').onclick=()=>{voiceNote.classList.remove('on');if(lastText)speakText(lastText,run)};
fsBtn.onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else root.requestFullscreen&&root.requestFullscreen().catch(()=>{})}catch(e){}};
exitBtn.onclick=()=>{stop();started=false;root.classList.remove('nb-active');try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!paused)pause()});

window.NABILWholeLessonOrchestrator={
  play(){if(!started)begin();else if(paused)resume();else if(finished)goTo(0)},
  pause,resume,stop,
  current(){return SCENES[index]||null},
  goTo,next(){goTo(Math.min(FINAL,index+1))},prev(){goTo(Math.max(0,index-1))},
  setBoardMode,
  modeLog:()=>modeLog.slice(),
  state(){return{index,paused,started,final:finished,boardMode,voice,speed,speaking,scenes:FINAL,studentWait,
    handVisible:hand.classList.contains('is-visible')}},
  finalIndex:FINAL};
window.NABILGoldenV6={version:'V6',boardMode:()=>boardMode,setBoardMode};
})();
