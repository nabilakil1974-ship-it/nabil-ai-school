<script>
(function(){
"use strict";
var DATA=%%DATA%%;
var NAMES={ar:"الأستاذ نبيل عقيل",en:"Ustaz Nabil Aqeel",fr:"Ustaz Nabil Aqeel"};
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var NS="http://www.w3.org/2000/svg";
var stage=$("#stage"),scale=1;
var PORTRAIT=false,SW=1672,SH=941;
function fit(){
  var w=window.innerWidth,h=window.innerHeight,pt=h>w*1.05;
  if(pt!==PORTRAIT||!stage.style.width){
    PORTRAIT=pt;SW=pt?900:1672;SH=pt?1800:941;
    stage.style.width=SW+"px";stage.style.height=SH+"px";stage.classList.toggle("portrait",pt);
    var cvs=$("#ink");if(cvs&&(cvs.width!==SW||cvs.height!==SH)){cvs.width=SW;cvs.height=SH;cvs.style.width=SW+"px";cvs.style.height=SH+"px";if(window.__repaint)window.__repaint()}
  }
  scale=Math.min(w/SW,h/SH);
  stage.style.left="0";stage.style.top="0";
  stage.style.transform="translate("+(w-SW*scale)/2+"px,"+(h-SH*scale)/2+"px) scale("+scale+")";
}
window.addEventListener("resize",fit);fit();
var QL=(location.search.match(/lang=(ar|en|fr)/)||[])[1];

var LANG=QL||DATA.lang||"ar",pi=0,ii=-1,voiceOn=true,playing=false,playTimer=null,target=[585,330],revealTimers=[];
var UI={en:{page:"Lesson map:",ex:"Problem",play:"Play the lesson",pause:"Pause the lesson"},ar:{page:"خريطة الدرس:",ex:"المسألة",play:"تشغيل الدرس",pause:"إيقاف مؤقت"},fr:{page:"Plan de la leçon :",ex:"Problème",play:"Lancer la leçon",pause:"Pause"}};
var VOICES={en:"en-US",ar:"ar-SA",fr:"fr-FR"};
function L(o){return (o&&(o[LANG]||o.en))||""}
function page(){return DATA.pages[pi]}

/* ---- build pieces ---- */
function buildMap(){
  var m=$("#map");m.innerHTML="";m.className=LANG==="ar"?"rtl":"";
  DATA.pages.forEach(function(p,i){
    var d=document.createElement("div");d.className="mi";d.dataset.i=i;
    d.innerHTML="<i>"+(i+1)+"</i><span></span>";d.lastChild.textContent=L(p.title);
    d.onclick=function(){stopPlay();gotoPage(i,true)};m.appendChild(d);
  });
}
function bundlesOf(p){
  if(p._b)return p._b;
  var b=[],pre=[],cur=null;
  p.items.forEach(function(x,idx){
    x._i=idx;
    if(x.k==="t"){cur={t:x,pre:pre,post:[]};b.push(cur);x._b=b.length-1;pre=[]}
    else if(cur)cur.post.push(x);else pre.push(x);
  });
  if(pre.length){if(b.length)b[0].pre=pre.concat(b[0].pre);else b.push({t:null,pre:pre,post:[]})}
  b.forEach(function(B){var all=B.pre.concat(B.post);B.draws=all.filter(function(x){return x.k==="d"});B.fs=all.filter(function(x){return x.k==="f"})});
  p._b=b;return b;
}
function renderPage(showAll,animateLast){
  var p=page();
  $("#title").textContent=L(p.title);
  $("#topic").innerHTML="";var tp=L(DATA.title);$("#topic").textContent=tp.length>34?tp.slice(0,32)+"…":tp;
  $("#pager").textContent=(pi+1)+" / "+DATA.pages.length;
  $("#sideh").textContent=UI[LANG].page;$("#ntxt").textContent=NAMES[LANG];
  $$(".mi").forEach(function(e,i){e.classList.toggle("cur",i===pi)});
  var cur=$(".mi.cur");if(cur&&cur.scrollIntoView){try{var mp=$("#map");mp.scrollTop=Math.max(0,cur.offsetTop-mp.offsetTop-90)}catch(e){}}
  var steps=$("#steps"),fm=$("#fm"),dr=$("#draw");
  steps.innerHTML="";fm.innerHTML="";dr.innerHTML="";dr.classList.remove("on");
  steps.className="abs"+(LANG==="ar"?" rtl":"");
  var hasDraw=p.items.some(function(x){return x.k==="d"}),hasF=p.items.some(function(x){return x.k==="f"});
  fm.classList.toggle("tall",!hasDraw);
  var tn=0;
  p.items.forEach(function(x,idx){
    if(x.k==="t"){tn++;
      var d=document.createElement("div");d.className="st";d.dataset.idx=idx;d.style.display="none";
      d.innerHTML='<div class="n">'+tn+'</div><div class="tx"></div>';
      var tx=d.lastChild;
      if(x.label){var lb=document.createElement("span");lb.className="lab";lb.textContent=x.label;tx.appendChild(lb)}
      var hw=document.createElement("span");hw.className="hw";L(x).split(/\s+/).filter(Boolean).forEach(function(w){var sp=document.createElement("span");sp.className="w";sp.textContent=w;hw.appendChild(sp);hw.appendChild(document.createTextNode(" "))});tx.appendChild(hw);
      d.onclick=function(){stopPlay();go(x._b)};
      steps.appendChild(d);
    }else if(x.k==="f"){
      var f=document.createElement("div");f.className="f";f.dataset.idx=idx;f.style.display="none";f.textContent=x.f;fm.appendChild(f);
    }
  });
  bundlesOf(p);
  if(showAll)ii=bundlesOf(p).length-1;
  applyUpTo(ii,animateLast);
}
var shownDraw=null;
function setDraw(x,hidden){
  var dr=$("#draw");
  if(shownDraw!==x||dr.innerHTML===""){
    dr.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+x.vb[0]+" "+x.vb[1]+'">'+x.svg+"</svg>";
    var svg=dr.querySelector("svg");if(svg){svg.setAttribute("preserveAspectRatio","xMidYMid meet");svg.removeAttribute("width");svg.removeAttribute("height")}
    shownDraw=x;
    (x.show||[]).forEach(function(id){var e=dr.querySelector("#"+id);if(e){e.style.opacity=hidden?0:1;e.style.transition="opacity .45s"}});
  }
  dr.classList.add("on");
}
function showIds(x,n){
  var dr=$("#draw"),ids=x.show||[];
  for(var k=0;k<ids.length;k++){var e=dr.querySelector("#"+ids[k]);if(e)e.style.opacity=k<n?1:0}
  if(n>0){var e2=dr.querySelector("#"+ids[Math.min(n,ids.length)-1]);
    if(e2){var r=e2.getBoundingClientRect(),sr=stage.getBoundingClientRect();target=[Math.min(790,(r.left+r.width/2-sr.left)/scale),(r.top+r.height/2-sr.top)/scale]}}
}
function clearDraw(){var dr=$("#draw");dr.innerHTML="";dr.classList.remove("on");shownDraw=null}
function progress(B,f){ /* drawings are revealed while the voice explains, then the formulas appear */
  var D=B.draws,F=B.fs,fm=$("#fm");
  if(D.length&&f>0){
    var q=Math.min(1,f/0.8)*D.length,di=Math.min(D.length-1,Math.floor(q)),fr=q>=D.length?1:q-di,x=D[di];
    setDraw(x,true);
    var ids=x.show||[];showIds(x,fr>=1?ids.length:Math.ceil(fr*ids.length));
  }
  F.forEach(function(fx,j){
    if(f>=0.7+0.3*j/F.length-1e-9){var e=fm.querySelector('[data-idx="'+fx._i+'"]');if(e&&e.style.display==="none"){e.style.display="block";void e.offsetWidth;e.classList.add("on");target=[770,655]}}
  });
}
function applyUpTo(k,animateLast){
  var p=page(),bs=bundlesOf(p),steps=$("#steps"),fm=$("#fm");
  var lastDraw=null,curEl=null,lastShown=null;
  for(var b=0;b<=k&&b<bs.length;b++){
    var B=bs[b],isCur=(b===k&&animateLast);
    if(B.t){var e=steps.querySelector('[data-idx="'+B.t._i+'"]');if(e){e.style.display="flex";e.classList.remove("cur","done");lastShown=e;if(b===k)curEl=e}}
    if(!isCur){
      B.fs.forEach(function(fx){var f=fm.querySelector('[data-idx="'+fx._i+'"]');if(f){f.style.display="block";f.classList.add("on")}});
      B.draws.forEach(function(d){lastDraw=d});
    }
  }
  $$(".st",steps).forEach(function(e){e.classList.remove("cur");if(e.style.display!=="none")e.classList.add("done")});
  var cur=curEl||lastShown;
  if(cur){cur.classList.add("cur");if(!(animateLast&&curEl))cur.classList.add("done");else cur.classList.remove("done");steps.scrollTop=cur.offsetTop-20}
  if(lastDraw)setDraw(lastDraw,false);else if(!(animateLast&&k>=0&&bs[k]&&bs[k].draws.length&&false))clearDraw();
  if(!animateLast&&lastDraw)showIds(lastDraw,(lastDraw.show||[]).length);
  target=[585,470];
  $("#navtxt").textContent=Math.max(k+1,0)+" / "+bs.length;
}
function go(k,speak){
  var p=page(),bs=bundlesOf(p);ii=Math.max(-1,Math.min(bs.length-1,k));
  renderPage(false,speak!==false);
  var B=ii>=0?bs[ii]:null;if(!B)return;
  if(speak===false)return;
  var el=B.t?$('#steps [data-idx="'+B.t._i+'"]'):null;
  var cb=function(){if(playing)schedule(500)};
  var est=B.t?0:Math.max(1800,B.draws.reduce(function(a,d){return a+(d.show||[]).length*480+600},0));
  narrate(B.t?L(B.t):"",el,cb,function(f){progress(B,f)},est);
}
function renderPageKeep(animate){renderPage(false,animate)}
function gotoPage(i,speak){
  pi=Math.max(0,Math.min(DATA.pages.length-1,i));ii=-1;renderPage(false,false);
  go(0,speak!==false);
}
function next(){
  var p=page();
  if(ii<bundlesOf(p).length-1)go(ii+1);
  else if(pi<DATA.pages.length-1)gotoPage(pi+1);
  else stopPlay();
}
function prev(){
  if(ii>0)go(ii-1,false);
  else if(pi>0){pi--;ii=-1;renderPage(true,false);go(bundlesOf(page()).length-1,false)}
}
$("#next").onclick=function(){stopPlay();next()};
$("#prev").onclick=function(){stopPlay();prev()};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "){e.preventDefault();stopPlay();next()}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){stopPlay();prev()}
});

/* voice + play : the writing is revealed word by word while the voice speaks it */
var narTok=0,narTimer=null,SUPPORT=false;
try{SUPPORT=!!window.speechSynthesis&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){}
var MW={en:{"−":" minus ","+":" plus ","×":" times ","·":" times ","÷":" divided by ","=":" equals ","→":" gives ","✓":" correct ","≈":" approximately "},
        ar:{"−":" ناقص ","+":" زائد ","×":" ضرب ","·":" ضرب ","÷":" تقسيم ","=":" يساوي ","→":" يعطي ","✓":" صحيح ","≈":" يساوي تقريبًا "},
        fr:{"−":" moins ","+":" plus ","×":" fois ","·":" fois ","÷":" divisé par ","=":" égale ","→":" donne ","✓":" juste ","≈":" environ "}};
function mathSpeech(f){var m=MW[LANG];return f.replace(/[−+×·÷=→✓≈]/g,function(c){return m[c]||c}).replace(/\s+/g," ")}
function chunksOf(text){
  var parts=text.match(/[^.!?؟؛:]+[.!?؟؛:]*\s*/g)||[text],out=[],cur="";
  parts.forEach(function(p){if(cur&&(cur+p).length>170){out.push(cur);cur=p}else cur+=p});
  if(cur)out.push(cur);
  return out.join("")===text?out:[text];
}
function narStop(){narTok++;clearInterval(narTimer);speaking=false;try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
function narrate(text,el,onDone,onProg,estO){
  narStop();var tok=narTok;
  var words=el?$$(".w",el):[],starts=[],pos=0;
  words.forEach(function(w){var i=text.indexOf(w.textContent,pos);if(i<0)i=pos;starts.push(i);pos=i+w.textContent.length});
  function reveal(n,f){for(var i=0;i<words.length;i++)words[i].classList.toggle("on",i<n);if(onProg)onProg(f!=null?f:(words.length?n/words.length:0))}
  var done=false;
  function finish(){if(tok!==narTok||done)return;done=true;clearInterval(narTimer);reveal(words.length,1);speaking=false;if(onDone)onDone()}
  reveal(0,0);speaking=true;
  var est=estO||Math.max(1400,text.length*(LANG==="ar"?80:68)),t0=Date.now(),gotB=false,started=false;
  narTimer=setInterval(function(){if(tok!==narTok||gotB)return;var f0=Math.min(1,(Date.now()-t0)/est);reveal(Math.ceil(f0*words.length),f0)},100);
  if(!text||!(voiceOn&&SUPPORT)){setTimeout(finish,est+400);return}
  var ch=chunksOf(text),ci=0,base=0;
  function speakNext(){
    if(tok!==narTok)return;
    if(ci>=ch.length){finish();return}
    var u=new SpeechSynthesisUtterance(ch[ci]),off=base,len=ch[ci].length;
    u.lang=VOICES[LANG];u.rate=.95;
    u.onstart=function(){started=true};
    u.onboundary=function(e){
      if(tok!==narTok)return;gotB=true;var c=off+(e.charIndex||0),n=0;
      for(var i=0;i<starts.length;i++){if(starts[i]<=c+1)n=i+1}
      reveal(n,words.length?n/words.length:0);
    };
    u.onend=function(){if(tok!==narTok)return;ci++;base+=len;speakNext()};
    u.onerror=function(e){if(tok!==narTok)return;setTimeout(finish,300)};
    try{window.speechSynthesis.speak(u)}catch(e){setTimeout(finish,est)}
  }
  try{window.speechSynthesis.cancel()}catch(e){}
  setTimeout(speakNext,60);
  setTimeout(function(){ /* voice never started: keep the timed writing and move on */
    if(tok===narTok&&!started&&!done){try{window.speechSynthesis.cancel()}catch(e){}tok=++narTok;var t1=Date.now();narTimer=setInterval(function(){var f=Math.min(1,(Date.now()-t1)/est);reveal(Math.ceil(f*words.length),f);if(f>=1){clearInterval(narTimer);reveal(words.length,1);speaking=false;if(!done){done=true;if(onDone)onDone()}}},100)}
  },3500);
}
function schedule(ms){
  clearTimeout(playTimer);
  playTimer=setTimeout(function(){
    if(!playing)return;
    var p=page();
    if(pi>=DATA.pages.length-1&&ii>=bundlesOf(p).length-1){stopPlay();return}
    next();
  },ms);
}
function startPlay(){
  playing=true;closePops();$("#side").classList.remove("show");$("#bigplay").textContent="❚❚";$("#mPlay").textContent="❚❚  "+UI[LANG].pause;
  go(Math.max(ii,0),true);
}
function stopPlay(){$("#bigplay").textContent="▶";playing=false;clearTimeout(playTimer);narStop();$("#mPlay").textContent="▶  "+UI[LANG].play}

/* ---- teacher ---- */
var T=$("#teacher");
%%TEACHER%%

%%INK%%

$$("[data-lang]").forEach(function(b){b.onclick=function(){stopPlay();LANG=b.dataset.lang;closePops();buildMap();renderPage(false,false);$("#mPlay").textContent="▶  "+UI[LANG].play}});

var bgs=[["","Navy"],["bg-grid","Grid"],["bg-black","Black"],["bg-green","Chalkboard"]],bi=0;
$("#bBg").onclick=function(){
  closePops();stage.classList.remove(bgs[bi][0]||"x");bi=(bi+1)%bgs.length;if(bgs[bi][0])stage.classList.add(bgs[bi][0]);
  var m=$("#bgmsg");m.textContent="Background: "+bgs[bi][1];m.style.opacity=1;setTimeout(function(){m.style.opacity=0},1200);
