name: Apply Golden normal registration
on:
  push:
    paths:
      - '.github/workflows/apply-golden-normal-registration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Claude Golden migration
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/main.py'); s=p.read_text()
          anchor='# ==========================================================\n# PostgreSQL extensions'
          imp='from app.services import golden_catalogue\n\n\n'
          if imp not in s:
              s=s.replace(anchor, imp+anchor, 1)
          route_anchor='# ==========================================================\n# API routers\n# ==========================================================\n\n'
          reg='app.include_router(golden_catalogue.build_router(), prefix="/api", tags=["golden-catalogue"])\n\n'
          pos=s.find(route_anchor, s.find('app = FastAPI'))
          if pos < 0: raise SystemExit('runtime API router anchor missing')
          insert=pos+len(route_anchor)
          if reg not in s:
              s=s[:insert]+reg+s[insert:]
          s=s.replace('/static/curriculum_strict.js?v=138','/static/curriculum_strict.js?v=139')
          s=s.replace('/static/nabil_drive_prepared_lesson_v1.js?v=7','/static/nabil_drive_prepared_lesson_v1.js?v=8')
          p.write_text(s)
      - name: Retire duplicate chat catalogue route if present
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/api/routes_chat.py'); s=p.read_text()
          old='@router.get("/curriculum/lessons")\n'
          if old in s:
              s=s.replace(old, '# RETIRED: canonical Golden catalogue is registered in app/main.py\n', 1)
              p.write_text(s)
      - name: Validate and commit
        run: |
          python -m py_compile app/main.py app/services/golden_catalogue.py app/api/routes_chat.py scripts/golden_runtime_bridge.py scripts/start_server_golden.py
          grep -q 'golden_catalogue.build_router()' app/main.py
          grep -q 'curriculum_strict.js?v=139' app/main.py
          grep -q 'nabil_drive_prepared_lesson_v1.js?v=8' app/main.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/api/routes_chat.py
          git diff --cached --quiet || git commit -m 'Register canonical Golden routes normally'
          git push
