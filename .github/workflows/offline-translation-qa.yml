name: Offline Translation QA
on:
  push:
    branches:
      - fix/powers-english-only-no-translation
  pull_request:
    paths:
      - 'scripts/nabil_factory/offline_translation.py'
      - 'scripts/test_offline_translation.py'
      - 'requirements-offline-translation.txt'
jobs:
  offline-translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pure HTML parser dependency
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Compile
        run: python -m py_compile scripts/nabil_factory/offline_translation.py scripts/test_offline_translation.py
      - name: Math and language safety tests
        run: python -m scripts.test_offline_translation
