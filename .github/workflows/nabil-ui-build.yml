name: NABIL UI Build

on:
  push:
    paths:
      - app/main.py
      - app/api/routes_chat.py
      - app/static/nabil_open_tutor_v1.js
      - app/static/nabil_learning_v132.js
      - app/static/nabil_reference_theme.css
      - scripts/test_ui_integration.py
      - scripts/test_drawing_payload_recovery.py
      - scripts/test_open_tutor_sphere.cjs
      - scripts/test_home_lesson_navigation.cjs
      - scripts/test_tutor_contract.py
      - .github/workflows/nabil-ui-build.yml
  workflow_dispatch:

jobs:
  static-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax build
        run: python -m py_compile app/main.py app/api/routes_chat.py scripts/test_ui_integration.py scripts/test_tutor_contract.py scripts/validate_nabil_ui.py scripts/test_drawing_payload_recovery.py
      - name: JavaScript syntax build
        run: |
          node --check app/static/nabil_open_tutor_v1.js
          node --check app/static/nabil_learning_v132.js
          node --check app/static/nabil_voice_v133.js
      - name: Static owner contract validator
        run: python -m scripts.validate_nabil_ui
      - name: Runtime drawing-protocol and sphere regressions
        run: python -m scripts.test_drawing_payload_recovery
      - name: Runtime sphere SVG renderer regression
        run: node scripts/test_open_tutor_sphere.cjs
      - name: Real home and lesson navigation regression
        run: node scripts/test_home_lesson_navigation.cjs
      - name: HTML assembly and user requirements regression
        run: python -m scripts.test_ui_integration
      - name: Natural multilingual tutor and figure-only regressions
        run: python -m scripts.test_tutor_contract
