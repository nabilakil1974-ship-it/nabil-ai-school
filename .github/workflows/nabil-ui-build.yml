name: NABIL UI Build

on:
  push:
    paths:
      - app/main.py
      - app/static/nabil_secondary_physics_lab.html
      - app/static/nabil_labs.html
      - app/static/nabil_universal_language_v1.js
      - app/api/routes_chat.py
      - app/core/lesson_output_guard.py
      - app/core/lesson_quality.py
      - app/core/textbook_page_citations.py
      - app/api/routes_textbook_pages.py
      - app/services/rag_search.py
      - app/services/lesson_cache.py
      - app/core/lesson_cache_contract.py
      - scripts/test_book_first_lesson_cache.py
      - app/static/nabil_book_first_preview_v1.js
      - scripts/test_textbook_page_grounding.py
      - scripts/test_textbook_page_requests.py
      - scripts/test_direct_book_page_start.py
      - scripts/test_nonblocking_lesson_generation.py
      - app/services/textbook_page_request.py
      - scripts/test_textbook_exercises_source_contract.py
      - scripts/test_universal_lesson_quality.py
      - scripts/test_chemistry_lesson_output_guard.py
      - app/static/nabil_ionic_diagram_fix.js
      - app/static/nabil_open_tutor_v1.js
      - app/static/nabil_learning_v132.js
      - app/static/nabil_reference_theme.css
      - scripts/test_ui_integration.py
      - scripts/test_drawing_payload_recovery.py
      - scripts/test_open_tutor_sphere.cjs
      - scripts/test_home_lesson_navigation.cjs
      - scripts/test_lesson_avatar_layout.cjs
      - scripts/test_tutor_contract.py
      - .github/workflows/nabil-ui-build.yml
  pull_request:
    paths:
      - app/main.py
      - app/static/nabil_secondary_physics_lab.html
      - app/static/nabil_labs.html
      - app/static/nabil_universal_language_v1.js
      - app/api/routes_chat.py
      - app/core/lesson_output_guard.py
      - app/core/lesson_quality.py
      - app/core/textbook_page_citations.py
      - app/api/routes_textbook_pages.py
      - app/services/rag_search.py
      - app/services/lesson_cache.py
      - app/core/lesson_cache_contract.py
      - scripts/test_book_first_lesson_cache.py
      - app/static/nabil_book_first_preview_v1.js
      - scripts/test_textbook_page_grounding.py
      - scripts/test_textbook_page_requests.py
      - scripts/test_direct_book_page_start.py
      - scripts/test_nonblocking_lesson_generation.py
      - app/services/textbook_page_request.py
      - scripts/test_textbook_exercises_source_contract.py
      - scripts/test_universal_lesson_quality.py
      - scripts/test_chemistry_lesson_output_guard.py
      - app/static/nabil_ionic_diagram_fix.js
      - app/static/nabil_open_tutor_v1.js
      - app/static/nabil_learning_v132.js
      - app/static/nabil_reference_theme.css
      - scripts/test_ui_integration.py
      - scripts/test_drawing_payload_recovery.py
      - scripts/test_open_tutor_sphere.cjs
      - scripts/test_home_lesson_navigation.cjs
      - scripts/test_lesson_avatar_layout.cjs
      - scripts/test_tutor_contract.py
      - .github/workflows/nabil-ui-build.yml
  workflow_dispatch:

jobs:
  static-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax build
        run: python -m py_compile app/main.py app/api/routes_chat.py scripts/test_ui_integration.py scripts/test_tutor_contract.py scripts/validate_nabil_ui.py scripts/test_drawing_payload_recovery.py app/api/routes_textbook_pages.py app/core/textbook_page_citations.py app/services/rag_search.py app/services/lesson_cache.py app/services/textbook_page_request.py scripts/test_textbook_page_requests.py
      - name: JavaScript syntax build
        run: |
          node --check app/static/nabil_open_tutor_v1.js
          node --check app/static/nabil_learning_v132.js
          node --check app/static/nabil_voice_v133.js
          node --check app/static/nabil_book_first_preview_v1.js
          node --check app/static/nabil_universal_language_v1.js
          node -e 'const fs=require("fs"),vm=require("vm");const h=fs.readFileSync("app/static/nabil_secondary_physics_lab.html","utf8");const js=h.split("<script>")[1]?.split("</script>")[0];if(!js)throw Error("secondary physics lab script missing");new vm.Script(js);for(const key of ["tabLens","tabProjectile","tabRC","setMode","lang"])if(!h.includes(key))throw Error("physics lab missing "+key);'
          node -e 'const fs=require("fs"),vm=require("vm");const html=fs.readFileSync("app/static/nabil_labs.html","utf8");if(!html.includes("<script>")||!html.includes("</script>"))throw Error("labs script missing");new vm.Script(html.split("<script>")[1].split("</script>")[0]);for(const x of ["pointLabel(mx,my", "mode==="])if(!html.includes(x))throw Error("labs missing: "+x);'
      - name: Nonblocking textbook lesson AI regression
        run: python -m scripts.test_nonblocking_lesson_generation
      - name: Direct official-book printed-page start regressions
        run: python -m scripts.test_direct_book_page_start
      - name: Book-first lesson cache and figure fallback regressions
        run: python -m scripts.test_book_first_lesson_cache
      - name: Official-book exercise priority contract
        run: python -m scripts.test_textbook_exercises_source_contract
      - name: Verified textbook page and figure fallback regression
        run: python -m scripts.test_textbook_page_grounding
      - name: Exact printed book-page routing regression
        run: python -m scripts.test_textbook_page_requests
      - name: Universal lesson quality regressions
        run: python -m scripts.test_universal_lesson_quality
      - name: Chemistry Ionic Bond content regression
        run: python -m scripts.test_chemistry_lesson_output_guard
      - name: Static owner contract validator
        run: python -m scripts.validate_nabil_ui
      - name: Runtime drawing-protocol and sphere regressions
        run: python -m scripts.test_drawing_payload_recovery
      - name: Runtime sphere SVG renderer regression
        run: node scripts/test_open_tutor_sphere.cjs
      - name: Real home and lesson navigation regression
        run: node scripts/test_home_lesson_navigation.cjs
      - name: Real structured lesson avatar fit regression
        run: node scripts/test_lesson_avatar_layout.cjs
      - name: HTML assembly and user requirements regression
        run: python -m scripts.test_ui_integration
      - name: Natural multilingual tutor and figure-only regressions
        run: python -m scripts.test_tutor_contract
