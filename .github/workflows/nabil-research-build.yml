name: NABIL Research Build

on:
  push:
    paths:
      - app/api/routes_research.py
      - app/services/research_docx_notes.py
      - app/static/nabil_research_v1.js
      - app/main.py
      - scripts/test_research_workspace.py
      - requirements.txt
      - .github/workflows/nabil-research-build.yml
  pull_request:
    paths:
      - app/api/routes_research.py
      - app/services/research_docx_notes.py
      - app/static/nabil_research_v1.js
      - app/main.py
      - scripts/test_research_workspace.py
      - requirements.txt
      - .github/workflows/nabil-research-build.yml
  workflow_dispatch:

jobs:
  research-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install document package
        run: python -m pip install python-docx==1.1.2
      - name: Backend syntax
        run: python -m py_compile app/api/routes_research.py app/services/research_docx_notes.py app/main.py scripts/test_research_workspace.py
      - name: Frontend syntax
        run: node --check app/static/nabil_research_v1.js
      - name: Export and research regression
        run: python -m scripts.test_research_workspace
