name: NABIL Factory Core Smoke

on:
  push:
    paths:
      - "scripts/nabil_lesson_factory.py"
      - "scripts/nabil_i18n.py"
      - "scripts/nabil_interactive_lab.py"
      - "scripts/nabil_quiz_engine.py"
      - "app/static/nabil_scientific_solution_cards_e2e.js"
      - "app/static/nabil_lesson_e2e_runtime_v1.js"
      - ".github/workflows/nabil_factory_core_smoke.yml"
  workflow_dispatch:

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile real factory modules
        run: |
          python -m py_compile             scripts/nabil_i18n.py             scripts/nabil_interactive_lab.py             scripts/nabil_quiz_engine.py             scripts/nabil_lesson_factory.py

      - name: Validate approved E2E JavaScript
        run: |
          node --check app/static/nabil_scientific_solution_cards_e2e.js
          node --check app/static/nabil_lesson_e2e_runtime_v1.js

      - name: Import and exercise enrichment engines
        run: |
          python - <<'PY'
          from scripts.nabil_i18n import resolve_lang_code, narrative_language_instruction
          from scripts.nabil_interactive_lab import render_verified_lab
          from scripts.nabil_quiz_engine import build_full_quiz_items, render_quiz_html
          import scripts.nabil_lesson_factory as factory

          assert resolve_lang_code("Arabic") == "ar"
          assert "Modern Standard Arabic" in narrative_language_instruction("ar")

          # Test-only fixture: verifies renderer behavior, never production evidence.
          spec = {
              "supported": True,
              "kind": "FORMULA_CALCULATOR",
              "title": "Fixture",
              "instructions": "Enter values",
              "observation": "Fixture observation",
              "evidence_ref": "C01",
              "formula": {"output": "y", "input_a": "a", "input_b": "b", "operator": "+"},
          }
          lab_html, active = render_verified_lab(spec, "en", "C01")
          assert active
          assert 'type="number"' in lab_html
          assert 'type="range"' not in lab_html
          assert ' min=' not in lab_html and ' max=' not in lab_html

          activities = [{
              "activity_num": "01",
              "concept_id": "C01",
              "source_page": 1,
              "conclusion": "fixture",
              "student_question": {
                  "q": "Fixture?",
                  "options": ["A", "B", "C"],
                  "correct_index": 0,
              },
          }]
          items = build_full_quiz_items(activities)
          quiz_html = render_quiz_html(items, "en")
          assert len(items) == len(activities)
          assert 'id="fullQuizBlock"' in quiz_html

          for required in (
              "build_evidence_map",
              "synthesize_universal_pedagogy",
              "run_all_quality_gates",
              "independent_scientific_review",
              "build_verified_lab_spec",
              "build_factory_solution_card_spec",
              "produce_lesson_for_entry",
          ):
              assert hasattr(factory, required), required

          source = factory.Path(factory.__file__).read_text(encoding="utf-8")
          assert "nabil_scientific_solution_cards_e2e.js?v=3" in source
          assert "nabil_lesson_e2e_runtime_v1.js?v=1" in source
          assert "data-nabil-solution-card" in source
          assert "LAB_FAKE_NUMERIC_RANGE_FORBIDDEN" in source

          print("NABIL_FACTORY_CORE_SMOKE_OK")
          PY
