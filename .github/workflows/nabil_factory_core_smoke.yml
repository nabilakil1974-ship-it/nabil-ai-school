      - name: Build verified E2E upload manifest
        if: success()
        run: |
          {
            echo "NABIL AI END-TO-END LABS BUNDLE"
            echo "commit=$(git rev-parse HEAD)"
            echo "workflow=NABIL Factory Core Smoke"
            echo "status=PASS"
            echo
            echo "FILES:"
            sha256sum \
              scripts/nabil_lesson_factory.py \
              scripts/nabil_interactive_lab.py \
              scripts/nabil_advanced_lab.py \
              scripts/nabil_geometry_lab.py \
              scripts/nabil_scientific_lab_coverage.py \
              scripts/nabil_i18n.py \
              scripts/nabil_quiz_engine.py \
              app/api/routes_smart_labs.py \
              app/api/routes_interactive_lessons.py \
              app/api/routes_chat.py \
              app/static/nabil_smart_lab_bridge_v1.js \
              app/static/nabil_book_first_preview_v1.js \
              app/static/nabil_browser_tts_v1.js \
              app/static/nabil_lesson_e2e_runtime_v1.js \
              app/static/nabil_scientific_solution_cards_e2e.js \
              app/static/nabil_reference_theme.css \
              app/main.py \
              .github/workflows/nabil_factory_core_smoke.yml
          } > NABIL_E2E_MANIFEST.txt

      - name: Build exact full-repository ZIP from tested commit
        if: success()
        id: package
        run: |
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          ZIP_NAME="NABIL_AI_END_TO_END_${SHORT_SHA}.zip"
          git archive --format=zip --output "${ZIP_NAME}" HEAD
          zip -q -u "${ZIP_NAME}" NABIL_E2E_MANIFEST.txt
          sha256sum "${ZIP_NAME}" > NABIL_E2E_ZIP_SHA256.txt
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload verified full-repository ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NABIL_E2E_LABS_END_TO_END
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ steps.package.outputs.zip_name }}
            NABIL_E2E_ZIP_SHA256.txt
