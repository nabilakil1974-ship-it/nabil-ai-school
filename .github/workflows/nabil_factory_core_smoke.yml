name: NABIL Factory Core Smoke

on:
  push:
    paths:
      - "scripts/nabil_lesson_factory.py"
      - "scripts/nabil_i18n.py"
      - "scripts/nabil_interactive_lab.py"
      - "scripts/nabil_advanced_lab.py"
      - "scripts/nabil_scientific_lab_coverage.py"
      - "scripts/test_nabil_scientific_lab_coverage.py"
      - "scripts/nabil_geometry_lab.py"
      - "scripts/nabil_quiz_engine.py"
      - "app/static/nabil_scientific_solution_cards_e2e.js"
      - "app/static/nabil_browser_tts_v1.js"
      - "app/static/nabil_lesson_e2e_runtime_v1.js"
      - "app/static/nabil_smart_lab_bridge_v1.js"
      - "app/static/nabil_book_first_preview_v1.js"
      - "app/static/nabil_reference_theme.css"
      - "app/api/routes_smart_labs.py"
      - "app/api/routes_chat.py"
      - "app/api/routes_interactive_lessons.py"
      - "app/main.py"
      - ".github/workflows/nabil_factory_core_smoke.yml"
  workflow_dispatch:

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile real factory modules
        run: |
          python -m py_compile \
            scripts/nabil_i18n.py \
            scripts/nabil_advanced_lab.py \
            scripts/nabil_scientific_lab_coverage.py \
            scripts/test_nabil_scientific_lab_coverage.py \
            scripts/nabil_geometry_lab.py \
            scripts/nabil_interactive_lab.py \
            scripts/nabil_quiz_engine.py \
            scripts/nabil_lesson_factory.py \
            app/api/routes_smart_labs.py \
            app/api/routes_interactive_lessons.py \
            app/main.py

      - name: Run grades 1-12 scientific lab coverage matrix
        run: |
          python scripts/test_nabil_scientific_lab_coverage.py
          python scripts/test_v1781_transient_resilience.py

      - name: Validate approved E2E JavaScript
        run: |
          node --check app/static/nabil_browser_tts_v1.js
          node --check app/static/nabil_scientific_solution_cards_e2e.js
          node --check app/static/nabil_lesson_e2e_runtime_v1.js
          node --check app/static/nabil_smart_lab_bridge_v1.js

      - name: Import and exercise enrichment engines
        run: |
          python - <<'PY'
          from scripts.nabil_i18n import resolve_lang_code, narrative_language_instruction
          from scripts.nabil_interactive_lab import render_verified_lab
          from scripts.nabil_advanced_lab import validate_advanced_lab_spec
          from scripts.nabil_geometry_lab import validate_geometry_proof_spec
          from scripts.nabil_quiz_engine import build_full_quiz_items, render_quiz_html
          import scripts.nabil_lesson_factory as factory

          assert resolve_lang_code("Arabic") == "ar"
          assert "Modern Standard Arabic" in narrative_language_instruction("ar")

          # Every verified lab now requires a real teacher_script.  These helpers are
          # test-only evidence-locked fixtures; production still gets scripts from
          # the factory and remains fail-closed.
          def fixture_teacher(ref, first_target, second_target, quote="Verified fixture evidence"):
              return [
                  {
                      "say": "Observe the verified element.",
                      "target_ids": [first_target],
                      "action": "point",
                      "state_before": {},
                      "state_after": {},
                      "scientific_constraints": ["fixture_evidence_only"],
                      "evidence_quote": quote,
                  },
                  {
                      "say": "Conclude only from the verified evidence.",
                      "target_ids": [second_target],
                      "action": "conclude",
                      "state_before": {},
                      "state_after": {},
                      "scientific_constraints": ["fixture_evidence_only"],
                      "evidence_quote": quote,
                  },
              ]

          # Test-only fixture: verifies renderer behavior, never production evidence.
          spec = {
              "supported": True,
              "kind": "FORMULA_CALCULATOR",
              "title": "Fixture",
              "instructions": "Enter values",
              "observation": "Fixture observation",
              "evidence_ref": "C01",
              "teacher_script": fixture_teacher("C01", "C01_a", "C01_result"),
              "formula": {"output": "y", "input_a": "a", "input_b": "b", "operator": "+"},
          }
          lab_html, active = render_verified_lab(spec, "en", "C01")
          assert active
          assert 'data-teacher-pointer="sentence-synced"' in lab_html
          assert 'type="number"' in lab_html
          assert 'type="range"' not in lab_html
          assert ' min=' not in lab_html and ' max=' not in lab_html

          orientation_spec = {
              "supported": True,
              "kind": "ORIENTATION_INVARIANT",
              "title": "Orientation fixture",
              "instructions": "Drag the vessel.",
              "observation": "Fixture observation",
              "evidence_ref": "C05",
              "teacher_script": fixture_teacher("C05", "C05_grab", "C05_invariant"),
              "invariant_orientation": "horizontal",
          }
          orientation_html, active = render_verified_lab(orientation_spec, "en", "C05")
          assert active
          assert "pointerdown" in orientation_html and "pointermove" in orientation_html
          assert "angleText" not in orientation_html
          assert "0°" not in orientation_html

          # Malformed provider JSON must be retried from the original request,
          # never silently "repaired" into possibly altered textbook wording.
          original_llm = factory.execute_llm_completion
          original_keys = factory._provider_keys
          original_auth = factory._vision_provider_authorized
          original_env_provider = __import__("os").environ.get("NABIL_FACTORY_AI_PROVIDER")
          malformed_then_valid = iter([
              '{"exercises":[{"number":1,"exact_source_prompt":"bad "quote""}]}',
              '{"exercises":[]}',
          ])
          provider_calls = []
          def fake_llm(*args, **kwargs):
              provider_calls.append(kwargs.get("preferred_provider_override"))
              return next(malformed_then_valid)
          factory.execute_llm_completion = fake_llm
          factory._provider_keys = lambda: {
              "openrouter": "x", "openai": "y", "groq": "z"}
          factory._vision_provider_authorized = lambda *args, **kwargs: True
          __import__("os").environ["NABIL_FACTORY_AI_PROVIDER"] = "openrouter"
          retry_payload = factory._execute_llm_json_strict(
              "fixture",
              image_base64="fixture",
              vision_context={"lesson_id":"L","book_id":"B","pdf_page":1},
              purpose="smoke_invalid_json",
              max_attempts=2)
          assert retry_payload == {"exercises": []}
          assert provider_calls == ["openrouter", "openai"], provider_calls
          assert hasattr(factory, "_rescue_unverified_exercise")
          source_text = factory.Path(factory.__file__).read_text(encoding="utf-8")
          assert "excluded_providers=malformed_providers" in source_text
          assert 'NABIL_FACTORY_MAX_ALL_PROVIDER_WAIT_SECONDS", "60"' in source_text
          assert "EXERCISE_TARGETED_RESCUE_ACCEPTED" in source_text
          assert "SKIPPED_UNVERIFIED_EXERCISE" in source_text
          assert factory.required_ai_practice_count(0) == 3
          assert factory.required_ai_practice_count(1) == 3
          assert factory.required_ai_practice_count(2) == 3
          assert factory.required_ai_practice_count(3) == 0
          assert factory.required_ai_practice_count(5) == 0
          source_text = factory.Path(factory.__file__).read_text(encoding="utf-8")
          assert "plausible from general knowledge" in source_text
          assert "scope_snapshot_sha256" in source_text
          assert "DELETE-FIRST source-grounding auditor" in source_text
          assert "LAB_UNIVERSAL_EVIDENCE_REVEAL_FALLBACK" in source_text
          assert "LAB_REQUIRED_FOR_EVERY_CONCEPT" in source_text
          assert "STUDENT_SOURCE_SCAN_FORBIDDEN" in source_text
          assert "NABIL_EXPLANATORY_REDRAW_FROM_LOCKED_EVIDENCE" in source_text
          assert "REFERENCE_CARD_CONCEPT_COVERAGE_INCOMPLETE" in source_text
          assert "SKIPPED_UNVERIFIED_SOURCE_FIGURE" in source_text
          assert "Skip exercise when its required source figure is unverified" not in source_text
          assert "SOURCE_FIGURE_REQUIRED_COVERAGE_INCOMPLETE" in source_text
          assert "AI_RECONSTRUCTED_DIAGRAM_FROM_VERIFIED_TEXT" in source_text
          assert "TEXT_DIAGRAM_RECONSTRUCTION_ACCEPTED" in source_text
          assert "TEXT_DIAGRAM_RECONSTRUCTION_NOT_POSSIBLE" in source_text
          assert "reconstructed_diagram_verified" in source_text
          assert "OPTIONAL_SOURCE_FIGURE_SKIPPED" in source_text
          assert "REMOVED_OUT_OF_SCOPE_GENERATED_CONTENT" in source_text
          assert "SOURCE_PAGE_LOCAL_OCR_SELECTED" in source_text
          assert "EXERCISE_SECTION_BOUNDARY_LOCKED" in source_text
          assert "LESSON_CONCEPT_LEAKED_FROM_EXERCISE_SECTION" in source_text
          assert "source_section_kind" in source_text
          assert "REMOVED_OUT_OF_SCOPE_SOLUTION_STEP" in source_text
          assert "SKIPPED_UNVERIFIED_EXERCISE_SOLUTION" in source_text
          assert "SOLUTION_SOURCE_SCOPE_AUDIT_MISSING" in source_text
          assert "exercise_solution_" in source_text
          assert "exercise_solution_audit_" in source_text
          assert "[BLANK]" in source_text
          assert "blank_count" in source_text
          assert "EXERCISE_PAGE_HIGHRES_RESCUE_ACCEPTED" in source_text
          assert "exercise_scan_highres_rescue_p" in source_text
          assert "EXERCISE_REVIEW_SCHEMA_RETRY_REQUIRED" in source_text
          assert "exercise_review_schema_retry_p" in source_text
          assert "PILOT_PUBLISH_PROHIBITED" not in source_text
          assert "--allow-pilot-publish" not in source_text
          assert "EXERCISE_REVIEW_SCHEMA_INCOMPLETE" in source_text
          assert "blank_count_mismatch" in source_text
          assert "final_answer_complete" in source_text
          assert "no_unrequested_actions" in source_text
          assert "TEXTBOOK_EXERCISE_EVIDENCE" in source_text
          assert "PRE_SOLVE_STATUS_INVALID" in source_text
          assert "SKIPPED_UNVERIFIED_QUIZ_ITEM" in source_text
          assert "GENERATED_CONTENT_SCOPE_AUDIT_MISSING" in source_text
          assert "EXERCISE_SEQUENCE_INCOMPLETE" not in source_text
          assert "EXERCISE_NUMBERING_INVALID" in source_text
          factory.execute_llm_completion = original_llm
          factory._provider_keys = original_keys
          factory._vision_provider_authorized = original_auth
          if original_env_provider is None:
              __import__("os").environ.pop("NABIL_FACTORY_AI_PROVIDER", None)
          else:
              __import__("os").environ["NABIL_FACTORY_AI_PROVIDER"] = original_env_provider

          shape_spec = {
              "supported": True,
              "kind": "SHAPE_RESPONSE",
              "title": "Shape fixture",
              "instructions": "Drag material.",
              "observation": "Fixture observation",
              "evidence_ref": "C06",
              "teacher_script": fixture_teacher("C06", "C06_matter", "C06_dropB"),
              "behavior": "conforms",
          }
          shape_html, active = render_verified_lab(shape_spec, "en", "C06")
          assert active
          assert "pointerdown" in shape_html and "pointermove" in shape_html
          assert "dropB" in shape_html

          reveal_spec = {
              "supported": True,
              "kind": "EVIDENCE_REVEAL",
              "title": "Universal fixture",
              "instructions": "Explore.",
              "observation": "Verified only.",
              "evidence_ref": "C07",
              "teacher_script": fixture_teacher(
                  "C07", "C07_item_0", "C07_item_0", "Verified idea"),
              "items": [{"label": "Idea", "evidence_quote": "Verified idea"}],
          }
          reveal_html, active = render_verified_lab(reveal_spec, "en", "C07")
          assert active
          assert 'data-lab-kind="EVIDENCE_REVEAL"' in reveal_html
          assert "nabil-reveal-item" in reveal_html
          assert "nabil:demo" in reveal_html

          # Advanced science fixtures verify deterministic invariants and the
          # synchronized teacher pointer. These are test fixtures, not lesson evidence.
          circuit_spec = {
              "supported": True,
              "kind": "DC_SERIES_CIRCUIT",
              "title": "Series circuit fixture",
              "instructions": "Inspect the switch and circuit.",
              "observation": "Fixture observation",
              "evidence_ref": "C02",
              "teacher_script": [
                  {
                      "say": "First close the switch.",
                      "target_ids": ["C02_switch"],
                      "action": "set_state",
                      "state_before": {"switch_closed": False},
                      "state_after": {"switch_closed": True},
                      "scientific_constraints": ["open_switch_zero_current"],
                      "evidence_quote": "Open switch means zero current.",
                  },
                  {
                      "say": "With the switch closed, current can flow through the series path.",
                      "target_ids": ["C02_current"],
                      "action": "observe",
                      "state_before": {"switch_closed": True},
                      "state_after": {"switch_closed": True},
                      "scientific_constraints": ["series_same_current", "ohms_law"],
                      "evidence_quote": "Closed series circuit carries the same current.",
                  },
              ],
              "resistors": ["R1", "R2"],
              "switch_control": True,
              "rules": {
                  "series_resistance_sum": True,
                  "series_same_current": True,
                  "ohms_law": True,
                  "open_switch_zero_current": True,
              },
          }
          circuit_html, active = render_verified_lab(circuit_spec, "en", "C02")
          assert active
          assert 'data-teacher-pointer="synced"' in circuit_html
          assert "OPEN_CIRCUIT_ZERO_CURRENT" in circuit_html
          assert "switchClosed?V/Rt:0" in circuit_html

          optics_spec = {
              "supported": True,
              "kind": "OPTICS_REFLECTION",
              "title": "Reflection fixture",
              "instructions": "Drag the source.",
              "observation": "Fixture observation",
              "evidence_ref": "C03",
              "teacher_script": fixture_teacher(
                  "C03", "C03_normal", "C03_reflected",
                  "Angles are measured from the normal and incidence equals reflection."),
              "angles_measured_from_normal": True,
              "normal_perpendicular_surface": True,
              "law": "angle_of_incidence_equals_angle_of_reflection",
          }
          optics_html, active = render_verified_lab(optics_spec, "en", "C03")
          assert active
          assert 'data-angle-reference="normal"' in optics_html
          assert "I_EQUALS_R" in optics_html
          assert 'data-teacher-pointer="synced"' in optics_html

          ionic_spec = {
              "supported": True,
              "kind": "IONIC_COMPOUND",
              "title": "MgCl2 fixture",
              "instructions": "Observe electron transfer.",
              "observation": "Fixture observation",
              "evidence_ref": "C04",
              "teacher_script": fixture_teacher(
                  "C04", "C04_cation", "C04_formula",
                  "The verified ion ratio is charge neutral."),
              "cation": {"symbol": "Mg", "charge": 2},
              "anion": {"symbol": "Cl", "charge": -1},
              "cation_ratio": 1,
              "anion_ratio": 2,
              "electron_transfer_count": 2,
              "bond_type": "ionic",
          }
          validate_advanced_lab_spec(ionic_spec)
          ionic_html, active = render_verified_lab(ionic_spec, "en", "C04")
          assert active
          assert 'data-charge-neutral="true"' in ionic_html
          assert "MgCl2" in ionic_html
          assert 'data-teacher-pointer="synced"' in ionic_html

          invalid_ionic = dict(ionic_spec)
          invalid_ionic["anion_ratio"] = 1
          try:
              validate_advanced_lab_spec(invalid_ionic)
              raise AssertionError("invalid ionic ratio must fail")
          except RuntimeError:
              pass

          geometry_spec = {
              "supported": True,
              "kind": "GEOMETRY_PROOF",
              "title": "Geometry proof fixture",
              "instructions": "Follow the proof.",
              "observation": "Only verified relations are marked.",
              "evidence_ref": "C08",
              "teacher_script": fixture_teacher(
                  "C08", "equal_sides", "right_m",
                  "The proof uses only the verified marked relations."),
              "points": [
                  {"label": "A", "x": 18, "y": 72},
                  {"label": "B", "x": 82, "y": 72},
                  {"label": "C", "x": 50, "y": 18},
                  {"label": "M", "x": 50, "y": 72},
              ],
              "segments": [
                  {"id": "AC", "a": "A", "b": "C"},
                  {"id": "BC", "a": "B", "b": "C"},
                  {"id": "AM", "a": "A", "b": "M"},
                  {"id": "MB", "a": "M", "b": "B"},
                  {"id": "CM", "a": "C", "b": "M"},
              ],
              "marks": [
                  {"id": "equal_sides", "type": "equal_segments",
                   "targets": ["AC", "BC"], "style_index": 1,
                   "evidence_quote": "AC = BC"},
                  {"id": "midpoint_parts", "type": "midpoint",
                   "targets": ["AM", "MB"], "style_index": 2,
                   "evidence_quote": "AM = MB"},
                  {"id": "right_m", "type": "perpendicular",
                   "angles": [{"a": "C", "vertex": "M", "b": "A"}],
                   "evidence_quote": "CM is perpendicular to AB"},
              ],
              "proof_steps": [
                  {"title": "Equal sides", "text": "Mark AC and BC equal.",
                   "formula": "AC = BC", "target_ids": ["equal_sides"],
                   "reveal_marks": ["equal_sides"], "evidence_quote": "AC = BC"},
                  {"title": "Midpoint", "text": "Mark AM and MB equal.",
                   "formula": "AM = MB", "target_ids": ["midpoint_parts"],
                   "reveal_marks": ["equal_sides", "midpoint_parts"],
                   "evidence_quote": "AM = MB"},
                  {"title": "Perpendicular", "text": "Show the right-angle square.",
                   "formula": "CM ⟂ AB", "target_ids": ["right_m"],
                   "reveal_marks": ["equal_sides", "midpoint_parts", "right_m"],
                   "evidence_quote": "CM is perpendicular to AB"},
              ],
          }
          validate_geometry_proof_spec(geometry_spec)
          geometry_html, active = render_verified_lab(
              geometry_spec, "en", "C08")
          assert active
          assert 'data-lab-kind="GEOMETRY_PROOF"' in geometry_html
          assert 'data-proof-marks="evidence-gated"' in geometry_html
          assert "geo-mark" in geometry_html
          assert "teacherArrow" in geometry_html
          assert "equal_segments" in geometry_html
          assert "perpendicular" in geometry_html

          # Teaching engine: subject/topic and secondary-year depth are
          # pedagogical metadata only; all science remains evidence-locked.
          math_concept = {
              "concept_id": "C-MATH",
              "title": "Study of a function",
              "raw_text": "Study the derivative and variation of the function.",
              "source_page": 1,
          }
          for grade, stage in ((10, "first_secondary"),
                               (11, "second_secondary"),
                               (12, "third_secondary")):
              prof = {
                  "subject": "mathematics", "language": "en",
                  "level": "L3", "grade": grade,
              }
              sig = factory.resolve_teaching_signature(math_concept, prof)
              assert sig["mode"] == "functions"
              assert sig["secondary_year_contract"]["stage"] == stage
              assert sig["autonomous_teacher"] is True
              assert sig["human_teacher_required"] is False

          physics_sig = factory.resolve_teaching_signature(
              {"concept_id": "P", "title": "Electric circuit",
               "raw_text": "current voltage resistance", "source_page": 1},
              {"subject": "physics", "language": "en",
               "level": "L3", "grade": 11})
          assert physics_sig["mode"] == "electricity"

          narrative = {
              "phenomenon": "Look at the verified graph.",
              "investigation": "Try the verified relation.",
              "observation": "Notice the variation.",
              "interpretation": "Explain the relation.",
              "conclusion": "State the verified conclusion.",
          }
          teaching_steps = factory.build_teaching_steps(
              math_concept, narrative,
              {"subject": "mathematics", "language": "en",
               "level": "L3", "grade": 12})
          assert len(teaching_steps) == 5
          assert all(x["lab_key"] == "concept:C-MATH" for x in teaching_steps)
          assert all(x["evidence"]["concept_id"] == "C-MATH"
                     for x in teaching_steps)

          factory._assert_formal_arabic_text(
              "لنلاحظ المعطيات ثم نستنتج القاعدة.", purpose="fixture")
          try:
              factory._assert_formal_arabic_text(
                  "هلق منشوف شو بدنا نعمل.", purpose="fixture_bad")
              raise AssertionError("colloquial Arabic must fail closed")
          except RuntimeError as exc:
              assert "FORMAL_ARABIC_REQUIRED" in str(exc)

          activities = [{
              "activity_num": "01",
              "concept_id": "C01",
              "source_page": 1,
              "conclusion": "fixture",
              "student_question": {
                  "q": "Fixture?",
                  "options": ["A", "B", "C"],
                  "correct_index": 0,
              },
          }]
          items = build_full_quiz_items(activities)
          quiz_html = render_quiz_html(items, "en")
          assert len(items) == len(activities)
          assert 'id="fullQuizBlock"' in quiz_html
          activities_with_omission = activities + [{
              "activity_num": "02",
              "concept_id": "C02",
              "source_page": 1,
              "conclusion": "",
              "student_question": None,
          }]
          omitted_items = build_full_quiz_items(activities_with_omission)
          assert len(omitted_items) == 1
          assert render_quiz_html([], "en") == ""

          for required in (
              "build_evidence_map",
              "synthesize_universal_pedagogy",
              "run_all_quality_gates",
              "independent_scientific_review",
              "build_verified_lab_spec",
              "build_factory_solution_card_spec",
              "produce_lesson_for_entry",
          ):
              assert hasattr(factory, required), required

          source = factory.Path(factory.__file__).read_text(encoding="utf-8")
          assert "nabil_scientific_solution_cards_e2e.js?v=4" in source
          assert "nabil_lesson_e2e_runtime_v1.js?v=4" in source
          assert "nabil_browser_tts_v1.js?v=1" in source
          assert "data-nabil-solution-card" in source
          assert "LAB_FAKE_NUMERIC_RANGE_FORBIDDEN" in source
          assert "REFERENCE_RENDERER_CONTRACT" in source
          assert "EXERCISE_SOLUTION_LAB_LINKAGE_INCOMPLETE" in source
          assert "STUDENT_SOURCE_RASTER_UI_FORBIDDEN" in source
          assert "REFERENCE_MOBILE_VIEWPORT = (390, 844)" in source
          assert "SCIENTIFIC_SOLUTION_CARD_LAB_KEY_MISSING" in source
          assert "nabil-prebuilt-lab-index/v2" in source
          assert "TEACHING_ENGINE_PROFILES" in source
          assert "SUBJECT_TEACHING_ENGINES" in source
          assert "resolve_teaching_signature" in source
          assert "WHOLE_LESSON_SMART_LAB_MISSING" in source
          assert "GEOMETRY_PROOF" in source
          assert "FULL_PAGE_TRANSLATION_INCOMPLETE" in source
          assert "build_trilingual_page_translation" in source
          assert "build_teaching_steps" in source
          assert "TEACHING_ENGINE_SEQUENCE_INCOMPLETE" in source
          assert "GEOMETRY_VISUAL_PROOF_MARKS_MISSING" in source
          assert "FORMAL_ARABIC_TEACHING_FAILED" in source
          assert "BROWSER_TTS_CONTRACT_NOT_WIRED" in source
          assert "BROWSER_TTS_CONTRACT_INVALID" in source
          assert "SECONDARY_YEAR_TEACHING" in source
          assert "_subject_teaching_mode" in source

          # Translation shell is tested without network/provider access.
          original_translate = factory._translate_strings_batch
          try:
              def fake_translate(values, source_lang, target_lang, purpose):
                  prefix = {"ar": "AR ", "en": "EN ", "fr": "FR "}[target_lang]
                  return {v: prefix + v for v in values}
              factory._translate_strings_batch = fake_translate
              translated_html, translated_report = factory.build_trilingual_page_translation(
                  "<!doctype html><html><body><h1>Lesson title</h1>"
                  "<button>Explain this concept</button></body></html>",
                  "en", "fixture_translation")
          finally:
              factory._translate_strings_batch = original_translate
          assert translated_report["complete"] is True
          assert translated_report["languages"] == ["ar", "en", "fr"]
          assert 'id="nabilPageLanguage"' in translated_html
          assert 'id="nabilPageTranslationBundle"' in translated_html
          assert 'data-nabil-lang="ar"' in translated_html
          assert 'data-nabil-lang="fr"' in translated_html
          assert 'data-nabil-translation-complete="true"' in translated_html

          print("NABIL_FACTORY_CORE_SMOKE_OK")
          PY

      - name: Runtime smoke prebuilt indexed labs
        run: |
          python - <<'PY'
          import scripts.nabil_lesson_factory as factory

          entry = {
              "lesson_id": "TEST-L1",
              "canonical_title": "Fixture Lesson",
              "language": "en",
              "subject": "physics",
              "grade": 7,
              "book_id": "B",
              "pdf_start_page": 1,
