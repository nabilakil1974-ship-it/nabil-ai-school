name: NABIL Factory Core Smoke

on:
  push:
    paths:
      - "scripts/nabil_lesson_factory.py"
      - "scripts/nabil_i18n.py"
      - "scripts/nabil_interactive_lab.py"
      - "scripts/nabil_advanced_lab.py"
      - "scripts/nabil_quiz_engine.py"
      - "app/static/nabil_scientific_solution_cards_e2e.js"
      - "app/static/nabil_lesson_e2e_runtime_v1.js"
      - ".github/workflows/nabil_factory_core_smoke.yml"
  workflow_dispatch:

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile real factory modules
        run: |
          python -m py_compile             scripts/nabil_i18n.py             scripts/nabil_advanced_lab.py             scripts/nabil_interactive_lab.py             scripts/nabil_quiz_engine.py             scripts/nabil_lesson_factory.py

      - name: Validate approved E2E JavaScript
        run: |
          node --check app/static/nabil_scientific_solution_cards_e2e.js
          node --check app/static/nabil_lesson_e2e_runtime_v1.js

      - name: Import and exercise enrichment engines
        run: |
          python - <<'PY'
          from scripts.nabil_i18n import resolve_lang_code, narrative_language_instruction
          from scripts.nabil_interactive_lab import render_verified_lab
          from scripts.nabil_advanced_lab import validate_advanced_lab_spec
          from scripts.nabil_quiz_engine import build_full_quiz_items, render_quiz_html
          import scripts.nabil_lesson_factory as factory

          assert resolve_lang_code("Arabic") == "ar"
          assert "Modern Standard Arabic" in narrative_language_instruction("ar")

          # Test-only fixture: verifies renderer behavior, never production evidence.
          spec = {
              "supported": True,
              "kind": "FORMULA_CALCULATOR",
              "title": "Fixture",
              "instructions": "Enter values",
              "observation": "Fixture observation",
              "evidence_ref": "C01",
              "formula": {"output": "y", "input_a": "a", "input_b": "b", "operator": "+"},
          }
          lab_html, active = render_verified_lab(spec, "en", "C01")
          assert active
          assert 'type="number"' in lab_html
          assert 'type="range"' not in lab_html
          assert ' min=' not in lab_html and ' max=' not in lab_html

          orientation_spec = {
              "supported": True,
              "kind": "ORIENTATION_INVARIANT",
              "title": "Orientation fixture",
              "instructions": "Drag the vessel.",
              "observation": "Fixture observation",
              "evidence_ref": "C05",
              "invariant_orientation": "horizontal",
          }
          orientation_html, active = render_verified_lab(orientation_spec, "en", "C05")
          assert active
          assert "pointerdown" in orientation_html and "pointermove" in orientation_html
          assert "angleText" not in orientation_html
          assert "0°" not in orientation_html

          # Malformed provider JSON must be retried from the original request,
          # never silently "repaired" into possibly altered textbook wording.
          original_llm = factory.execute_llm_completion
          original_keys = factory._provider_keys
          original_auth = factory._vision_provider_authorized
          original_env_provider = __import__("os").environ.get("NABIL_FACTORY_AI_PROVIDER")
          malformed_then_valid = iter([
              '{"exercises":[{"number":1,"exact_source_prompt":"bad "quote""}]}',
              '{"exercises":[]}',
          ])
          provider_calls = []
          def fake_llm(*args, **kwargs):
              provider_calls.append(kwargs.get("preferred_provider_override"))
              return next(malformed_then_valid)
          factory.execute_llm_completion = fake_llm
          factory._provider_keys = lambda: {
              "openrouter": "x", "openai": "y", "groq": "z"}
          factory._vision_provider_authorized = lambda *args, **kwargs: True
          __import__("os").environ["NABIL_FACTORY_AI_PROVIDER"] = "openrouter"
          retry_payload = factory._execute_llm_json_strict(
              "fixture",
              image_base64="fixture",
              vision_context={"lesson_id":"L","book_id":"B","pdf_page":1},
              purpose="smoke_invalid_json",
              max_attempts=2)
          assert retry_payload == {"exercises": []}
          assert provider_calls == ["openrouter", "openai"], provider_calls
          assert hasattr(factory, "_rescue_unverified_exercise")
          source_text = factory.Path(factory.__file__).read_text(encoding="utf-8")
          assert "excluded_providers=malformed_providers" in source_text
          assert "EXERCISE_TARGETED_RESCUE_ACCEPTED" in source_text
          assert "SKIPPED_UNVERIFIED_EXERCISE" in source_text
          assert factory.required_ai_practice_count(0) == 3
          assert factory.required_ai_practice_count(1) == 2
          assert factory.required_ai_practice_count(2) == 1
          assert factory.required_ai_practice_count(3) == 0
          assert factory.required_ai_practice_count(5) == 0
          assert "EXERCISE_SEQUENCE_INCOMPLETE" not in source_text
          assert "EXERCISE_NUMBERING_INVALID" in source_text
          factory.execute_llm_completion = original_llm
          factory._provider_keys = original_keys
          factory._vision_provider_authorized = original_auth
          if original_env_provider is None:
              __import__("os").environ.pop("NABIL_FACTORY_AI_PROVIDER", None)
          else:
              __import__("os").environ["NABIL_FACTORY_AI_PROVIDER"] = original_env_provider

          shape_spec = {
              "supported": True,
              "kind": "SHAPE_RESPONSE",
              "title": "Shape fixture",
              "instructions": "Drag material.",
              "observation": "Fixture observation",
              "evidence_ref": "C06",
              "behavior": "conforms",
          }
          shape_html, active = render_verified_lab(shape_spec, "en", "C06")
          assert active
          assert "pointerdown" in shape_html and "pointermove" in shape_html
          assert "dropB" in shape_html

          # Advanced science fixtures verify deterministic invariants and the
          # synchronized teacher pointer. These are test fixtures, not lesson evidence.
          circuit_spec = {
              "supported": True,
              "kind": "DC_SERIES_CIRCUIT",
              "title": "Series circuit fixture",
              "instructions": "Inspect the switch and circuit.",
              "observation": "Fixture observation",
              "evidence_ref": "C02",
              "resistors": ["R1", "R2"],
              "switch_control": True,
              "rules": {
                  "series_resistance_sum": True,
                  "series_same_current": True,
                  "ohms_law": True,
                  "open_switch_zero_current": True,
              },
          }
          circuit_html, active = render_verified_lab(circuit_spec, "en", "C02")
          assert active
          assert 'data-teacher-pointer="synced"' in circuit_html
          assert "OPEN_CIRCUIT_ZERO_CURRENT" in circuit_html
          assert "switchClosed?V/Rt:0" in circuit_html

          optics_spec = {
              "supported": True,
              "kind": "OPTICS_REFLECTION",
              "title": "Reflection fixture",
              "instructions": "Drag the source.",
              "observation": "Fixture observation",
              "evidence_ref": "C03",
              "angles_measured_from_normal": True,
              "normal_perpendicular_surface": True,
              "law": "angle_of_incidence_equals_angle_of_reflection",
          }
          optics_html, active = render_verified_lab(optics_spec, "en", "C03")
          assert active
          assert 'data-angle-reference="normal"' in optics_html
          assert "I_EQUALS_R" in optics_html
          assert 'data-teacher-pointer="synced"' in optics_html

          ionic_spec = {
              "supported": True,
              "kind": "IONIC_COMPOUND",
              "title": "MgCl2 fixture",
              "instructions": "Observe electron transfer.",
              "observation": "Fixture observation",
              "evidence_ref": "C04",
              "cation": {"symbol": "Mg", "charge": 2},
              "anion": {"symbol": "Cl", "charge": -1},
              "cation_ratio": 1,
              "anion_ratio": 2,
              "electron_transfer_count": 2,
              "bond_type": "ionic",
          }
          validate_advanced_lab_spec(ionic_spec)
          ionic_html, active = render_verified_lab(ionic_spec, "en", "C04")
          assert active
          assert 'data-charge-neutral="true"' in ionic_html
          assert "MgCl2" in ionic_html
          assert 'data-teacher-pointer="synced"' in ionic_html

          invalid_ionic = dict(ionic_spec)
          invalid_ionic["anion_ratio"] = 1
          try:
              validate_advanced_lab_spec(invalid_ionic)
              raise AssertionError("invalid ionic ratio must fail")
          except RuntimeError:
              pass

          activities = [{
              "activity_num": "01",
              "concept_id": "C01",
              "source_page": 1,
              "conclusion": "fixture",
              "student_question": {
                  "q": "Fixture?",
                  "options": ["A", "B", "C"],
                  "correct_index": 0,
              },
          }]
          items = build_full_quiz_items(activities)
          quiz_html = render_quiz_html(items, "en")
          assert len(items) == len(activities)
          assert 'id="fullQuizBlock"' in quiz_html

          for required in (
              "build_evidence_map",
              "synthesize_universal_pedagogy",
              "run_all_quality_gates",
              "independent_scientific_review",
              "build_verified_lab_spec",
              "build_factory_solution_card_spec",
              "produce_lesson_for_entry",
          ):
              assert hasattr(factory, required), required

          source = factory.Path(factory.__file__).read_text(encoding="utf-8")
          assert "nabil_scientific_solution_cards_e2e.js?v=3" in source
          assert "nabil_lesson_e2e_runtime_v1.js?v=1" in source
          assert "data-nabil-solution-card" in source
          assert "LAB_FAKE_NUMERIC_RANGE_FORBIDDEN" in source

          print("NABIL_FACTORY_CORE_SMOKE_OK")
          PY
