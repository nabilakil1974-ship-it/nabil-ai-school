name: NABIL Competitions isolated checks
on:
  push:
    branches: [feature/nabil-competitions]
    paths:
      - 'competitions/**'
      - 'app/main.py'
      - '.github/workflows/competitions-check.yml'
  pull_request:
    paths:
      - 'competitions/**'
      - 'app/main.py'
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r competitions/requirements.txt
      - run: python -m py_compile competitions/routes.py competitions/server.py competitions/offline_generator.py competitions/gs_benchmark.py competitions/exam_archive.py competitions/math_blueprints.py app/main.py
      - run: |
          python - <<'PY'
          from competitions.routes import GRADE_TOPICS, GenerateRequest, _validate_selection
          from competitions.offline_generator import build_offline_assessment, _family
          from competitions.math_blueprints import get_blueprint
          from competitions.routes import router, _archive_context
          from competitions import exam_archive
          paths = {route.path for route in router.routes}
          assert _archive_context(GenerateRequest(grade='g7', lessons=['Powers'], language='en')) == []
          assert '/competitions/analytics/visit' in paths
          assert '/competitions/analytics/summary' in paths
          assert '/competitions/archive/status' in paths
          assert '/competitions/archive/search' in paths
          assert '/competitions/archive/documents' in paths
          assert '/competitions/archive/documents/{document_id}' in paths
          assert '/competitions/archive/documents' in paths
          assert exam_archive.list_archive(limit=10)['total'] == 0
          assert '/competitions/archive/sync' in paths
          assert '/competitions/archive/documents' in paths
          assert exam_archive._classify('رياضيات انكليزي - علوم عامة - دورة 2 - 2019')['grade'] == 'Terminale GS'
          assert exam_archive._classify('رياضيات انكليزي - علوم عامة - دورة 2 - 2019')['subject'] == 'Mathematics'
          assert exam_archive._classify('رياضيات انكليزي - علوم عامة - دورة 2 - 2019')['session'] == 'Session 2'
          assert exam_archive._classify('الشهادة المتوسطة - رياضيات فرنسي - 2022 - العادية')['grade'] == 'Brevet'
          from bs4 import BeautifulSoup
          anchor = BeautifulSoup('<table><tr><td>رياضيات - انكليزي - علوم عامة - دورة 2 - 2019</td><td><a href="/files/exam.pdf">PDF</a></td></tr></table>', 'html.parser').find('a')
          row_title, is_math = exam_archive._anchor_exam_title(anchor)
          assert is_math and 'علوم عامة' in row_title and row_title != 'PDF'
          assert exam_archive._classify('أسس التصحيح - رياضيات - علوم عامة - 2024')['subject'] == 'Mathematics'
          assert exam_archive._search_normalise('Dérivées') == 'derivees'
          assert 'derivees' in exam_archive.SEARCH_SYNONYMS['derivatives']
          assert exam_archive._safe_url('https://www.crdp.org/sites/default/files/sample.pdf')
          assert exam_archive.list_archive(limit=5)['total'] == 0
          assert not exam_archive._safe_url('https://example.com/sample.pdf')
          assert len(GRADE_TOPICS) == 9
          missing_blueprints = [(grade, topic) for grade, topics in GRADE_TOPICS.items() for topic in topics if get_blueprint(topic) is None]
          assert not missing_blueprints, f"Missing local math teaching blueprints: {missing_blueprints}"
          _validate_selection(GenerateRequest(grade='g7', lessons=['Powers'], language='en'))
          try:
              _validate_selection(GenerateRequest(grade='g7', lessons=['Complex Numbers'], language='en'))
          except Exception:
              pass
          else:
              raise AssertionError('Cross-grade/unknown lesson was accepted')
          try:
              _validate_selection(GenerateRequest(grade='g9', lessons=['Probability'], language='en'))
          except Exception:
              pass
          else:
              raise AssertionError('Grade 9 probability must be rejected')
          # Offline coverage is explicit: do not invent generic questions for unsupported Terminale GS topics.
          gs_supported = ['Quadratic Equations', 'Signs of Quadratic Functions',
                          'Limits of Functions at Infinity', 'Limits of a Function at a Point',
                          'Derivatives', 'Functions', 'Permutations', 'Probability I', 'Probability II',
                          'Orthogonality', 'Vectors and Coordinate Systems', 'Sequences',
                          'Trigonometric Equations', 'Trigonometric Formulas', 'Circle',
                          'Scalar Product', 'Antiderivatives', 'Complex Numbers', 'Statistics']
          for grade, topics in GRADE_TOPICS.items():
              if grade == 'terminal_gs':
                  for topic in gs_supported:
                      for language in ('en', 'fr'):
                          one = build_offline_assessment(GenerateRequest(grade=grade, lessons=[topic], language=language))
                          assert one['questions'][0]['lesson'] == topic
                          assert one['solutions'][0]['final_answer']
                  for topic in set(topics) - set(gs_supported):
                      try:
                          build_offline_assessment(GenerateRequest(grade=grade, lessons=[topic], language='en'))
                      except ValueError as exc:
                          assert 'No validated offline Terminale GS question template' in str(exc)
                      else:
                          raise AssertionError(f'Unsupported Terminale GS topic was not blocked: {topic}')
                  continue
              req = GenerateRequest(grade=grade, lessons=topics, language='en', total_marks=20)
              result = build_offline_assessment(req)
              assert len(result['questions']) == len(topics), (grade, len(result['questions']), len(topics))
              assert len(result['solutions']) == len(topics)
              assert len(result['rubric']) == len(topics)
              assert all(q.get('pedagogical_blueprint', {}).get('observable_skills') for q in result['questions'])
              assert round(sum(float(q['marks']) for q in result['questions']), 2) == 20
              for topic in topics:
                  one = build_offline_assessment(GenerateRequest(grade=grade, lessons=[topic], language='fr'))
                  assert one['questions'][0]['lesson'] == topic
                  assert one['solutions'][0]['final_answer']
          assert _family('Antiderivatives') == 'antiderivative'
          anti = build_offline_assessment(GenerateRequest(grade='terminal_gs', lessons=['Antiderivatives'], language='en'))
          assert 'antiderivative' in anti['questions'][0]['statement'].lower()
          assert "f′(x)" not in anti['questions'][0]['statement']
          # Benchmark: identical four Terminale GS lessons, language and 20-mark scale.
          benchmark = ['Derivatives', 'Probability I', 'Vectors and Coordinate Systems', 'Statistics']
          for language in ('en', 'fr'):
              result = build_offline_assessment(GenerateRequest(grade='terminal_gs', lessons=benchmark, language=language, total_marks=20))
              assert [q['lesson'] for q in result['questions']] == benchmark
              assert round(sum(float(q['marks']) for q in result['questions']), 2) == 20
              for q, rubric in zip(result['questions'], result['rubric']):
                  assert q['parts'] and round(sum(float(p['marks']) for p in q['parts']), 2) == float(q['marks'])
                  assert round(sum(float(c['marks']) for c in rubric['criteria']), 2) == float(rubric['total'])
              assert len(result['solutions']) == 4
          stats = build_offline_assessment(GenerateRequest(grade='terminal_gs', lessons=['Statistics'], language='en'))
          assert stats['questions'][0]['table']['headers'] == ['Number of books (x)', 'Frequency (n)']
          assert len(stats['questions'][0]['table']['rows']) == 4
          vectors = build_offline_assessment(GenerateRequest(grade='terminal_gs', lessons=['Vectors and Coordinate Systems'], language='en'))
          assert vectors['questions'][0]['diagram']['points'] == [{'label':'A','x':-1,'y':2},{'label':'B','x':3,'y':5}]
          # One-lesson selection must scale its parts and rubric to the requested 20 marks.
          one = build_offline_assessment(GenerateRequest(grade='terminal_gs', lessons=['Derivatives'], language='en', total_marks=20))
          assert round(sum(float(p['marks']) for p in one['questions'][0]['parts']), 2) == 20
          assert round(sum(float(c['marks']) for c in one['rubric'][0]['criteria']), 2) == 20
          print('offline generator covers all catalogue lessons; local pedagogy blueprints, totals and answer keys validated')
          # Exercise the real FastAPI generation route using the exact weak-paper lesson mix.
          import os
          for key in ('NABIL_LLM_API_KEY', 'GEMINI_API_KEY', 'OPENAI_API_KEY'):
              os.environ.pop(key, None)
          from fastapi.testclient import TestClient
          from competitions.server import app
          client = TestClient(app)
          payload = {'grade':'terminal_gs',
                     'lessons':['Quadratic Equations','Derivatives','Probability II','Antiderivatives','Complex Numbers'],
                     'language':'en','exam_type':'Training competition',
                     'duration_minutes':90,'total_marks':20,'difficulty':'balanced'}
          response = client.post('/api/competitions/generate', json=payload)
          assert response.status_code == 200, response.text
          generated = response.json()
          assert [q['lesson'] for q in generated['questions']] == payload['lessons']
          assert 'antiderivative' in generated['questions'][3]['statement'].lower()
          assert 'f′(x)' not in generated['questions'][3]['statement']
          assert generated['quality_gate']['status'] == 'limited_offline_template'
          assert generated['quality_gate']['local_blueprints_attached'] == len(payload['lessons'])
          assert all(q.get('pedagogical_blueprint') for q in generated['questions'])
          assert round(sum(float(q['marks']) for q in generated['questions']), 2) == 20
          assert len(generated['solutions']) == len(generated['rubric']) == 5
          assert not any(step.lower().startswith(('we conclude:', 'on conclut :'))
                         for sol in generated['solutions'] for step in sol['steps'][-1:])
          visual_response = client.post('/api/competitions/generate', json={
              'grade':'terminal_gs','lessons':['Vectors and Coordinate Systems','Statistics'],
              'language':'en','exam_type':'Training competition',
              'duration_minutes':90,'total_marks':20,'difficulty':'balanced'})
          assert visual_response.status_code == 200, visual_response.text
          visual = visual_response.json()
          assert visual['questions'][0]['diagram']['points'][0] == {'label':'A','x':-1,'y':2}
          assert len(visual['questions'][1]['table']['rows']) == 4
          docx_response = client.post('/api/competitions/export/docx', json={
              'title':visual['title'],'grade_label':visual['grade_label'],'language':'en',
              'duration_minutes':90,'total_marks':20,'questions':visual['questions'],
              'solutions':visual['solutions'],'rubric':visual['rubric'],
              'curriculum_note':visual['curriculum_note']})
          assert docx_response.status_code == 200, docx_response.text[:500]
          assert docx_response.content[:2] == b'PK'
          print('DOCX export passed with real coordinate plot and statistics table')
          print('FastAPI generation route passed the five-lesson Terminale GS regression test')
          print('competition contract checks passed')
          PY
