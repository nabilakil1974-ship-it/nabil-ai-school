name: CRDP Master Curriculum Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymupdf

      - name: Run V10 CRDP sync without Kindergarten
        run: |
          python scripts/sync_crdp_master_curriculum.py             /tmp/crdp_official             app/static/crdp_master_curriculum_index.json

      - name: Print coverage report
        run: |
          python scripts/report_crdp_master_curriculum.py             app/static/crdp_master_curriculum_index.json

      - name: Validate V10 curriculum
        id: validate
        continue-on-error: true
        run: |
          python scripts/validate_crdp_master_curriculum.py             app/static/crdp_master_curriculum_index.json

      - name: Commit generated master index
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/crdp_master_curriculum_index.json
          if git diff --cached --quiet; then
            echo "No curriculum changes to commit."
          else
            git commit -m "Expand verified CRDP curriculum coverage"
            git push
          fi

      - name: Upload generated index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crdp-master-curriculum-index-v10-no-kindergarten
          path: app/static/crdp_master_curriculum_index.json
          if-no-files-found: error

      - name: Fail job if validation failed
        if: steps.validate.outcome != 'success'
        run: |
          echo "Validation failed. Artifact was uploaded for inspection."
          exit 1
